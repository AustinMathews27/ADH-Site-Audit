name: Weekly photo storage audit

# Read-only health check of photo storage (scripts/photo-audit.mjs): every photo
# the projects reference must exist in Blob Storage, and no new duplicate uploads
# may appear after the v8.56 single-upload fix.
#
# The site requires sign-in for /api/* (staticwebapp.config.json), so the script
# reads Cosmos DB and Blob Storage directly. Add these repository secrets (Settings → Secrets and
# variables → Actions); use read-only credentials:
#   AUDIT_COSMOS_CONNECTION_STRING  Cosmos account → Keys → Read-only Keys →
#                                   PRIMARY CONNECTION STRING
#   AUDIT_STORAGE_ACCOUNT           storage account name (the AZURE_STORAGE_ACCOUNT app setting)
#   AUDIT_STORAGE_SAS               SAS token for the site-photos container with
#                                   Read + List only, and an expiry you track
# Without them the script falls back to the API and fails with a "sign-in page"
# message.
#
# THIS REPO IS PUBLIC, so this workflow's logs and the issue it opens are too.
# Always run the script with --ci (counts only: no project names, no photo URLs)
# and never upload its --out report as an artifact.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (6 am Pacific / 9 am Eastern)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-photo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Photo storage audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Azure SDKs for the direct read (not committed; no lockfile written)
      - name: Install Azure SDKs
        run: npm install --no-save --no-package-lock --no-audit --no-fund @azure/cosmos@4 @azure/storage-blob@12

      - name: Run audit
        env:
          COSMOS_DB_CONNECTION_STRING: ${{ secrets.AUDIT_COSMOS_CONNECTION_STRING }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AUDIT_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS: ${{ secrets.AUDIT_STORAGE_SAS }}
        run: |
          set -o pipefail
          node scripts/photo-audit.mjs --check --ci 2>&1 | tee audit.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Photo storage audit'
            echo '```'
            cat audit.txt 2>/dev/null || echo 'The audit produced no output (it could not reach the API).'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One tracking issue: opened on the first failure, commented on after that.
      - name: Open or update the regression issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Photo storage audit failed'
          {
            echo "The weekly photo storage audit failed: $RUN_URL"
            echo
            echo '```'
            cat audit.txt 2>/dev/null || echo 'No output — the audit could not reach the API.'
            echo '```'
            echo
            echo 'Run `node scripts/photo-audit.mjs` locally for project names and file lists (kept out of this public repo on purpose).'
            echo '- **Spare copies uploaded since the v8.56 fix** — a device is on an old build (Admin → Users shows versions) or an upload path bypasses `_uploadPhotoOnce`.'
            echo '- **Live pictures missing from storage** — a file a project still shows was deleted; check Admin → Dead Photos / Recovery.'
          } > body.md
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi

/** Toggle open/closed state */
window.toggleLaborLog = function(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  item._laborLogOpen = !item._laborLogOpen;
  _refreshLaborLog(pid, sid);
};

/** Refresh just the labor log panel without rebuilding the whole SI editor */
function _refreshLaborLog(pid, sid) {
  const el = document.getElementById(`labor-log-panel-${sid}`);
  if (el) el.innerHTML = _buildLaborLogPanelHTML(pid, sid);
}

/** Add a labor entry */
window.addLaborEntry = function(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  _mpEnsure(item);

  const dateEl    = document.getElementById(`mp-date-${sid}`);
  const workersEl = document.getElementById(`mp-workers-${sid}`);
  const hoursEl   = document.getElementById(`mp-hours-${sid}`);
  const noteEl    = document.getElementById(`mp-note-${sid}`);

  const date    = dateEl?.value;
  const workers = parseInt(workersEl?.value);
  const hours   = parseFloat(hoursEl?.value);
  const note    = noteEl?.value.trim() || '';

  if (!date)          return showToast('Select a date', 'red');
  if (!workers || workers < 1) return showToast('Enter number of workers', 'red');
  if (!hours || hours <= 0)    return showToast('Enter hours per worker', 'red');

  syncEditorToStore(pid, sid);

  item.laborEntries.push({
    id:      'lbr_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    date,
    workers,
    hours,
    note,
    total:   workers * hours
  });

  markAsDirty(sid); save();
  _refreshLaborLog(pid, sid);
  // Also refresh any open manpower dashboard
  _refreshManpowerDashboardIfOpen(pid);

  const total = workers * hours;
  showToast(`✓ ${total}h logged (${workers} workers × ${hours}h)`, 'green');

  // Clear inputs except date
  if(workersEl) workersEl.value = '';
  if(hoursEl)   hoursEl.value  = '';
  if(noteEl)    noteEl.value   = '';
};

/** Delete a labor entry */
window.deleteLaborEntry = function(pid, sid, entryId) {
  const item = getSI(pid, sid); if(!item) return;
  _mpEnsure(item);
  syncEditorToStore(pid, sid);
  item.laborEntries = item.laborEntries.filter(e => e.id !== entryId);
  markAsDirty(sid); save();
  _refreshLaborLog(pid, sid);
  _refreshManpowerDashboardIfOpen(pid);
  showToast('Entry deleted');
};

/** Live preview of hours total as user types */
window.updateMPPreview = function(sid) {
  const workers = parseFloat(document.getElementById(`mp-workers-${sid}`)?.value) || 0;
  const hours   = parseFloat(document.getElementById(`mp-hours-${sid}`)?.value)   || 0;
  const el      = document.getElementById(`mp-preview-${sid}`);
  if(!el) return;
  if(workers && hours) {
    el.textContent = `= ${workers * hours}h total will be logged`;
    el.style.color = 'var(--accent)';
  } else {
    el.textContent = '';
  }
};

function navToManpower(pid) {
  const cur = route();
  stack = stack.filter(r => r.view !== 'manpower' && r.view !== 'si' && r.view !== 'env' && r.view !== 'schedule');
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) {
    stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  }
  stack.push({ view: 'manpower', folderId: cur.folderId || '', projectId: pid });
  render();
}

function buildManpowerView(pid) {
  const proj = getProject(pid); if(!proj) return;
  const el   = document.getElementById('v-manpower');

  // Ensure all items have laborEntries
  (proj.items || []).forEach(i => _mpEnsure(i));

  // ── Project-wide totals ───────────────
  const totalEst    = proj.items.reduce((s, i) => s + (i.laborHours || 0), 0);
  const totalLogged = proj.items.reduce((s, i) => s + _mpTotalLogged(i), 0);
  const totalRem    = Math.max(0, totalEst - totalLogged);
  const projPct     = totalEst > 0 ? Math.round((totalLogged / totalEst) * 100) : 0;
  const projColor   = _mpColor(projPct);

  // ── Items sorted by most recently logged ──
  const items = [...proj.items].sort((a, b) => {
    const lastA = a.laborEntries?.slice().sort((x,y) => y.date.localeCompare(x.date))[0]?.date || '';
    const lastB = b.laborEntries?.slice().sort((x,y) => y.date.localeCompare(x.date))[0]?.date || '';
    return lastB.localeCompare(lastA);
  });

  // ── All entries across project (for activity feed) ──
  const allEntries = [];
  proj.items.forEach(item => {
    (item.laborEntries || []).forEach(e => {
      allEntries.push({ ...e, itemNum: item.num, itemTitle: item.title, itemId: item.id });
    });
  });
  allEntries.sort((a, b) => b.date.localeCompare(a.date));
  const recentEntries = allEntries.slice(0, 10);

  // ── Stats summary strip ───────────────
  const summaryHTML = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px">
        <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text)">${totalEst}h</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">Total Estimated</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px">
        <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:${projColor}">${totalLogged}h</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">Hours Logged</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px">
        <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text3)">${totalRem}h</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">Remaining</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px">
        <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:${projColor}">${projPct}%</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">Budget Used</div>
        <div style="height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-top:6px">
          <div style="height:100%;width:${Math.min(projPct,100)}%;background:${projColor};border-radius:2px"></div>
        </div>
      </div>
    </div>`;

  // ── SI table ──────────────────────────
  const tableRowsHTML = items.map(item => {
    const logged  = _mpTotalLogged(item);
    const pct     = _mpBurnPct(item);
    const color   = _mpColor(pct);
    const hasEst  = item.laborHours != null;
    const rem     = _mpRemaining(item);
    const entries = item.laborEntries || [];
    const lastEntry = entries.slice().sort((a,b) => b.date.localeCompare(a.date))[0];

    return `
      <div style="display:grid;grid-template-columns:100px 1fr 80px 80px 80px 140px 36px;gap:0;border-bottom:1px solid var(--border);align-items:center;min-height:48px;transition:background 0.1s"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">

        <div style="padding:8px 12px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent)">${item.num}</div>

        <div style="padding:8px 10px">
          <div style="font-size:11px;font-weight:500;color:var(--text)">${item.title}</div>
          ${lastEntry ? `<div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:1px">Last: ${_fmtDate(lastEntry.date)}</div>` : ''}
        </div>

        <div style="padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--text3);text-align:right">
          ${hasEst ? item.laborHours+'h' : '—'}
        </div>

        <div style="padding:8px 10px;font-family:var(--mono);font-size:11px;font-weight:600;color:${logged>0?color:'var(--text3)'};text-align:right">
          ${logged}h
        </div>

        <div style="padding:8px 10px;font-family:var(--mono);font-size:11px;color:${rem===0&&hasEst?'#ef4444':'var(--text3)'};text-align:right">
          ${hasEst ? (rem+'h') : '—'}
        </div>

        <div style="padding:8px 12px">
          ${hasEst ? `
            <div style="display:flex;align-items:center;gap:6px">
              <div style="flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${Math.min(pct,100)}%;background:${color};border-radius:3px"></div>
              </div>
              <span style="font-family:var(--mono);font-size:9px;color:${color};font-weight:600;flex-shrink:0">${pct}%</span>
            </div>` : `<span style="font-size:9px;color:var(--text3)">no estimate</span>`}
        </div>

        <div style="padding:4px 8px">
          <button onclick="showQuickLogModal('${pid}','${item.id}')"
            style="width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--accent);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.12s"
            title="Log hours for this SI"
            onmouseover="this.style.background='var(--accent-dim)';this.style.borderColor='var(--accent)'"
            onmouseout="this.style.background='var(--surface2)';this.style.borderColor='var(--border)'">＋</button>
        </div>
      </div>`;
  }).join('');

  const noEstItems = proj.items.filter(i => i.laborHours == null).length;

  // ── Recent activity feed ──────────────
  const activityHTML = recentEntries.length === 0
    ? `<div style="text-align:center;padding:20px;font-size:12px;color:var(--text3)">No labor logged yet on this project</div>`
    : recentEntries.map(e => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);flex-shrink:0;width:56px">${_fmtDate(e.date)}</div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700;flex-shrink:0;width:64px">${e.itemNum.replace(/^SI\s+/,'SI ')}</div>
          <div style="font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.itemTitle}</div>
          <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
            <span style="font-size:11px;color:var(--text2)">👷 ${e.workers}</span>
            <span style="font-size:11px;color:var(--text2)">× ${e.hours}h</span>
            <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent)">${e.total || e.workers*e.hours}h</span>
          </div>
          ${e.note ? `<div style="font-size:10px;color:var(--text3);font-style:italic;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">"${e.note}"</div>` : ''}
          <button onclick="deleteAnyLaborEntry('${pid}','${e.itemId}','${e.id}')"
            style="width:20px;height:20px;border-radius:4px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.12s"
            onmouseover="this.style.background='var(--red-dim)';this.style.color='var(--red)'"
            onmouseout="this.style.background='none';this.style.color='var(--text3)'">✕</button>
        </div>`).join('');

  el.innerHTML = `
    <div style="flex:1;overflow-y:auto;padding:20px">

      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <div style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px">
          👷 Manpower Tracking
          <span style="font-size:11px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
        </div>
        <button onclick="showQuickLogModal('${pid}',null)"
          style="display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:9px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;transition:opacity 0.15s"
          onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
          ＋ Log Hours
        </button>
      </div>

      <!-- Summary strip -->
      ${summaryHTML}

      ${noEstItems > 0 ? `
        <div style="padding:8px 12px;background:var(--yellow-dim);border:1px solid rgba(217,119,6,0.3);border-radius:8px;font-size:11px;color:var(--yellow);margin-bottom:14px;display:flex;align-items:center;gap:8px">
          <span>⚠</span> ${noEstItems} SI item${noEstItems!==1?'s':''} have no labor estimate set — edit those items to add estimated hours
        </div>` : ''}

      <!-- SI table -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px">
        <!-- Table header -->
        <div style="display:grid;grid-template-columns:100px 1fr 80px 80px 80px 140px 36px;background:var(--surface2);border-bottom:2px solid var(--border)">
          ${['SI#','Description','Est.','Logged','Rem.','Progress',''].map((h,i) => `
            <div style="padding:8px ${i===0?'12px':'10px'};font-size:8px;font-family:var(--mono);font-weight:700;letter-spacing:0.8px;color:var(--text3);text-transform:uppercase;${i>=2&&i<=4?'text-align:right':''}">${h}</div>`).join('')}
        </div>
        ${tableRowsHTML || `<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px">No SI items on this project</div>`}
      </div>

      <!-- Recent activity -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
        <div style="padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:0.8px;color:var(--text3);text-transform:uppercase">
          Recent Activity ${allEntries.length > 10 ? `<span style="font-weight:400;color:var(--text3)">(showing last 10 of ${allEntries.length})</span>` : ''}

/** Quick log modal — works from dashboard (any SI) or SI editor */
window.showQuickLogModal = function(pid, preselectedSid) {
  const proj = getProject(pid); if(!proj) return;

  const siOptions = proj.items.map(i =>
    `<option value="${i.id}" ${i.id===preselectedSid?'selected':''}>${i.num.replace(/^SI\s+/,'SI ')} — ${i.title}</option>`
  ).join('');

  makeModal('Log Labor Hours', `
    <div class="field-group">
      <div class="field-label">Site Item</div>
      <select class="field-input" id="ql-si" onchange="updateQLEstimate('${pid}')">
        ${preselectedSid ? '' : `<option value="">— Select SI —</option>`}
        ${siOptions}
      </select>
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Date</div>
        <input type="date" class="field-input" id="ql-date" value="${_todayISO()}" />
      </div>
      <div class="field-group">
        <div class="field-label">Workers</div>
        <input type="number" class="field-input" id="ql-workers" min="1" max="99" placeholder="2"
          oninput="updateQLPreview()" />
      </div>
      <div class="field-group">
        <div class="field-label">Hrs / Worker</div>
        <input type="number" class="field-input" id="ql-hours" min="0.5" max="24" step="0.5" placeholder="8"
          oninput="updateQLPreview()" />
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Note (optional)</div>
      <input type="text" class="field-input" id="ql-note" placeholder="e.g. Framing, blocking, trim..." />
    </div>
    <div id="ql-preview" style="font-family:var(--mono);font-size:11px;color:var(--text2);padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;min-height:36px;margin-top:4px"></div>
    <div id="ql-estimate" style="font-size:10px;color:var(--text3);margin-top:6px"></div>
  `, () => {
    const siId   = document.getElementById('ql-si')?.value;
    const date   = document.getElementById('ql-date')?.value;
    const workers = parseInt(document.getElementById('ql-workers')?.value);
    const hours  = parseFloat(document.getElementById('ql-hours')?.value);
    const note   = document.getElementById('ql-note')?.value.trim() || '';

    if (!siId)              return showToast('Select a site item', 'red');
    if (!date)              return showToast('Select a date', 'red');
    if (!workers || workers < 1) return showToast('Enter number of workers', 'red');
    if (!hours || hours <= 0)    return showToast('Enter hours per worker', 'red');

    const item = getSI(pid, siId); if(!item) return;
    _mpEnsure(item);

    item.laborEntries.push({
      id:      'lbr_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
      date,
      workers,
      hours,
      note,
      total:   workers * hours
    });

    markAsDirty(siId); save(); closeModal();

    // Refresh whichever view is open
    _refreshLaborLog(pid, siId);
    _refreshManpowerDashboardIfOpen(pid);

    showToast(`✓ ${workers * hours}h logged on ${item.num}`, 'green');
  });

  // Init preview
  setTimeout(() => {
    updateQLEstimate(pid);
    document.getElementById('ql-workers')?.focus();
  }, 100);
};

window.updateQLPreview = function() {
  const w = parseFloat(document.getElementById('ql-workers')?.value) || 0;
  const h = parseFloat(document.getElementById('ql-hours')?.value)   || 0;
  const el = document.getElementById('ql-preview');
  if (!el) return;
  if (w && h) {
    el.textContent = `${w} workers × ${h}h = ${w*h}h total logged`;
    el.style.color = 'var(--accent)';
  } else {
    el.textContent = 'Enter workers and hours to see total';
    el.style.color = 'var(--text3)';
  }
};

window.updateQLEstimate = function(pid) {
  const siId = document.getElementById('ql-si')?.value;
  const el   = document.getElementById('ql-estimate');
  if (!el || !siId) return;
  const item = getSI(pid, siId); if(!item) return;
  _mpEnsure(item);
  if (item.laborHours == null) {
    el.textContent = 'No estimate set on this SI';
  } else {
    const logged = _mpTotalLogged(item);
    const rem    = Math.max(0, item.laborHours - logged);
    const pct    = _mpBurnPct(item);
    el.textContent = `SI budget: ${item.laborHours}h est · ${logged}h logged · ${rem}h remaining (${pct}% used)`;
    el.style.color = _mpColor(pct);
  }
  updateQLPreview();
};

/** Delete from dashboard activity feed */
window.deleteAnyLaborEntry = function(pid, siId, entryId) {
  const item = getSI(pid, siId); if(!item) return;
  _mpEnsure(item);
  item.laborEntries = item.laborEntries.filter(e => e.id !== entryId);
  markAsDirty(siId); save();
  _refreshManpowerDashboardIfOpen(pid);
  _refreshLaborLog(pid, siId);
  showToast('Entry deleted');
};

/** Refresh dashboard if currently visible */
function _refreshManpowerDashboardIfOpen(pid) {
  const r = route();
  if (r.view === 'manpower' && r.projectId === pid) {
    buildManpowerView(pid);
  }
}

(function injectWorkOrderFileInput() {
  function inject() {
    if (document.getElementById('wo-xls-input')) return;
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.id = 'wo-xls-input';
    inp.accept = '.xls,.xlsx';
    inp.style.display = 'none';
    inp.onchange = (e) => window.handleWorkOrdersXLSX(e);
    document.body.appendChild(inp);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})();

let _woTargetFid = null;
let _woTargetPid = null;

window.triggerWorkOrdersImport = function(fid, pid) {
  _woTargetFid = fid || '';
  _woTargetPid = pid || null;
  const inp = document.getElementById('wo-xls-input');
  if (!inp) return showToast('Import input not ready', 'red');
  inp.value = '';
  inp.click();
};

const WO_HEADER_ALIASES = {
  name:            ['name','item','description','work order','work order name'],
  type:            ['type'],
  plannedCritical: ['planned critical date','critical date','need by','required date'],
  workflow:        ['workflow name','workflow'],
  plannedStart:    ['planned start date','start date','install date'],
  shipmentDate:    ['actual shipment date','shipment date','ship date'],
  laborHours:      ['estimated total labor hours','total labor hours','labor hours','hours'],
  deliveryDate:    ['delivery/on site date','delivery date','on site date','on-site date','delivery'],
  siNumber:        ['si #','si#','si number','si no','si']
};

function _woNormalizeHeader(h) {
  return String(h || '').toLowerCase().replace(/[\s_\-\/#\.]+/g, ' ').trim();
}

function _woBuildHeaderIndex(headerRow) {
  const idx = {};
  headerRow.forEach((h, i) => {
    const norm = _woNormalizeHeader(h);
    for (const canonical in WO_HEADER_ALIASES) {
      if (WO_HEADER_ALIASES[canonical].some(alias => _woNormalizeHeader(alias) === norm)) {
        idx[canonical] = i;
        return;
      }
    }
  });
  return idx;
}

function _woParseName(name) {
  if (!name) return { si: null, title: '' };
  const s = String(name).trim();
  const lead = s.match(/^(\d{2,4})\s*[-–:.\s]?\s*(.*)$/);
  if (lead) return { si: lead[1].padStart(4, '0'), title: lead[2].trim() || s };
  const any = s.match(/\b(\d{2,4})\b/);
  return { si: any ? any[1].padStart(4, '0') : null, title: s };
}

function _woToISODate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if (m) {
    let [, mo, da, yr] = m;
    if (yr.length === 2) yr = '20' + yr;
    const iso = `${yr}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`;
    return isNaN(new Date(iso)) ? '' : iso;
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}

function _woToNumber(v) {
  if (v == null || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}

function extractWorkOrdersFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, cellDates: true, defval: '' });
  if (!rows.length) return { items: [], skipped: [], headerFound: false };

  let headerRowIdx = -1, headerIdx = null;
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    const h = _woBuildHeaderIndex(rows[i]);
    if ('name' in h && ('plannedStart' in h || 'plannedCritical' in h || 'deliveryDate' in h)) {
      headerRowIdx = i; headerIdx = h; break;
    }
  }
  if (headerRowIdx === -1) return { items: [], skipped: [], headerFound: false };

  const items = [], skipped = [];
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(c => c === '' || c == null)) continue;
    const rawName = headerIdx.name != null ? row[headerIdx.name] : '';
    const { si, title } = _woParseName(rawName);
    if (!si) { skipped.push({ row: r + 1, reason: 'No SI number detected in Name' }); continue; }
    items.push({
      si, title: title || rawName,
      type:            String(headerIdx.type        != null ? row[headerIdx.type]        : '').trim(),
      workflow:        String(headerIdx.workflow     != null ? row[headerIdx.workflow]    : '').trim(),
      plannedStart:    _woToISODate(headerIdx.plannedStart    != null ? row[headerIdx.plannedStart]    : ''),
      plannedCritical: _woToISODate(headerIdx.plannedCritical != null ? row[headerIdx.plannedCritical] : ''),
      shipmentDate:    _woToISODate(headerIdx.shipmentDate    != null ? row[headerIdx.shipmentDate]    : ''),
      deliveryDate:    _woToISODate(headerIdx.deliveryDate    != null ? row[headerIdx.deliveryDate]    : ''),
      laborHours:      _woToNumber( headerIdx.laborHours      != null ? row[headerIdx.laborHours]      : ''),
      _checked: true
    });
  }
  const seen = new Map();
  items.forEach(it => { if (seen.has(it.si)) it._duplicate = true; seen.set(it.si, true); });
  return { items, skipped, headerFound: true };
}

function _woWeekKeyFor(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return null;
  const today = new Date();
  const day = today.getDay();
  const diff = today.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(today.getFullYear(), today.getMonth(), diff);
  const wIdx = Math.floor((d - monday) / (7 * 24 * 60 * 60 * 1000));
  if (wIdx < 0 || wIdx > 5) return null;
  return 'w' + wIdx;
}

function showWorkOrdersPreviewModal(filename, parsed, onConfirm) {
  if (!parsed.headerFound) return showToast('Could not find header row (expected "Name" column)', 'red');
  if (!parsed.items.length) return showToast('No importable rows found', 'red');

  const hasMerge = !!_woTargetPid;
  const targetProject = hasMerge ? getProject(_woTargetPid) : null;

  const rowsHTML = parsed.items.map((it, i) => `

function _woBuildSIItem(it, sectionId) {
  return {
    id: 'si_' + it.si + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    sectionId, num: 'SI ' + it.si, title: it.title,
    status: 'pending', assignedTo: '', dueDate: it.plannedStart || '',
    notes: '', tags: [], customTags: [], photos: [],
    plannedStart: it.plannedStart || '', plannedCritical: it.plannedCritical || '',
    shipmentDate: it.shipmentDate || '', deliveryDate: it.deliveryDate || '',
    laborHours: it.laborHours, workflow: it.workflow || '', workOrderType: it.type || '',
    delivery: { deliveryDate: it.deliveryDate || '', truck: '' }
  };
}

function _woPopulateSchedule(project, items) {
  if (!project.schedule) project.schedule = {};
  let populated = 0;
  items.forEach(si => {
    const wkey = _woWeekKeyFor(si.plannedStart);
    if (!wkey) return;
    const cellKey = `${si.id}_${wkey}`;
    if (!project.schedule[cellKey]) { project.schedule[cellKey] = 'Planned Start'; populated++; }
  });
  return populated;
}

function createProjectFromWorkOrders(items, projectName, folderId) {
  const pid = 'proj_' + Date.now();
  const section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' };
  const siItems = items.map(it => _woBuildSIItem(it, section.id));
  const project = {
    id: pid, name: projectName || 'Work Orders Import',
    ownedBy: _currentUser?.userId || '',
    client: '', company: '', auditor: '', date: new Date().toLocaleDateString(),
    projectType: '', coverPhoto: null, sections: [section], items: siItems,
    schedule: {}, importLog: []
  };
  const populated = _woPopulateSchedule(project, siItems);
  store.projects.push(project);
  if (folderId) { const f = getFolder(folderId); if (f && !f.projects.includes(pid)) f.projects.push(pid); }
  project.importLog.push({ date: new Date().toISOString(), summary: { added: siItems.length, modified: 0, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  save();
  return { pid, added: siItems.length, scheduled: populated };
}

function mergeWorkOrdersIntoProject(project, items) {
  let section = project.sections.find(s => s.name === 'Imported Work Orders');
  if (!section) { section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' }; project.sections.push(section); }
  const existingBySI = new Map();
  project.items.forEach(i => { const m = String(i.num||'').match(/\d{2,4}/); if (m) existingBySI.set(m[0].padStart(4,'0'), i); });
  let added = 0, updated = 0;
  const newOrUpdatedItems = [];
  items.forEach(it => {
    const existing = existingBySI.get(it.si);
    if (existing) {
      existing.dueDate         = it.plannedStart    || existing.dueDate;
      existing.plannedStart    = it.plannedStart    || existing.plannedStart    || '';
      existing.plannedCritical = it.plannedCritical || existing.plannedCritical || '';
      existing.shipmentDate    = it.shipmentDate    || existing.shipmentDate    || '';
      existing.deliveryDate    = it.deliveryDate    || existing.deliveryDate    || '';
      existing.laborHours      = (it.laborHours != null) ? it.laborHours : existing.laborHours;
      existing.workflow        = it.workflow     || existing.workflow     || '';
      existing.workOrderType   = it.type         || existing.workOrderType || '';
      if (it.deliveryDate) { existing.delivery = existing.delivery || { deliveryDate:'', truck:'' }; existing.delivery.deliveryDate = it.deliveryDate; }
      newOrUpdatedItems.push(existing); updated++;
    } else {
      const si = _woBuildSIItem(it, section.id);
      project.items.push(si); newOrUpdatedItems.push(si); added++;
    }
  });
  const populated = _woPopulateSchedule(project, newOrUpdatedItems);
  if (!project.importLog) project.importLog = [];
  project.importLog.push({ date: new Date().toISOString(), summary: { added, modified: updated, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  save();
  return { added, updated, scheduled: populated };
}

window.handleWorkOrdersXLSX = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const folderId = _woTargetFid, mergePid = _woTargetPid;
  const reader = new FileReader();
  reader.onload = ev => {
    let wb;
    try { wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true }); }
    catch (err) { console.error('[WO Import] read failed:', err); return showToast('Could not read spreadsheet', 'red'); }
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const parsed = extractWorkOrdersFromSheet(sheet);
    showWorkOrdersPreviewModal(file.name, parsed, (selected, projectName) => {
      if (mergePid) {
        const proj = getProject(mergePid);
        if (!proj) { closeModal(); return showToast('Target project not found', 'red'); }
        const res = mergeWorkOrdersIntoProject(proj, selected);
        markProjectDirty(mergePid);
        closeModal();
        showToast(`✓ +${res.added} new · ~${res.updated} updated · 📅 ${res.scheduled} scheduled`, 'green');
        render();
      } else {
        const res = createProjectFromWorkOrders(selected, projectName, folderId);
        closeModal();
        showToast(`✓ Imported ${res.added} SI · 📅 ${res.scheduled} scheduled`, 'green');
        setTimeout(() => navToProject(res.pid, folderId), 50);
      }
      _woTargetFid = null; _woTargetPid = null;
    });
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

// FEATURE: _timeAgo + _logActivity helpers
// ══════════════════════════════════════════════════════════════════
function _timeAgo(ts) {
  if(!ts) return '';
  const diff=Date.now()-ts;
  const m=Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function _logActivity(pid,entry) {
  const proj=getProject(pid); if(!proj) return;
  if(!proj.activityLog) proj.activityLog=[];
  proj.activityLog.unshift({...entry,at:Date.now()});
  if(proj.activityLog.length>300) proj.activityLog.length=300;
  markProjectDirty(pid);
}

let _voiceRec=null, _voiceActive=false;
function toggleVoice(pid,sid) {
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){ showToast('Voice not supported on this browser',''); return; }
  const btn=document.getElementById('voice-btn');
  if(_voiceActive){ _voiceRec?.stop(); return; }
  _voiceRec=new SpeechRecognition();
  _voiceRec.continuous=true; _voiceRec.interimResults=true; _voiceRec.lang='en-US';
  _voiceRec.onstart=()=>{ _voiceActive=true; if(btn)btn.classList.add('recording'); showToast('🎤 Listening…'); };
  _voiceRec.onresult=e=>{
    const ta=document.getElementById('notes-input'); if(!ta) return;
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ');
    // Only append final results to avoid duplication
    if(e.results[e.results.length-1].isFinal){
      ta.value=(ta.value?ta.value+' ':'')+e.results[e.results.length-1][0].transcript.trim();
      scheduleAutoSave(pid,sid);
    }
  };
  _voiceRec.onerror=()=>{ _voiceActive=false; if(btn)btn.classList.remove('recording'); };
  _voiceRec.onend=()=>{ _voiceActive=false; if(btn)btn.classList.remove('recording'); _voiceRec=null; };
  _voiceRec.start();
}

let _attachTarget={pid:null,sid:null};
function triggerAttach(pid,sid){
  _attachTarget={pid,sid};

function handleAttachmentImport(e){
  const {pid,sid}=_attachTarget;
  const item=getSI(pid,sid); if(!item) return;
  if(!item.attachments) item.attachments=[];
  const files=Array.from(e.target.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const ext=file.name.split('.').pop().toLowerCase();
      const icons={pdf:'📄',doc:'📝',docx:'📝',xlsx:'📊',xls:'📊',pptx:'📑',csv:'📊',txt:'📃',zip:'🗜️',png:'🖼️',jpg:'🖼️',jpeg:'🖼️'};
      const attach={id:'att_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:file.name,type:file.type,ext,icon:icons[ext]||'📎',size:file.size,data:ev.target.result,addedAt:Date.now(),addedBy:store.settings.displayName||'You'};
      item.attachments.push(attach);
      _logActivity(pid,{type:'attach',siId:sid,siNum:item.num,detail:file.name,by:attach.addedBy});
      if(++loaded===files.length){
        markAsDirty(sid); save();
        const el=document.getElementById('attach-list-'+sid);
        if(el) el.innerHTML=_buildAttachListHTML(pid,sid);
        showToast('✓ File attached','green');
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function _buildAttachListHTML(pid,sid){
  const item=getSI(pid,sid); if(!item||!item.attachments||!item.attachments.length) return '<div style="font-size:11px;color:var(--text3);padding:6px 0">No files attached yet</div>';
  return item.attachments.map(a=>`
    <div class="attach-row">
      <span class="attach-icon">${a.icon||'📎'}</span>
      <span class="attach-name" title="${a.name}">${a.name}</span>
      <span class="attach-size">${(a.size/1024).toFixed(0)}KB</span>
      ${a.data?`<button class="attach-del" style="color:var(--accent);background:none" onclick="event.stopPropagation();_openAttachment('${a.id}','${pid}','${sid}')" title="Open">⬇</button>`:''}
      <button class="attach-del" onclick="deleteAttachment('${pid}','${sid}','${a.id}')">✕</button>
    </div>`).join('');
}
function _openAttachment(attId,pid,sid){
  const item=getSI(pid,sid); if(!item) return;
  const a=item.attachments?.find(x=>x.id===attId); if(!a||!a.data) return;
  const link=document.createElement('a');
  link.href=a.data; link.download=a.name; link.click();
}
function deleteAttachment(pid,sid,attId){
  const item=getSI(pid,sid); if(!item) return;
  item.attachments=(item.attachments||[]).filter(a=>a.id!==attId);
  markAsDirty(sid); save();
  const el=document.getElementById('attach-list-'+sid);
  if(el) el.innerHTML=_buildAttachListHTML(pid,sid);
  showToast('Attachment removed');
}

let _fpDraggingPin=null;
function handleFloorPlanUpload(e){
  const pid=route().projectId; if(!pid) return;
  const proj=getProject(pid); if(!proj) return;
  const file=e.target.files[0]; if(!file) return;
  const isPDF = file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf');

    proj.floorPlan.isPDF=isPDF;
    // Persist in IndexedDB — not sent to CosmosDB (too large)
    _idbSet('fp_img_'+pid, {data:ev.target.result, type:file.type, isPDF}).catch(()=>{});
    markProjectDirty(pid); save();
    buildFloorPlanView(pid);
    showToast('✓ Floor plan uploaded','green');
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function buildFloorPlanView(pid){
  const proj=getProject(pid); if(!proj) return;
  const el=document.getElementById('v-floorplan'); if(!el) return;
  const fp=proj.floorPlan||{pins:[]};

  // Restore from IndexedDB if imageData was stripped by CosmosDB sync
  if(!fp.imageData){
    _idbGet('fp_img_'+pid).then(saved=>{
      if(!saved) return;
      const data   = typeof saved==='object' ? saved.data   : saved;
      const type   = typeof saved==='object' ? saved.type   : 'image/jpeg';
      const isPDF  = typeof saved==='object' ? saved.isPDF  : false;
      if(proj.floorPlan){ proj.floorPlan.imageData=data; proj.floorPlan.imageType=type; proj.floorPlan.isPDF=isPDF; }
      buildFloorPlanView(pid);
    }).catch(()=>{});
  }

  const hasImage = !!fp.imageData;
  const isPDF    = fp.isPDF || (fp.imageType||'').includes('pdf');

  const pinsHTML = (fp.pins||[]).map(pin=>`
    <div class="fp-pin" data-pinid="${pin.id}" style="left:${pin.xPct}%;top:${pin.yPct}%;position:absolute;transform:translate(-50%,-50%);z-index:20;cursor:pointer;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,0.6)"
      title="${pin.siNum}: ${pin.siTitle}"
      onclick="_fpPinClick(event,'${pid}','${pin.id}')">
      📍<div class="fp-pin-label">${pin.siNum}</div>
    </div>`).join('');

  // For PDFs: use <embed> + transparent overlay for click-to-pin
  // For images: use <img>
  const mediaHTML = isPDF
    ? `<div id="fp-inner" style="position:relative;width:100%;height:100%;min-height:600px">
        <embed id="fp-embed" src="" type="application/pdf" style="width:100%;height:100%;min-height:600px;border:none;display:block">
        <div id="fp-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;z-index:10"
          onclick="_fpOverlayClick(event,'${pid}')"></div>
        ${pinsHTML}
       </div>`
    : `<div id="fp-inner" style="position:relative;display:inline-block;min-width:200px">
        <img id="fp-img" src="" style="display:block;max-width:100%;user-select:none" draggable="false">
        ${pinsHTML}
       </div>`;

  el.innerHTML=`
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;flex-wrap:wrap">
      <div style="font-size:14px;font-weight:600">🗺️ Floor Plan <span style="font-size:11px;color:var(--text3);font-weight:400">${proj.name}</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${hasImage?`<span style="font-size:10px;font-family:var(--mono);color:var(--text3)">${(fp.pins||[]).length} pins · ${isPDF?'PDF':'Image'}</span>`:''}
        <button onclick="document.getElementById('floorplan-input').click()" style="font-size:11px;font-family:var(--mono);padding:6px 12px;border:1px solid var(--border);background:var(--surface2);border-radius:7px;cursor:pointer;color:var(--text2)">📤 ${hasImage?'Replace':'Upload Plan'}</button>
        ${hasImage?`<button onclick="_fpTogglePinMode(this)" id="fp-pin-btn" style="font-size:11px;font-family:var(--mono);padding:6px 12px;border:1px solid var(--border);background:var(--surface2);border-radius:7px;cursor:pointer;color:var(--text2)">📍 Place Pin</button>`:''}
        ${hasImage&&(fp.pins||[]).length?`<button onclick="_fpClearPins('${pid}')" style="font-size:11px;font-family:var(--mono);padding:6px 12px;border:1px solid var(--red-dim);background:var(--red-dim);border-radius:7px;cursor:pointer;color:var(--red)">🗑 Clear Pins</button>`:''}
      </div>
    </div>
    <div style="flex:1;overflow:auto;position:relative;background:var(--surface2)" id="fp-scroll">
      ${hasImage ? mediaHTML
        : `<div style="text-align:center;padding:60px 24px;color:var(--text3)">
            <div style="font-size:48px;opacity:0.15;margin-bottom:16px">🗺️</div>
            <div style="font-size:14px;font-weight:600;color:var(--text2)">No floor plan yet</div>
            <div style="font-size:12px;margin-top:6px;max-width:300px;margin-left:auto;margin-right:auto">Upload a PNG, JPG, or PDF. Supports multi-page PDFs — use browser PDF controls to navigate pages.</div>
           </div>`}
    </div>
    ${hasImage?`
    <div style="padding:6px 14px;background:var(--surface);border-top:1px solid var(--border);font-size:10px;font-family:var(--mono);color:var(--text3);flex-shrink:0;display:flex;align-items:center;gap:10px">
      <span>📍 Place Pin → select SI → click plan</span>
      ${isPDF?`<span style="color:var(--accent)">PDF: use browser controls to navigate pages before placing pins</span>`:''}
    </div>
    <div id="fp-si-picker" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:10px;max-height:220px;overflow-y:auto;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,0.4);min-width:280px;max-width:420px">
      <div style="padding:8px 12px;font-size:9px;font-family:var(--mono);color:var(--text3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
        <span>SELECT SI TO PIN</span>
        <span style="cursor:pointer" onclick="document.getElementById('fp-si-picker').style.display='none'">✕</span>
      </div>
      ${proj.items.map(item=>`
        <div style="padding:9px 14px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center"
          onclick="_fpSelectSI('${pid}','${item.id}')"
          onmouseover="this.style.background='var(--accent-dim)'"
          onmouseout="this.style.background=''">
          <span style="font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0">${item.num}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.title}</span>
          <div class="si-status ${item.status}" style="flex-shrink:0;margin-left:auto"></div>
        </div>`).join('')}
    </div>`:''}`;

  // Assign src via JS (never inline — avoids backtick issues + PDFs need embed.src set after DOM insert)
  if(hasImage){
    window._fpAddMode=false;
    window._fpSelectedSI=null;
    window._fpPid=pid;

    if(isPDF){
      const embed=document.getElementById('fp-embed');
      if(embed) embed.src=fp.imageData;
    } else {
      const img=document.getElementById('fp-img');
      if(img){ img.src=fp.imageData; }
      // Wire click for image-based pinning
      const inner=document.getElementById('fp-inner');
      if(inner) inner.addEventListener('click',e=>{
        if(e.target.closest('.fp-pin')) return;
        _fpHandleClick(e,pid,'fp-img');
      });
    }
  }
}

// Toggle pin placement mode
window._fpTogglePinMode=function(btn){
  window._fpAddMode=!window._fpAddMode;
  btn.style.background   = window._fpAddMode?'var(--accent-dim)':'var(--surface2)';
  btn.style.borderColor  = window._fpAddMode?'var(--accent)':'var(--border)';
  btn.style.color        = window._fpAddMode?'var(--accent)':'var(--text2)';
  if(window._fpAddMode) showToast('📍 Select an SI from the list, then click the plan');
  else { document.getElementById('fp-si-picker').style.display='none'; window._fpSelectedSI=null; }
};

// Click handler for overlay (PDF) — coordinates relative to overlay div
window._fpOverlayClick=function(e,pid){
  _fpHandleClick(e,pid,'fp-overlay');
};

// Shared pin placement logic for both image and PDF
window._fpHandleClick=function(e,pid,refId){
  if(!window._fpAddMode) return;
  if(!window._fpSelectedSI){
    const picker=document.getElementById('fp-si-picker');
    if(picker) picker.style.display=picker.style.display==='none'?'block':'none';
    return;
  }
  const ref=document.getElementById(refId); if(!ref) return;
  const rect=ref.getBoundingClientRect();
  const xPct=((e.clientX-rect.left)/rect.width*100).toFixed(2);
  const yPct=((e.clientY-rect.top)/rect.height*100).toFixed(2);
  const si=window._fpSelectedSI;
  const proj=getProject(pid); if(!proj) return;
  if(!proj.floorPlan.pins) proj.floorPlan.pins=[];
  proj.floorPlan.pins=proj.floorPlan.pins.filter(p=>p.siId!==si.id);
  proj.floorPlan.pins.push({id:'pin_'+Date.now(),siId:si.id,siNum:si.num,siTitle:si.title,xPct,yPct});
  markProjectDirty(pid); save();
  window._fpAddMode=false; window._fpSelectedSI=null;
  buildFloorPlanView(pid);
  showToast('📍 Pin placed','green');
};

window._fpSelectSI=function(pid,siId){
  const proj=getProject(pid); if(!proj) return;
  window._fpSelectedSI=proj.items.find(i=>i.id===siId);
  const picker=document.getElementById('fp-si-picker');
  if(picker) picker.style.display='none';
  showToast(`📍 Now click the floor plan to place ${window._fpSelectedSI?.num}`);
};

window._fpPinClick=function(e,pid,pinId){
  e.stopPropagation();
  const proj=getProject(pid); if(!proj) return;
  const pin=proj.floorPlan?.pins?.find(p=>p.id===pinId); if(!pin) return;
  const choice=confirm(`${pin.siNum}: "${pin.siTitle}"\n\nOK = Remove pin    Cancel = Open SI`);
  if(choice){
    proj.floorPlan.pins=proj.floorPlan.pins.filter(p=>p.id!==pinId);
    markProjectDirty(pid); save(); buildFloorPlanView(pid);
  } else {
    navToSI(pid,pin.siId);
  }
};

window._fpClearPins=function(pid){
  const proj=getProject(pid); if(!proj||!proj.floorPlan) return;
  if(!confirm('Remove all pins from this floor plan?')) return;
  proj.floorPlan.pins=[];
  markProjectDirty(pid); save(); buildFloorPlanView(pid);
  showToast('Pins cleared');
};
// ══════════════════════════════════════════════════════════════════
// PATCH: renderLeft — show archived section + updated-by badge
// ══════════════════════════════════════════════════════════════════
(function patchRenderLeft(){
  const orig=renderLeft;
  renderLeft=function(r){
    orig(r);
    // Inject updated-by badges into rendered SI rows
    if(r.projectId){
      const proj=getProject(r.projectId); if(!proj) return;
      document.querySelectorAll('.si-row[data-sid]').forEach(row=>{
        const sid=row.dataset.sid;
        const item=proj.items.find(i=>i.id===sid);
        if(!item||!item._updatedAt) return;
        const info=row.querySelector('.si-info');
        if(!info||info.querySelector('.upd-badge')) return;
        const badge=document.createElement('div');
        badge.className='upd-badge';
        badge.style.cssText='font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        badge.innerHTML=(item._updatedBy&&item._updatedBy!=='You'?item._updatedBy+' · ':'')+`<span style="color:var(--accent)">${_timeAgo(item._updatedAt)}</span>`;
        info.appendChild(badge);
      });
    }
  };
})();

// ══════════════════════════════════════════════════════════════════
// PATCH: buildFolderView / buildRootView — show archived projects separately
// ══════════════════════════════════════════════════════════════════
(function patchProjViews(){
  function injectArchivedSection(gridEl, allProjs, fid){
    if(!gridEl) return;
    const archived=allProjs.filter(p=>p.archived);
    if(!archived.length) return;
    // Remove archived cards from main grid
    archived.forEach(p=>{
      const existing=[...gridEl.querySelectorAll('.proj-card')].find(el=>el.onclick?.toString().includes(p.id));
      existing?.remove();
    });
    // Add collapsible archived section
    const sec=document.createElement('div');
    sec.style.cssText='margin-top:14px;border-top:1px solid var(--border);padding-top:10px';
    const key='adh_arch_open_'+fid;
    const open=localStorage.getItem(key)==='1';
    sec.innerHTML=`
      <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';localStorage.setItem('${key}',this.nextElementSibling.style.display!==''?'1':'0')"
        style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-family:var(--mono);color:var(--text3);font-weight:600;letter-spacing:0.5px;padding:4px 0;user-select:none">
        <span>🗄️ ARCHIVED (${archived.length})</span><span style="margin-left:auto">${open?'▲':'▼'}</span>
      </div>
      <div class="proj-grid archived-section" style="display:${open?'grid':'none'};margin-top:8px">
        ${archived.map(p=>projCardHTML(p,fid||'')).join('')}
      </div>`;
    gridEl.after(sec);
  }

  // Hook into DOM mutations after buildRootView/buildFolderView render
  const origRenderRight=renderRight;
  renderRight=function(r){
    origRenderRight(r);
    requestAnimationFrame(()=>{
      // Filter archived from all visible proj-grids and add archived section
      const projGrids=document.querySelectorAll('.proj-grid:not(.archived-section)');
      projGrids.forEach(grid=>{
        const allProjs=store.projects.filter(p=>{
          const cards=[...grid.querySelectorAll('.proj-card:not(.new-card)')];
          return cards.some(c=>c.getAttribute('onclick')?.includes(p.id)||c.querySelector('*')?.onclick?.toString().includes(p.id));
        });
        // simpler: just filter archived cards from current folder
        if(r.view==='folder'||r.view==='root'){
          const fid=r.folderId||'';
          const inFolder=store.projects.filter(p=>p.archived);
          if(inFolder.length) injectArchivedSection(grid, store.projects, fid);
        }
      });
    });
  };
})();

// ══════════════════════════════════════════════════════════════════
// Init: Request notification permission status check
// ══════════════════════════════════════════════════════════════════
setTimeout(()=>{
  if(_notifEnabled && Notification.permission!=='granted'){ _notifEnabled=false; localStorage.setItem('adh_notif','0'); }
  _updateNotifUI();
},1000);
</script>

// ══════════════════════════════════════════
// 6-WEEK LOOK AHEAD SCHEDULE  v2.0
// — Absolute ISO week keys (YYYY-Www)
// — Full Timeline + 6-Week window toggle
// — Sliding window navigation
// — Export range modal
// ══════════════════════════════════════════

// ── ISO week helpers ─────────────────────

/** Returns ISO week string "YYYY-Www" for a given Date */
function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
}

/** Returns Monday Date for an ISO week key "YYYY-Www" */
function isoWeekMonday(key) {
  const [year, wPart] = key.split('-W');
  const y = parseInt(year), w = parseInt(wPart);
  // Jan 4 is always in week 1
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1) + (w - 1) * 7);
  return monday;
}

/** Format date as M/D */
function fmtMD(d) { return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; }

/** Add weeks to an ISO key */
function addWeeks(key, n) {
  const mon = isoWeekMonday(key);
  mon.setUTCDate(mon.getUTCDate() + n * 7);
  return isoWeekKey(mon);
}

/** Compare two ISO week keys */
function weekCmp(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

/** Current ISO week key */
function currentWeekKey() { return isoWeekKey(new Date()); }

/** Array of N consecutive week keys starting from startKey */
function weekRange(startKey, n) {
  return Array.from({length: n}, (_, i) => addWeeks(startKey, i));
}

// ── Per-project schedule view state ──────
const _schedState = {};
function getSchedState(pid) {
  if (!_schedState[pid]) {
    _schedState[pid] = {
      mode: '6week',          // '6week' | 'full'
      windowStart: null,      // ISO key — null = auto (current week)
    };
  }
  return _schedState[pid];
}

// ── Legacy key migration ──────────────────
// Old keys: "${itemId}_w0" … "${itemId}_w5" (relative to some past Monday)
// New keys: "${itemId}_YYYY-Www"
// We migrate by assuming w0 = current week at time of migration (best guess).
function _migrateLegacySchedule(proj) {
  if (!proj.schedule) return;
  const cur = currentWeekKey();
  const newSched = {};
  let migrated = 0;
  Object.entries(proj.schedule).forEach(([key, val]) => {
    const m = key.match(/^(.+)_(w\d)$/);
    if (m) {
      const itemId = m[1];
      const wIdx = parseInt(m[2].slice(1));
      const newKey = `${itemId}_${addWeeks(cur, wIdx)}`;
      newSched[newKey] = val;
      migrated++;
    } else {
      newSched[key] = val;
    }
  });
  if (migrated > 0) {
    proj.schedule = newSched;
    console.log(`[ADH] Migrated ${migrated} legacy schedule keys to ISO format`);
  }

  // Also migrate laborLog
  if (proj.laborLog) {
    const newLog = {};
    Object.entries(proj.laborLog).forEach(([key, val]) => {
      const m = key.match(/^(.+)_(w\d)$/);
      if (m) {
        const itemId = m[1];
        const wIdx = parseInt(m[2].slice(1));
        newLog[`${itemId}_${addWeeks(cur, wIdx)}`] = val;
      } else {
        newLog[key] = val;
      }
    });
    proj.laborLog = newLog;
  }
}

// ── Compute full timeline extent ──────────
// ONLY uses actual schedule entries — never item date fields
// (those can be years out from work order imports and cause infinite loops)
// Hard cap: max 52 weeks before current, max 26 weeks after current
function _getProjectWeekExtent(proj) {
  const cur = currentWeekKey();
  const hardEarliest = addWeeks(cur, -52); // never go more than 1 year back
  const hardLatest   = addWeeks(cur, 26);  // never go more than 6 months forward
  let earliest = cur, latest = addWeeks(cur, 5);

  // Only scan actual entered schedule cells — not item metadata dates
  Object.keys(proj.schedule || {}).forEach(key => {
    const m = key.match(/(\d{4}-W\d{2})$/);
    if (!m) return;
    const wk = m[1];
    // Ignore any key outside the hard caps (safety guard)
    if (weekCmp(wk, hardEarliest) < 0 || weekCmp(wk, hardLatest) > 0) return;
    if (weekCmp(wk, earliest) < 0) earliest = wk;
    if (weekCmp(wk, latest) > 0) latest = wk;
  });

  // Ensure at least 6 weeks visible beyond current
  if (weekCmp(addWeeks(cur, 5), latest) > 0) latest = addWeeks(cur, 5);
  // Never go earlier than hard cap
  if (weekCmp(earliest, hardEarliest) < 0) earliest = hardEarliest;
  // If no schedule entries exist yet, default to current + 11 weeks
  if (weekCmp(earliest, cur) > 0) earliest = cur;
  if (weekCmp(latest, addWeeks(cur, 11)) < 0) latest = addWeeks(cur, 11);

  return { earliest, latest };
}

// ── Build week column metadata ────────────
function _buildWeekCols(weeks) {
  return weeks.map(wk => {
    const mon = isoWeekMonday(wk);
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    const isCurrent = wk === currentWeekKey();
    const isPast = weekCmp(wk, currentWeekKey()) < 0;
    return {
      key: wk,
      label: fmtMD(mon) + '–' + fmtMD(sun),
      month: mon.toLocaleString('default', {month:'short', timeZone:'UTC'}),
      isCurrent,
      isPast,
      mon, sun
    };
  });
}

// ── Group weeks by month for header ───────
function _groupByMonth(weekCols) {
  const groups = [];
  weekCols.forEach(wc => {
    const m = wc.month;
    if (!groups.length || groups[groups.length-1].month !== m) {
      groups.push({ month: m, count: 1 });
    } else {
      groups[groups.length-1].count++;
    }
  });
  return groups;
}

// ── Phase color mapping (from Excel) ──────
const PHASE_COLORS = {
  'SDS':  { bg:'rgba(59,130,246,0.18)',  text:'#60a5fa', border:'rgba(59,130,246,0.35)' },
  'FSS':  { bg:'rgba(59,130,246,0.18)',  text:'#60a5fa', border:'rgba(59,130,246,0.35)' },
  'SDA':  { bg:'rgba(16,185,129,0.18)',  text:'#34d399', border:'rgba(16,185,129,0.35)' },
  'FSA':  { bg:'rgba(16,185,129,0.18)',  text:'#34d399', border:'rgba(16,185,129,0.35)' },
  'RTS':  { bg:'rgba(245,158,11,0.18)',  text:'#fbbf24', border:'rgba(245,158,11,0.35)' },
  'DEL':  { bg:'rgba(249,115,22,0.22)',  text:'#fb923c', border:'rgba(249,115,22,0.4)'  },
  'GLASS':{ bg:'rgba(167,139,250,0.18)', text:'#a78bfa', border:'rgba(167,139,250,0.35)'},
  'MEP':  { bg:'rgba(239,68,68,0.15)',   text:'#f87171', border:'rgba(239,68,68,0.3)'  },
  'TBD':  { bg:'rgba(100,116,139,0.15)', text:'#94a3b8', border:'rgba(100,116,139,0.3)'},
  'DELAYED':{ bg:'rgba(239,68,68,0.12)',text:'#f87171', border:'rgba(239,68,68,0.25)' },
};

function _cellStyle(val) {
  if (!val) return '';
  const upper = val.toUpperCase().trim();
  for (const [k, c] of Object.entries(PHASE_COLORS)) {
    if (upper === k || upper.startsWith(k + ' ') || upper.includes(k)) {
      return `background:${c.bg};color:${c.text};border:1px solid ${c.border};border-radius:5px;font-weight:600;font-size:9px;`;
    }
  }
  return '';
}

// ── Main buildScheduleView ────────────────
function buildScheduleView(pid) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.schedule) proj.schedule = {};
  if(!proj.laborSettings) proj.laborSettings = { show:false, workers:4, hoursPerDay:8, workDays:5 };
  if(!proj.laborLog) proj.laborLog = {};

  // Migrate legacy keys on first open
  _migrateLegacySchedule(proj);

  const ls = proj.laborSettings;
  const state = getSchedState(pid);
  const cur = currentWeekKey();

  // Determine which weeks to show
  let weekKeys;
  if (state.mode === 'full') {
    const { earliest, latest } = _getProjectWeekExtent(proj);
    weekKeys = [];
    let wk = earliest;
    let safety = 0;
    while (weekCmp(wk, latest) <= 0 && safety < 80) { // hard cap: 80 weeks max
      weekKeys.push(wk);
      wk = addWeeks(wk, 1);
      safety++;
    }
  } else {
    // 6-week sliding window
    const windowStart = state.windowStart || cur;
    weekKeys = weekRange(windowStart, 6);
  }

  const weekCols = _buildWeekCols(weekKeys);
  const monthGroups = _groupByMonth(weekCols);
  const items = proj.items;
  const el = document.getElementById('v-schedule');

  // ── Per-week labor totals ─────────────
  const weekLabor = weekCols.map(wc => {
    const scheduled = items.reduce((sum, item) => {
      const hasCell = !!(proj.schedule[`${item.id}_${wc.key}`] || '').trim();
      return sum + (hasCell && item.laborHours ? item.laborHours : 0);
    }, 0);
    const logged = items.reduce((sum, item) => {
      const log = proj.laborLog[`${item.id}_${wc.key}`] || {};
      return sum + (log.hours || 0);
    }, 0);
    const capacity = ls.workers * ls.hoursPerDay * ls.workDays;
    const display = logged > 0 ? logged : scheduled;
    const pct = capacity > 0 ? Math.round((display / capacity) * 100) : 0;
    const barColor = pct > 100 ? '#ef4444' : pct >= 80 ? '#fbbf24' : '#22c55e';
    return { scheduled, logged, capacity, pct, barColor, display };
  });

  // ── Status dot helper ─────────────────
  function statusDot(s) {
    const c = { completed:'#22c55e','punch-ongoing':'#a855f7','not-ready':'#ef4444','in-progress':'#fbbf24','on-hold':'#f97316',pending:'#475569' };
    return `<span class="sched-status-dot" style="background:${c[s]||c.pending}"></span>`;
  }

  // ── Column widths ─────────────────────
  const SI_COL = 170; // px, fixed
  const WEEK_COL = state.mode === 'full' ? Math.max(72, Math.min(110, Math.floor((window.innerWidth - SI_COL - 80) / weekCols.length))) : 110;

  // ── Navigation controls ───────────────
  const windowStart = state.windowStart || cur;
  const prevStart = addWeeks(windowStart, -6);
  const nextStart = addWeeks(windowStart, 6);

  const navControlsHTML = state.mode === '6week' ? `
    <div style="display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;flex-shrink:0">
      <button class="sched-nav-btn" onclick="schedSlide('${pid}',-1)" title="Previous 6 weeks"
        style="width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.12s"
        onmouseover="this.style.background='var(--surface3)'" onmouseout="this.style.background='none'">‹</button>
      <button onclick="schedGoToday('${pid}')"

        style="width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.12s"
        onmouseover="this.style.background='var(--surface3)'" onmouseout="this.style.background='none'">›</button>
    </div>` : '';

  // ── Month header row ──────────────────
  const monthHeaderHTML = `
    <div class="sched-cell sched-si-col" style="background:var(--surface);border-bottom:1px solid var(--border);padding:6px 10px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase">SITE ITEM</div>
    ${monthGroups.map(g => `
      <div style="grid-column:span ${g.count};background:var(--surface);border-bottom:1px solid var(--border);border-left:1px solid var(--border2);padding:5px 10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.8px;color:var(--text3);text-transform:uppercase;display:flex;align-items:center">
        ${g.month.toUpperCase()}

  // ── Week header row ───────────────────
  const weekHeaderHTML = `
    <div class="sched-cell sched-si-col" style="background:var(--surface);padding:0"></div>
    ${weekCols.map(wc => `
      <div class="sched-cell sched-week-header ${wc.isCurrent?'sched-current-week':''} ${wc.isPast?'sched-past-week':''}"

        <div style="font-family:var(--mono);font-size:8px;font-weight:700;color:${wc.isCurrent?'var(--accent)':wc.isPast?'var(--text3)':'var(--text2)'};letter-spacing:0.3px">${wc.label}</div>

  // ── Data rows ─────────────────────────
  const dataRowsHTML = items.map(item => {
    const totalLogged = weekCols.reduce((sum, wc) => {

      return sum + (log.hours || 0);
    }, 0);
    const remaining = (item.laborHours || 0) - totalLogged;
    const remPct = item.laborHours > 0 ? remaining / item.laborHours : 1;

              onchange="saveLaborLog('${pid}','${key}','workers',+this.value||0)" title="Workers" />
            <input type="number" min="0" max="9999" value="${log.hours||''}" placeholder="⏱"
              style="width:36px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:3px;font-size:8px;color:var(--text);text-align:center;outline:none;padding:1px;"

    return `

        <span style="font-family:var(--mono);font-size:8px;color:var(--text3)">${statusDot(item.status)}${item.num}</span>
        <span style="font-size:10px;line-height:1.3;color:var(--text);font-weight:500">${item.title}</span>
        ${item.laborHours != null ? `<span style="font-size:8px;font-family:var(--mono);color:${remClass}">⏱ ${item.laborHours}h ${ls.show && item.laborHours ? (remaining<=0?'✓ done':remaining+'h left') : ''}</span>` : ''}
      </div>
      ${cells}`;
  }).join('');

  // ── Labor summary row ─────────────────
  const laborRowHTML = ls.show ? `
    <div class="sched-cell sched-si-col" style="background:rgba(30,58,95,0.85);display:flex;align-items:center;padding:8px 10px;">
      <span style="font-family:var(--mono);font-size:9px;font-weight:700;color:#93c5fd;letter-spacing:0.8px;text-transform:uppercase">👷 LABOR</span>
    </div>
    ${weekCols.map((wc, i) => {
      const wl = weekLabor[i];
      const barColor = wl.pct > 100 ? '#ef4444' : wl.pct >= 80 ? '#fbbf24' : '#22c55e';
      return `<div class="sched-cell ${wc.isCurrent?'sched-current-week':''}"
        style="background:rgba(30,58,95,0.7);padding:6px 8px;display:flex;flex-direction:column;gap:3px;">
        <span style="font-family:var(--mono);font-size:9px;color:#93c5fd;font-weight:600">${wl.logged>0?wl.logged+'h logged':wl.scheduled+'h est'}</span>
        <span style="font-size:8px;color:${barColor};font-family:var(--mono)">${wl.pct}% / ${wl.capacity}h cap</span>
        <div style="height:3px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${Math.min(wl.pct,100)}%;background:${barColor};border-radius:2px;transition:width 0.3s"></div>
        </div>
      </div>`;
    }).join('')}` : '';

  // ── Legend HTML ───────────────────────
  const legendHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 0;border-top:1px solid var(--border)">
      ${Object.entries(PHASE_COLORS).slice(0,7).map(([k,c]) => `
        <div style="display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;color:${c.text};
          background:${c.bg};border:1px solid ${c.border};border-radius:4px;padding:2px 7px;">
          ${k}
        </div>`).join('')}
      <span style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-left:4px">— tap cell to enter phase / notes</span>
    </div>`;

  // ── Labor settings panel ──────────────
  const laborPanelHTML = ls.show ? `
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 14px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:11px;">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Workers</span>
        <input type="number" class="labor-num-input" min="1" max="999" value="${ls.workers}"
          onchange="saveScheduleSetting('${pid}','workers',+this.value||1)" />
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Hrs/Day</span>
        <input type="number" class="labor-num-input" min="1" max="24" value="${ls.hoursPerDay}"
          onchange="saveScheduleSetting('${pid}','hoursPerDay',+this.value||8)" />
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Work Days</span>
        <div style="display:flex;gap:3px">
          ${[5,6,7].map(d=>`<button onclick="saveScheduleSetting('${pid}','workDays',${d})"
            style="padding:4px 9px;border-radius:6px;border:1px solid ${ls.workDays===d?'rgba(96,165,250,0.5)':'var(--border)'};
            background:${ls.workDays===d?'rgba(96,165,250,0.15)':'var(--surface)'};
            color:${ls.workDays===d?'#60a5fa':'var(--text3)'};font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;">${d}d</button>`).join('')}
        </div>
      </div>
      <div style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">
        Cap: ${ls.workers * ls.hoursPerDay * ls.workDays}h/wk
      </div>
    </div>` : '';

  // ── Assemble the grid ─────────────────
  const gridCols = `${SI_COL}px repeat(${weekCols.length}, ${WEEK_COL}px)`;

  el.innerHTML = `
    <div class="schedule-wrap">
      <!-- Header row -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="schedule-title">📅 Look Ahead
            <span style="font-size:11px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
          </div>
          ${navControlsHTML}
        </div>
        <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">

          <div style="display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0">

              6-WEEK
            </button>
            <button onclick="schedSetMode('${pid}','full')"
              style="padding:7px 13px;border:none;background:${state.mode==='full'?'var(--accent)':'none'};
              color:${state.mode==='full'?'#000':'var(--text2)'};font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap">
              FULL TIMELINE
            </button>
          </div>
          <button class="labor-toggle-btn ${ls.show?'active':''}" onclick="saveScheduleSetting('${pid}','show',${!ls.show})"
            style="padding:7px 13px;white-space:nowrap">
            👷 Manpower
          </button>
          <button class="schedule-export-btn" onclick="showScheduleExportModal('${pid}')">
            ⬇ Export PDF
          </button>
        </div>
      </div>

      ${laborPanelHTML}

      ${items.length === 0 ? `
        <div style="text-align:center;padding:60px;color:var(--text3)">
          <div style="font-size:40px;opacity:0.18;margin-bottom:12px">📅</div>
          <div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px">No site items yet</div>
          <div style="font-size:12px">Add SI items to the project first.</div>
        </div>
      ` : `
        <div style="overflow-x:auto;flex:1;border:1px solid var(--border);border-radius:10px;overflow:hidden">
          <div id="sched-grid-inner" style="display:grid;grid-template-columns:${gridCols};min-width:${SI_COL + weekCols.length * WEEK_COL}px">
            ${monthHeaderHTML}
            ${weekHeaderHTML}
            ${dataRowsHTML}
            ${laborRowHTML}
          </div>
        </div>
        ${legendHTML}
      `}
    </div>`;

  // Scroll to current week in full timeline mode
  if (state.mode === 'full') {
    setTimeout(() => {
      const grid = document.getElementById('sched-grid-inner');
      if (!grid) return;
      const curIdx = weekCols.findIndex(w => w.isCurrent);
      if (curIdx > 0) {
        const scrollTarget = SI_COL + (curIdx - 1) * WEEK_COL;
        grid.parentElement.scrollLeft = Math.max(0, scrollTarget - 20);
      }
    }, 60);
  }
}

// ── Schedule action handlers ──────────────
window.schedSetMode = function(pid, mode) {
  const state = getSchedState(pid);
  state.mode = mode;
  if (mode === '6week') state.windowStart = null; // reset to current
  buildScheduleView(pid);
};

window.schedSlide = function(pid, dir) {
  const state = getSchedState(pid);
  const cur = currentWeekKey();
  const base = state.windowStart || cur;
  state.windowStart = addWeeks(base, dir * 6);
  buildScheduleView(pid);
};

window.schedGoToday = function(pid) {
  const state = getSchedState(pid);
  state.windowStart = null;
  buildScheduleView(pid);
};

window.saveScheduleCell = function(pid, key, val) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.schedule) proj.schedule = {};
  if(val.trim()) proj.schedule[key] = val.trim();
  else delete proj.schedule[key];
  markProjectDirty(pid); save();
};

window.saveScheduleSetting = function(pid, field, value) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.laborSettings) proj.laborSettings = {show:false,workers:4,hoursPerDay:8,workDays:5};
  proj.laborSettings[field] = value;
  markProjectDirty(pid); save();
  buildScheduleView(pid);
};

window.saveLaborLog = function(pid, key, field, value) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.laborLog) proj.laborLog = {};
  if(!proj.laborLog[key]) proj.laborLog[key] = {workers:0,hours:0};
  proj.laborLog[key][field] = value;
  if(!proj.laborLog[key].workers && !proj.laborLog[key].hours) delete proj.laborLog[key];
  markProjectDirty(pid); save();
};

// ── Export modal ──────────────────────────
window.showScheduleExportModal = function(pid) {
  const proj = getProject(pid); if(!proj) return;
  const cur = currentWeekKey();
  const { earliest, latest } = _getProjectWeekExtent(proj);

  // Presets
  const presets = [
    { label: 'Current 6 Weeks', from: cur, to: addWeeks(cur, 5) },
    { label: 'Past 4 + Next 8',  from: addWeeks(cur, -4), to: addWeeks(cur, 7) },
    { label: 'Full Project',      from: earliest, to: latest },
  ];

  function weekCount(from, to) {
    let n = 0, wk = from;
    while (weekCmp(wk, to) <= 0 && n < 200) { n++; wk = addWeeks(wk, 1); }
    return n;
  }

  function fmtKey(k) {
    const mon = isoWeekMonday(k);
    return mon.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
  }

  makeModal('Export Schedule PDF', `
    <div style="margin-bottom:14px">
      <div class="share-section-label">Quick Presets</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${presets.map((p,i) => `
          <div class="action-row" onclick="applySchedPreset(${i})"
            style="padding:10px 13px;cursor:pointer" id="sched-preset-${i}">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${p.label}</div>
              <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px">
                ${fmtKey(p.from)} → ${fmtKey(p.to)} · ${weekCount(p.from,p.to)} weeks
              </div>
            </div>
            <div class="action-arrow">›</div>
          </div>`).join('')}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div class="field-group" style="margin-bottom:0">
        <div class="field-label">From Week</div>
        <input type="week" class="field-input" id="exp-from" value="${cur.replace('W','W').replace('-W','-W')}"
          style="padding:8px 10px;font-size:12px" oninput="updateSchedPageCount('${pid}')" />
      </div>
      <div class="field-group" style="margin-bottom:0">
        <div class="field-label">To Week</div>
        <input type="week" class="field-input" id="exp-to" value="${addWeeks(cur,5).replace('-W','-W')}"
          style="padding:8px 10px;font-size:12px" oninput="updateSchedPageCount('${pid}')" />
      </div>
    </div>

    <div id="exp-page-count" style="padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:var(--mono);color:var(--text2);margin-bottom:14px">
      — select range above —
    </div>

    <div class="export-opt-row">
      <span class="export-opt-label">Include manpower row</span>
      <div class="export-check ${ls.show?'checked':''}" id="exp-labor" onclick="toggleCheck('exp-labor')">${ls.show?'✓':''}</div>
    </div>
  `, () => {
    const fromEl = document.getElementById('exp-from');
    const toEl   = document.getElementById('exp-to');
    if(!fromEl||!toEl) return;
    // Convert <input type="week"> value "YYYY-Www" to our key format
    const fromKey = fromEl.value; // browser gives YYYY-Www already
    const toKey   = toEl.value;
    if(!fromKey||!toKey) return showToast('Select a date range','red');
    const inclLabor = document.getElementById('exp-labor')?.classList.contains('checked');
    closeModal();
    exportSchedulePDF(pid, fromKey, toKey, inclLabor);
  });

  // Attach preset appliers
  window.applySchedPreset = function(i) {
    const p = presets[i];
    const fromEl = document.getElementById('exp-from');
    const toEl   = document.getElementById('exp-to');
    if(fromEl) fromEl.value = p.from;
    if(toEl)   toEl.value   = p.to;
    updateSchedPageCount(pid);
    document.querySelectorAll('[id^=sched-preset-]').forEach(el => {
      el.style.borderColor = '';
      el.style.background  = '';
    });
    const sel = document.getElementById('sched-preset-' + i);
    if(sel) { sel.style.borderColor = 'var(--accent)'; sel.style.background = 'var(--accent-dim)'; }
  };

  window.updateSchedPageCount = function(pid_) {
    const fromEl = document.getElementById('exp-from');
    const toEl   = document.getElementById('exp-to');
    const el     = document.getElementById('exp-page-count');
    if(!fromEl||!toEl||!el) return;
    const from = fromEl.value, to = toEl.value;
    if(!from||!to) { el.textContent = '— select range above —'; return; }
    if(weekCmp(from, to) > 0) { el.textContent = '⚠ "From" must be before "To"'; el.style.color = 'var(--red)'; return; }
    el.style.color = 'var(--text2)';
    const n = weekCount(from, to);
    const proj_ = getProject(pid_);
    const items_ = proj_?.items?.length || 0;
    // Rough estimate: ~3 rows per page in landscape at rowH=10
    const rowsPerPage = Math.floor((210 - 36) / 10);
    const pages = Math.ceil(items_ / rowsPerPage) + 1;
    el.textContent = `${n} weeks · ~${items_} SI items · Est. ${pages} page${pages!==1?'s':''}`;
  };

  // Initialize page count
  setTimeout(() => updateSchedPageCount(pid), 50);
};

// ── PDF export with range ─────────────────
async function exportSchedulePDF(pid, fromKey, toKey, inclLabor) {
  const proj = getProject(pid); if(!proj) return;

  let attempts = 0;
  while(typeof window.jspdf === 'undefined' && attempts < 32) {
    await new Promise(r => setTimeout(r, 250)); attempts++;
  }
  if(typeof window.jspdf === 'undefined') return showToast('PDF library not loaded');

  showPDFProgress('Building Schedule PDF…', 0);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const PW = 297, PH = 210;

  function h2r(h) { return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  const BG = '#1e3a5f', FG = '#ffffff';
  const ls = proj.laborSettings || {show:false,workers:4,hoursPerDay:8,workDays:5};

  // Build week list for export
  const exportWeeks = [];
  let wk = fromKey;
  while(weekCmp(wk, toKey) <= 0 && exportWeeks.length < 100) {
    exportWeeks.push(wk);
    wk = addWeeks(wk, 1);
  }

  const curKey = currentWeekKey();
  const siColW = 72;
  const weekColW = Math.min(28, Math.floor((PW - 14 - siColW) / exportWeeks.length));
  const rowH = 10;

  // ── Header band ──────────────────────
  doc.setFillColor(...h2r(BG)); doc.rect(0,0,PW,22,'F');
  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
  doc.text('LOOK AHEAD SCHEDULE', 14, 10);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`${proj.name}  ·  ${fmtKey(fromKey)} – ${fmtKey(toKey)}  ·  Generated: ${new Date().toLocaleDateString()}`, 14, 17);

  function fmtKey(k) {
    const mon = isoWeekMonday(k);
    return mon.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'2-digit', timeZone:'UTC'});
  }

  const startY = 26;

  // ── Month grouping header ─────────────
  const months = _groupByMonth(_buildWeekCols(exportWeeks));
  let mx = 14 + siColW;
  months.forEach(mg => {
    const colSpanW = mg.count * weekColW;
    doc.setFillColor(...h2r('#1e293b')); doc.rect(mx, startY, colSpanW, 5, 'F');
    doc.setFontSize(5.5); doc.setFont('helvetica','bold'); doc.setTextColor(150,180,210);
    doc.text(mg.month.toUpperCase(), mx + colSpanW/2, startY + 3.8, {align:'center'});
    mx += colSpanW;
  });

  // ── Week column headers ───────────────
  doc.setFillColor(...h2r(BG)); doc.rect(14, startY, siColW, 8, 'F');
  doc.setFontSize(6); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
  doc.text('SITE ITEM', 16, startY + 5.5);

  exportWeeks.forEach((w, i) => {
    const x = 14 + siColW + i * weekColW;
    const isCur = w === curKey;
    doc.setFillColor(...h2r(isCur ? '#2563eb' : BG));
    doc.rect(x, startY, weekColW, 8, 'F');
    const mon = isoWeekMonday(w);
    const label = `${mon.getUTCMonth()+1}/${mon.getUTCDate()}`;
    doc.setFontSize(5); doc.setFont('helvetica', isCur?'bold':'normal');
    doc.setTextColor(isCur ? 255 : 180, isCur ? 255 : 200, isCur ? 255 : 220);
    doc.text(label, x + weekColW/2, startY + 5.5, {align:'center', maxWidth: weekColW-2});
  });

  // ── Data rows ─────────────────────────
  let y = startY + 8;
  const BORDER = '#cbd5e1';

  proj.items.forEach((item, ri) => {
    if(y + rowH > PH - 12) {
      doc.addPage();
      y = 14;
      // Re-draw compact header on continuation pages
      doc.setFillColor(...h2r(BG)); doc.rect(14, y, siColW + exportWeeks.length*weekColW, 6, 'F');
      doc.setFontSize(6); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
      doc.text('SITE ITEM', 16, y+4.5);
      exportWeeks.forEach((w,i) => {
        const x = 14 + siColW + i*weekColW;
        const mon = isoWeekMonday(w);
        doc.text(`${mon.getUTCMonth()+1}/${mon.getUTCDate()}`, x+weekColW/2, y+4.5, {align:'center', maxWidth:weekColW-1});
      });
      y += 6;
    }

    const bg = ri%2===0 ? '#f8fafc' : '#eef2f7';
    doc.setFillColor(...h2r(bg)); doc.rect(14, y, siColW + exportWeeks.length*weekColW, rowH, 'F');
    doc.setDrawColor(...h2r(BORDER)); doc.setLineWidth(0.15);
    doc.rect(14, y, siColW + exportWeeks.length*weekColW, rowH, 'S');

    // Status dot
    const dotColors = {completed:'#22c55e','punch-ongoing':'#a855f7','not-ready':'#ef4444','in-progress':'#fbbf24','on-hold':'#f97316',pending:'#94a3b8'};
    const dc = dotColors[item.status] || dotColors.pending;
    doc.setFillColor(...h2r(dc));
    doc.circle(17, y+5, 1.5, 'F');

    doc.setFontSize(6.5); doc.setFont('helvetica','bold'); doc.setTextColor(30,58,95);
    doc.text(item.num, 20, y+4.5, {maxWidth: siColW-8});
    doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(50,70,100);
    doc.text(item.title, 20, y+8.5, {maxWidth: siColW-8});

    // Week cells
    exportWeeks.forEach((w, i) => {
      const x = 14 + siColW + i*weekColW;
      const val = (proj.schedule[`${item.id}_${w}`] || '').trim();
      if(!val) return;

      // Phase color background
      const upper = val.toUpperCase();
      let phBg = null, phText = [50,70,100];
      for(const [k,c] of Object.entries(PHASE_COLORS)) {
        if(upper === k || upper.startsWith(k+' ') || upper.includes(k)) {
          const rgb = h2r(c.text);
          phBg = rgb; phText = rgb;
          doc.setFillColor(rgb[0], rgb[1], rgb[2], 0.15);
          doc.setFillColor(phBg[0]*0.3+220, phBg[1]*0.3+220, phBg[2]*0.3+220);
          doc.rect(x+0.5, y+0.5, weekColW-1, rowH-1, 'F');
          break;
        }
      }
      doc.setFontSize(5.5); doc.setFont('helvetica','bold');
      doc.setTextColor(...phText);
      doc.text(val, x+weekColW/2, y+5.5, {align:'center', maxWidth: weekColW-2});
    });

    y += rowH;
  });

  // ── Labor row ─────────────────────────
  if(inclLabor && ls.show) {
    if(y+rowH+2 > PH-12) { doc.addPage(); y=14; }
    doc.setFillColor(...h2r(BG)); doc.rect(14, y, siColW + exportWeeks.length*weekColW, rowH+2, 'F');
    doc.setFontSize(6.5); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
    doc.text('MANPOWER', 16, y+7);

    exportWeeks.forEach((w, i) => {
      const x = 14 + siColW + i*weekColW;
      const scheduled = proj.items.reduce((sum,item)=>{
        const hasCell=!!(proj.schedule?.[`${item.id}_${w}`]||'').trim();
        return sum+(hasCell&&item.laborHours?item.laborHours:0);
      },0);
      const capacity = ls.workers*ls.hoursPerDay*ls.workDays;
      const pct = capacity>0?Math.round((scheduled/capacity)*100):0;
      const [r,g,b] = pct>100?[239,68,68]:pct>=80?[251,191,36]:[34,197,94];
      doc.setFontSize(5.5); doc.setFont('helvetica','bold'); doc.setTextColor(147,197,253);
      doc.text(`${scheduled}h`, x+weekColW/2, y+5, {align:'center', maxWidth:weekColW-2});
      doc.setTextColor(r,g,b); doc.setFont('helvetica','normal'); doc.setFontSize(5);
      doc.text(`${pct}%`, x+weekColW/2, y+9, {align:'center', maxWidth:weekColW-2});
    });
    y += rowH+2;
  }

  // ── Footer on all pages ───────────────
  const pc = doc.getNumberOfPages();
  for(let p=1;p<=pc;p++){
    doc.setPage(p);
    doc.setFillColor(...h2r(BG)); doc.rect(0,PH-8,PW,8,'F');
    doc.setFontSize(6); doc.setFont('helvetica','normal'); doc.setTextColor(...h2r(FG));
    doc.text(proj.name, 14, PH-3);
    doc.text(`${fmtKey(fromKey)} – ${fmtKey(toKey)}`, PW/2, PH-3, {align:'center'});
    doc.text(`Page ${p} of ${pc}`, PW-14, PH-3, {align:'right'});
  }

  updatePDFProgress('Saving…', 95);
  await new Promise(r => setTimeout(r, 80));

  const filename = proj.name.replace(/[^a-z0-9]/gi,'_') + '_schedule.pdf';
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  hidePDFProgress();

  if(isIOS){
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px';
    ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:24px;max-width:320px;text-align:center">
      <div style="font-size:36px;margin-bottom:10px">📅</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">Schedule PDF Ready</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:18px;line-height:1.6">Tap <strong>Open PDF</strong> then Share ⬆ → Save to Files</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="window.open('${url}','_blank');this.closest('div[style]').remove()"
          style="background:var(--green);color:#000;border:none;border-radius:10px;padding:12px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer">Open PDF ↗</button>
        <button onclick="this.closest('div[style]').remove()"
          style="background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;cursor:pointer">Cancel</button>
      </div></div>`;
    document.body.appendChild(ov);
  } else {
    doc.save(filename);
    showToast('✓ Schedule PDF Downloaded', 'green');
  }
}

// ENVIRONMENTAL CONDITIONS VIEW
// ══════════════════════════════════════════

// Per-sensor filter state: { startPct:0, endPct:100 }
const _envFilters = {};

function getEnvFilter(pid, si) {
  const key = pid+'_'+si;
  if(!_envFilters[key]) _envFilters[key] = {startPct:0, endPct:100, preset:'all'};
  return _envFilters[key];
}

function filterData(data, startPct, endPct) {
  if(!data||!data.length) return [];
  const s = Math.floor(data.length * startPct/100);
  const e = Math.ceil(data.length * endPct/100);
  return data.slice(s, Math.max(s+1, e));
}

function buildEnvView(pid) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) proj.envData = { sensors:[], screenshots:[] };
  if(!proj.envData.thresholds) proj.envData.thresholds = { minTemp:50, maxTemp:80, minHum:20, maxHum:60 };
  const env = proj.envData;
  const thr = env.thresholds;
  const el = document.getElementById('v-env');

  const screenshotCards = env.screenshots.map((s,i)=>`
    <div class="env-screenshot-card">
      <div class="env-screenshot-header">
        <span class="env-screenshot-title">📷 ${s.label||'Sensor Screenshot'}</span>
        <button class="env-sensor-del" onclick="deleteEnvScreenshot('${pid}',${i})">✕</button>
      </div>
      <img class="env-screenshot-img" src="${s.data}" />
    </div>`).join('');

  const sensorCards = env.sensors.map((s,si)=>buildSensorCard(pid,s,si)).join('');

  // Compute threshold violations across all sensors
  const warnings = [];
  env.sensors.forEach((s,si)=>{
    const flt = getEnvFilter(pid, si);
    const td = filterData(s.temperature||[], flt.startPct, flt.endPct);
    const hd = filterData(s.humidity||[],    flt.startPct, flt.endPct);
    const tOver  = td.filter(d=>d.v > thr.maxTemp);
    const tUnder = td.filter(d=>d.v < thr.minTemp);
    const hOver  = hd.filter(d=>d.v > thr.maxHum);
    const hUnder = hd.filter(d=>d.v < thr.minHum);
    if(tOver.length) {
      const peak = Math.max(...tOver.map(d=>d.v)).toFixed(1);
      warnings.push({type:'temp', dir:'high', msg:`${s.name||'Sensor '+(si+1)}: Temp exceeded max ${thr.maxTemp}°F — peak ${peak}°F (${tOver.length} readings)`, cls:'temp-warn'});
    }
    if(tUnder.length) {
      const low = Math.min(...tUnder.map(d=>d.v)).toFixed(1);
      warnings.push({type:'temp', dir:'low', msg:`${s.name||'Sensor '+(si+1)}: Temp dropped below min ${thr.minTemp}°F — low ${low}°F (${tUnder.length} readings)`, cls:'temp-warn'});
    }
    if(hOver.length) {
      const peak = Math.max(...hOver.map(d=>d.v)).toFixed(1);
      warnings.push({type:'hum', dir:'high', msg:`${s.name||'Sensor '+(si+1)}: Humidity exceeded max ${thr.maxHum}% — peak ${peak}% (${hOver.length} readings)`, cls:'hum-warn'});
    }
    if(hUnder.length) {
      const low = Math.min(...hUnder.map(d=>d.v)).toFixed(1);
      warnings.push({type:'hum', dir:'low', msg:`${s.name||'Sensor '+(si+1)}: Humidity dropped below min ${thr.minHum}% — low ${low}% (${hUnder.length} readings)`, cls:'hum-warn'});
    }
  });

  const warningsHTML = warnings.length ? `
    <div class="env-warnings-list">
      ${warnings.map(w=>`
        <div class="env-warn-item ${w.cls}">
          <span class="env-warn-icon">${w.type==='temp'?'🌡️':'💧'}</span>
          <span style="margin-right:4px">${w.dir==='high'?'▲':'▼'}</span> ${w.msg}
        </div>`).join('')}
    </div>` : '';

  const emptyState = (!env.sensors.length && !env.screenshots.length) ? `
    <div class="env-empty">
      <div class="env-empty-icon">🌡️</div>
      <div class="env-empty-title">No environmental data yet</div>
      <div class="env-empty-desc">Upload a sensor screenshot to capture a visual snapshot, or import CSV data to display live temperature &amp; humidity charts.</div>
    </div>` : '';

  el.innerHTML=`
    <div class="env-wrap">
      <div class="env-header-row">
        <div class="env-header-title">🌡️ Environmental Conditions
          <span style="font-size:10px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
        </div>
        <div class="env-upload-row">
          <button class="env-upload-btn screenshot" onclick="triggerEnvScreenshot('${pid}')">📷 Screenshot</button>
          <button class="env-upload-btn csv" onclick="triggerEnvCSV('${pid}')">📊 Import CSV</button>
        </div>
      </div>

      <!-- Threshold settings -->
      <div class="env-threshold-bar">
        <span style="font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;flex-shrink:0">Thresholds</span>
        <div class="env-zone-presets">
          ${[
            {id:'Z1', minH:25, maxH:45},
            {id:'Z2', minH:30, maxH:55},
            {id:'Z3', minH:43, maxH:65},
          ].map(z => {
            const active = thr.minTemp===60&&thr.maxTemp===90&&thr.minHum===z.minH&&thr.maxHum===z.maxH;
            return `<button class="env-zone-btn${active?' active':''}" onclick="applyZonePreset('${pid}','${z.id}')" title="${z.id}: 60–90°F · ${z.minH}–${z.maxH}%">${z.id}</button>`;
          }).join('')}
        </div>
        <div class="env-threshold-inputs">
          <div class="env-threshold-field temp-field">
            <label>🌡️ MIN</label>
            <input type="number" id="thr-mintemp-${pid}" value="${thr.minTemp??50}" min="-40" max="200" step="0.5"
              onchange="updateThreshold('${pid}','minTemp',this.value)" />
            <label style="color:var(--text2)">°F</label>
          </div>
          <div class="env-threshold-field temp-field">
            <label>🌡️ MAX</label>
            <input type="number" id="thr-maxtemp-${pid}" value="${thr.maxTemp??80}" min="-40" max="200" step="0.5"
              onchange="updateThreshold('${pid}','maxTemp',this.value)" />
            <label style="color:var(--text2)">°F</label>
          </div>
          <div class="env-threshold-field hum-field">
            <label>💧 MIN</label>
            <input type="number" id="thr-minhum-${pid}" value="${thr.minHum??20}" min="0" max="100" step="1"
              onchange="updateThreshold('${pid}','minHum',this.value)" />
            <label style="color:var(--text2)">%</label>
          </div>
          <div class="env-threshold-field hum-field">
            <label>💧 MAX</label>
            <input type="number" id="thr-maxhum-${pid}" value="${thr.maxHum??60}" min="0" max="100" step="1"
              onchange="updateThreshold('${pid}','maxHum',this.value)" />
            <label style="color:var(--text2)">%</label>
          </div>
        </div>
        ${warnings.length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--red);font-weight:600;flex-shrink:0">⚠ ${warnings.length} violation${warnings.length!==1?'s':''}</span>` : `<span style="font-family:var(--mono);font-size:10px;color:var(--green);flex-shrink:0">✓ All OK</span>`}
      </div>

      ${warningsHTML}
      ${emptyState}
      ${screenshotCards}
      <div class="env-sensor-grid" id="env-sensor-grid">${sensorCards}</div>
    </div>`;

  setTimeout(()=>{
    env.sensors.forEach((s,si)=> drawSensorCharts(pid, s, si));
  }, 80);
}

function buildSensorCard(pid, s, si) {
  const flt = getEnvFilter(pid, si);
  const allTemp = s.temperature||[];
  const allHum  = s.humidity||[];
  const tempData = filterData(allTemp, flt.startPct, flt.endPct);
  const humData  = filterData(allHum,  flt.startPct, flt.endPct);

  function stats(arr) {
    if(!arr.length) return {max:'—',min:'—',avg:'—'};
    const vals = arr.map(d=>d.v);
    return {
      max: Math.max(...vals).toFixed(1),
      min: Math.min(...vals).toFixed(1),
      avg: (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)
    };
  }
  const ts = stats(tempData), hs = stats(humData);
  const pts = tempData.length || humData.length;

  // Date range label for filtered window
  function rangeLabel(arr) {
    const withDates = arr.filter(d=>d.label);
    if(withDates.length<2) return s.dateRange||'';
    return withDates[0].label+' – '+withDates[withDates.length-1].label;
  }

  const presets = ['7d','30d','90d','all'];

  return `
  <div class="env-sensor-card" id="sensor-card-${si}">
    <div class="env-sensor-header">
      <div>
        <div class="env-sensor-name">📡 ${s.name||'Sensor'}
          <span class="env-sensor-id">${s.deviceId?'ID: '+s.deviceId:''}</span>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono)">${pts} points · ${rangeLabel(tempData.length?tempData:humData)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="env-sensor-meta">
          ${allTemp.length?`<div class="env-sensor-stat">
            <div class="env-sensor-stat-val" style="color:#f97316">${ts.avg}°F</div>
            <div class="env-sensor-stat-lbl">AVG TEMP</div>
          </div>`:''}
          ${allHum.length?`<div class="env-sensor-stat">
            <div class="env-sensor-stat-val" style="color:var(--accent)">${hs.avg}%</div>
            <div class="env-sensor-stat-lbl">AVG HUM</div>
          </div>`:''}
        </div>
        <button class="env-sensor-del" onclick="deleteEnvSensor('${pid}',${si})">✕</button>
      </div>
    </div>

window.updateEnvRange = function(pid, si, handle, val) {
  const flt = getEnvFilter(pid, si);
  val = parseFloat(val);
  if(handle==='start') {
    flt.startPct = Math.min(val, flt.endPct-5);
    document.getElementById('range-start-'+si).value = flt.startPct;
  } else {
    flt.endPct = Math.max(val, flt.startPct+5);
    document.getElementById('range-end-'+si).value = flt.endPct;
  }
  flt.preset='custom';
  updateEnvRangeUI(pid, si);
};

window.applyEnvPreset = function(pid, si, preset) {
  const flt = getEnvFilter(pid, si);
  const proj = getProject(pid);
  const s = proj?.envData?.sensors?.[si];
  if(!s) return;

  const totalPts = Math.max((s.temperature||[]).length,(s.humidity||[]).length);
  flt.preset = preset;

  if(preset==='all') { flt.startPct=0; flt.endPct=100; }
  else {
    // approximate: 7d=last ~7/365 of data, 30d=30/365, 90d=90/365
    const fracs = {'7d':7/365,'30d':30/365,'90d':90/365};
    const frac = fracs[preset]||1;
    flt.startPct = Math.max(0, Math.round((1-frac)*100));
    flt.endPct = 100;
  }

  document.getElementById('range-start-'+si).value = flt.startPct;
  document.getElementById('range-end-'+si).value   = flt.endPct;
  updateEnvRangeUI(pid, si);
};

function updateEnvRangeUI(pid, si) {
  const flt = getEnvFilter(pid, si);
  const fill = document.getElementById('range-fill-'+si);
  const disp = document.getElementById('range-display-'+si);
  if(fill) { fill.style.left=flt.startPct+'%'; fill.style.right=(100-flt.endPct)+'%'; }
  if(disp) disp.textContent = Math.round(flt.startPct)+'% – '+Math.round(flt.endPct)+'%';

  ['7d','30d','90d','all'].forEach(p=>{
    const btn = document.querySelector(`#sensor-card-${si} .env-preset-btn[onclick*="'${p}'"]`);
    if(btn) btn.classList.toggle('active', flt.preset===p);
  });

  const proj = getProject(pid);
  const s = proj?.envData?.sensors?.[si];
  if(s) drawSensorCharts(pid, s, si);
}

window.updateThreshold = function(pid, metric, val) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) return;
  if(!proj.envData.thresholds) proj.envData.thresholds = {minTemp:50, maxTemp:80, minHum:20, maxHum:60};
  const thr = proj.envData.thresholds;
  const num = parseFloat(val);
  if(metric==='minTemp') thr.minTemp = isNaN(num)?50:num;
  else if(metric==='maxTemp') thr.maxTemp = isNaN(num)?80:num;
  else if(metric==='minHum')  thr.minHum  = isNaN(num)?20:num;
  else if(metric==='maxHum')  thr.maxHum  = isNaN(num)?60:num;
  markProjectDirty(pid); save();
  buildEnvView(pid);
};

// ── CHART DRAWING ─────────────────────
function drawSensorCharts(pid, s, si) {
  const proj = getProject(pid);
  const thr = proj?.envData?.thresholds || {maxTemp:80, maxHum:60};
  const flt = getEnvFilter(pid, si);
  const tempData = filterData(s.temperature||[], flt.startPct, flt.endPct);
  const humData  = filterData(s.humidity||[],    flt.startPct, flt.endPct);

  function drawChart(wrapperId, canvasId, data, lineColor, fillColor, maxThreshold, minThreshold) {
    const wrap = document.getElementById(wrapperId);
    const canvas = document.getElementById(canvasId);
    if(!wrap||!canvas||!data.length) return;

    const W = wrap.offsetWidth;
    const H = wrap.offsetHeight;
    if(W===0||H===0) return;

    const dpr = window.devicePixelRatio||1;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W+'px';
    canvas.style.height = H+'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const pad = {t:10, b:22, l:38, r:10};
    const cw = W - pad.l - pad.r;
    const ch = H - pad.t - pad.b;

    // Background
    ctx.fillStyle = '#272b34';
    ctx.fillRect(0,0,W,H);

    const vals = data.map(d=>d.v);
    const mn = Math.min(...vals);
    const mx = Math.max(...vals);
    // Expand range to show both threshold lines
    const dispMin = Math.min(mn, minThreshold!==undefined ? minThreshold-2 : mn, maxThreshold!==undefined ? maxThreshold-2 : mn);
    const dispMax = Math.max(mx, maxThreshold!==undefined ? maxThreshold+2 : mx, minThreshold!==undefined ? minThreshold+2 : mx);
    const range = dispMax - dispMin || 1;

    // Grid
    const gridLevels = 4;
    for(let g=0;g<=gridLevels;g++){
      const f = g/gridLevels;
      const y = pad.t + ch*(1-f);
      ctx.strokeStyle='rgba(255,255,255,0.05)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.font='8px monospace';
      ctx.textAlign='right';
      ctx.fillText((dispMin+range*f).toFixed(1), pad.l-3, y+3);
    }

    // X-axis labels (up to 6)
    const n = data.length;
    const xStep = Math.max(1, Math.floor(n/6));
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='8px monospace';
    ctx.textAlign='center';
    for(let i=0;i<n;i+=xStep){
      const x = pad.l + cw*(i/(n-1||1));
      ctx.fillText(data[i].label||'', x, H-4);
    }

    // Threshold lines (max = red dashed, min = blue dashed)
    function drawThreshLine(thrVal, color, labelPrefix) {
      if(thrVal === undefined) return;
      const thrY = pad.t + ch*(1-(thrVal-dispMin)/range);
      if(thrY < pad.t || thrY > pad.t+ch) return; // outside visible area
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(pad.l, thrY); ctx.lineTo(pad.l+cw, thrY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.font='bold 8px monospace';
      ctx.textAlign='left';
      ctx.fillText(labelPrefix+' '+thrVal, pad.l+2, thrY-2);
      ctx.restore();
    }
    drawThreshLine(maxThreshold, 'rgba(239,68,68,0.75)',   'MAX');
    drawThreshLine(minThreshold, 'rgba(96,165,250,0.75)',  'MIN');

    // Fill under curve
    ctx.beginPath();
    data.forEach((d,i)=>{
      const x = pad.l + cw*(i/(n-1||1));
      const y = pad.t + ch*(1-(d.v-dispMin)/range);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.lineTo(pad.l+cw*((n-1)/(n-1||1)), pad.t+ch);
    ctx.lineTo(pad.l, pad.t+ch);
    ctx.closePath();
    const fillGrad = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
    fillGrad.addColorStop(0, fillColor+'44');
    fillGrad.addColorStop(1, fillColor+'08');
    ctx.fillStyle = fillGrad;
    ctx.fill();

    // Line — red above maxThreshold, blue below minThreshold, normal otherwise
    for(let i=1;i<n;i++){
      const x0 = pad.l + cw*((i-1)/(n-1||1));
      const y0 = pad.t + ch*(1-(data[i-1].v-dispMin)/range);
      const x1 = pad.l + cw*(i/(n-1||1));
      const y1 = pad.t + ch*(1-(data[i].v-dispMin)/range);
      const aboveMax = maxThreshold!==undefined && (data[i-1].v>maxThreshold || data[i].v>maxThreshold);
      const belowMin = minThreshold!==undefined && (data[i-1].v<minThreshold || data[i].v<minThreshold);
      ctx.beginPath();
      ctx.strokeStyle = aboveMax ? '#ef4444' : belowMin ? '#60a5fa' : lineColor;
      ctx.lineWidth   = (aboveMax||belowMin) ? 2.2 : 1.6;
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.stroke();
    }
  }

  if(tempData.length) drawChart('wrap-temp-'+si, 'canvas-temp-'+si, tempData, '#f97316', '#f97316', thr.maxTemp, thr.minTemp);
  if(humData.length)  drawChart('wrap-hum-'+si,  'canvas-hum-'+si,  humData,  '#f87171', '#f87171', thr.maxHum,  thr.minHum);
}

function handleEnvFile(e) {
  const file = e.target.files[0]; if(!file) return;
  const {pid, type} = _envTarget;
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) proj.envData={sensors:[],screenshots:[]};

  if(type==='screenshot') {
    const reader=new FileReader();
    reader.onload=ev=>{
      proj.envData.screenshots.push({data:ev.target.result, label:file.name.replace(/\.[^.]+$/,'')});
      markProjectDirty(pid); save(); buildEnvView(pid);
    };
    reader.readAsDataURL(file);
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{
      const sensor = parseEnvCSV(ev.target.result, file.name);
      if(!sensor) return showToast('Could not parse CSV — expected columns: timestamp, temperature, humidity');
      proj.envData.sensors.push(sensor);
      const newSi = proj.envData.sensors.length-1;
      markProjectDirty(pid); save(); buildEnvView(pid);
      setTimeout(()=>drawSensorCharts(pid, sensor, newSi), 120);
    };
    reader.readAsText(file);
  }
  e.target.value='';
}

// ── CSV PARSER ────────────────────────
function parseEnvCSV(text, filename) {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h=>h.trim().toLowerCase().replace(/['"]/g,''));

  let timeIdx=-1, tempIdx=-1, humIdx=-1;
  headers.forEach((h,i)=>{
    if(timeIdx===-1 && /time|date|timestamp/.test(h)) timeIdx=i;
    if(tempIdx===-1 && /temp/.test(h))                tempIdx=i;
    if(humIdx===-1  && /hum|rh(?!\w)|humidity/.test(h)) humIdx=i;
  });

  // Fallback: positional
  if(timeIdx===-1) timeIdx=0;
  if(tempIdx===-1) tempIdx=1;
  if(humIdx===-1)  humIdx=2;

  const rows = lines.slice(1);
  const tempData=[], humData=[], dates=[];

  rows.forEach(row=>{
    const cols = row.split(sep).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length < 2) return;
    const rawDate = cols[timeIdx]||'';
    const tVal = parseFloat(cols[tempIdx]);
    const hVal = humIdx < cols.length ? parseFloat(cols[humIdx]) : NaN;

    let label='';
    try {
      const d = new Date(rawDate);
      if(!isNaN(d.getTime())) {
        label = (d.getMonth()+1)+'/'+(d.getDate());
        dates.push(d);
      }
    } catch(err){}

    if(!isNaN(tVal) && tVal > -100 && tVal < 300) tempData.push({v:tVal, label, raw:rawDate});
    if(!isNaN(hVal) && hVal >= 0   && hVal <= 100) humData.push({v:hVal, label, raw:rawDate});
  });

  if(!tempData.length && !humData.length) return null;

  // Downsample to max 400 points for performance
  function downsample(arr, max) {
    if(arr.length<=max) return arr;
    const step = arr.length/max;
    return Array.from({length:max},(_,i)=>arr[Math.min(arr.length-1,Math.round(i*step))]);
  }

  const dateRange = dates.length>=2 ?
    `${(dates[0].getMonth()+1)}/${dates[0].getDate()}/${dates[0].getFullYear()} – ${(dates[dates.length-1].getMonth()+1)}/${dates[dates.length-1].getDate()}/${dates[dates.length-1].getFullYear()}` : '';

  return {
    name: filename.replace(/\.[^.]+$/,''),
    deviceId: '',
    dateRange,
    temperature: downsample(tempData, 400),
    humidity:    downsample(humData,  400),
  };
}

// Flush the SI editor DOM fields into the store without saving.
// Must be called before save() whenever the editor DOM will be rebuilt.
function syncEditorToStore(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  const n  = document.getElementById('notes-input');
  const a  = document.getElementById('assigned-input');
  const d  = document.getElementById('due-input');
  const dd = document.getElementById('si-delivery-date');

function handleFileImport(e) {
  const item=getSI(_pt.pid,_pt.sid); if(!item) return;
  const files=Array.from(e.target.files); let loaded=0;

  // Extract EXIF DateTimeOriginal from JPEG binary
  function getExifDate(arrayBuffer) {
    try {
      const view=new DataView(arrayBuffer);
      // JPEG marker check
      if(view.getUint16(0)!==0xFFD8) return null;
      let offset=2;
      while(offset<view.byteLength-2) {
        const marker=view.getUint16(offset);
        if(marker===0xFFE1) { // APP1 / EXIF
          const segLen=view.getUint16(offset+2);
          const exifHeader=String.fromCharCode(...new Uint8Array(arrayBuffer,offset+4,4));
          if(exifHeader==='Exif') {
            const tiffStart=offset+10;
            const endian=view.getUint16(tiffStart);
            const le=endian===0x4949;
            const ifdOffset=le?view.getUint32(tiffStart+4,true):view.getUint32(tiffStart+4,false);
            const numEntries=le?view.getUint16(tiffStart+ifdOffset,true):view.getUint16(tiffStart+ifdOffset,false);
            for(let i=0;i<numEntries;i++){
              const entryOffset=tiffStart+ifdOffset+2+i*12;
              const tag=le?view.getUint16(entryOffset,true):view.getUint16(entryOffset,false);
              // 0x9003 = DateTimeOriginal, 0x0132 = DateTime
              if(tag===0x9003||tag===0x0132) {
                const valOffset=le?view.getUint32(entryOffset+8,true):view.getUint32(entryOffset+8,false);
                let str='';
                for(let c=0;c<19;c++){
                  const ch=view.getUint8(tiffStart+valOffset+c);
                  if(ch===0) break;
                  str+=String.fromCharCode(ch);
                }
                // Format: "YYYY:MM:DD HH:MM:SS"
                const m=str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                if(m) return `${m[2]}/${m[3]}/${m[1]} ${m[4]}:${m[5]}`;
              }
            }
          }
        }
        if(marker===0xFFDA) break; // SOS — end of headers
        if(offset+2+view.getUint16(offset+2)>=view.byteLength) break;
        offset+=2+view.getUint16(offset+2);
      }
    } catch(err){}
    return null;
  }

  files.forEach(file=>{
    const arrReader=new FileReader();
    arrReader.onload=arrEv=>{
      const takenAt = getExifDate(arrEv.target.result) ||
        // fallback: use file lastModified
        (()=>{
          const d=new Date(file.lastModified);
          return (d.getMonth()+1).toString().padStart(2,'0')+'/'+
            d.getDate().toString().padStart(2,'0')+'/'+d.getFullYear()+' '+
            d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
        })();

      const dataReader=new FileReader();
      dataReader.onload=dataEv=>{
        // Resize/Compress before saving to IndexedDB to prevent memory bloat
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1200; // Resizing to 1200px is plenty for audit reports
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);

          // New Blob-based capture logic for IndexedDB
          canvas.toBlob(async (blob) => {
            if (!blob) return;
            
            // Save locally first (works offline, instant feedback)
            // Store this raw 'blob' object directly into IndexedDB instead of the Base64 string.
            const photoEntry = {data: blob, caption: '', takenAt};
            item.photos.push(photoEntry);
            _logActivity(_pt.pid,{type:'photo',siId:_pt.sid,siNum:item.num,detail:`Photo ${item.photos.length}`,by:store.settings.displayName||'You'});
            if(++loaded===files.length){ markAsDirty(_pt.sid); save(); buildSIEditor(_pt.pid,_pt.sid); renderLeft(route()); }

            // Then upload to Azure Blob Storage in the background
            try {
              const blobUrl = await _uploadPhotoToAzureBlob(blob, _pt.pid, _pt.sid);
              if (blobUrl) {
                // Swap data→url so CosmosDB sync picks it up (data stays for offline display)
                photoEntry.url = blobUrl;
                markAsDirty(_pt.sid);
                save();
                buildSIEditor(_pt.pid, _pt.sid);
              }
            } catch(uploadErr) {
              // Non-fatal — photo is still saved locally as a Blob
              console.warn('[Photo] Azure Blob upload failed, photo kept locally:', uploadErr.message);
            }
          }, 'image/jpeg', 0.8); // 0.8 adds a slight compression for faster syncs
        };
        img.src = dataEv.target.result;
      };
      dataReader.readAsDataURL(file);
    };
    arrReader.readAsArrayBuffer(file);
  });
  e.target.value='';
}

// ── Azure Blob Storage upload ────────────────────────────────────────────────
// Fetches a short-lived SAS token from the Azure Function, then uploads
// directly to Blob Storage. Returns the permanent blob URL on success.

let _cachedSasUrl = null;
let _sasUrlExpiry = null;

async function _getBlobSasUrl() {
  const now = Date.now();
  if (_cachedSasUrl && _sasUrlExpiry && now < _sasUrlExpiry) return _cachedSasUrl;
  const res = await fetch('/api/getBlobSasUrl');
  if (!res.ok) throw new Error(`SAS fetch failed: ${res.status}`);
  const { sasUrl, expiresOn } = await res.json();
  _cachedSasUrl = sasUrl;
  _sasUrlExpiry = expiresOn ? new Date(expiresOn).getTime() - 5 * 60 * 1000 : now + 50 * 60 * 1000;
  return _cachedSasUrl;
}

async function preparePhotoForUpload(dbPhotoData) {
  // If it's already a Blob (New Method), it is ready for Azure!
  if (dbPhotoData instanceof Blob) {
    return dbPhotoData;
  }
  
  // If it's a legacy Base64 string, we must convert it to a Blob before 
  // PUTting it to the Azure SAS URL. 
  // (Using fetch() on a data URL is a highly efficient shortcut to convert it to a Blob)
  if (typeof dbPhotoData === 'string' && dbPhotoData.startsWith('data:image')) {
    const response = await fetch(dbPhotoData);
    return await response.blob();
  }
  
  throw new Error("Invalid photo data format");
}

async function _uploadPhotoToAzureBlob(dbPhotoData, projectId, siId) {
  const blobToUpload = await preparePhotoForUpload(dbPhotoData);
  const sasContainerUrl = await _getBlobSasUrl();
  const ext      = 'jpg';
  const blobName = `${projectId}/${siId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const [baseUrl, sasParams] = sasContainerUrl.split('?');
  const putUrl = `${baseUrl}/${blobName}?${sasParams}`;
  const uploadRes = await fetch(putUrl, {
    method : 'PUT',
    headers: { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': 'image/jpeg' },
    body   : blobToUpload,
  });
  if (!uploadRes.ok) throw new Error(`Blob PUT failed: ${uploadRes.status}`);
  return `${baseUrl}/${blobName}`;
}

function deletePhoto(pid,sid,idx) {
  const item=getSI(pid,sid); if(!item) return;
  syncEditorToStore(pid,sid);
  const [removed] = item.photos.splice(idx,1);
  markAsDirty(sid); save();
  buildSIEditor(pid,sid); renderLeft(route());

  // Free memory if it was a local blob (crucial memory cleanup)
  if (removed && removed._blobUrl) {
    URL.revokeObjectURL(removed._blobUrl);
  }

  // If the photo was uploaded to Azure Blob, delete it server-side too
  if (removed && removed.url) {
    fetch('/api/deleteBlob', {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ blobUrl: removed.url }),
    }).catch(e => console.warn('[Photo] Blob delete failed (non-fatal):', e.message));
  }
}

const MAX_MB = 25.5;
window.estimateFileSize = function(pid) {
  const proj=getProject(pid); if(!proj) return;
  const quality = parseInt(document.getElementById('img-quality')?.value||72)/100;
  const includePhotos = document.getElementById('chk-photos')?.classList.contains('checked');
  const includeEnv = document.getElementById('chk-env')?.classList.contains('checked');

  // Base overhead for PDF structure, cover page, and internal fonts
  let bytes = 25000; 
  proj.items.forEach(item=>{
    bytes += 1500; // estimated text data per item
    if(includePhotos) {
      item.photos.forEach(p=>{
        const origBytes = (p.data||'').length * 0.75;
        // The export resizes photos to a max-width of 900px.
        // A 900px JPEG at ~70% quality is typically 120KB - 180KB.
        const scaledBase = Math.min(origBytes, 160000); 
        bytes += scaledBase * quality;
      });
    }
  });

  if(includeEnv && proj.envData) {
    // Each sensor chart is rendered as a separate high-res JPEG
    (proj.envData.sensors || []).forEach(s => {
      if(s.temperature?.length) bytes += 250000; // Approx 250KB per chart
      if(s.humidity?.length) bytes += 250000;
    });
    // Environmental screenshots are typically PNGs and are embedded at full size
    (proj.envData.screenshots || []).forEach(s => {
      bytes += (s.data || '').length * 0.75;
    });
  }

  const mb = bytes / (1024*1024);
  const pct = Math.min(100, (mb/MAX_MB)*100);
  const over = mb > MAX_MB;

  const valEl=document.getElementById('filesize-val');
  const fillEl=document.getElementById('filesize-fill');
  const warnEl=document.getElementById('filesize-warning');

  if(valEl) {
    valEl.textContent = mb < 0.1 ? (bytes/1024).toFixed(0)+' KB' : mb.toFixed(2)+' MB';
    valEl.className = 'filesize-val'+(over?' warn':'');
  }
  if(fillEl) {
    fillEl.style.width = pct+'%';
    fillEl.className = 'filesize-fill'+(over?' warn':'');
  }
  if(warnEl) warnEl.className = 'filesize-warning'+(over?' show':'');
};

// ── EXPORT CSV ────────────────────────
function exportCSV(pid) {
  const proj=getProject(pid); if(!proj) return;
  const rows = [];
  // Header
  rows.push(['item_id','si_number','title','status','assigned_to','due_date','tags','notes'].join(','));
  proj.items.forEach(it => {
    const safe = v => '"' + String((v===undefined||v===null)?'':v).replace(/"/g,'""') + '"';
    const tags = (it.tags||[]).join(';');
    rows.push([
      safe(it.id), safe(it.num), safe(it.title), safe(it.status), safe(it.assignedTo), safe(it.dueDate), safe(tags), safe(it.notes)
    ].join(','));
  });
  const csv = rows.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = proj.name.replace(/[^a-z0-9]/gi,'_') + '_audit.csv';
  a.click(); closeModal(); showToast('✓ CSV Downloaded','green');
}

// ── EXPORT PDF ─────────────────────────
async function exportPDF(pid) {
  const proj=getProject(pid); if(!proj) return;

  // MANDATORY FIELD CHECK — completed and punch-ongoing items are exempt
  const incomplete = proj.items.filter(it => {
    if (it.status === 'completed' || it.status === 'punch-ongoing') return false;
    const hasStatus = !!it.statusCode;
    const hasNotes = it.notes && it.notes.trim().length > 0;
    const hasPhoto = it.photos && it.photos.length > 0;
    return !hasStatus || !hasNotes || !hasPhoto;
  });

  if (incomplete.length > 0) {
    const list = incomplete.map(it => it.num).join(', ');
    showToast(`Cannot export: Items [${list}] are missing Field Check, Notes, or Photos.`, 'red');
    return; // Stops export
  }

  const quality   = parseInt(document.getElementById('img-quality')?.value||72)/100;
  const inclPhotos= document.getElementById('chk-photos')?.classList.contains('checked')??true;
  const inclTS    = document.getElementById('chk-timestamp')?.classList.contains('checked')??true;
  const inclNotes = document.getElementById('chk-notes')?.classList.contains('checked')??true;
  const inclTags  = document.getElementById('chk-tags')?.classList.contains('checked')??true;
  const inclCover = document.getElementById('chk-cover')?.classList.contains('checked')??true;
  const inclEnv   = document.getElementById('chk-env')?.classList.contains('checked')??true;
  const reportTitle = document.getElementById('pdf-report-title')?.value || 'Site Conditions Report';
  const footerText  = document.getElementById('pdf-footer-text')?.value || '';
  const whiteLabel  = document.getElementById('chk-white-label')?.classList.contains('checked') ?? false;
  const tpl       = _selectedTpl;

  closeModal();
  showPDFProgress('Loading PDF engine…', 0);

  // Wait up to 8s for jsPDF to load
  let attempts = 0;
  while(typeof window.jspdf === 'undefined' && attempts < 32) {
    await new Promise(r=>setTimeout(r,250));
    attempts++;
  }
  if(typeof window.jspdf === 'undefined') {
    hidePDFProgress();
    showToast('PDF library not loaded — check your connection');
    return;
  }

  updatePDFProgress('Building PDF…', 5);

  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  const PW=210, PH=297;

  // ── THEME ───────────────────────────
  const T = {
    classic: {
      bgPage:'#ffffff', bgHeader:'#1e3a5f', bgRow:'#f8fafc', bgAlt:'#eef2f7',
      cHeader:'#ffffff', cTitle:'#1e3a5f', cText:'#334155', cSub:'#64748b',
      cAccent:'#1e3a5f', cBorder:'#cbd5e1', cTag:'#e2e8f0', cTagText:'#475569',
      font:'helvetica'
    },
    dark: {
      bgPage:'#0f172a', bgHeader:'#1e293b', bgRow:'#1e293b', bgAlt:'#0f172a',
      cHeader:'#3db8f5', cTitle:'#e2e8f0', cText:'#94a3b8', cSub:'#64748b',
      cAccent:'#3db8f5', cBorder:'#334155', cTag:'#1e293b', cTagText:'#3db8f5',
      font:'helvetica'
    },
    minimal: {
      bgPage:'#ffffff', bgHeader:'#ffffff', bgRow:'#ffffff', bgAlt:'#f9fafb',
      cHeader:'#000000', cTitle:'#111827', cText:'#374151', cSub:'#9ca3af',
      cAccent:'#000000', cBorder:'#e5e7eb', cTag:'#f3f4f6', cTagText:'#6b7280',
      font:'helvetica'
    }
  }[tpl];

  function hex2rgb(hex) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }
  function setFill(c){ doc.setFillColor(...hex2rgb(c)); }
  function setStroke(c){ doc.setDrawColor(...hex2rgb(c)); }
  function setTextC(c){ doc.setTextColor(...hex2rgb(c)); }

  let pageNum=0;
  function addPage() {
    if(pageNum>0) doc.addPage();
    pageNum++;
    setFill(T.bgPage); doc.rect(0,0,PW,PH,'F');
  }

  // ── STATUS COLORS ───────────────────
  function statusColor(s){
    return s==='completed'?'#22c55e':s==='punch-ongoing'?'#a855f7':s==='not-ready'?'#ef4444':s==='in-progress'?'#fbbf24':s==='on-hold'?'#f97316':s==='out-of-scope'?'#94a3b8':'#6b7280';
  }

  // ── COMPRESS IMAGE + OPTIONAL TIMESTAMP ──
  async function compressImage(dataUrl, q, addTS) {
    return new Promise(res=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=900;
        let w=img.width, h=img.height;
        if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);

        if(addTS) {
          // Use photo's actual taken date if available, else export time
          const ts = addTS || '';
          const fsize=Math.max(11, Math.round(w*0.032));
          ctx.font=`bold ${fsize}px monospace`;
          const metrics=ctx.measureText(ts);
          const tw=metrics.width;
          const th=fsize;
          const pad=fsize*0.4;
          const bx=w-tw-pad*2-8;
          const by=h-th-pad*2-8;
          // Semi-transparent pill background
          ctx.fillStyle='rgba(0,0,0,0.58)';
          const r2=fsize*0.35;
          const bw=tw+pad*2, bh=th+pad*2;
          ctx.beginPath();
          ctx.moveTo(bx+r2,by); ctx.lineTo(bx+bw-r2,by);
          ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+r2);
          ctx.lineTo(bx+bw,by+bh-r2);
          ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-r2,by+bh);
          ctx.lineTo(bx+r2,by+bh);
          ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-r2);
          ctx.lineTo(bx,by+r2);
          ctx.quadraticCurveTo(bx,by,bx+r2,by);
          ctx.closePath();
          ctx.fill();
          // White text
          ctx.fillStyle='#ffffff';
          ctx.fillText(ts, bx+pad, by+th+pad*0.6);
        }

        res(canvas.toDataURL('image/jpeg',q));
      };
      img.onerror=()=>res(null);
      img.src=dataUrl;
    });
  }

  // ── COVER PAGE ──────────────────────
  if(inclCover) {
    addPage();
    // Header band
    setFill(T.bgHeader); doc.rect(0,0,PW,60,'F');
    if(tpl==='minimal') {
      setStroke(T.cAccent); doc.setLineWidth(1.5); doc.line(15,58,195,58);
    }
    // Logo / Title area (Dynamic aspect ratio + horizontal positioning)
    let textX = 15;
    if (window._pdfBranding.logo && !whiteLabel) {
      const props = doc.getImageProperties(window._pdfBranding.logo);
      const h = parseInt(document.getElementById('pdf-logo-height')?.value || 18);
      const w = (props.width * h) / props.height;
      doc.addImage(window._pdfBranding.logo, 'PNG', 15, 7, w, h);
      textX = 15 + w + 6; // Padding after logo
    }

    doc.setFont(T.font,'bold');
    doc.setFontSize(24);
    setTextC(T.cHeader);
    doc.text(reportTitle.toUpperCase(), textX, 18);

    // Layout: if cover photo exists, split into left text (60%) + right image (38%)
    const hasCoverPhoto = !!proj.coverPhoto;
    const textMaxW = hasCoverPhoto ? 110 : PW - 30;
    const imgX = 128, imgY = 65, imgW = 67, imgH = 130;

    // Project name
    doc.setFontSize(18);
    doc.setFont(T.font,'bold');
    setTextC(T.cTitle);
    doc.text(proj.name, 15, 80, {maxWidth: textMaxW});

    // Meta table
    const meta=[['Client',proj.client],['Company',proj.company],['Auditor',proj.auditor],['Date',proj.date]];
    let my=100;
    meta.forEach(([lbl,val])=>{
      doc.setFontSize(8); doc.setFont(T.font,'bold'); setTextC(T.cSub);
      doc.text(lbl.toUpperCase(),15,my);
      doc.setFontSize(11); doc.setFont(T.font,'normal'); setTextC(T.cText);
      doc.text(val||'—',15,my+6,{maxWidth: textMaxW});
      my+=16;
    });

    // Cover photo (right column)
    if(hasCoverPhoto) {
      try {
        // Rounded rect border / background
        setFill(T.bgRow); setStroke(T.cBorder); doc.setLineWidth(0.3);
        doc.roundedRect(imgX, imgY, imgW, imgH, 3, 3, 'FD');
        // Clip and draw image
        doc.addImage(proj.coverPhoto, 'JPEG', imgX, imgY, imgW, imgH, '', 'FAST');
      } catch(err) { /* silently skip if image fails */ }
    }

    // Stats bar
    const statY=180;
    const stats=[
      {lbl:'Total Items',val:proj.items.length,c:'#64748b'},
      {lbl:'Completed',val:proj.items.filter(i=>i.status==='completed').length,c:'#22c55e'},
      {lbl:'Punch',val:proj.items.filter(i=>i.status==='punch-ongoing').length,c:'#a855f7'},
      {lbl:'Not Ready',val:proj.items.filter(i=>i.status==='not-ready').length,c:'#ef4444'},
      {lbl:'In Progress',val:proj.items.filter(i=>i.status==='in-progress').length,c:'#f59e0b'},
      {lbl:'Pending',val:proj.items.filter(i=>i.status==='pending').length,c:'#6b7280'},
    ];
    const sw=(PW-30)/stats.length;
    stats.forEach((s,i)=>{
      const x=15+i*sw;
      setFill(T.bgRow); doc.roundedRect(x,statY,sw-4,22,3,3,'F');
      doc.setFontSize(16); doc.setFont(T.font,'bold');
      doc.setTextColor(...hex2rgb(s.c));
      doc.text(String(s.val),x+4,statY+13);
      doc.setFontSize(7); doc.setFont(T.font,'normal'); setTextC(T.cSub);
      doc.text(s.lbl,x+4,statY+20);
    });

    // Footer
    setTextC(T.cSub); doc.setFontSize(8);
    doc.text('Report Date: '+new Date().toLocaleDateString(),15,PH-10);
  }

  // ── SECTION PAGES ───────────────────
  const sections=proj.sections;
  const totalItems=proj.items.length;
  let done=0;

  for(const sec of sections) {
    const items=proj.items.filter(i=>i.sectionId===sec.id);
    if(!items.length) continue;

    // Section header page
    addPage();
    setFill(T.bgHeader); doc.rect(0,0,PW,20,'F');
    doc.setFontSize(11); doc.setFont(T.font,'bold'); setTextC(T.cHeader);
    doc.text(sec.name.toUpperCase(),15,13);
    doc.setFontSize(8); doc.setFont(T.font,'normal');
    doc.text(items.length+' item'+(items.length!==1?'s':''),PW-15,13,{align:'right'});

    let cy=28;

    for(const item of items) {
      // Estimate height needed
      const hasPhotos = inclPhotos && item.photos.length>0;
      const hasDates = !!(item.deliveryDate || item.punchDate);
      const estH = 14 + (inclNotes&&item.notes?14:0) + (hasDates?6:0) + (inclTags&&item.tags.length?8:0) + (hasPhotos?62:0) + 6;

      if(cy+estH > PH-14) {
        addPage();
        setFill(T.bgHeader); doc.rect(0,0,PW,12,'F');
        doc.setFontSize(8); doc.setFont(T.font,'bold'); setTextC(T.cHeader);
        doc.text(sec.name+' (continued)',15,8);
        cy=20;
      }

      // Item card background
      setFill(T.bgRow);
      setStroke(T.cBorder);
      doc.setLineWidth(0.3);
      doc.roundedRect(12,cy,PW-24,estH,2,2,'FD');

      // Status dot
      doc.setFillColor(...hex2rgb(statusColor(item.status)));
      doc.circle(18,cy+6,2,'F');

      // SI number + title
      doc.setFontSize(7.5); doc.setFont(T.font,'bold'); setTextC(T.cSub);
      doc.text(item.num,22,cy+5.5);
      doc.setFontSize(10); doc.setFont(T.font,'bold'); setTextC(T.cTitle);
      doc.text(item.title,22,cy+12,{maxWidth:PW-50});

      // Status label
      const sc=statusColor(item.status);
      const slbl=item.status.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
      doc.setFontSize(7); doc.setFont(T.font,'bold');
      doc.setTextColor(...hex2rgb(sc));
      doc.text(slbl,PW-16,cy+6,{align:'right'});

      let iy=cy+16;
      
      // Drawing the Field Check and Details on the PDF
      doc.setFont(T.font, 'bold');
      doc.setFontSize(10);
      doc.setTextColor(40, 40, 40); 
      const fieldCheckLine = `Field Check: [${item.statusCode}] ${item.statusText || ''}`;
      doc.text(fieldCheckLine, 15, iy);
      iy += 6; // Move cursor down for the next line (Notes/Tags)

      if(inclNotes && item.notes) {
        doc.setFontSize(8.5); doc.setFont(T.font,'normal'); setTextC(T.cText);
        const lines=doc.splitTextToSize(item.notes, PW-38);
        lines.slice(0,3).forEach(line=>{ doc.text(line,22,iy); iy+=4.5; });
        iy+=2;
      }

      if(item.deliveryDate || item.punchDate) {
        doc.setFontSize(7.5); doc.setFont(T.font,'bold'); setTextC(T.cSub);
        const dateParts = [];
        if(item.deliveryDate) dateParts.push(`Delivery: ${item.deliveryDate}`);
        if(item.punchDate)    dateParts.push(`Punch: ${item.punchDate}`);
        doc.text(dateParts.join('   |   '), 22, iy);
        iy += 6;
      }

      if(inclTags && item.tags.length) {
        let tx=22;
        item.tags.forEach(tag=>{
          const tw=doc.getTextWidth(tag)+4;
          setFill(T.cTag); setStroke(T.cBorder); doc.setLineWidth(0.2);
          doc.roundedRect(tx,iy-3,tw,5,1.5,1.5,'FD');
          doc.setFontSize(6); setTextC(T.cTagText);
          doc.text(tag,tx+2,iy+0.5);
          tx+=tw+2;
          if(tx>PW-30){ tx=22; iy+=6; }
        });
        iy+=7;
      }

      // Photos — 3 per row, unlimited
      if(hasPhotos) {
        const COLS = 3, GAP = 4;
        const photoW = (PW - 28 - GAP * (COLS - 1)) / COLS;
        const photoH = Math.round(photoW * 0.67);
        const maxPh = item.photos.length;

        for(let pi=0; pi<maxPh; pi++) {
          const col = pi % COLS;
          if(col === 0 && pi > 0) {
            iy += photoH + 3;
            if(iy + photoH > PH - 14) {
              addPage();
              setFill(T.bgHeader); doc.rect(0,0,PW,12,'F');
              doc.setFontSize(8); doc.setFont(T.font,'bold'); setTextC(T.cHeader);
              doc.text(sec.name+' (cont.)',15,8);
              iy = 20;
            }
          }
          const ph = item.photos[pi];
          try {
            const tsLabel = inclTS ? (ph.takenAt || null) : null;
            const compressed = await compressImage(ph.data, quality, tsLabel);
            if(compressed) {
              const px = 14 + col * (photoW + GAP);
              doc.addImage(compressed,'JPEG',px,iy,photoW,photoH,'','FAST');
            }
          } catch(err){}
        }
        iy += photoH + 3;
      }

      cy = iy + 6;
      done++;
      updatePDFProgress('Rendering items…', Math.round((done/totalItems)*85)+10);
      // Use rAF yield — more reliable than setTimeout(0) on iOS Safari
      await new Promise(r=>requestAnimationFrame(r));
    }
  }

  // ── ENVIRONMENTAL CONDITIONS PAGE ───
  if(inclEnv && proj.envData) {
    const env = proj.envData;
    const thr = env.thresholds || {maxTemp:80, maxHum:60};
    const hasSensors = env.sensors && env.sensors.length > 0;
    const hasScreenshots = env.screenshots && env.screenshots.length > 0;

    if(hasSensors || hasScreenshots) {
      updatePDFProgress('Rendering environmental charts…', 90);
      addPage();

      // Section header
      setFill(T.bgHeader); doc.rect(0,0,PW,20,'F');
      doc.setFontSize(11); doc.setFont(T.font,'bold'); setTextC(T.cHeader);
      doc.text('ENVIRONMENTAL CONDITIONS',15,13);
      doc.setFontSize(8); doc.setFont(T.font,'normal');
      doc.text('Temperature & Humidity',PW-15,13,{align:'right'});

      let ey = 26;

      // Helper: render a sensor chart onto the PDF via canvas
      async function renderEnvChart(data, label, lineColor, maxThr, minThr, x, y, w, h) {
        if(!data.length) return;
        const canvas = document.createElement('canvas');
        const dpr = 2;
        canvas.width = w*dpr*4; canvas.height = h*dpr*4;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr*4, dpr*4);
        const CW=w, CH=h;
        const pad={t:8,b:18,l:32,r:6};
        const cw=CW-pad.l-pad.r, ch=CH-pad.t-pad.b;

        // bg
        ctx.fillStyle = tpl==='dark' ? '#1e293b' : '#f8fafc';
        ctx.fillRect(0,0,CW,CH);

        const vals = data.map(d=>d.v);
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const dispMin = Math.min(mn, minThr!==undefined?minThr-2:mn, maxThr!==undefined?maxThr-2:mn);
        const dispMax = Math.max(mx, maxThr!==undefined?maxThr+2:mx, minThr!==undefined?minThr+2:mx);
        const range = dispMax-dispMin||1;

        // Grid lines
        ctx.strokeStyle = tpl==='dark'?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
        ctx.lineWidth=0.5;
        for(let g=0;g<=4;g++){
          const f=g/4, gy=pad.t+ch*(1-f);
          ctx.beginPath(); ctx.moveTo(pad.l,gy); ctx.lineTo(pad.l+cw,gy); ctx.stroke();
          ctx.fillStyle=tpl==='dark'?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.4)';
          ctx.font='5px monospace'; ctx.textAlign='right';
          ctx.fillText((dispMin+range*f).toFixed(1),pad.l-2,gy+2);
        }

        // X labels
        const n=data.length, xStep=Math.max(1,Math.floor(n/5));
        ctx.fillStyle=tpl==='dark'?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.4)';
        ctx.font='5px monospace'; ctx.textAlign='center';
        for(let i=0;i<n;i+=xStep){
          const cx2=pad.l+cw*(i/(n-1||1));
          ctx.fillText(data[i].label||'',cx2,CH-3);
        }

        // Threshold lines
        function pdfThreshLine(thrVal, color) {
          if(thrVal===undefined) return;
          const thrY=pad.t+ch*(1-(thrVal-dispMin)/range);
          if(thrY<pad.t||thrY>pad.t+ch) return;
          ctx.save(); ctx.strokeStyle=color;
          ctx.lineWidth=0.8; ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(pad.l,thrY); ctx.lineTo(pad.l+cw,thrY); ctx.stroke();
          ctx.setLineDash([]); ctx.restore();
          ctx.fillStyle=color; ctx.font='bold 5px monospace'; ctx.textAlign='left';
          ctx.fillText((thrVal===maxThr?'MAX ':'MIN ')+thrVal, pad.l+2, thrY-1.5);
        }
        pdfThreshLine(maxThr, 'rgba(239,68,68,0.8)');
        pdfThreshLine(minThr, 'rgba(96,165,250,0.8)');

        // Fill
        ctx.beginPath();
        data.forEach((d,i)=>{
          const px=pad.l+cw*(i/(n-1||1));
          const py=pad.t+ch*(1-(d.v-dispMin)/range);
          i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        });
        ctx.lineTo(pad.l+cw*((n-1)/(n-1||1)),pad.t+ch);
        ctx.lineTo(pad.l,pad.t+ch); ctx.closePath();
        ctx.fillStyle=lineColor+'33'; ctx.fill();

        // Line — color per segment
        for(let i=1;i<n;i++){
          const x0=pad.l+cw*((i-1)/(n-1||1)),y0=pad.t+ch*(1-(data[i-1].v-dispMin)/range);
          const x1=pad.l+cw*(i/(n-1||1)),y1=pad.t+ch*(1-(data[i].v-dispMin)/range);
          const aboveMax=maxThr!==undefined&&(data[i-1].v>maxThr||data[i].v>maxThr);
          const belowMin=minThr!==undefined&&(data[i-1].v<minThr||data[i].v<minThr);
          ctx.beginPath(); ctx.strokeStyle=aboveMax?'#ef4444':belowMin?'#60a5fa':lineColor;
          ctx.lineWidth=aboveMax||belowMin?1.2:0.9; ctx.lineJoin='round';
          ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
        }

        const imgData = canvas.toDataURL('image/jpeg',0.92);
        doc.addImage(imgData,'JPEG',x,y,w,h,'','FAST');
      }

      for(const [si,s] of (env.sensors || []).entries()) {
        const flt = getEnvFilter(proj.id, si);
        const tempData = filterData(s.temperature||[], flt.startPct, flt.endPct);
        const humData  = filterData(s.humidity||[],    flt.startPct, flt.endPct);

        // Sensor name header
        if(ey+80 > PH-20) { addPage(); ey=16; }
        setFill(T.bgRow); doc.roundedRect(12,ey,PW-24,8,1,1,'F');
        doc.setFontSize(8); doc.setFont(T.font,'bold'); setTextC(T.cTitle);
        doc.text('📡 '+(s.name||'Sensor '+(si+1)),15,ey+5.5);
        doc.setFontSize(7); doc.setFont(T.font,'normal'); setTextC(T.cSub);
        doc.text(s.dateRange||'', PW-15, ey+5.5, {align:'right'});
        ey+=11;

        // Compute stats for the filtered window
        function statLine(arr, unit, label) {
          if(!arr.length) return '';
          const vals=arr.map(d=>d.v);
          return `${label}  MIN ${Math.min(...vals).toFixed(1)}${unit}  AVG ${(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)}${unit}  MAX ${Math.max(...vals).toFixed(1)}${unit}`;
        }

        // Thresholds warning in PDF
        const tOv = tempData.filter(d=>d.v>thr.maxTemp);
        const tUn = tempData.filter(d=>d.v<thr.minTemp);
        const hOv = humData.filter(d=>d.v>thr.maxHum);
        const hUn = humData.filter(d=>d.v<thr.minHum);
        if(tOv.length||tUn.length||hOv.length||hUn.length) {
          const warnLines = [];
          if(tOv.length) warnLines.push(`▲ Temp exceeded max ${thr.maxTemp}°F — peak ${Math.max(...tOv.map(d=>d.v)).toFixed(1)}°F (${tOv.length} readings)`);
          if(tUn.length) warnLines.push(`▼ Temp below min ${thr.minTemp}°F — low ${Math.min(...tUn.map(d=>d.v)).toFixed(1)}°F (${tUn.length} readings)`);
          if(hOv.length) warnLines.push(`▲ Humidity exceeded max ${thr.maxHum}% — peak ${Math.max(...hOv.map(d=>d.v)).toFixed(1)}% (${hOv.length} readings)`);
          if(hUn.length) warnLines.push(`▼ Humidity below min ${thr.minHum}% — low ${Math.min(...hUn.map(d=>d.v)).toFixed(1)}% (${hUn.length} readings)`);
          const warnH = 6 + warnLines.length * 6;
          setFill('#fef2f2'); setStroke('#ef4444'); doc.setLineWidth(0.3);
          doc.roundedRect(12,ey,PW-24,warnH,1.5,1.5,'FD');
          doc.setFontSize(6.5); doc.setFont(T.font,'bold'); doc.setTextColor(239,68,68);
          let wy=ey+5;
          warnLines.forEach(line=>{ doc.text('⚠ '+line,15,wy); wy+=6; });
          ey += warnH + 3;
        }

        // Temperature chart
        if(tempData.length) {
          if(ey+44 > PH-20) { addPage(); ey=16; }
          doc.setFontSize(7); doc.setFont(T.font,'bold'); doc.setTextColor(249,115,22);
          doc.text('TEMPERATURE (°F)',15,ey+4);
          doc.setFontSize(6); doc.setFont(T.font,'normal'); setTextC(T.cSub);
          doc.text(statLine(tempData,'°F',''),80,ey+4);
          ey+=7;
          await renderEnvChart(tempData,'TEMPERATURE',  '#f97316', thr.maxTemp, thr.minTemp, 12, ey, PW-24, 38);
          ey+=41;
        }

        // Humidity chart
        if(humData.length) {
          if(ey+44 > PH-20) { addPage(); ey=16; }
          doc.setFontSize(7); doc.setFont(T.font,'bold'); doc.setTextColor(248,113,113);
          doc.text('RELATIVE HUMIDITY (%)',15,ey+4);
          doc.setFontSize(6); doc.setFont(T.font,'normal'); setTextC(T.cSub);
          doc.text(statLine(humData,'%',''),80,ey+4);
          ey+=7;
          await renderEnvChart(humData,'HUMIDITY','#f87171', thr.maxHum, thr.minHum, 12, ey, PW-24, 38);
          ey+=41;
        }
        ey+=6;
        await new Promise(r=>requestAnimationFrame(r));
      }

      // Screenshots
      for(const [si,s] of env.screenshots.entries()) {
        if(ey + 70 > PH-20) { addPage(); ey=16; }
        doc.setFontSize(8); doc.setFont(T.font,'bold'); setTextC(T.cTitle);
        doc.text('📷 '+(s.label||'Screenshot '+(si+1)),15,ey+5);
        ey+=9;
        try {
          doc.addImage(s.data,'PNG',12,ey,PW-24,65,'','FAST');
          ey+=68;
        } catch(e){}
      }
    }
  }

  // ── SIGNATURE PAGE ───────────────────
  if (window._pdfBranding.auditorSig || window._pdfBranding.clientSig) {
    addPage();
    setFill(T.bgHeader); doc.rect(0,0,PW,20,'F');
    doc.setFontSize(11); doc.setFont(T.font,'bold'); setTextC(T.cHeader);
    doc.text('REPORT SIGN-OFF', 15, 13);
    
    let sy = 40;
    doc.setFontSize(12); doc.setFont(T.font,'bold'); setTextC(T.cTitle);
    doc.text('Auditor / Inspector', 15, sy);
    if (window._pdfBranding.auditorSig) {
      doc.addImage(window._pdfBranding.auditorSig, 'PNG', 15, sy + 5, 60, 20);
    }
    doc.setFontSize(9); doc.setFont(T.font,'normal'); setTextC(T.cSub);
    doc.line(15, sy + 26, 85, sy + 26);
    doc.text('Signature', 15, sy + 30);
    doc.text('Date: ' + new Date().toLocaleDateString(), 60, sy + 30);

    sy = 100;
    doc.setFontSize(12); doc.setFont(T.font,'bold'); setTextC(T.cTitle);
    doc.text('Client / General Contractor', 15, sy);
    if (window._pdfBranding.clientSig) {
      doc.addImage(window._pdfBranding.clientSig, 'PNG', 15, sy + 5, 60, 20);
    }
    doc.setFontSize(9); doc.setFont(T.font,'normal'); setTextC(T.cSub);
    doc.line(15, sy + 26, 85, sy + 26);
    doc.text('Signature', 15, sy + 30);
    doc.text('Date: ________________', 60, sy + 30);
  }

  // Footer on all pages
  const pageCount=doc.getNumberOfPages();
  for(let p=1;p<=pageCount;p++){
    doc.setPage(p);
    setFill(T.bgHeader); doc.rect(0,PH-8,PW,8,'F');

  const filename = proj.name.replace(/[^a-z0-9]/gi,'_')+'_'+tpl+'_report.pdf';
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if(isIOS) {
    // iOS Safari: open PDF in new tab — user can then tap Share → Save to Files
    const pdfBlob = doc.output('blob');
    const blobURL = URL.createObjectURL(pdfBlob);
    hidePDFProgress();

    // Show instructions overlay
    const ov = document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;';

      <div style="background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:24px;max-width:340px;text-align:center;">
        <div style="font-size:36px;margin-bottom:12px">📄</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">PDF Ready</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:20px;line-height:1.6">
          Your PDF will open in a new tab.<br>
          Tap <strong style="color:var(--text)">Share ⬆</strong> → <strong style="color:var(--text)">Save to Files</strong> to keep it.
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button onclick="window.open('${blobURL}','_blank');this.closest('div[style]').remove();"
            style="background:var(--accent);color:#000;border:none;border-radius:10px;padding:12px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;">
            Open PDF ↗
          </button>

            style="background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;cursor:pointer;">
            Cancel
          </button>

      </div>`;
    document.body.appendChild(ov);
  } else {
    // Desktop: standard download
    doc.save(filename);
    hidePDFProgress();
    showToast('✓ PDF Downloaded', 'green');
  }
}

// ── DUPLICATE PROJECT ─────────────────────
function duplicateProject(pid,fid,opts) {
  const src=getProject(pid); if(!src) return;
  const ts=Date.now();
  const newProj=JSON.parse(JSON.stringify(src));
  newProj.id='proj_'+ts;
  newProj.name=src.name+' (Copy)';
  // Remap section IDs
  const secMap={};
  newProj.sections=newProj.sections.map(s=>{
    const nid='sec_'+Math.random().toString(36).slice(2);
    secMap[s.id]=nid;
    return {...s,id:nid};
  });
  // Remap items — keep status as requested
  newProj.items=newProj.items.map((item,i)=>{
    const nitem={
      ...item,
      id:'si_'+(ts+i),
      sectionId:secMap[item.sectionId]||item.sectionId,
      // Status preserved from original
    };
    if(!opts.keepPhotos) nitem.photos=[];
    if(!opts.keepNotes){ nitem.notes=''; nitem.tags=[]; nitem.assignedTo=''; nitem.dueDate=''; }
    return nitem;
  });
  store.projects.push(newProj);
  // Add to same folder
  if(fid){ const f=getFolder(fid); if(f) f.projects.push(newProj.id); }
  save(); closeModal();
  // Rebuild current view
  const r=route();
  if(r.view==='folder') buildFolderView(fid);
  else buildRootView();
  showToast('✓ Project duplicated','green');
}

function confirmDeleteProject(pid,fid) {
  const proj=getProject(pid); if(!proj) return;
  makeModal('Delete Project',`
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${proj.name}</div>
      <div style="font-size:12px;color:var(--text2)">This will permanently delete the project and all its items and photos. This cannot be undone.</div>
    </div>`,()=>{
    // Remove from all folders
    store.folders.forEach(f=>{ f.projects=f.projects.filter(id=>id!==pid); });
    // Remove project
    store.projects=store.projects.filter(p=>p.id!==pid);
    save(); closeModal();
    // If we were inside this project, go back
    if(route().projectId===pid) fid?navToFolder(fid):navToRoot();
    else {
      const r=route();
      if(r.view==='folder') buildFolderView(r.folderId);
      else buildRootView();
      renderLeft(r);
    }
    showToast('Project deleted');
  });
}

window.confirmDeleteFolder = function(fid) {
  const folder = getFolder(fid);
  if (!folder) return;
  
  if (MAIN_FOLDERS.includes(folder.name)) {
    showToast('Main folders cannot be deleted', 'red');
    return;
  }

  const parentId = folder.parentId;
  makeModal('Delete Folder', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${folder.icon} ${folder.name}</div>
      <div style="font-size:12px;color:var(--text2)">Delete this folder and all subfolders? Projects inside will NOT be deleted; they will still be available in "All Projects".</div>
    </div>`, () => {
    const toDelete = [fid];
    const findChildren = (pid) => {
      store.folders.filter(f => f.parentId === pid).forEach(child => {
        toDelete.push(child.id);
        findChildren(child.id);
      });
    };
    findChildren(fid);
    store.folders = store.folders.filter(f => !toDelete.includes(f.id));
    save();
    closeModal();
    if (parentId) navToFolder(parentId); else navToRoot();
    showToast('Folder deleted');
  });
};

/* =========================================
   XLS IMPORT — NORMALIZATION & FILTERING
   ========================================= */

function normalizeSI(raw) {
  if (!raw) return null;
  const m = String(raw).match(/\d{2,4}/);
  if (!m) return null;
  return m[0].padStart(4, '0');
}

function isJunkRow(values) {
  const blacklist = [
    'job name','truck','delivery','arrival','notes',
    'address','vendor','mail out','gc info','installer',
    'scope','logo','load date','delivery date'
  ];
  const text = values.join(' ').toLowerCase();
  return blacklist.some(k => text.includes(k));
}

/* =========================================
   V1.5-B — SECTION MAPPING RULES
   ========================================= */
// Default SECTION_RULES — overwritten by _initStore() once IndexedDB loads
let SECTION_RULES = {
  'center bar': 'Center Bar',
  'casino bar': 'Casino Bar',
  'steak': 'Steakhouse Restaurant'
};

function mapSection(desc) {
  const d = desc.toLowerCase();
  for (const k in SECTION_RULES) {
    if (d.includes(k)) return SECTION_RULES[k];
  }
  return 'General';
}

/* =========================================
   V2-A — DELIVERY METADATA EXTRACTION
   ========================================= */
function extractDelivery(row) {
  const date = row.find(c => typeof c === 'string' && /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(c));
  const truck = row.find(c => typeof c === 'string' && /truck/i.test(c));
  return { deliveryDate: date || '', truck: truck || '' };
}

function flagImportDuplicates(items) {
  const seen = new Set();
  items.forEach(i => {
    if (seen.has(i.si)) i._duplicate = true;
    seen.add(i.si);
  });
}

/* =========================================
   V2-B — AUTO STATUS RULES
   ========================================= */
function applyDeliveryRules(si) {
  if (!si.delivery?.deliveryDate) return;
  const dDate = new Date(si.delivery.deliveryDate);
  const iDate = si.dueDate ? new Date(si.dueDate) : null; // Mapping installDate to existing dueDate

  if (iDate && !isNaN(dDate) && !isNaN(iDate) && dDate > iDate) {
    si.status = 'not-ready';
    if (!si.notes.includes('Delivery scheduled after install window')) {
      si.notes = (si.notes ? si.notes + '\n' : '') + '⚠️ Delivery scheduled after install window.';
    }
  }
}

/* =========================================
   V2-C/D — RE-IMPORT DIFF ENGINE
   ========================================= */
function diffSI(existing, incoming) {
  const map = new Map(existing.map(s => [s.num, s]));
  const diffs = [];

  incoming.forEach(n => {
    const old = map.get('SI ' + n.si);
    if (!old) {
      diffs.push({ type: 'new', next: n });
      return;
    }

    const changes = {};
    if (old.title !== n.title) changes.title = [old.title, n.title];
    if (JSON.stringify(old.delivery) !== JSON.stringify(n.delivery))
      changes.delivery = [old.delivery, n.delivery];

    if (Object.keys(changes).length)
      diffs.push({ type: 'modified', si: old, changes, next: n });
  });

  existing.forEach(o => {
    if (!incoming.find(n => 'SI ' + n.si === o.num))
      diffs.push({ type: 'removed', si: o });
  });

  return diffs;
}

function extractSIFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, {
    header: 1,
    raw: false,
    defval: ''
  });

  const items = [];
  const skipped = [];

  rows.forEach((row, idx) => {
    if (!row || row.length < 2) return;
    if (isJunkRow(row)) return;

    let si = null;
    row.forEach(c => { if (!si) si = normalizeSI(c); });

    if (!si) return;

    const desc = row.find(c =>
      typeof c === 'string' &&
      c.length > 6 &&
      !normalizeSI(c) &&
      !/tbd|xxxx|vendor/i.test(c)
    );

    if (!desc) {
      skipped.push({ row: idx + 1, reason: 'Missing description' });
      return;
    }

    const section = mapSection(desc);
    const delivery = extractDelivery(row);
    
    items.push({
      si,
      title: desc.trim(),
      section,
      delivery,
      _checked: true
    });
  });

  return { items, skipped };
}

/* =========================================
   RE-IMPORT DIFF — LOGIC & WARNINGS
   ========================================= */

function assessDeliveryImpact(si, newDelivery) {
  if (!si.dueDate || !newDelivery?.deliveryDate) return null;
  const install = new Date(si.dueDate);
  const delivery = new Date(newDelivery.deliveryDate);
  if (delivery > install) {
    return { status: 'not-ready', note: 'Delivery scheduled after install window.' };
  }
  return null;
}

function detectConflicts(diffs) {
  diffs.forEach(d => {
    if (d.type !== 'modified') return;
    const si = d.si;
    const hasFieldData = (si.photos && si.photos.length) || (si.notes && si.notes.trim()) || (si.tags && si.tags.length);
    const criticalChange = d.changes.delivery || d.changes.title;
    if (hasFieldData && criticalChange) {
      d.type = 'conflict';
      d.apply = false;
    }
  });
}

function logImport(project, summary) {
  if (!project.importLog) project.importLog = [];
  project.importLog.push({ date: new Date().toISOString(), summary });
}

function showImportLog(project) {
  const html = `
    <div class="list-scroll" style="max-height:300px">
      ${(project.importLog || []).length === 0 ? '<div style="padding:20px;text-align:center;color:var(--text3)">No history found</div>' : 
        project.importLog.map(e => `
        <div style="padding:10px;border-bottom:1px solid var(--border);font-size:11px;font-family:var(--mono)">
          <div style="font-weight:600;margin-bottom:4px;color:var(--text)">${new Date(e.date).toLocaleString()}</div>
          <div style="display:flex;gap:10px;color:var(--text2)">
            <span style="color:var(--green)">+${e.summary.added}</span>
            <span style="color:var(--accent)">~${e.summary.modified}</span>
            <span style="color:var(--red)">-${e.summary.removed}</span>
            <span style="color:var(--yellow)">⚠${e.summary.conflicts}</span>
          </div>
        </div>`).join('')}
    </div>`;

/* =========================================
   RE-IMPORT DIFF — CLASSIFICATION
   ========================================= */

function classifyDiffs(projectItems, incomingItems) {
  const existingMap = new Map(
    projectItems.map(i => [i.num.replace(/\D/g, ''), i])
  );

  const diffs = [];

  incomingItems.forEach(n => {
    const old = existingMap.get(n.si);

    if (!old) {
      diffs.push({ type: 'new', next: n, apply: true });
      return;
    }

    const changes = {};
    let impact = null;

    if (old.title !== n.title) {
      changes.title = { before: old.title, after: n.title };
    }

    if (JSON.stringify(old.delivery) !== JSON.stringify(n.delivery)) {
      changes.delivery = { before: old.delivery, after: n.delivery };
      impact = assessDeliveryImpact(old, n.delivery);
    }

    if (Object.keys(changes).length) {
      diffs.push({
        type: 'modified',
        si: old,
        changes,
        impact,
        apply: true
      });
    }

    existingMap.delete(n.si);
  });

  // Remaining SIs were removed from new file
  existingMap.forEach(si => {
    diffs.push({
      type: 'removed',
      si,
      apply: false   // safe default
    });
  });

  return diffs;
}

function buildImportWarnings(parsed) {
  const warnings = [];
  if (parsed.skipped?.length) {
    warnings.push(`⚠ ${parsed.skipped.length} rows skipped (no description)`);
  }
  const general = parsed.items.filter(i => i.section === 'General');
  if (general.length) {
    warnings.push(`⚠ ${general.length} items defaulted to General section`);
  }
  return warnings;
}

                    </span>

              ${d.impact ? `<div style="margin-top:6px;color:var(--red);font-size:10px">⚠ Install Impact: Not Ready</div>` : ''}
            </div>

let _reimportTargetPid = null;
function triggerReimportXLS(pid) {
  _reimportTargetPid = pid;
  _xlsTargetFid = null;
  const inp = document.getElementById('xls-file-input');
  inp.value = '';
  inp.click();
}

function handleXLSImport(e) {
  const folderId = _xlsTargetFid;
  const reimportPid = _reimportTargetPid;
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(ev.target.result, { type: 'binary' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const parsed = extractSIFromSheet(sheet);
    flagImportDuplicates(parsed.items);

    if (!parsed.items.length) {
      showToast('No SI found in file', 'red');
      return;
    }

    if (reimportPid) {
      const project = getProject(reimportPid);
      if (!project) return showToast('Project not found', 'red');
      
      const diffs = classifyDiffs(project.items, parsed.items);
      detectConflicts(diffs);
      showReimportDiffModal(project, diffs, selectedDiffs => {
        applyReimportDiff(project, selectedDiffs, diffs);
        closeModal();
        render();
        showToast(`Applied ${selectedDiffs.length} changes`, 'green');
      });
    } else {
      showXLSPreviewModal(file.name, parsed, selectedSI => {
        createProjectFromImport(selectedSI, folderId);
        closeModal();
        showToast(`Imported ${selectedSI.length} SI`, 'green');
      });
    }
    _reimportTargetPid = null;
  };

  reader.readAsBinaryString(file);
  e.target.value = '';
}

function createProjectFromImport(items, folderId) {
  const pid = 'proj_' + Date.now();
  const sections = {};
  const siItems = [];

  items.forEach(i => {
    if (!sections[i.section]) {
      sections[i.section] = { id: 'sec_' + i.section.replace(/\s+/g, '_') };
    }

    siItems.push({
      id: 'si_' + i.si,
      sectionId: sections[i.section].id,
      num: 'SI ' + i.si,
      title: i.title,
      status: 'pending',
      delivery: i.delivery || { deliveryDate: '', truck: '' },
      notes: '',
      tags: [],
      photos: []
    });
    applyDeliveryRules(siItems[siItems.length - 1]);
  });

  const project = {
    id: pid,
    name: 'Imported Project ' + new Date().toLocaleDateString(),
    client: '',
    company: '',
    auditor: '',
    date: new Date().toLocaleDateString(),
    sections: Object.entries(sections).map(([name, s]) => ({
      id: s.id,
      name
    })),
    items: siItems
  };

  store.projects.push(project);
  if (folderId) {
    const f = getFolder(folderId);
    if (f && !f.projects.includes(pid)) f.projects.push(pid);
  }

  save();
  navToProject(pid, folderId);
}

function applyReimportDiff(project, appliedDiffs, allDiffs) {
  appliedDiffs.forEach(d => {
    if (d.type === 'new') {
      project.items.push({
        id: 'si_' + d.next.si,
        num: 'SI ' + d.next.si,
        title: d.next.title,
        sectionId: project.sections.find(s => s.name === d.next.section)?.id || project.sections[0].id,
        status: 'pending',
        notes: '',
        tags: [],
        delivery: d.next.delivery,
        photos: []
      });
    }

    if (d.type === 'modified') {
      if (d.changes.title) {
        d.si.title = d.changes.title.after;
      }
      if (d.changes.delivery) {
        d.si.delivery = d.changes.delivery.after;
      }
    }

    if (d.type === 'removed') {
      d.si.status = 'out-of-scope';
    }
    
    // Re-check logistics rules after update
    const updatedItem = d.type === 'new' ? project.items[project.items.length - 1] : d.si;
    applyDeliveryRules(updatedItem);
  });

  logImport(project, {
    added: allDiffs.filter(d => d.type === 'new').length,
    modified: allDiffs.filter(d => d.type === 'modified').length,
    removed: allDiffs.filter(d => d.type === 'removed').length,
    conflicts: allDiffs.filter(d => d.type === 'conflict').length
  });

  save();
}

// ── SAVE-ON-EXIT HANDLERS ─────────────────
// Flush any pending editor state before the page/app is closed or backgrounded.
(function() {
  function flushAndSave() {
    clearTimeout(_autoSaveTimer);
    clearTimeout(_saveTimer);   // cancel debounce
    const r = route();
    if (r.view === 'si') {
      syncEditorToStore(r.projectId, r.siId);
    }
    // Synchronous fallback: write to localStorage as a safety net
    // (IDB writes are async and may not complete before the page is killed)
    try { localStorage.setItem('fap_v3_exit', JSON.stringify(store)); } catch(e) {}
    // Also kick off the async IDB write — may or may not finish in time
    _idbSet('fap_v3', store).catch(() => {});
  }
  window.addEventListener('beforeunload', flushAndSave);
  window.addEventListener('pagehide', flushAndSave);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flushAndSave();
  });

  // On next startup, recover from the exit snapshot if IDB was empty
  (async () => {
    try {
      const snap = localStorage.getItem('fap_v3_exit');
      if (!snap) return;
      const idbData = await _idbGet('fap_v3');
      if (!idbData) {
        await _idbSet('fap_v3', JSON.parse(snap));
        console.log('[ADH] Recovered exit snapshot → IndexedDB');
      }
      localStorage.removeItem('fap_v3_exit');
    } catch(e) {}
  })();
})();

function _twEnsure(item) {
  if (!item.towerWork) item.towerWork = { enabled: false, rooms: [] };

function _buildTowerPanelHTML(pid, sid) {
  const item = getSI(pid, sid); if (!item) return '';
  _twEnsure(item);
  const tw = item.towerWork;
  const enabled = tw.enabled;

  if (!enabled) {
    return `<button class="tower-toggle-btn" onclick="toggleTowerWork('${pid}','${sid}')">

  const rooms = [...tw.rooms].sort((a,b) => {
    const na = parseInt(a.number) || 0, nb = parseInt(b.number) || 0;
    return na !== nb ? na - nb : a.number.localeCompare(b.number);
  });
  const total = rooms.length;
  const done = rooms.filter(r => r.status === 'completed').length;
  const inProg = rooms.filter(r => r.status === 'in-progress').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const roomsHTML = rooms.length ? rooms.map(rm => `

    </div>`).join('')

      </div>

        <div class="tw-progress-fill" style="width:${pct}%;background:${barColor}"></div>
      </div>
      <div class="tw-room-list">${roomsHTML}</div>
      <div class="tw-add-section">
        <div style="font-size:10px;font-family:var(--mono);color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Add Rooms</div>
        <div class="tw-input-row">
          <input class="tw-input narrow" id="tw-room-num-${sid}" placeholder="Room #" maxlength="10"
            onkeydown="if(event.key==='Enter')addTowerRoom('${pid}','${sid}')" />
          <input class="tw-input" id="tw-room-type-${sid}" placeholder="Type (e.g. King, Suite…)"
            list="tw-type-list-${sid}"
            onkeydown="if(event.key==='Enter')addTowerRoom('${pid}','${sid}')" />
          <datalist id="tw-type-list-${sid}">
            <option value="King"><option value="Queen"><option value="Double Queen">
            <option value="Suite"><option value="Accessible"><option value="Studio">
            <option value="Corridor"><option value="Bathroom"><option value="Lobby">
            <option value="Conference"><option value="Penthouse">
          </datalist>
          <button class="tw-add-btn" onclick="addTowerRoom('${pid}','${sid}')">＋ Add</button>
        </div>
        <div class="tw-input-row" style="margin-top:4px">
          <input class="tw-input" id="tw-range-${sid}" placeholder="Range: 101-110 or 201,203,205"
            onkeydown="if(event.key==='Enter')addTowerRoomRange('${pid}','${sid}')" />
          <input class="tw-input" id="tw-range-type-${sid}" placeholder="Type for all"
            list="tw-type-list-${sid}"
            onkeydown="if(event.key==='Enter')addTowerRoomRange('${pid}','${sid}')" />
          <button class="tw-add-btn" onclick="addTowerRoomRange('${pid}','${sid}')">＋ Range</button>
        </div>
      </div>
    </div>`;
}

function _refreshTowerPanel(pid, sid) {
  const el = document.getElementById(`tower-panel-${sid}`);
  if (el) el.innerHTML = _buildTowerPanelHTML(pid, sid);
  renderLeft(route()); // refresh badge in list
}

window.toggleTowerWork = function(pid, sid) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  item.towerWork.enabled = !item.towerWork.enabled;
  save();
  _refreshTowerPanel(pid, sid);
};

window.addTowerRoom = function(pid, sid) {
  const numEl = document.getElementById(`tw-room-num-${sid}`);
  const typeEl = document.getElementById(`tw-room-type-${sid}`);
  const num = (numEl?.value || '').trim();
  const type = (typeEl?.value || '').trim();
  if (!num) { showToast('Enter a room number', 'red'); numEl?.focus(); return; }
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  // Prevent duplicate room numbers
  if (item.towerWork.rooms.some(r => r.number === num)) {
    showToast(`Room ${num} already exists`, 'red'); return;
  }
  item.towerWork.rooms.push({ id:'rm_'+Date.now()+'_'+Math.random().toString(36).slice(2,5), number:num, type, status:'pending' });
  save();
  if (numEl) numEl.value = '';
  if (typeEl) typeEl.value = '';
  _refreshTowerPanel(pid, sid);
  // Re-focus for rapid entry
  setTimeout(() => document.getElementById(`tw-room-num-${sid}`)?.focus(), 50);
};

window.addTowerRoomRange = function(pid, sid) {
  const rangeEl = document.getElementById(`tw-range-${sid}`);
  const typeEl  = document.getElementById(`tw-range-type-${sid}`);
  const raw  = (rangeEl?.value || '').trim();
  const type = (typeEl?.value || '').trim();
  if (!raw) { showToast('Enter a range or list', 'red'); rangeEl?.focus(); return; }

  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  const existing = new Set(item.towerWork.rooms.map(r => r.number));

  // Parse "101-110" range or "201,203,205" list
  let numbers = [];
  if (/^\d+-\d+$/.test(raw)) {
    const [from, to] = raw.split('-').map(Number);
    if (to < from || to - from > 500) { showToast('Invalid range (max 500 rooms)', 'red'); return; }
    for (let n = from; n <= to; n++) numbers.push(String(n));
  } else {
    numbers = raw.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
  }

  let added = 0;
  numbers.forEach(num => {
    if (!existing.has(num)) {
      item.towerWork.rooms.push({ id:'rm_'+Date.now()+'_'+Math.random().toString(36).slice(2,5)+'_'+num, number:num, type, status:'pending' });
      existing.add(num);
      added++;
    }
  });

  save();
  if (rangeEl) rangeEl.value = '';
  _refreshTowerPanel(pid, sid);
  showToast(`＋${added} room${added!==1?'s':''} added`, 'green');
};

window.cycleTowerRoomStatus = function(pid, sid, roomId) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  const room = item.towerWork.rooms.find(r => r.id === roomId);
  if (!room) return;
  const idx = TW_STATUS_CYCLE.indexOf(room.status);
  room.status = TW_STATUS_CYCLE[(idx + 1) % TW_STATUS_CYCLE.length];
  save();
  _refreshTowerPanel(pid, sid);
};

window.deleteTowerRoom = function(pid, sid, roomId) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  item.towerWork.rooms = item.towerWork.rooms.filter(r => r.id !== roomId);
  save();
  _refreshTowerPanel(pid, sid);
};

let _woTargetFid = null;
let _woTargetPid = null;

window.triggerWorkOrdersImport = function(fid, pid) {
  _woTargetFid = fid || '';
  _woTargetPid = pid || null;
  const inp = document.getElementById('wo-xls-input');

const WO_HEADER_ALIASES = {
  name:            ['name','item','description','work order','work order name'],
  type:            ['type'],
  plannedCritical: ['planned critical date','critical date','need by','required date'],
  workflow:        ['workflow name','workflow'],
  plannedStart:    ['planned start date','start date','install date'],
  shipmentDate:    ['actual shipment date','shipment date','ship date'],
  laborHours:      ['estimated total labor hours','total labor hours','labor hours','hours'],
  deliveryDate:    ['delivery/on site date','delivery date','on site date','on-site date','delivery'],
  siNumber:        ['si #','si#','si number','si no','si']
};

function _woNormalizeHeader(h) {
  return String(h || '').toLowerCase().replace(/[\s_\-\/#\.]+/g, ' ').trim();
}

function _woBuildHeaderIndex(headerRow) {
  const idx = {};
  headerRow.forEach((h, i) => {
    const norm = _woNormalizeHeader(h);
    for (const canonical in WO_HEADER_ALIASES) {
      if (WO_HEADER_ALIASES[canonical].some(alias => _woNormalizeHeader(alias) === norm)) {
        idx[canonical] = i;
        return;
      }
    }
  });
  return idx;
}

function _woParseName(name) {
  if (!name) return { si: null, title: '' };
  const s = String(name).trim();
  const lead = s.match(/^(\d{2,4})\s*[-–:.\s]?\s*(.*)$/);
  if (lead) return { si: lead[1].padStart(4, '0'), title: lead[2].trim() || s };
  const any = s.match(/\b(\d{2,4})\b/);
  return { si: any ? any[1].padStart(4, '0') : null, title: s };
}

function _woToISODate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if (m) {
    let [, mo, da, yr] = m;
    if (yr.length === 2) yr = '20' + yr;
    const iso = `${yr}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`;
    return isNaN(new Date(iso)) ? '' : iso;
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}

function _woToNumber(v) {
  if (v == null || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}

function extractWorkOrdersFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, cellDates: true, defval: '' });
  if (!rows.length) return { items: [], skipped: [], headerFound: false };

  let headerRowIdx = -1, headerIdx = null;
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    const h = _woBuildHeaderIndex(rows[i]);
    if ('name' in h && ('plannedStart' in h || 'plannedCritical' in h || 'deliveryDate' in h)) {
      headerRowIdx = i; headerIdx = h; break;
    }
  }
  if (headerRowIdx === -1) return { items: [], skipped: [], headerFound: false };

  const items = [], skipped = [];
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(c => c === '' || c == null)) continue;
    const rawName = headerIdx.name != null ? row[headerIdx.name] : '';
    const { si, title } = _woParseName(rawName);
    if (!si) { skipped.push({ row: r + 1, reason: 'No SI number detected in Name' }); continue; }
    items.push({
      si, title: title || rawName,
      type:            String(headerIdx.type        != null ? row[headerIdx.type]        : '').trim(),
      workflow:        String(headerIdx.workflow     != null ? row[headerIdx.workflow]    : '').trim(),
      plannedStart:    _woToISODate(headerIdx.plannedStart    != null ? row[headerIdx.plannedStart]    : ''),
      plannedCritical: _woToISODate(headerIdx.plannedCritical != null ? row[headerIdx.plannedCritical] : ''),
      shipmentDate:    _woToISODate(headerIdx.shipmentDate    != null ? row[headerIdx.shipmentDate]    : ''),
      deliveryDate:    _woToISODate(headerIdx.deliveryDate    != null ? row[headerIdx.deliveryDate]    : ''),
      laborHours:      _woToNumber( headerIdx.laborHours      != null ? row[headerIdx.laborHours]      : ''),
      _checked: true
    });
  }
  const seen = new Map();
  items.forEach(it => { if (seen.has(it.si)) it._duplicate = true; seen.set(it.si, true); });
  return { items, skipped, headerFound: true };
}

function _woWeekKeyFor(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return null;
  const today = new Date();
  const day = today.getDay();
  const diff = today.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(today.getFullYear(), today.getMonth(), diff);
  const wIdx = Math.floor((d - monday) / (7 * 24 * 60 * 60 * 1000));
  if (wIdx < 0 || wIdx > 5) return null;
  return 'w' + wIdx;
}

function showWorkOrdersPreviewModal(filename, parsed, onConfirm) {
  if (!parsed.headerFound) return showToast('Could not find header row (expected "Name" column)', 'red');
  if (!parsed.items.length) return showToast('No importable rows found', 'red');

  const hasMerge = !!_woTargetPid;
  const targetProject = hasMerge ? getProject(_woTargetPid) : null;

  const rowsHTML = parsed.items.map((it, i) => `
    <div style="display:grid;grid-template-columns:28px 60px 1fr 90px 70px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11px;align-items:center">
      <input type="checkbox" ${it._checked ? 'checked' : ''} data-woi="${i}" class="wo-row-check" />
      <span style="font-family:var(--mono);font-weight:600;color:var(--accent)">${it.si}${it._duplicate ? ' ⚠' : ''}</span>
      <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.title}</span>
      <span style="font-family:var(--mono);color:var(--text2);font-size:10px">${it.plannedStart || '—'}</span>
      <span style="font-family:var(--mono);color:var(--text2);font-size:10px;text-align:right">${it.laborHours != null ? it.laborHours + 'h' : '—'}</span>
    </div>`).join('');

  const skippedHTML = parsed.skipped.length
    ? `<div style="margin-top:10px;padding:10px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);border-radius:8px;font-size:11px;color:var(--text2)">
         <div style="font-weight:600;color:var(--yellow);margin-bottom:4px">⚠ ${parsed.skipped.length} row(s) skipped</div>
         ${parsed.skipped.slice(0,5).map(s=>`<div>Row ${s.row}: ${s.reason}</div>`).join('')}
         ${parsed.skipped.length > 5 ? `<div>…and ${parsed.skipped.length-5} more</div>` : ''}
       </div>` : '';

  const targetHTML = hasMerge
    ? `<div style="padding:10px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.3);border-radius:8px;font-size:11px;margin-bottom:10px">
         <div style="font-weight:600;color:var(--accent);margin-bottom:2px">↻ Merging into existing project</div>
         <div style="color:var(--text2)">${targetProject ? targetProject.name : '(unknown)'}</div>
       </div>`
    : `<div class="field-group">
         <div class="field-label">New Project Name</div>
         <input class="field-input" id="wo-project-name" value="Work Orders – ${filename.replace(/\.xlsx?$/i,'')}" placeholder="Project name" />
       </div>`;

  makeModal(hasMerge ? 'Merge Work Orders' : 'Import Work Orders', `
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)">${filename} · ${parsed.items.length} item${parsed.items.length!==1?'s':''} detected</div>
    ${targetHTML}
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn-nav" style="flex:1;font-size:11px" onclick="document.querySelectorAll('.wo-row-check').forEach(c=>c.checked=true)">Select All</button>
      <button class="btn-nav" style="flex:1;font-size:11px" onclick="document.querySelectorAll('.wo-row-check').forEach(c=>c.checked=false)">Select None</button>
    </div>
    <div style="display:grid;grid-template-columns:28px 60px 1fr 90px 70px;gap:8px;padding:6px 10px;border-bottom:2px solid var(--border);font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;font-weight:600">
      <span></span><span>SI</span><span>Title</span><span>Start</span><span style="text-align:right">Labor</span>
    </div>
    <div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">${rowsHTML}</div>
    ${skippedHTML}
    <div style="margin-top:10px;font-size:11px;color:var(--text3)">💡 Planned Start Dates within the next 6 weeks will auto-populate the schedule.</div>
  `, () => {
    const selected = parsed.items.filter((_,i) => {
      const cb = document.querySelector(`.wo-row-check[data-woi="${i}"]`);
      return cb && cb.checked;
    });
    if (!selected.length) return showToast('No items selected', 'red');
    const projectName = document.getElementById('wo-project-name')?.value?.trim();
    onConfirm(selected, projectName);
  });
}

function _woBuildSIItem(it, sectionId) {
  return {
    id: 'si_' + it.si + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    sectionId, num: 'SI ' + it.si, title: it.title,
    status: 'pending', assignedTo: '', dueDate: it.plannedStart || '',
    notes: '', tags: [], customTags: [], photos: [],
    plannedStart: it.plannedStart || '', plannedCritical: it.plannedCritical || '',
    shipmentDate: it.shipmentDate || '', deliveryDate: it.deliveryDate || '',
    laborHours: it.laborHours, workflow: it.workflow || '', workOrderType: it.type || '',
    delivery: { deliveryDate: it.deliveryDate || '', truck: '' }
  };
}

function _woPopulateSchedule(project, items) {
  if (!project.schedule) project.schedule = {};
  let populated = 0;
  items.forEach(si => {
    const wkey = _woWeekKeyFor(si.plannedStart);
    if (!wkey) return;
    const cellKey = `${si.id}_${wkey}`;
    if (!project.schedule[cellKey]) { project.schedule[cellKey] = 'Planned Start'; populated++; }
  });
  return populated;
}

function createProjectFromWorkOrders(items, projectName, folderId) {
  const pid = 'proj_' + Date.now();
  const section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' };
  const siItems = items.map(it => _woBuildSIItem(it, section.id));
  const project = {
    id: pid, name: projectName || 'Work Orders Import',
    client: '', company: '', auditor: '', date: new Date().toLocaleDateString(),
    projectType: '', coverPhoto: null, sections: [section], items: siItems,
    schedule: {}, importLog: []
  };
  const populated = _woPopulateSchedule(project, siItems);
  store.projects.push(project);
  if (folderId) { const f = getFolder(folderId); if (f && !f.projects.includes(pid)) f.projects.push(pid); }
  project.importLog.push({ date: new Date().toISOString(), summary: { added: siItems.length, modified: 0, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  save();
  return { pid, added: siItems.length, scheduled: populated };
}

function mergeWorkOrdersIntoProject(project, items) {
  let section = project.sections.find(s => s.name === 'Imported Work Orders');
  if (!section) { section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' }; project.sections.push(section); }
  const existingBySI = new Map();
  project.items.forEach(i => { const m = String(i.num||'').match(/\d{2,4}/); if (m) existingBySI.set(m[0].padStart(4,'0'), i); });
  let added = 0, updated = 0;
  const newOrUpdatedItems = [];
  items.forEach(it => {
    const existing = existingBySI.get(it.si);
    if (existing) {
      existing.dueDate         = it.plannedStart    || existing.dueDate;
      existing.plannedStart    = it.plannedStart    || existing.plannedStart    || '';
      existing.plannedCritical = it.plannedCritical || existing.plannedCritical || '';
      existing.shipmentDate    = it.shipmentDate    || existing.shipmentDate    || '';
      existing.deliveryDate    = it.deliveryDate    || existing.deliveryDate    || '';
      existing.laborHours      = (it.laborHours != null) ? it.laborHours : existing.laborHours;
      existing.workflow        = it.workflow     || existing.workflow     || '';
      existing.workOrderType   = it.type         || existing.workOrderType || '';
      if (it.deliveryDate) { existing.delivery = existing.delivery || { deliveryDate:'', truck:'' }; existing.delivery.deliveryDate = it.deliveryDate; }
      newOrUpdatedItems.push(existing); updated++;
    } else {
      const si = _woBuildSIItem(it, section.id);
      project.items.push(si); newOrUpdatedItems.push(si); added++;
    }
  });
  const populated = _woPopulateSchedule(project, newOrUpdatedItems);
  if (!project.importLog) project.importLog = [];
  project.importLog.push({ date: new Date().toISOString(), summary: { added, modified: updated, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  save();
  return { added, updated, scheduled: populated };
}

window.handleWorkOrdersXLSX = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const folderId = _woTargetFid, mergePid = _woTargetPid;
  const reader = new FileReader();
  reader.onload = ev => {
    let wb;
    try { wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true }); }
    catch (err) { console.error('[WO Import] read failed:', err); return showToast('Could not read spreadsheet', 'red'); }
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const parsed = extractWorkOrdersFromSheet(sheet);
    showWorkOrdersPreviewModal(file.name, parsed, (selected, projectName) => {
      if (mergePid) {
        const proj = getProject(mergePid);
        if (!proj) { closeModal(); return showToast('Target project not found', 'red'); }
        const res = mergeWorkOrdersIntoProject(proj, selected);
        closeModal();
        showToast(`✓ +${res.added} new · ~${res.updated} updated · 📅 ${res.scheduled} scheduled`, 'green');
        render();
      } else {
        const res = createProjectFromWorkOrders(selected, projectName, folderId);
        closeModal();
        showToast(`✓ Imported ${res.added} SI · 📅 ${res.scheduled} scheduled`, 'green');
        setTimeout(() => navToProject(res.pid, folderId), 50);
      }
      _woTargetFid = null; _woTargetPid = null;
    });
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border2);
}
.sched-current-week {
  background: rgba(37,99,235,0.06) !important;
  border-right: 1px solid rgba(37,99,235,0.2) !important;
}
body.theme-dark .sched-current-week {
  background: rgba(249,115,22,0.06) !important;
  border-right: 1px solid rgba(249,115,22,0.2) !important;
}
.sched-past-week {
  opacity: 0.75;
}
.sched-editable-cell {
  cursor: text;
  transition: background 0.1s;
}
.sched-editable-cell:hover {
  background: var(--surface3) !important;
}
.sched-editable-cell input[type="text"]:focus {
  background: var(--accent-dim) !important;
  border-radius: 4px;
}

/* ── FILE ATTACHMENTS ── */
.attach-row { display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px; }
.attach-icon { font-size:16px;flex-shrink:0; }
.attach-name { font-size:11px;font-family:var(--mono);color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.attach-size { font-size:10px;color:var(--text3);font-family:var(--mono);flex-shrink:0; }
.attach-del  { width:22px;height:22px;border-radius:5px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.12s;flex-shrink:0; }
.attach-del:hover { background:var(--red-dim);color:var(--red); }
.btn-attach { display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;font-family:var(--mono);cursor:pointer;transition:all 0.12s; }
.btn-attach:hover { border-color:var(--accent);color:var(--accent); }
/* ── VOICE-TO-TEXT ── */
.voice-btn { width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s;flex-shrink:0; }
.voice-btn.recording { background:var(--red-dim);border-color:var(--red);color:var(--red);animation:pulse-rec 1s infinite; }
@keyframes pulse-rec { 0%,100%{opacity:1} 50%{opacity:0.5} }
/* ── CAMERA FAB (mobile) ── */
.camera-fab { display:none;position:fixed;bottom:calc(80px + var(--sab));right:18px;z-index:200;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#000;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);align-items:center;justify-content:center;transition:transform 0.15s; }
.camera-fab:active { transform:scale(0.93); }
@media(max-width:640px){ .camera-fab.visible { display:flex; } }
/* ── ARCHIVE BADGE ── */
.archived-badge { font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--surface3);color:var(--text3);border:1px solid var(--border);letter-spacing:0.5px; }
.proj-grid.archived-section { opacity:0.65; }
/* ── ACTIVITY FEED ── */
.act-item { display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border); }
.act-dot  { width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px; }
.act-dot.status   { background:var(--accent); }
.act-dot.photo    { background:var(--green); }
.act-dot.note     { background:var(--yellow); }
.act-dot.attach   { background:#a855f7; }
/* ── FLOOR PLAN ── */
.fp-canvas-wrap { position:relative;flex:1;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center; }
.fp-canvas { cursor:crosshair;display:block;max-width:100%;max-height:100%; }
.fp-pin { position:absolute;transform:translate(-50%,-50%);cursor:pointer;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,0.6);transition:transform 0.12s;z-index:10; }
.fp-pin:hover { transform:translate(-50%,-50%) scale(1.3); }
.fp-pin-label { position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10px;font-family:var(--mono);color:var(--accent);white-space:nowrap;pointer-events:none;margin-top:2px; }
/* ════════════════════════════════════════════════════════════════
   ── PHONE LAYOUT v1 ──
   Mobile-only overrides scoped under html.is-phone.
   No effect on iPad / desktop. Toggled via JS at runtime
   based on matchMedia('(max-width:640px)'). To preview on desktop:
     document.documentElement.classList.add('is-phone')
   ════════════════════════════════════════════════════════════════ */

/* Shared phone-icon mask base */
html.is-phone .nav-actions .btn-icon::before,
html.is-phone .nav-back-btn::before,
html.is-phone .mbn-item .mbn-icon::before,
html.is-phone .camera-fab::before {
  content: '';
  display: block;
  background-color: currentColor;
  -webkit-mask-position: center;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
  mask-size: contain;
}

/* ── PHONE LEFT-PANEL DRAWER ────────────────────────────────── */
/* On phones the left panel (folders / SI list / bulk actions) becomes
   an off-canvas drawer, opened via the Browse tab in the bottom nav. */
html.is-phone .left-panel {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: min(84vw, 340px);
  z-index: 700;
  transform: translateX(-105%);
  transition: transform 0.26s ease;
  border-right: 1px solid var(--border);
  box-shadow: none;
  padding-bottom: var(--sab);
}
html.is-phone body.drawer-open .left-panel {
  transform: translateX(0);
  box-shadow: 12px 0 34px rgba(0,0,0,0.28);
}
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 690;
  opacity: 0; pointer-events: none;
  transition: opacity 0.26s ease;
}
body.drawer-open .drawer-overlay { opacity: 1; pointer-events: auto; }
.drawer-close-btn { display: none; }
html.is-phone .drawer-close-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text2); font-size: 14px; cursor: pointer;
}

/* ── PHONE NAV BAR ──────────────────────────────────────────── */
html.is-phone .app-body { flex-direction: column; }
html.is-phone .right-panel { flex: 1; overflow: hidden; }

html.is-phone .nav-bar {
  height: 56px;
  padding: 0 10px;
  gap: 6px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
html.is-phone .nav-logo { display: none !important; }

/* Show only the LAST crumb as a clean title on phone */
html.is-phone .breadcrumb { gap: 0; padding: 0 4px; }
html.is-phone .breadcrumb .crumb:not(:last-child),
html.is-phone .breadcrumb .crumb-sep { display: none; }
html.is-phone .breadcrumb .crumb {
  font-family: var(--sans);
  font-size: 17px; font-weight: 600;
  color: var(--text);
  padding: 6px 4px;
  letter-spacing: -0.01em;
}
/* When root crumb is the only one, show fallback */
html.is-phone .breadcrumb .crumb.active:only-child:empty::after,
html.is-phone .breadcrumb .crumb.active:has(img):only-child::after {
  content: 'Projects';
  font-family: var(--sans);
  font-size: 17px; font-weight: 700;
  color: var(--text);
}
html.is-phone .breadcrumb .crumb.active:has(img):only-child img { display: none; }

/* Back button: bigger touch target */
html.is-phone .nav-back-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border-color: var(--border);
  font-size: 0;
}

  width: 20px; height: 20px;
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m15 18-6-6 6-6'/></svg>");

  width: 40px; height: 40px;

  background: transparent;
}

  top: 50%; left: 50%;

          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><path d='m17 8-5-5-5 5'/><path d='M12 3v12'/></svg>");
}

/* ── PHONE CAMERA FAB ───────────────────────────────────────── */
html.is-phone .camera-fab {

  border-radius: 18px;

  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z'/><circle cx='12' cy='13' r='3'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z'/><circle cx='12' cy='13' r='3'/></svg>");
}

/* ── PHONE PROJECT/FOLDER CARDS — list rows ─────────────────── */
html.is-phone .grid-wrap { padding: 12px 12px 100px; }

html.is-phone .folder-grid,
html.is-phone .proj-grid {
  display: flex !important;
  flex-direction: column;
  gap: 8px;
}

/* Folder cards as rows */
html.is-phone .folder-card {
  flex-direction: row;
  align-items: center;
  border-radius: 16px;
  padding: 14px;
  min-height: 64px;
  gap: 14px;
}
html.is-phone .folder-card:hover { transform: none; box-shadow: none; }
html.is-phone .folder-card:active { background: var(--surface2); }
html.is-phone .fc-icon { font-size: 24px; flex-shrink: 0; }
html.is-phone .fc-name { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
html.is-phone .fc-count { font-size: 11px; flex-shrink: 0; }
html.is-phone .folder-card.new-card { min-height: 56px; padding: 12px; }

/* Project cards as rows with thumbnail */
html.is-phone .proj-card {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  min-height: 80px;
  position: relative;
}
html.is-phone .proj-card:hover { transform: none; box-shadow: none; }
html.is-phone .proj-card:active { background: var(--surface2); }
html.is-phone .proj-card.new-card {
  flex-direction: row;
  justify-content: center;
  min-height: 64px;
  padding: 14px;
  gap: 10px;
}
html.is-phone .pc-photo {
  width: 84px; height: auto;
  flex-shrink: 0;
  font-size: 26px;
  align-self: stretch;
}
html.is-phone .pc-body {
  flex: 1;
  padding: 12px 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
html.is-phone .pc-name {
  font-size: 15px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 3px;
}
html.is-phone .pc-meta { font-size: 11.5px; }
html.is-phone .pc-stats { margin-top: 6px; gap: 4px; }
html.is-phone .stat-pill { font-size: 9.5px; padding: 2px 6px; }
html.is-phone .proj-card-menu-btn {
  opacity: 1;
  top: 8px; right: 8px;
  width: 32px; height: 32px;
  background: rgba(0,0,0,0.5);
  font-size: 18px;
}
html.is-phone .proj-summary-photo-overlay { background: rgba(0,0,0,0.35); }
html.is-phone .proj-summary-photo-overlay .overlay-btn { opacity: 1; }

/* ── PHONE SECTION DIVIDERS ─────────────────────────────────── */
html.is-phone .section-divider {
  font-size: 11px;
  margin: 12px 4px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
html.is-phone .section-divider::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
  display: inline-block;
}

/* ── PHONE SEARCH (in left panel, but visible at root) ──────── */
html.is-phone .search-box {
  margin: 0 0 12px;
}
html.is-phone .search-box input {
  height: 44px;
  font-size: 15px;
  border-radius: 12px;
}

/* ── PHONE OFFLINE/UPDATE BANNERS ───────────────────────────── */
html.is-phone .offline-banner,
html.is-phone .update-banner {
  font-size: 11px;
  padding: 6px 12px;
}

/* ── PHONE MISC POLISH ──────────────────────────────────────── */
html.is-phone body { padding-bottom: calc(64px + var(--sab)); }
html.is-phone .empty-state { padding: 40px 24px; }
html.is-phone .empty-state-icon { font-size: 48px; }
html.is-phone .empty-state-text { font-size: 14px; }

/* Dark-mode tweaks on phone (extends body.theme-dark) */
html.is-phone body.theme-dark .nav-bar {
  background: var(--surface);
  border-bottom-color: var(--border);
}
html.is-phone body.theme-dark .mobile-bottom-nav {
  background: var(--surface);
  border-top-color: var(--border);
}

/* Touch-target safety */
html.is-phone button,
html.is-phone .btn-icon,
html.is-phone .nav-back-btn { min-width: 40px; min-height: 40px; }

/* ── END PHONE LAYOUT v1 ─────────────────────────────────────── */

/* ── NOTIFICATION BELL ── */
.notif-badge { position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface); }

/* ── EXPORT CHECK (contacts selection checkbox) ── */
.export-check {
  width:18px; height:18px; border-radius:5px;
  border:1.5px solid var(--border); background:var(--surface2);
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:11px; flex-shrink:0;
  transition:all 0.1s; color:transparent;
}
.export-check.checked { background:var(--accent); border-color:var(--accent); color:#000; }

/* ── CONTACT TABLE (Excel-style rows) ── */
.contact-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface); }
.contact-table { min-width:820px; }
.contact-thead, .contact-row {
  display:grid;
  grid-template-columns:34px 1.3fr 1fr 1fr 100px 120px 110px 1.3fr 40px;
  align-items:center;
}
.contact-thead {
  padding:0 10px; height:34px;
  background:var(--surface2); border-bottom:1px solid var(--border);
  font-size:10px; font-family:var(--mono); font-weight:700; letter-spacing:0.4px;
  text-transform:uppercase; color:var(--text3);
  position:sticky; top:0; z-index:2;
}
.contact-row {
  padding:0 10px; min-height:44px;
  border-bottom:1px solid var(--border); cursor:pointer;
  transition:background 0.1s;
}
.contact-row:hover { background:var(--surface2); }
.contact-row:nth-child(even) { background:rgba(255,255,255,0.02); }
.contact-row:last-child { border-bottom:none; }
.contact-row.highlighted { background:var(--accent-dim); }
.ct-c {
  font-size:12px; color:var(--text); padding:8px 6px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ct-name { font-weight:600; }
.ct-muted { color:var(--text2); }
.ct-link { color:var(--accent); text-decoration:none; }
.ct-link:hover { text-decoration:underline; }
.ct-del {
  width:26px; height:26px; border-radius:6px; border:none; background:none;
  color:var(--text3); cursor:pointer; font-size:12px; opacity:0.6;
  display:flex; align-items:center; justify-content:center;
}
.ct-del:hover { opacity:1; color:var(--red); background:var(--red-dim); }
.contact-row.add-row { color:var(--text3); }
.contact-row.add-row:hover { background:var(--surface2); }

/* ── PDF PROGRESS OVERLAY ── */
.pdf-progress-overlay {
  position:fixed; inset:0; z-index:800;
  background:rgba(0,0,0,0.75); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.pdf-progress-box {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:16px; padding:28px 32px; max-width:340px; width:100%;
  text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.5);
}
.pdf-progress-title { font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px; }
.pdf-progress-sub {
  font-size:11px; font-family:var(--mono); color:var(--text2);
  margin-bottom:14px; min-height:16px;
}
.pdf-progress-track {
  height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; margin-bottom:8px;
}
.pdf-progress-fill {
  height:100%; background:var(--accent); border-radius:3px; transition:width 0.3s ease;
}

/* ── SHARE MODAL HELPERS ── */
.share-section-label {
  font-size:10px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono); margin-bottom:8px;
}
.export-opt-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.export-opt-label { font-size:12px; color:var(--text2); }

/* ════════════════════════════════════════════════════════════════
   MODERNISED UI v2 — full visual overhaul
   ════════════════════════════════════════════════════════════════ */

/* ── Extended design tokens ──────────────────────────────────── */
:root {
  --sh-xs:  0 1px 2px rgba(0,0,0,0.06);
  --sh-sm:  0 1px 4px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);
  --sh-md:  0 4px 14px rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.06);
  --sh-lg:  0 8px 28px rgba(0,0,0,0.13), 0 3px 8px rgba(0,0,0,0.07);
  --sh-xl:  0 16px 48px rgba(0,0,0,0.18), 0 6px 16px rgba(0,0,0,0.09);
  --sh-2xl: 0 28px 72px rgba(0,0,0,0.22), 0 10px 28px rgba(0,0,0,0.11);
  --r-xs:   5px;
  --r-sm:   9px;
  --r-md:   13px;
  --r-lg:   17px;
  --r-xl:   22px;
  --r-pill: 999px;
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --glass:        rgba(255,255,255,0.74);
  --glass-border: rgba(255,255,255,0.52);
}
body.theme-dark {
  --sh-xs:  0 1px 2px rgba(0,0,0,0.28);
  --sh-sm:  0 1px 4px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.22);
  --sh-md:  0 4px 14px rgba(0,0,0,0.52), 0 2px 4px rgba(0,0,0,0.30);
  --sh-lg:  0 8px 28px rgba(0,0,0,0.62), 0 3px 8px rgba(0,0,0,0.34);
  --sh-xl:  0 16px 48px rgba(0,0,0,0.72), 0 6px 16px rgba(0,0,0,0.44);
  --sh-2xl: 0 28px 72px rgba(0,0,0,0.82), 0 10px 28px rgba(0,0,0,0.52);
  --glass:        rgba(18,24,38,0.84);
  --glass-border: rgba(255,255,255,0.07);
}

/* ── Base rendering ──────────────────────────────────────────── */
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ── Smooth theme colour transitions ─────────────────────────── */
body, .nav-bar, .left-panel, .right-panel, .modal, .panel-header,
.folder-card, .proj-card, .action-row, .stat-card, .si-row, .folder-row,
.field-input, .search-box, .btn-icon, .btn-add, .btn-nav, .save-bar,
.global-search-box, .ctx-menu, .toast, .autosave-indicator {
  transition-property: background-color, border-color, color, box-shadow;
  transition-duration: 0.20s;
  transition-timing-function: ease;
}

/* ── NAV BAR — frosted glass ─────────────────────────────────── */
.nav-bar {
  height: 62px !important;
  padding: 0 16px !important;
  background: var(--glass) !important;
  backdrop-filter: saturate(180%) blur(18px) !important;
  -webkit-backdrop-filter: saturate(180%) blur(18px) !important;
  border-bottom: 1px solid var(--glass-border) !important;
  box-shadow: var(--sh-sm) !important;
  gap: 8px !important;
  position: relative;
  z-index: 100;
}
.nav-logo { height: 44px !important; width: auto !important; }

.breadcrumb { gap: 4px !important; }
.crumb {
  font-size: 13px !important;
  font-weight: 500 !important;
  padding: 4px 8px !important;
  border-radius: var(--r-sm) !important;
}
.crumb.active { font-weight: 600 !important; }
.crumb-sep { font-size: 16px !important; opacity: 0.45; }

.nav-back-btn {
  width: 34px !important; height: 34px !important;
  border-radius: var(--r-sm) !important;
  font-size: 20px !important;
}
.nav-back-btn:hover {
  border-color: var(--accent) !important;
  color: var(--accent) !important;
  background: var(--accent-dim) !important;
  transform: translateX(-1px);
}

/* Nav icon buttons */
.btn-icon {
  width: 34px !important; height: 34px !important;
  border-radius: var(--r-sm) !important;
  font-size: 15px !important;
  background: var(--surface2) !important;
  border: 1px solid var(--border) !important;
}
.btn-icon:hover {
  border-color: var(--accent) !important;
  color: var(--accent) !important;
  background: var(--accent-dim) !important;
  transform: translateY(-1px);
}
.btn-icon:active { transform: scale(0.91) !important; }

/* ── BANNERS ─────────────────────────────────────────────────── */
.update-banner {
  background: linear-gradient(90deg, #1e3a8a, #1d4ed8) !important;
  font-size: 11px !important;
}
.update-banner-btn {
  border-radius: var(--r-pill) !important;
  padding: 5px 14px !important;
  background: rgba(255,255,255,0.18) !important;
  border: 1px solid rgba(255,255,255,0.28) !important;
}
.update-banner-btn:hover { background: rgba(255,255,255,0.30) !important; }

/* ── LEFT PANEL ──────────────────────────────────────────────── */
.left-panel { background: var(--surface) !important; }
.panel-header { padding: 12px 14px 10px !important; background: var(--surface) !important; }
.panel-title { font-size: 9px !important; font-weight: 700 !important; letter-spacing: 1.5px !important; }

.btn-add {
  border-radius: var(--r-pill) !important;
  padding: 5px 13px !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  gap: 4px !important;
  box-shadow: var(--sh-xs) !important;
}
.btn-add:hover { transform: translateY(-1px); box-shadow: var(--sh-sm) !important; }
.btn-add:active { transform: scale(0.95) !important; }

/* Search box — pill shape */
.search-box {
  border-radius: var(--r-pill) !important;
  padding: 7px 14px !important;
  background: var(--surface2) !important;
  border: 1px solid var(--border) !important;
  gap: 8px !important;
}
.search-box:focus-within {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 3px var(--accent-dim) !important;
}
.search-box input { font-size: 13px !important; }
.search-icon { opacity: 0.5; font-size: 14px !important; }

/* ── FOLDER ROWS ─────────────────────────────────────────────── */
.folder-row {
  padding: 8px 10px !important;
  gap: 10px !important;
  margin: 1px 6px !important;
  border-radius: var(--r-sm) !important;
  transition: background 0.13s ease !important;
}
.folder-row:hover { background: var(--surface2) !important; }
.folder-row.active {
  background: var(--folder-dim) !important;
}
.folder-row.active::before {
  left: -6px !important; top: 50% !important;
  transform: translateY(-50%);
  bottom: unset !important;
  height: 20px !important; width: 3px !important;
  border-radius: var(--r-pill) !important;
}
.folder-icon-wrap {
  width: 32px !important; height: 28px !important;
  border-radius: var(--r-sm) !important;
}
.folder-name { font-size: 13px !important; font-weight: 500 !important; }
.folder-meta { font-size: 10px !important; margin-top: 1px !important; }

/* ── SI ROWS ─────────────────────────────────────────────────── */
.section-group {
  padding: 10px 14px 3px !important;
  font-size: 9px !important;
  letter-spacing: 1.5px !important;
}
.section-count {
  border-radius: var(--r-pill) !important;
  padding: 1px 7px !important;
  font-size: 9px !important;
}
.si-row {
  padding: 8px 10px !important;
  gap: 10px !important;
  margin: 1px 6px !important;
  border-radius: var(--r-sm) !important;
  transition: background 0.13s ease !important;
}
.si-row:hover { background: var(--surface2) !important; }
.si-row.active { background: var(--accent-dim) !important; }
.si-row.active::before {
  left: -6px !important; top: 50% !important;
  transform: translateY(-50%);
  bottom: unset !important;
  height: 20px !important; width: 3px !important;
  border-radius: var(--r-pill) !important;
}
.si-thumb {
  border-radius: var(--r-sm) !important;
  width: 40px !important; height: 30px !important;
}
.si-num { font-size: 11px !important; font-weight: 700 !important; margin-bottom: 2px !important; }
.si-title { font-size: 12px !important; font-weight: 500 !important; }
.si-status { width: 8px !important; height: 8px !important; }
.si-status.completed     { box-shadow: 0 0 7px #22c55e !important; }
.si-status.not-ready     { box-shadow: 0 0 7px var(--red) !important; }
.si-status.in-progress   { box-shadow: 0 0 7px var(--yellow) !important; }
.si-status.changed       { box-shadow: 0 0 7px #f97316 !important; }
.si-status.punch-ongoing { box-shadow: 0 0 7px #a855f7 !important; }
.si-drag-handle { opacity: 0.3 !important; }
.si-drag-handle:hover { opacity: 0.95 !important; }

/* ── BULK ACTION BAR ─────────────────────────────────────────── */
.bulk-btn { border-radius: var(--r-pill) !important; padding: 5px 11px !important; font-size: 9px !important; }

/* ── RIGHT PANEL GRID WRAPPER ────────────────────────────────── */
.grid-wrap { padding: 22px !important; }
.section-divider {
  font-size: 9px !important; font-weight: 700 !important;
  letter-spacing: 1.5px !important; margin-bottom: 14px !important;
  display: flex !important; align-items: center !important; gap: 10px !important;
}
.section-divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border); border-radius: var(--r-pill);
  opacity: 0.7;
}

/* ── FOLDER CARDS ────────────────────────────────────────────── */
.folder-card {
  border-radius: var(--r-lg) !important;
  padding: 18px 16px !important;
  border: 1px solid transparent !important;
  background: var(--surface) !important;
  box-shadow: var(--sh-sm) !important;
  gap: 10px !important;
  transition: transform 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out), border-color 0.18s ease !important;
}
.folder-card:hover {
  border-color: var(--folder) !important;
  box-shadow: var(--sh-lg) !important;
  transform: translateY(-3px) !important;
}
.folder-card:active { transform: scale(0.97) !important; box-shadow: var(--sh-sm) !important; }
.folder-card.new-card {
  border: 1.5px dashed var(--border) !important;
  box-shadow: none !important;
}
.folder-card.new-card:hover {
  border-color: var(--accent) !important;
  box-shadow: var(--sh-sm) !important;
  transform: translateY(-2px) !important;
}
.fc-icon { font-size: 30px !important; }
.folder-card--logo .fc-icon { height: 80px !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 4px 0 !important; }
.folder-card--logo .fc-icon .folder-logo-img { height: 72px !important; width: auto !important; max-width: 100% !important; object-fit: contain !important; }
.fc-name { font-size: 13px !important; font-weight: 600 !important; line-height: 1.3 !important; }
.fc-count { font-size: 10px !important; opacity: 0.6; }

/* ── PROJECT CARDS ───────────────────────────────────────────── */
.proj-card {
  border-radius: var(--r-lg) !important;
  border: 1px solid transparent !important;
  background: var(--surface) !important;
  box-shadow: var(--sh-sm) !important;
  transition: transform 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out), border-color 0.18s ease !important;
}
.proj-card:hover {
  border-color: var(--accent) !important;
  box-shadow: var(--sh-lg) !important;
  transform: translateY(-3px) !important;
}
.proj-card:active { transform: scale(0.98) !important; box-shadow: var(--sh-sm) !important; }
.proj-card.new-card {
  border: 1.5px dashed var(--border) !important;
  box-shadow: none !important; min-height: 150px !important;
}
.proj-card.new-card:hover {
  border-color: var(--accent) !important;
  box-shadow: var(--sh-sm) !important;
  transform: translateY(-2px) !important;
}

<script>
// ══════════════════════════════════════════════════════════════
// PHONE LAYOUT DETECTION v1
// Toggles `is-phone` on <html> based on viewport. Mobile-only
// CSS overrides are scoped under html.is-phone in the stylesheet.
// To preview phone layout on desktop devtools:
//   document.documentElement.classList.add('is-phone')
// ══════════════════════════════════════════════════════════════
(function(){
  // Catches phones in portrait (max-width 640px) AND phones in landscape
  // (short viewport + touchscreen). Excludes iPad (smallest is 744px).
  var mq = window.matchMedia(
    '(max-width: 640px), (max-height: 480px) and (pointer: coarse)'
  );
  function apply(){
    document.documentElement.classList.toggle('is-phone', mq.matches);
  }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else if (mq.addListener) mq.addListener(apply); // older Safari
  // Also re-check on orientation change (iOS sometimes lags matchMedia)
  window.addEventListener('orientationchange', function(){ setTimeout(apply, 50); });
})();

// ── BULK SELECTION ────────────────────
window._bulkSelected = new Set();

window.toggleBulkSelect = function(pid, siId, e) {
  e.stopPropagation();
  if(window._bulkSelected.has(siId)) window._bulkSelected.delete(siId);
  else window._bulkSelected.add(siId);
  updateBulkBar();
  renderLeft(route());
};

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const cnt = document.getElementById('bulk-count');
  if(!bar) return;
  const n = window._bulkSelected.size;
  bar.classList.toggle('visible', n > 0);
  if(cnt) cnt.textContent = n + ' selected';
}

window.bulkSetStatus = function(status) {
  if(!window._bulkSelected.size) return;
  const r = route();
  if(!r.projectId) return;
  const proj = getProject(r.projectId);
  if(!proj) return;
  window._bulkSelected.forEach(siId => {
    const item = proj.items.find(i => i.id === siId);
    if(item) { item.status = status; markAsDirty(siId); }
  });
  save();
  window._bulkSelected.clear();
  updateBulkBar();
  renderLeft(route());
  const cur = route();
  if(cur.view === 'si' && window._bulkSelected.has(cur.siId)) buildSIEditor(cur.projectId, cur.siId);
  showToast(`✓ ${status} applied`, 'green');
};

window.clearBulkSelection = function() {
  window._bulkSelected.clear();
  updateBulkBar();
  renderLeft(route());
};

// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
const SEED = {
  settings: { isAdmin: false, theme: 'light' },
  folders:[
    {id:'fld_ast',name:'A.S.S.T',icon:`<img src='logos/asst.png' alt='A.S.S.T' class='folder-logo-img'>`, projects:[], parentId:null},
    {id:'fld_ami',name:'AMI',icon:`<img src='logos/ami.png' alt='AMI' class='folder-logo-img'>`, projects:[], parentId:null},
    {id:'fld_acd',name:'ACD',icon:`<img src='logos/acd-light.png' alt='ACD' class='folder-logo-img logo-light logo-dark-bg'><img src='logos/acd-dark.png' alt='ACD' class='folder-logo-img logo-dark logo-dark-bg'>`, projects:[], parentId:null},
    {id:'fld_acs',name:'ACS',icon:`<img src='logos/acs.png' alt='ACS' class='folder-logo-img'>`, projects:[], parentId:null},
    {id:'fld_adh',name:'ADH',icon:`<img src='logos/adh.png' alt='ADH' class='folder-logo-img logo-dark-bg'>`, projects:[], parentId:null},
    {id:'fld_acm',name:'ACM',icon:`<img src='logos/acm-light.png' alt='ACM' class='folder-logo-img logo-light logo-dark-bg'><img src='logos/acm-dark.png' alt='ACM' class='folder-logo-img logo-dark logo-dark-bg'>`, projects:[], parentId:null},

  ],
  contacts: [],
  projects:[]
};

// ══════════════════════════════════════════
// INDEXEDDB STORAGE ENGINE
// Replaces localStorage — no 5 MB cap, reliable on iOS PWA
// ══════════════════════════════════════════
const DB_NAME    = 'adh_audit_db';
const DB_VERSION = 1;
const STORE_NAME = 'kv';          // generic key-value object store

let _db = null;

function _openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

function _idbGet(key) {
  return _openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror   = e => reject(e.target.error);
  }));
}

function _idbSet(key, value) {
  return _openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).put(value, key);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  }));
}

// ── In-memory store (populated during async init) ──
let store = JSON.parse(JSON.stringify(SEED));

// ══════════════════════════════════════════════════════════════════════════════
// ENTRA ID AUTH — via Azure Static Web Apps built-in /.auth endpoint
// No MSAL.js needed. SWA handles the OAuth flow automatically.
// ══════════════════════════════════════════════════════════════════════════════

let _currentUser = null; // { userId, userDetails, userRoles }

/**
 * Get the authenticated user from SWA's /.auth/me endpoint.
 * - Online + authenticated  → returns clientPrincipal, caches in IDB
 * - Online + not logged in  → redirects to Entra login, returns null
 * - Offline                 → returns cached user from IDB (works after first login)
 * - localhost (dev)         → returns a dev identity, no redirect
 */
async function _getAuthUser() {
  // ── AUTH DEACTIVATED · SHARED WORKSPACE ──────────────────
  // No /.auth/me request, no Entra redirect — startup is instant.
  // Every device resolves to ONE canonical identity so all clients
  // read/write the same Cosmos index (adh-index-{ADH_USER_ID}) and
  // stamp the same ownedBy. ADH_USER_ID is the OID the existing data
  // already lives under, so no migration is needed. To repoint the
  // entire workspace, change this single value.
  const ADH_USER_ID = '25a348bbf3bb4e9087aefec8b88424b6';

  let userDetails = 'field@adh.local';
  try {
    const cached = await _idbGet('adh_user');
    if (cached && cached.userDetails) userDetails = cached.userDetails;
  } catch (e) { /* no cache yet */ }

  const user = { userId: ADH_USER_ID, userDetails, userRoles: ['authenticated'] };
  try { await _idbSet('adh_user', user); } catch (e) {}
  return user;
}

/** Display-friendly name from the Entra principal */
function _userName() {
  if (!_currentUser) return '';
  const email = _currentUser.userDetails || '';
  return email.includes('@') ? email.split('@')[0] : email;
}

// ══════════════════════════════════════════════════════════════════════════════
// SYNC ENGINE v5 — Per-Project Document Architecture
// ══════════════════════════════════════════════════════════════════════════════
//
// ARCHITECTURE:
//   CLOUD:  adh-index-v1      → folders, contacts, settings, projectIds[]
//           adh-proj-{id}     → one independent document per project
//   LOCAL:  store (unchanged shape in IndexedDB)
//
// DIRTY TRACKING:
//   _dirtyIndex      : boolean  — folders / contacts / settings changed
//   _dirtyProjectIds : Set<id>  — which projects need pushing
//   Both are persisted in IDB across page reloads via "adh_dirty_v1"
//
// PUSH:
//   Auto every 30s (if dirty) + immediately on markDirtyAndSave()
//   Manual via 🔄 button → full push of all dirty items
//
// POLL (every 15s):
//   Check index _ts  → if changed, merge and re-render
//   Check current open project _ts → if changed, merge and re-render
//   Check for new projectIds in index → fetch and add locally
//
// STARTUP:
//   Load IDB → fetch index → fetch all projects in parallel (4s timeout)
// ══════════════════════════════════════════════════════════════════════════════

// ── Dirty tracking ────────────────────────────────────────────────────────────
let _dirtyIndex = false;
const _dirtyProjectIds = new Set();

// IDB key for persisting dirty state across reloads
const DIRTY_IDB_KEY = 'adh_dirty_v1';

async function _loadDirtyState() {
  try {
    const saved = await _idbGet(DIRTY_IDB_KEY);
    if (saved) {
      if (saved.index)      _dirtyIndex = true;
      if (saved.projects)   saved.projects.forEach(id => _dirtyProjectIds.add(id));
    }
  } catch(e) {}
}

async function _persistDirtyState() {
  try {
    await _idbSet(DIRTY_IDB_KEY, {
      index:    _dirtyIndex,
      projects: [..._dirtyProjectIds]
    });
  } catch(e) {}
}

// ── Cloud timestamp cache ─────────────────────────────────────────────────────
// Tracks the last _ts we received from Cosmos for each document.
// Used to avoid re-fetching unchanged documents during poll.
const TS_IDB_KEY = 'adh_ts_v5';
let _cloudTs = { index: 0, projects: {} };

async function _loadCloudTs() {
  try {
    const saved = await _idbGet(TS_IDB_KEY);
    if (saved) _cloudTs = saved;
  } catch(e) {}
}

async function _saveCloudTs() {
  try { await _idbSet(TS_IDB_KEY, _cloudTs); } catch(e) {}
}

// ── Mark dirty helpers ────────────────────────────────────────────────────────

/** Call when any SI item field changes. */
function markAsDirty(itemId) {
  const proj = store.projects.find(p => p.items && p.items.some(i => i.id === itemId));
  if (proj) {
    _dirtyProjectIds.add(proj.id);
    const item = proj.items.find(i => i.id === itemId);
    if (item) {
      item._dirty        = true;
      item._lastModified = new Date().toISOString();
    }
  }
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/** Call when project structure changes (new/deleted SI, section changes, project meta). */
function markProjectDirty(projectId) {
  _dirtyProjectIds.add(projectId);
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/** Call when folders, contacts, or settings change. */
function markStoreDirty() {
  _dirtyIndex = true;
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/**
 * Central save helper for SI field changes.
 * Stamps each changed field with a per-field timestamp for conflict resolution.
 */
function markDirtyAndSave(si, changes) {
  Object.assign(si, changes);
  const now = Date.now();
  si._fieldTs = si._fieldTs || {};
  Object.keys(changes).forEach(k => { si._fieldTs[k] = now; });
  markAsDirty(si.id);
  scheduleDirtySync();
}

// ── Debounced auto-sync ───────────────────────────────────────────────────────
let _syncTimer = null;
function scheduleDirtySync(delayMs = 2000) {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => syncChanges(true), delayMs);
}

// ── Local save (IndexedDB) ────────────────────────────────────────────────────
let _saveTimer = null;
function save() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    _idbSet('fap_v3', store).catch(err => {
      console.error('[ADH] IndexedDB save failed:', err);
      showToast('⚠️ Error saving data locally');
    });
    _idbSet('section_rules', SECTION_RULES).catch(() => {});
  }, 80);
}

// ── Payload builders ──────────────────────────────────────────────────────────

/** Strip binary data before sending a project to Cosmos. */
function _buildProjectPayload(proj) {
  const cleanFloorPlan = proj.floorPlan
    ? Object.assign({}, proj.floorPlan, { imageData: null })
    : undefined;

  const out = Object.assign({}, proj, {
    // Blob-storage URL syncs through Cosmos; pending base64 stays local
    // until _flushPendingPhotos uploads it.
    coverPhoto: (proj.coverPhoto && !proj.coverPhoto.startsWith('data:')) ? proj.coverPhoto : null,
    items: (proj.items || []).map(item => {
      const cloudPhotos = (item.photos || [])
        .filter(p => p.url)
        .map(p => ({ url: p.url, caption: p.caption || '', takenAt: p.takenAt || '' }));
      const cloudAttachments = (item.attachments || [])
        .map(a => ({ id: a.id, name: a.name, type: a.type, ext: a.ext,
                     icon: a.icon, size: a.size, addedAt: a.addedAt, addedBy: a.addedBy }));
      return Object.assign({}, item, { photos: cloudPhotos, attachments: cloudAttachments });
    })
  });
  if (cleanFloorPlan !== undefined) out.floorPlan = cleanFloorPlan;
  return out;
}

/** Build the index payload. */
function _buildIndexPayload() {
  const userId = _currentUser?.userId || '';
  return {
    userId,
    folders:    store.folders,
    contacts:   store.contacts,
    settings:   store.settings,
    // Only register projects owned by this user in their index
    projectIds: store.projects
      .filter(p => !p._deleted && (!p.ownedBy || p.ownedBy === userId))
      .map(p => p.id),
    // Deleted project IDs — the server unions projectIds from both sides, so
    // tombstones are the only way an ID ever leaves the cloud index.
    projectTombstones: store.projectTombstones || {},
    _savedAt:   Date.now()
  };
}

// ── API wrappers ──────────────────────────────────────────────────────────────

async function _apiGetIndex() {
  const userId = _currentUser?.userId || '';
  const res = await fetch(`/api/getIndex?userId=${encodeURIComponent(userId)}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`getIndex HTTP ${res.status}`);
  return res.json();
}

async function _apiSaveIndex(payload) {
  const res = await fetch('/api/saveIndex', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload)  // payload already includes userId from _buildIndexPayload
  });
  if (!res.ok) throw new Error(`saveIndex HTTP ${res.status}`);
  return res.json();
}

async function _apiGetProject(pid) {
  const res = await fetch(`/api/getProject?id=${encodeURIComponent(pid)}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`getProject HTTP ${res.status} (${pid})`);
  return res.json();
}

async function _apiSaveProject(proj) {
  const userId = _currentUser?.userId || '';
  const res = await fetch('/api/saveProject', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ project: { ...proj, ownedBy: proj.ownedBy || userId } })
  });
  if (!res.ok) throw new Error(`saveProject HTTP ${res.status} (${proj.id})`);
  return res.json();
}

/** Best-effort server-side cleanup of Azure photo blobs (fire and forget). */
function _deleteBlobUrls(urls) {
  urls.filter(u => u && /^https?:/.test(u)).forEach(u => {
    fetch('/api/deleteBlob', {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ blobUrl: u })
    }).catch(() => {});
  });
}

// ── Orphan index entries ──────────────────────────────────────────────────────
// The cloud index can list a project ID whose document doesn't exist (the doc
// push failed or never happened after the index registered the ID) — every
// startup then 404s on it forever. A definitive 404 is recorded here; if the
// doc is STILL missing ORPHAN_CONFIRM_MS later, the ID is tombstoned so
// saveIndex prunes it from the cloud index for good. The delay protects a
// just-created project whose doc push is still in flight, and timeouts/network
// errors are never counted — only real 404s.
const ORPHAN_IDB_KEY    = 'adh_orphan_v1';
const ORPHAN_CONFIRM_MS = 10 * 60 * 1000;
let _orphan404 = {};   // { projectId: firstSeen404EpochMs }

async function _loadOrphan404() {
  try { const s = await _idbGet(ORPHAN_IDB_KEY); if (s) _orphan404 = s; } catch(e) {}
}
function _saveOrphan404() { _idbSet(ORPHAN_IDB_KEY, _orphan404).catch(() => {}); }

/** Record a fetch outcome for pid. Returns true if pid was pruned as orphan. */
function _noteProjectFetch(pid, missing) {
  if (!missing) {
    if (_orphan404[pid]) { delete _orphan404[pid]; _saveOrphan404(); }
    return false;
  }
  const local = store.projects.find(p => p.id === pid);
  if (local && !local._deleted) return false; // live local copy — doc push may be pending
  const now = Date.now();
  if (!_orphan404[pid]) { _orphan404[pid] = now; _saveOrphan404(); return false; }
  if (now - _orphan404[pid] < ORPHAN_CONFIRM_MS) return false;
  // Confirmed orphan — tombstone it so the next index push prunes it everywhere
  store.projectTombstones = store.projectTombstones || {};
  store.projectTombstones[pid] = now;
  delete _orphan404[pid]; _saveOrphan404();
  delete _cloudTs.projects[pid];
  _dirtyIndex = true;
  console.log(`[ADH] Pruned orphan index entry ${pid} (project doc missing from cloud)`);
  return true;
}

/**
 * Fetch a set of project docs in parallel and merge them into the local store.
 * Skips tombstoned IDs and feeds definitive 404s to the orphan tracker.
 * Used by startup load and Pull All.
 */
async function _fetchAndMergeProjects(projectIds, timeoutMs) {
  const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
  const livePids = projectIds.filter(pid => !(store.projectTombstones || {})[pid]);

  const results = await Promise.all(livePids.map(pid =>
    Promise.race([_apiGetProject(pid), timeout(timeoutMs)])
      .then(cp => ({ pid, cp, missing: cp === null }))
      .catch(() => ({ pid, cp: null, missing: false })) // timeout/network ≠ orphan
  ));

  let fetched = 0, pruned = 0;
  results.forEach(({ pid, cp, missing }) => {
    if (_noteProjectFetch(pid, missing)) pruned++;
    if (!cp) return;
    _mergeProjectIntoLocal(cp);
    _cloudTs.projects[pid] = cp._ts || 0;
    fetched++;
  });
  if (pruned) {
    _persistDirtyState();
    scheduleDirtySync(); // push the pruned index promptly
  }
  return { fetched, total: livePids.length };
}

// ── Merge helpers ─────────────────────────────────────────────────────────────

/** Restore SEED logo icons for the 6 main folders so cloud data never overwrites them. */
function _fixFolderIcons() {
  ['fld_ast','fld_ami','fld_acd','fld_acs','fld_adh','fld_acm'].forEach(id => {
    const f    = store.folders.find(folder => folder.id === id);
    const seedF = SEED.folders.find(sf => sf.id === id);
    if (f && seedF) f.icon = seedF.icon;
  });
}

/**
 * Merge index fields from cloud into local store.
 * Called on startup and during poll when index _ts changes.
 */
function _mergeIndexIntoLocal(cloudIndex) {
  // Folders: union by ID, incoming wins on conflict
  if (cloudIndex.folders) {
    const localById = new Map((store.folders || []).map(f => [f.id, f]));
    const cloudById = new Map((cloudIndex.folders || []).map(f => [f.id, f]));
    // Keep local-only folders (created offline), accept all cloud folders
    cloudById.forEach((f, id) => localById.set(id, f));
    store.folders = [...localById.values()];
    // Always restore logo icons from SEED so cloud never overwrites the img tags
    _fixFolderIcons();
  }

  // Contacts: merge by ID with tombstone respect
  if (cloudIndex.contacts) {
    const localById = new Map((store.contacts || []).map(c => [c.id, c]));
    const cloudById = new Map((cloudIndex.contacts || []).map(c => [c.id, c]));

    // Start from cloud, then overlay local tombstones / unsaved additions
    const mergedIds = new Set([...localById.keys(), ...cloudById.keys()]);
    store.contacts = [...mergedIds].map(id => {
      const local = localById.get(id);
      const cloud = cloudById.get(id);
      if (!cloud) return local; // local-only (created offline)
      if (!local) return cloud; // cloud-only (added by another device)
      // Both exist — tombstone wins, else cloud wins (newer server version)
      if (local._deleted) return local;  // preserve our tombstone
      if (cloud._deleted) return cloud;  // accept cloud tombstone
      return cloud; // cloud has the latest confirmed version
    });
  }

  // Settings: cloud wins if we don't have unsaved local changes
  if (cloudIndex.settings && !_dirtyIndex) {
    store.settings = cloudIndex.settings;
  }

  // Project tombstones: merge (newest wins), then apply to local copies so a
  // deletion made on another device removes the project here too.
  if (cloudIndex.projectTombstones) {
    store.projectTombstones = store.projectTombstones || {};
    Object.entries(cloudIndex.projectTombstones).forEach(([id, ts]) => {
      if (!store.projectTombstones[id] || ts > store.projectTombstones[id]) {
        store.projectTombstones[id] = ts;
      }
    });
    store.projects.forEach(p => {
      const ts = store.projectTombstones[p.id];
      if (ts && !p._deleted) {
        p._deleted   = true;
        p._deletedAt = ts;
        p._fieldTs   = p._fieldTs || {};
        p._fieldTs._deleted = ts;
        // The deleting device already pushed the doc tombstone — drop any
        // pending push of ours so we don't send data for a dead project.
        _dirtyProjectIds.delete(p.id);
      }
    });
    // Drop dead IDs from folder listings (covers local-only folder entries
    // that the cloud folder merge above didn't overwrite).
    store.folders.forEach(f => {
      if (f.projects) f.projects = f.projects.filter(id => !store.projectTombstones[id]);
    });
  }
}

/**
 * Derive the local project ID from a cloud project document.
 * Cloud docs store id as "adh-proj-{pid}", and preserve original in projectId field.
 */
function _localPidFrom(cloudProj) {
  return cloudProj.projectId || cloudProj.id.replace(/^adh-proj-/, '');
}

/**
 * Merge a single cloud project document into the local store.
 * - Preserves local photos (never uploaded to Cosmos).
 * - Skips items flagged _dirty (user has unsaved changes).
 * - Adds project if it doesn't exist locally yet.
 */
const _SNAP_VOLATILE = new Set(['_ts', '_rid', '_self', '_etag', '_attachments', 'projectId']);
function _projSnapshot(p) {
  // Cheap change-detection serialization. Cosmos metadata is excluded
  // (it changes on every save even when content is identical), and long
  // strings (base64 photos, signatures, floor plans) are reduced to a
  // length+edges fingerprint so we never stringify megabytes just to
  // compare two project versions.
  return JSON.stringify(p, (k, v) => {
    if (_SNAP_VOLATILE.has(k)) return undefined;
    if (typeof v === 'string' && v.length > 256) {
      return 'trunc:' + v.length + ':' + v.slice(0, 24) + v.slice(-24);
    }
    return v;
  });
}

// Returns true when the merge actually changed local data — callers use
// this to skip pointless re-renders when the cloud _ts bumped but the
// content is identical (or every local item was dirty and skipped).
function _mergeProjectIntoLocal(cloudProj) {
  const localPid = _localPidFrom(cloudProj);

  // Snapshot local photos before merge
  const localPhotos = {};
  const localProj = store.projects.find(p => p.id === localPid);

  if (localProj) {
    (localProj.items || []).forEach(i => {
      if (i.photos && i.photos.length) localPhotos[i.id] = i.photos;
    });
  }

  function restorePhotos(item) {
    const out = Object.assign({}, item);
    const local = localPhotos[item.id] || [];
    // Cloud only has URL photos; local may also have Blob/base64 (not yet uploaded)
    const cloudUrls    = (item.photos || []).filter(p => p.url);
    const cloudUrlSet  = new Set(cloudUrls.map(p => p.url));
    const localUrlSet  = new Set(local.map(p => p.url).filter(Boolean));
    // Keep every local photo that is still referenced by the cloud, still has
    // usable local image data, or is waiting to upload. Drop only entries whose
    // cloud copy disappeared (photo deleted or replaced by a markup on another
    // device) AND that hold no local data — those can never display again and
    // would sit as dead broken-image tiles forever.
    const hasLocalData = p => (p.data instanceof Blob) || (typeof p.data === 'string' && p.data.startsWith('data:'));
    const keptLocal = local.filter(p => !p.url || cloudUrlSet.has(p.url) || p._needsUpload || hasLocalData(p));
    const freshCloud = cloudUrls.filter(p => !localUrlSet.has(p.url));
    out.photos = [...keptLocal, ...freshCloud];
    return out;
  }

  if (!localProj) {
    // Never (re-)add a project that is deleted — either the cloud doc itself
    // is a tombstone, or we already hold a tombstone for that ID.
    if (cloudProj._deleted || (store.projectTombstones || {})[localPid]) return false;
    // New project from another device — add it
    const newProj = Object.assign({}, cloudProj, {
      id:        localPid,
      items:     (cloudProj.items || []).map(restorePhotos)
    });
    delete newProj.projectId; // only needed for Cosmos key lookup
    store.projects.push(newProj);
    return true;
  }

  // Merge items: skip _dirty local items, merge the rest field-by-field
  const localItemMap = new Map((localProj.items || []).map(i => [i.id, i]));
  (cloudProj.items || []).forEach(ci => {
    const li = localItemMap.get(ci.id);
    if (!li) {
      // New item from another device
      localItemMap.set(ci.id, restorePhotos(ci));
    } else if (!li._dirty) {
      // Safe to merge — no unsaved local changes
      const merged = Object.assign({}, li, ci);
      merged.photos = restorePhotos(ci).photos;
      localItemMap.set(ci.id, merged);
    }
    // else: li._dirty → skip, preserve local version
  });

  // Merge project-level fields (cloud wins for confirmed data)
  const mergedProj = Object.assign({}, localProj, cloudProj, {
    id:        localPid,  // always keep local ID format
    items:     [...localItemMap.values()]
  });
  // Cover photo: a pending local upload (base64 not yet flushed to blob
  // storage) always wins; otherwise the cloud value is authoritative so
  // covers — and cover removals (null) — sync across devices like SI photos.
  if (localProj.coverPhoto && localProj.coverPhoto.startsWith('data:')) {
    mergedProj.coverPhoto = localProj.coverPhoto;
  }
  // Restore floor plan image data (never in Cosmos)
  if (localProj.floorPlan && localProj.floorPlan.imageData && mergedProj.floorPlan) {
    mergedProj.floorPlan.imageData = localProj.floorPlan.imageData;
  }
  delete mergedProj.projectId; // cleanup

  const idx = store.projects.findIndex(p => p.id === localPid);
  if (idx >= 0) store.projects[idx] = mergedProj;

  // localProj was never mutated (merge builds new objects), so comparing
  // it against mergedProj tells us whether anything actually changed.
  return _projSnapshot(localProj) !== _projSnapshot(mergedProj);
}

// ── Main sync function ────────────────────────────────────────────────────────

async function _flushPendingPhotos(proj) {
  // Cover photo: same treatment as SI photos — upload the pending base64
  // to blob storage and replace it with the permanent URL, which then
  // syncs to other devices through the project document.
  if (proj.coverPhoto && proj.coverPhoto.startsWith('data:')) {
    try {
      const coverUrl = await _uploadPhotoToAzureBlob(proj.coverPhoto, proj.id, 'cover');
      if (coverUrl) proj.coverPhoto = coverUrl;
    } catch(e) {
      console.warn('[Sync] Cover photo upload failed:', e.message);
    }
  }

  for (const item of proj.items || []) {
    for (const p of item.photos || []) {

      // Check if the URL is completely missing, OR if it is a temporary local string
      const isTemporaryUrl = p.url && (p.url.startsWith('data:') || p.url.startsWith('blob:'));

      // Upload if there's no permanent Azure URL, or a markup re-upload is
      // still pending (_needsUpload — photo.url points at the pre-markup copy)
      if ((!p.url || isTemporaryUrl || p._needsUpload) && p.data) {
        try {
          const newUrl = await _uploadPhotoToAzureBlob(p.data, proj.id, item.id);
          if (newUrl) {
            const staleUrl = (p._replaceUrl && p._replaceUrl !== newUrl) ? p._replaceUrl : null;
            p.url = newUrl; // Overwrite the temporary string with the real Azure link
            delete p._needsUpload;
            delete p._replaceUrl;
            if (staleUrl) {
              fetch('/api/deleteBlob', {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify({ blobUrl: staleUrl }),
              }).catch(() => {});
            }
          }
        } catch(uploadErr) {
          console.warn('[Sync] Pending photo upload failed:', uploadErr.message);
        }
      }
    }
  }
}

/**
 * Push dirty local data to the cloud.
 *
 * isAuto=true  : only pushes dirty items, silent on success
 * isAuto=false : pushes everything (full baseline), shows toast
 */
async function syncChanges(isAuto = false) {
  if (!navigator.onLine) {
    if (!isAuto) showToast('Offline — changes saved locally');
    return;
  }

  // ── Context-aware manual sync ─────────────────────────────────────────────
  if (!isAuto) {
    const r = route();
    const inProject = r.projectId &&
      ['project','si','schedule','env','manpower','activity','floorplan','tblog'].includes(r.view);
    if (inProject) {
      return _syncSingleProject(r.projectId);
    } else {
      return _pullAll();
    }
  }

  // ── Auto sync: push dirty OWNED items only ────────────────────────────────
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }

  try {
    const nothingDirty = !_dirtyIndex && _dirtyProjectIds.size === 0;
    if (nothingDirty) return;

    // Projects are pushed BEFORE the index so a new project's document exists
    // by the time its ID is registered in the cloud index — otherwise another
    // device could see the ID, 404 on the doc, and flag it as an orphan.
    const userId = _currentUser?.userId || '';
    const projectsToPush = [..._dirtyProjectIds]
      .map(pid => store.projects.find(p => p.id === pid))
      .filter(Boolean)
      .filter(p => !p.ownedBy || p.ownedBy === userId); // NEVER push foreign projects

    for (const proj of projectsToPush) {
      try {
        if (!proj._deleted) await _flushPendingPhotos(proj); // no uploads for tombstones
        const result = await _apiSaveProject(_buildProjectPayload(proj));
        if (result.ok) {
          _dirtyProjectIds.delete(proj.id);
          if (result._ts) _cloudTs.projects[proj.id] = result._ts;
          (proj.items || []).forEach(i => { i._dirty = false; });
        }
      } catch(err) { console.warn(`[Sync] Project ${proj.id} failed:`, err.message); }
    }

    if (_dirtyIndex) {
      try {
        const result = await _apiSaveIndex(_buildIndexPayload());
        if (result.ok) {
          _dirtyIndex = false;
          if (result._ts) _cloudTs.index = result._ts;
        }
      } catch(err) { console.warn('[Sync] Index push failed:', err.message); }
    }

    await _saveCloudTs();
    await _persistDirtyState();
    await _idbSet('fap_v3', store);

  } catch(err) {
    console.error('[Sync Error]', err);
  } finally {
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  }
}

/**
 * Push+pull a single project. Called when the user hits 🔄 inside a project.
 * Push: upload any dirty local changes (only if we own the project).
 * Pull: download the latest cloud version and merge.
 */
async function _syncSingleProject(pid) {
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }

  let anyError = false;
  const proj   = store.projects.find(p => p.id === pid);
  const userId = _currentUser?.userId || '';

  if (!proj) {
    showToast('Project not found', 'red');
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
    return;
  }

  const isOwned = !proj.ownedBy || proj.ownedBy === userId;

  // ── Push (only if we own it and it's dirty) ────────────────────────────
  if (isOwned && _dirtyProjectIds.has(pid)) {
    try {
      if (!proj._deleted) await _flushPendingPhotos(proj);
      const result = await _apiSaveProject(_buildProjectPayload(proj));
      if (result.ok) {
        _dirtyProjectIds.delete(pid);
        if (result._ts) _cloudTs.projects[pid] = result._ts;
        (proj.items || []).forEach(i => { i._dirty = false; });
        await _persistDirtyState();
      } else { anyError = true; }
    } catch(err) {
      anyError = true;
      console.warn('[SyncProject] Push failed:', err.message);
    }
  }

  // ── Pull latest ────────────────────────────────────────────────────────
  try {
    const cp = await _apiGetProject(pid);
    if (cp) {
      const remoteTs = cp._ts || 0;
      const localTs  = _cloudTs.projects[pid] || 0;
      if (remoteTs > localTs) {
        _mergeProjectIntoLocal(cp);
        _cloudTs.projects[pid] = remoteTs;
        await _idbSet('fap_v3', store);
        await _saveCloudTs();
        // Manual sync — the user asked for this, repaint immediately
        // (their own button tap would otherwise defer it as "activity").
        _applySyncRender();
      }
    }
  } catch(err) {
    anyError = true;
    console.warn('[SyncProject] Pull failed:', err.message);
  }

  if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  showToast(
    anyError ? '⚠️ Sync had errors' : (isOwned ? '✓ Project synced' : '✓ Project refreshed'),
    anyError ? '' : 'green'
  );
}

/**
 * Pull everything from the cloud for this user.
 * Called when the user hits 🔄 from the home/root view.
 * Only fetches projects that belong to this user's index.
 */
async function _pullAll() {
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }
  showToast('⬇ Pulling your latest data…');

  try {
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));

    // Also push any dirty index/project data before pulling
    if (_dirtyIndex) {
      try {
        await _apiSaveIndex(_buildIndexPayload());
        _dirtyIndex = false;
      } catch(e) { console.warn('[PullAll] Index push failed:', e.message); }
    }

    const cloudIndex = await Promise.race([_apiGetIndex(), timeout(8000)]);
    if (cloudIndex) {
      _mergeIndexIntoLocal(cloudIndex);
      _cloudTs.index = cloudIndex._ts || 0;

      const { fetched } = await _fetchAndMergeProjects(cloudIndex.projectIds || [], 6000);

      await _idbSet('fap_v3', store);
      await _saveCloudTs();
      render();
      showToast(`✓ ${fetched} project${fetched !== 1 ? 's' : ''} up to date`, 'green');
    } else {
      showToast('Nothing new from cloud', '');
    }
  } catch(err) {
    console.error('[PullAll]', err);
    showToast('Pull failed — check connection', 'red');
  } finally {
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  }
}

// ── Poll for remote changes ───────────────────────────────────────────────────

// ── Sync-driven render guard ──────────────────────────────────────
// Background sync (poll / single-project pull) must NEVER rip the live SI editor
// out from under the user. Rebuilding #v-si via innerHTML destroys #edit-body,
// which resets scrollTop to 0 (scroll-jump bug) and — if the 800ms autosave
// debounce has not fired yet — rebuilds the textarea from the stale store,
// dropping in-flight keystrokes. These helpers gate that rebuild.

// ── Sync repaint deferral ─────────────────────────────────────────
// Cloud data is ALWAYS merged into the store the moment it arrives;
// what gets deferred is only the repaint. While the user is actively
// working — recent touch/typing/scroll, a focused form field, a pending
// autosave, an open modal/annotation/search overlay, or the phone
// drawer — the repaint is queued (dot on the sync button) and flushed
// once they go idle or navigate. Sync never yanks the screen mid-work.

let _pendingSyncRender = false;
let _lastUserActivity  = Date.now();
const SYNC_IDLE_MS     = 10000;

['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
  window.addEventListener(ev, () => { _lastUserActivity = Date.now(); },
    { capture: true, passive: true }));

function _userIsBusy() {
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '')) return true;
  // _autoSaveTimer is non-null only while a debounced save is pending
  // (it is nulled the moment the timer fires — see scheduleAutoSave).
  if (_autoSaveTimer != null) return true;
  if (document.getElementById('modal-overlay')) return true;
  if (document.querySelector('.annotation-overlay, .global-search-overlay')) return true;
  if (document.body.classList.contains('drawer-open')) return true;
  return (Date.now() - _lastUserActivity) < SYNC_IDLE_MS;
}

function _setSyncPendingDot(on) {
  document.querySelectorAll('#sync-btn, .nav-actions .btn-icon[onclick*="syncChanges"]')
    .forEach(el => el.classList.toggle('sync-pending', on));
}

function _rebuildSIEditorPreservingScroll() {
  // Refresh the SI editor in place while keeping scroll position + focus.
  const r = route();
  if (r.view !== 'si' || !r.projectId || !r.siId) { render(); return; }

  const body       = document.getElementById('edit-body');
  const prevScroll = body ? body.scrollTop : 0;

  const ae     = document.activeElement;
  const editor = document.getElementById('v-si');
  const aeId   = (editor && ae && editor.contains(ae) && ae.id) ? ae.id : null;
  const selS   = (ae && 'selectionStart' in ae) ? ae.selectionStart : null;
  const selE   = (ae && 'selectionEnd'   in ae) ? ae.selectionEnd   : null;

  renderNavBar(r);
  renderLeft(r);
  buildSIEditor(r.projectId, r.siId);   // synchronous innerHTML rebuild of #v-si
  show('v-si');

  const newBody = document.getElementById('edit-body');
  if (newBody) newBody.scrollTop = prevScroll;   // ← kills the scroll-jump

  if (aeId) {
    const el = document.getElementById(aeId);
    if (el) {
      try {
        el.focus();
        if (selS != null && typeof el.setSelectionRange === 'function') {
          el.setSelectionRange(selS, selE);
        }
      } catch (_) {}
    }
  }
}

function _applySyncRender() {
  _pendingSyncRender = false;
  _setSyncPendingDot(false);
  const r = route();
  if (r.view === 'si') { _rebuildSIEditorPreservingScroll(); return; }
  render();
}

// Render entry point for background sync. Returns true when the repaint
// actually happened, false when it was queued for later.
function _renderFromSync() {
  if (_userIsBusy()) {
    _pendingSyncRender = true;
    _setSyncPendingDot(true);
    return false;
  }
  _applySyncRender();
  return true;
}

// Flush a queued sync repaint once the user has gone idle
setInterval(() => {
  if (_pendingSyncRender && !_userIsBusy()) _applySyncRender();
}, 3000);

let _pollIntervalId  = null;
const POLL_MS        = 15000;

async function _pollForRemoteChanges() {
  if (!navigator.onLine) return;

  try {
    // ── 1. Check index ──────────────────────────────────────────────────────
    const cloudIndex = await _apiGetIndex();
    if (cloudIndex && (cloudIndex._ts || 0) > _cloudTs.index) {
      _mergeIndexIntoLocal(cloudIndex);
      _cloudTs.index = cloudIndex._ts;
      console.log('[Poll] Index updated from cloud');

      // ── 2. Check for project IDs that we don't have locally ──────────────
      const localIds = new Set(store.projects.map(p => p.id));
      const newIds   = (cloudIndex.projectIds || [])
        .filter(id => !localIds.has(id) && !(store.projectTombstones || {})[id]);
      for (const newId of newIds) {
        try {
          const cp = await _apiGetProject(newId);
          if (cp) {
            _mergeProjectIntoLocal(cp);
            _cloudTs.projects[newId] = cp._ts || 0;
            console.log(`[Poll] New project ${newId} pulled from cloud`);
          }
        } catch(e) { console.warn(`[Poll] Could not fetch new project ${newId}:`, e.message); }
      }

      if (newIds.length > 0) {
        await _idbSet('fap_v3', store);
        if (_renderFromSync()) showToast('🔄 New project available', 'green');
      }
    }

    // ── 3. Check currently open project ────────────────────────────────────
    const r = route();
    if (r.projectId) {
      const lastTs = _cloudTs.projects[r.projectId] || 0;
      try {
        const cp = await _apiGetProject(r.projectId);
        if (cp && (cp._ts || 0) > lastTs) {
          const changed = _mergeProjectIntoLocal(cp);
          _cloudTs.projects[r.projectId] = cp._ts;
          await _idbSet('fap_v3', store);
          // Only repaint (or queue a repaint) when the merge actually
          // changed local data — a ts bump with identical content, or a
          // merge fully skipped because local items were dirty, is a no-op.
          if (changed) {
            if (_renderFromSync()) showToast('🔄 Updated from cloud', 'green');
            console.log(`[Poll] Project ${r.projectId} updated from cloud`);
          }
        }
      } catch(e) { console.warn(`[Poll] Project ${r.projectId} check failed:`, e.message); }
    }

    await _saveCloudTs();

  } catch(e) {
    console.warn('[Poll] Error:', e.message);
  }
}

function _startPolling() {
  if (_pollIntervalId) return;
  _pollIntervalId = setInterval(_pollForRemoteChanges, POLL_MS);
}

function _stopPolling() {
  clearInterval(_pollIntervalId);
  _pollIntervalId = null;
}

// ── Migrate from localStorage (one-time, legacy) ──────────────────────────────
async function _migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem('fap_v3');
    if (!raw) return null;
    const data = JSON.parse(raw);
    await _idbSet('fap_v3', data);
    localStorage.removeItem('fap_v3');
    console.log('[ADH] Migrated data from localStorage → IndexedDB');
    return data;
  } catch(e) { return null; }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function _initStore() {
  try {
    // ── 1. Load local data instantly (works offline) ───────────────────────
    let data = await _migrateFromLocalStorage();
    if (!data) data = await _idbGet('fap_v3');
    if (data) store = data;
  } catch(e) {
    console.warn('[ADH] Storage load error, using seed:', e);
    store = JSON.parse(JSON.stringify(SEED));
  }

  // ── Ensure required fields on migrated/old data ──────────────────────────
  if (!store.settings) store.settings = { isAdmin: false, theme: 'light' };
  if (store.settings.theme === undefined || store.settings.theme === 'default') store.settings.theme = 'light';
  if (!store.settings.displayName) store.settings.displayName = '';
  if (!store.folders)  store.folders  = [];
  if (!store.projects) store.projects = [];
  if (!store.contacts) store.contacts = [];
  if (!store.projectTombstones) store.projectTombstones = {};
  store.folders.forEach(f => { if (f.parentId === undefined) f.parentId = null; });
  store.contacts.forEach(c => { if (!c.project) c.project = 'Office'; });

  // ── GC old tombstones ──────────────────────────────────────────────────
  // Deleted projects/items/contacts ride along as tombstones so deletions
  // sync to every device; past these windows everyone has synced them, so
  // drop them to keep local data from growing forever. (The server GCs its
  // copies too — saveProject/saveIndex.)
  const _gcNow = Date.now();
  const _gcTombTTL = 60 * 24 * 60 * 60 * 1000; // 60 days
  const _gcMapTTL  = 90 * 24 * 60 * 60 * 1000; // 90 days (matches server)
  const _tombTs = o => o._deletedAt || (o._fieldTs && o._fieldTs._deleted) || 0;
  store.projects = store.projects.filter(p => !p._deleted || (_gcNow - _tombTs(p)) < _gcTombTTL);
  store.projects.forEach(p => {
    if (p.items) p.items = p.items.filter(i => !i._deleted || (_gcNow - _tombTs(i)) < _gcTombTTL);
  });
  store.contacts = store.contacts.filter(c => !c._deleted || (_gcNow - _tombTs(c)) < _gcTombTTL);
  Object.keys(store.projectTombstones).forEach(id => {
    if ((_gcNow - store.projectTombstones[id]) > _gcMapTTL) delete store.projectTombstones[id];
  });

  // Restore logo icons from SEED (cloud data must never overwrite them)
  _fixFolderIcons();

  // One-time: add ACM folder if missing
  if (!store.folders.find(f => f.id === 'fld_acm')) {
    const seedAcm = SEED.folders.find(f => f.id === 'fld_acm');
    if (seedAcm) store.folders.push(JSON.parse(JSON.stringify(seedAcm)));
  }

  // Ensure new per-project fields
  store.projects.forEach(p => {
    if (!p.laborSettings) p.laborSettings = { show: false, workers: 4, hoursPerDay: 8, workDays: 5 };
    (p.items || []).forEach(i => {
      if (!i.towerWork) i.towerWork = { enabled: false, rooms: [] };
    });
  });
  _migrateManpower(store);

  // UI state init
  window.contactCategoryFilter = 'All';
  window.contactProjectFilter  = 'All';
  window.importMenuOpen        = false;
  window.exportMenuOpen        = false;
  window.selectedContacts      = new Set();

  isAdmin = store.settings.isAdmin;
  applyTheme(store.settings.theme);

  // Load section_rules (migrate from localStorage if present)
  try {
    const srLS = localStorage.getItem('section_rules');
    if (srLS) {
      const parsed = JSON.parse(srLS);
      await _idbSet('section_rules', parsed);
      localStorage.removeItem('section_rules');
      SECTION_RULES = parsed;
    } else {
      const srIDB = await _idbGet('section_rules');
      if (srIDB) SECTION_RULES = srIDB;
    }
  } catch(e) { /* keep default */ }

  // Instantly draw the UI using whatever is in the local IndexedDB
  render();

  // ── 2. NOW check the auth token in the background ─────────────────────────
  _currentUser = await _getAuthUser();
  if (!_currentUser) return; // redirect in progress or no cache offline

  // Set display name from Entra email (email prefix = first part before @)
  if (!store.settings.displayName && _currentUser.userDetails) {
    store.settings.displayName = _userName();
  }

  // Restore dirty state, timestamp cache, and orphan tracker from IDB
  await _loadDirtyState();
  await _loadCloudTs();
  await _loadOrphan404();
  // Hygiene: drop timestamp cache entries for tombstoned projects
  Object.keys(_cloudTs.projects).forEach(id => {
    if (store.projectTombstones[id]) delete _cloudTs.projects[id];
  });

  // ── 3. Merge from cloud if online ─────────────────────────────────────────
  if (navigator.onLine) {
    try {
      const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));

      // Fetch index (fast, small doc)
      const cloudIndex = await Promise.race([_apiGetIndex(), timeout(4000)]);

      if (cloudIndex) {
        _mergeIndexIntoLocal(cloudIndex);
        _cloudTs.index = cloudIndex._ts || 0;

        // Fetch all live projects in parallel (4s timeout each)
        const { fetched, total } = await _fetchAndMergeProjects(cloudIndex.projectIds || [], 4000);

        await _idbSet('fap_v3', store);
        await _saveCloudTs();
        console.log(`[ADH] Loaded ${fetched}/${total} projects from cloud`);

        // Re-render current view so folder/project views opened before cloud load are fresh
        render();
        _patchFolderCardCounts();
      }
    } catch(e) {
      console.warn('[ADH] Cloud load on startup skipped:', e.message);
    }
  }

  // ── Start polling and auto-sync ────────────────────────────────────────────
  _startPolling();

  // Auto-sync every 30s if we have dirty data
  setInterval(() => {
    if (navigator.onLine && (_dirtyIndex || _dirtyProjectIds.size > 0)) {
      syncChanges(true);
    }
  }, 30000);

  // ── Online / offline handlers ──────────────────────────────────────────────
  function updateOnlineStatus() {
    document.body.classList.toggle('is-offline', !navigator.onLine);
    if (navigator.onLine) {
      _startPolling();
      _pollForRemoteChanges();
      // Flush any dirty data that accumulated while offline
      if (_dirtyIndex || _dirtyProjectIds.size > 0) syncChanges(true);
    } else {
      _stopPolling();
    }
  }
  window.addEventListener('online',  updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // ── Visibility change: pause poll when tab hidden ──────────────────────────
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      _stopPolling();
    } else {
      _startPolling();
      _pollForRemoteChanges();
    }
  });
}

// Helper function to parse mixed photo formats from IndexedDB
function getPhotoSrcForDisplay(p) {
  // 1. Local Blob first — it is always the current version (fresh captures and
  //    markups land here before upload; p.url may still point at the pre-markup
  //    cloud copy until the re-upload succeeds) and it works offline.
  if (p.data instanceof Blob) {
    // Convert the raw binary blob into a temporary local URL for the <img> tag
    // Cached internally as _blobUrl to prevent memory leaks during frequent UI re-renders
    if (!p._blobUrl) p._blobUrl = URL.createObjectURL(p.data);
    return p._blobUrl;
  }

  // 2. Remote Azure Blob URL
  if (p.url) return p.url;

  // 3. Is it the legacy Base64 string?
  if (typeof p.data === 'string' && p.data.startsWith('data:image')) {
    return p.data;
  }

  // Nothing usable — the image data was lost (e.g. a failed upload followed by
  // local eviction). Callers render a "photo unavailable" placeholder on null.
  return null;
}

function render() {
  const r = route();

  // A full render always paints the freshest store, so it satisfies any
  // sync repaint that was queued while the user was busy.
  _pendingSyncRender = false;
  _setSyncPendingDot(false);

  // Navigating away closes the phone drawer — but background sync renders
  // (same route) must not rip it out from under the user.
  if (document.body.classList.contains('drawer-open') &&
      JSON.stringify(r) !== window._drawerRoute) {
    closeMobileDrawer();
  }

  // 1. Instantly draw the nav bar
  renderNavBar(r);
  
  // 2. Instantly draw the left panel (if on desktop/iPad)
  renderLeft(r);
  
  // 3. Yield the thread for a millisecond to let the browser paint the screen,
  // THEN do the heavy lifting of rendering the right panel grids.
  setTimeout(() => {
    renderRight(r);
  }, 0);
}

      syncBtn.title = isOwned ? `⇅ Sync project: ${proj?.name || ''}` : `⬇ Refresh: ${proj?.name || ''}`;

      syncBtn.title = '⬇ Pull all my data from cloud';

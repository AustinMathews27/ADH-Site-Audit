<body>

<!-- OFFLINE BANNER -->
<div class="offline-banner">⚠️ Offline Mode — Changes will sync when reconnected</div>

<!-- UPDATE BANNER -->
<div class="update-banner" id="update-banner">
  <span>🔄 New version available — your changes are safe</span>
  <button class="update-banner-btn" onclick="applyAppUpdate()">Reload Now</button>
</div>

<!-- NAV BAR -->
<div class="nav-bar">
  <div class="nav-back-btn disabled" id="back-btn" onclick="goBack()">‹</div>
  <div class="breadcrumb" id="breadcrumb">
    <span class="crumb active" onclick="navToRoot()"><img src="logo.png" alt="ADH Audit" class="nav-logo" id="main-logo"></span>
  </div>
  <div class="nav-actions">
    <div class="btn-icon" onclick="openGlobalSearch()" title="Global Search (⌘K)">⌕</div>
    <div class="btn-icon" onclick="syncChanges()" title="Sync" id="sync-btn">🔄</div>
    <div class="btn-icon" onclick="showThemeModal()" title="Themes">🎨</div>
    <div class="btn-icon" onclick="showShareModal()" title="Share">📤</div>
    <div class="btn-icon" onclick="handleAdd()" title="Add">＋</div>
    <div class="btn-icon" onclick="showLoginModal()" id="admin-lock-btn" title="Admin Login">🔓</div>
    <div class="btn-icon" onclick="toggleNotifications()" id="notif-btn" title="Notifications" style="position:relative">🔔</div>
    <div id="user-chip" onclick="showUserMenu()" title="Account"
      style="display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;
      border:1px solid var(--border);background:var(--surface2);cursor:pointer;
      font-size:11px;font-family:var(--mono);color:var(--text2);white-space:nowrap;
      transition:all 0.15s;max-width:120px;overflow:hidden;text-overflow:ellipsis"
      onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
      onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text2)'">
      👤 <span id="user-chip-name">…</span>
    </div>
  </div>
</div>

<!-- BODY -->
<div class="app-body">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="panel-header">
      <div class="panel-header-row">
        <span class="panel-title" id="left-panel-title">Folders</span>
      </div>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="text" placeholder="Search..." id="search-input" oninput="handleSearch(this.value)" />
      </div>
    </div>
    <div class="list-scroll" id="list-scroll"></div>
    <div class="bulk-action-bar" id="bulk-bar">
      <span style="font-family:var(--mono);font-size:9px;color:var(--accent);font-weight:700" id="bulk-count">0 selected</span>
      <button class="bulk-btn" onclick="bulkSetStatus('completed')">✓ Done</button>
      <button class="bulk-btn" onclick="bulkSetStatus('not-ready')">✕ Not Ready</button>
      <button class="bulk-btn" onclick="bulkSetStatus('in-progress')">◑ In Progress</button>
      <button class="bulk-btn" onclick="bulkSetStatus('punch-ongoing')">◈ Punch</button>
      <button class="bulk-btn" onclick="bulkSetStatus('pending')">◌ Pending</button>
      <button class="bulk-btn danger" onclick="clearBulkSelection()">✕ Clear</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->

// ══════════════════════════════════════════════════════════════
// PHONE LAYOUT DETECTION v1
// Toggles `is-phone` on <html> based on viewport. Mobile-only
// CSS overrides are scoped under html.is-phone in the stylesheet.
// To preview phone layout on desktop devtools:
//   document.documentElement.classList.add('is-phone')
// ══════════════════════════════════════════════════════════════
(function(){
  // Catches phones in portrait (max-width 640px) AND phones in landscape
  // (short viewport + touchscreen). Excludes iPad (smallest is 744px).
  var mq = window.matchMedia(
    '(max-width: 640px), (max-height: 480px) and (pointer: coarse)'
  );
  function apply(){
    document.documentElement.classList.toggle('is-phone', mq.matches);
  }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else if (mq.addListener) mq.addListener(apply); // older Safari
  // Also re-check on orientation change (iOS sometimes lags matchMedia)
  window.addEventListener('orientationchange', function(){ setTimeout(apply, 50); });
})();

window._bulkSelected = new Set();

window.toggleBulkSelect = function(pid, siId, e) {
  e.stopPropagation();
  if(window._bulkSelected.has(siId)) window._bulkSelected.delete(siId);
  else window._bulkSelected.add(siId);
  updateBulkBar();
  renderLeft(route());
};

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const cnt = document.getElementById('bulk-count');
  if(!bar) return;
  const n = window._bulkSelected.size;
  bar.classList.toggle('visible', n > 0);
  if(cnt) cnt.textContent = n + ' selected';
}

  if(!window._bulkSelected.size) return;
  const r = route();
  if(!r.projectId) return;
  const proj = getProject(r.projectId);
  if(!proj) return;
  window._bulkSelected.forEach(siId => {
    const item = proj.items.find(i => i.id === siId);
    if(item) { item.status = status; markAsDirty(siId); }
  });
  save();
  window._bulkSelected.clear();
  updateBulkBar();
  renderLeft(route());
  const cur = route();
  if(cur.view === 'si' && window._bulkSelected.has(cur.siId)) buildSIEditor(cur.projectId, cur.siId);
  showToast(`✓ ${status} applied`, 'green');
};

  window._bulkSelected.clear();
  updateBulkBar();
  renderLeft(route());
};

window.reorderSI = function(pid, sectionId, siId, dir) {
  const proj = getProject(pid); if(!proj) return;
  const sectionItems = proj.items.filter(i => i.sectionId === sectionId);
  const globalIdx = proj.items.findIndex(i => i.id === siId);
  const sectionIdx = sectionItems.findIndex(i => i.id === siId);
  const targetSectionIdx = sectionIdx + dir;
  if(targetSectionIdx < 0 || targetSectionIdx >= sectionItems.length) return;
  const targetItem = sectionItems[targetSectionIdx];
  const targetGlobalIdx = proj.items.findIndex(i => i.id === targetItem.id);
  // Swap in the main array
  [proj.items[globalIdx], proj.items[targetGlobalIdx]] = [proj.items[targetGlobalIdx], proj.items[globalIdx]];
  markProjectDirty(pid); save();
  renderLeft(route());
};

// ══════════════════════════════════════════
// INDEXEDDB STORAGE ENGINE
// Replaces localStorage — no 5 MB cap, reliable on iOS PWA
// ══════════════════════════════════════════
const DB_NAME    = 'adh_audit_db';
const DB_VERSION = 1;
const STORE_NAME = 'kv';          // generic key-value object store

let _db = null;

function _openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

function _idbGet(key) {
  return _openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror   = e => reject(e.target.error);
  }));
}

function _idbSet(key, value) {
  return _openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).put(value, key);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  }));
}

// ══════════════════════════════════════════════════════════════════
// DURABLE OPS QUEUE — pendingOps survives reload/crash/tab-close
// ══════════════════════════════════════════════════════════════════
// Every patch is appended here BEFORE being sent. On confirmed save,
// the matching op is removed. On startup and on online events, any
// remaining ops are flushed. The Service Worker can also flush this
// queue in the background via the Background Sync API.
//
// Format: [{ patch: {...}, ts: epochMs, attempts: int }, ...]

const OPS_KEY = 'pending_ops_v1';
let _opsFlushing = false;

async function _opsGet() {
  return (await _idbGet(OPS_KEY)) || [];
}
async function _opsAppend(patch) {
  const ops = await _opsGet();
  ops.push({ patch, ts: Date.now(), attempts: 0 });
  // Cap to last 500 ops to prevent unbounded growth in pathological cases
  if (ops.length > 500) ops.splice(0, ops.length - 500);
  await _idbSet(OPS_KEY, ops);
}
async function _opsRemoveByTs(ts) {
  const ops = await _opsGet();
  await _idbSet(OPS_KEY, ops.filter(op => op.ts !== ts));
}
async function _opsClear() {
  await _idbSet(OPS_KEY, []);
}

/**
 * Flush all queued ops to /api/patchAudit. Idempotent — safe to call
 * concurrently with the SW's flush; the server's deep-merge + ETag
 * concurrency make duplicate POSTs harmless.
 */
async function _opsFlush() {
  if (_opsFlushing || !navigator.onLine) return;
  _opsFlushing = true;
  try {
    let ops = await _opsGet();
    let progressed = false;
    while (ops.length > 0 && navigator.onLine) {
      const op = ops[0];
      try {
        const res = await fetch('/api/patchAudit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patch: op.patch })
        });
        if (!res.ok) {
          // Bump attempts; if a single op fails 5+ times, drop it (avoid poison pill)
          op.attempts = (op.attempts || 0) + 1;
          if (op.attempts >= 5) {
            console.warn('[ADH][ops] Dropping op after 5 failed attempts:', op);
            await _opsRemoveByTs(op.ts);
          } else {
            // Persist incremented attempt count and stop
            const all = await _opsGet();
            const target = all.find(x => x.ts === op.ts);
            if (target) target.attempts = op.attempts;
            await _idbSet(OPS_KEY, all);
            break;
          }
        } else {
          await _opsRemoveByTs(op.ts);
          progressed = true;
        }
      } catch (err) {
        // Network failure — stop and retry on next flush
        break;
      }
      ops = await _opsGet();
    }
    if (progressed) {
      console.log('[ADH][ops] Flushed pending operations queue');
    }
  } finally {
    _opsFlushing = false;
  }
}

/**
 * Ask the browser to wake us up when connectivity returns so the queue
 * gets flushed even if the app/tab is closed. Falls back silently on
 * browsers without Background Sync (Safari/Firefox).
 */
function _registerBgSync() {
  if (!('serviceWorker' in navigator)) return;
  if (!('SyncManager' in window)) return;
  navigator.serviceWorker.ready
    .then(reg => reg.sync.register('adh-flush-ops'))
    .catch(() => {/* permission denied or no SW; ignore */});
}

// ══════════════════════════════════════════════════════════════════════════════
// ENTRA ID AUTH — via Azure Static Web Apps built-in /.auth endpoint
// No MSAL.js needed. SWA handles the OAuth flow automatically.
// ══════════════════════════════════════════════════════════════════════════════

let _currentUser = null; // { userId, userDetails, userRoles }

/**
 * Get the authenticated user from SWA's /.auth/me endpoint.
 * - Online + authenticated  → returns clientPrincipal, caches in IDB
 * - Online + not logged in  → redirects to Entra login, returns null
 * - Offline                 → returns cached user from IDB (works after first login)
 * - localhost (dev)         → returns a dev identity, no redirect
 */
async function _getAuthUser() {
  // Dev/local bypass — no auth server running locally
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    const devUser = { userId: 'dev-local', userDetails: 'dev@local.test', userRoles: ['authenticated'] };
    await _idbSet('adh_user', devUser);
    localStorage.setItem('adh_auth_token', 'valid_user_session');
    localStorage.setItem('adh_user_id', devUser.userId);
    return devUser;
  }

  try {
    const res = await fetch('/.auth/me', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.clientPrincipal) {
        // Authenticated — cache and return
        await _idbSet('adh_user', data.clientPrincipal);
        localStorage.setItem('adh_auth_token', 'valid_user_session');
        localStorage.setItem('adh_user_id', data.clientPrincipal.userId);
        return data.clientPrincipal;
      }
      // Response OK but no principal = not logged in → redirect
      localStorage.removeItem('adh_auth_token');
      localStorage.removeItem('adh_user_id');
      window.location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(window.location.pathname);
      return null;
    }
  } catch(e) {
    // Network error — fall through to offline cache
    console.warn('[Auth] /.auth/me unreachable, trying IDB cache');
  }

  // Offline fallback — use last-known user
  const cached = await _idbGet('adh_user');
  if (cached) {
    console.log('[Auth] Offline — using cached user:', cached.userDetails);
    localStorage.setItem('adh_auth_token', 'valid_user_session');
    localStorage.setItem('adh_user_id', cached.userId);
    return cached;
  }

  // No cache and can't reach auth — show a friendly wall
  localStorage.removeItem('adh_auth_token');
  localStorage.removeItem('adh_user_id');
  document.body.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100vh;gap:16px;font-family:sans-serif;color:#475569;background:#f1f5f9">
      <div style="font-size:48px">🔒</div>
      <div style="font-size:18px;font-weight:600;color:#0f172a">Sign in required</div>
      <div style="font-size:13px;max-width:320px;text-align:center;line-height:1.6">
        You need to be online to sign in for the first time.<br>
        Once signed in, the app works offline.
      </div>
      <button onclick="window.location.href='/.auth/login/aad'"
        style="background:#2563eb;color:#fff;border:none;border-radius:10px;
        padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer">
        Sign in with Microsoft
      </button>
    </div>`;
  return null;
}

// When the app starts up (even in airplane mode):
function verifyLoginTokenLocally() {
  const token = localStorage.getItem('adh_auth_token');
  return token !== null; // Instantly returns true without needing the internet
}

/** Cosmos index document ID scoped to the current user */
function _userIndexId() {
  return _currentUser ? `adh-index-${_currentUser.userId}` : 'adh-index-v1';
}

/** Display-friendly name from the Entra principal */
function _userName() {
  if (!_currentUser) return '';
  const email = _currentUser.userDetails || '';
  return email.includes('@') ? email.split('@')[0] : email;
}

// ══════════════════════════════════════════════════════════════════════════════
// SYNC ENGINE v5 — Per-Project Document Architecture
// ══════════════════════════════════════════════════════════════════════════════
//
// HOW TO INSTALL:
//   In index.html, find the block that starts with:
//     "// ══════ SYNC ENGINE v4 — Item-level patching"
//   and ends just before:
//     "// ══════════════════════════════════════════"
//     "// 6-WEEK LOOK AHEAD SCHEDULE"
//   Replace that entire block with this file's contents.
//
// ARCHITECTURE:
//   CLOUD:  adh-index-v1      → folders, contacts, settings, projectIds[]
//           adh-proj-{id}     → one independent document per project
//   LOCAL:  store (unchanged shape in IndexedDB)
//
// DIRTY TRACKING:
//   _dirtyIndex      : boolean  — folders / contacts / settings changed
//   _dirtyProjectIds : Set<id>  — which projects need pushing
//   Both are persisted in IDB across page reloads via "adh_dirty_v1"
//
// PUSH:
//   Auto every 30s (if dirty) + immediately on markDirtyAndSave()
//   Manual via 🔄 button → full push of all dirty items
//
// POLL (every 15s):
//   Check index _ts  → if changed, merge and re-render
//   Check current open project _ts → if changed, merge and re-render
//   Check for new projectIds in index → fetch and add locally
//
// STARTUP:
//   Load IDB → fetch index → fetch all projects in parallel (4s timeout)
// ══════════════════════════════════════════════════════════════════════════════

// ── Dirty tracking ────────────────────────────────────────────────────────────
let _dirtyIndex = false;
const _dirtyProjectIds = new Set();

// IDB key for persisting dirty state across reloads
const DIRTY_IDB_KEY = 'adh_dirty_v1';

async function _loadDirtyState() {
  try {
    const saved = await _idbGet(DIRTY_IDB_KEY);
    if (saved) {
      if (saved.index)      _dirtyIndex = true;
      if (saved.projects)   saved.projects.forEach(id => _dirtyProjectIds.add(id));
    }
  } catch(e) {}
}

async function _persistDirtyState() {
  try {
    await _idbSet(DIRTY_IDB_KEY, {
      index:    _dirtyIndex,
      projects: [..._dirtyProjectIds]
    });
  } catch(e) {}
}

async function _clearDirtyState() {
  _dirtyIndex = false;
  _dirtyProjectIds.clear();
  try { await _idbSet(DIRTY_IDB_KEY, { index: false, projects: [] }); } catch(e) {}
}

// ── Cloud timestamp cache ─────────────────────────────────────────────────────
// Tracks the last _ts we received from Cosmos for each document.
// Used to avoid re-fetching unchanged documents during poll.
const TS_IDB_KEY = 'adh_ts_v5';
let _cloudTs = { index: 0, projects: {} };

async function _loadCloudTs() {
  try {
    const saved = await _idbGet(TS_IDB_KEY);
    if (saved) _cloudTs = saved;
  } catch(e) {}
}

async function _saveCloudTs() {
  try { await _idbSet(TS_IDB_KEY, _cloudTs); } catch(e) {}
}

// ── Mark dirty helpers ────────────────────────────────────────────────────────

/** Call when any SI item field changes. */
function markAsDirty(itemId) {
  const proj = store.projects.find(p => p.items && p.items.some(i => i.id === itemId));
  if (proj) {
    _dirtyProjectIds.add(proj.id);
    const item = proj.items.find(i => i.id === itemId);
    if (item) {
      item._dirty        = true;
      item._lastModified = new Date().toISOString();
    }
  }
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/** Call when project structure changes (new/deleted SI, section changes, project meta). */
function markProjectDirty(projectId) {
  _dirtyProjectIds.add(projectId);
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/** Call when folders, contacts, or settings change. */
function markStoreDirty() {
  _dirtyIndex = true;
  store.lastUpdated = Date.now();
  save();
  _persistDirtyState();
}

/**
 * Central save helper for SI field changes.
 * Stamps each changed field with a per-field timestamp for conflict resolution.
 */
function markDirtyAndSave(si, changes) {
  Object.assign(si, changes);
  const now = Date.now();
  si._fieldTs = si._fieldTs || {};
  Object.keys(changes).forEach(k => { si._fieldTs[k] = now; });
  markAsDirty(si.id);
  scheduleDirtySync();
}

// ── Debounced auto-sync ───────────────────────────────────────────────────────
let _syncTimer = null;
function scheduleDirtySync(delayMs = 2000) {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => syncChanges(true), delayMs);
}

// ── Local save (IndexedDB) ────────────────────────────────────────────────────
let _saveTimer = null;
function save() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    _idbSet('fap_v3', store).catch(err => {
      console.error('[ADH] IndexedDB save failed:', err);
      showToast('⚠️ Error saving data locally');
    });
    _idbSet('section_rules', SECTION_RULES).catch(() => {});
  }, 80);
}

// ── Payload builders ──────────────────────────────────────────────────────────

/** Strip binary data before sending a project to Cosmos. */
function _buildProjectPayload(proj) {
  const cleanFloorPlan = proj.floorPlan
    ? Object.assign({}, proj.floorPlan, { imageData: null })
    : undefined;

  const out = Object.assign({}, proj, {
    coverPhoto: null,  // stays in IndexedDB only
    items: (proj.items || []).map(item => {
      const cloudPhotos = (item.photos || [])
        .filter(p => p.url)
        .map(p => ({ url: p.url, caption: p.caption || '', takenAt: p.takenAt || '' }));
      const cloudAttachments = (item.attachments || [])
        .map(a => ({ id: a.id, name: a.name, type: a.type, ext: a.ext,
                     icon: a.icon, size: a.size, addedAt: a.addedAt, addedBy: a.addedBy }));
      return Object.assign({}, item, { photos: cloudPhotos, attachments: cloudAttachments });
    })
  });
  if (cleanFloorPlan !== undefined) out.floorPlan = cleanFloorPlan;
  return out;
}

/** Build the index payload. */
function _buildIndexPayload() {
  const userId = _currentUser?.userId || '';
  return {
    userId,
    folders:    store.folders,
    contacts:   store.contacts,
    settings:   store.settings,
    // Only register projects owned by this user in their index
    projectIds: store.projects
      .filter(p => !p._deleted && (!p.ownedBy || p.ownedBy === userId))
      .map(p => p.id),
    _savedAt:   Date.now()
  };
}

// ── API wrappers ──────────────────────────────────────────────────────────────

async function _apiGetIndex() {
  const userId = _currentUser?.userId || '';
  const res = await fetch(`/api/getIndex?userId=${encodeURIComponent(userId)}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`getIndex HTTP ${res.status}`);
  return res.json();
}

async function _apiSaveIndex(payload) {
  const res = await fetch('/api/saveIndex', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload)  // payload already includes userId from _buildIndexPayload
  });
  if (!res.ok) throw new Error(`saveIndex HTTP ${res.status}`);
  return res.json();
}

async function _apiGetProject(pid) {
  const res = await fetch(`/api/getProject?id=${encodeURIComponent(pid)}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`getProject HTTP ${res.status} (${pid})`);
  return res.json();
}

async function _apiSaveProject(proj) {
  const userId = _currentUser?.userId || '';
  const res = await fetch('/api/saveProject', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ project: { ...proj, ownedBy: proj.ownedBy || userId } })
  });
  if (!res.ok) throw new Error(`saveProject HTTP ${res.status} (${proj.id})`);
  return res.json();
}

// ── Merge helpers ─────────────────────────────────────────────────────────────

/**
 * Merge index fields from cloud into local store.
 * Called on startup and during poll when index _ts changes.
 */
function _mergeIndexIntoLocal(cloudIndex) {
  // Folders: union by ID, incoming wins on conflict
  if (cloudIndex.folders) {
    const localById = new Map((store.folders || []).map(f => [f.id, f]));
    const cloudById = new Map((cloudIndex.folders || []).map(f => [f.id, f]));
    // Keep local-only folders (created offline), accept all cloud folders
    cloudById.forEach((f, id) => localById.set(id, f));
    store.folders = [...localById.values()];
  }

  // Contacts: merge by ID with tombstone respect
  if (cloudIndex.contacts) {
    const localById = new Map((store.contacts || []).map(c => [c.id, c]));
    const cloudById = new Map((cloudIndex.contacts || []).map(c => [c.id, c]));

    // Start from cloud, then overlay local tombstones / unsaved additions
    const mergedIds = new Set([...localById.keys(), ...cloudById.keys()]);
    store.contacts = [...mergedIds].map(id => {
      const local = localById.get(id);
      const cloud = cloudById.get(id);
      if (!cloud) return local; // local-only (created offline)
      if (!local) return cloud; // cloud-only (added by another device)
      // Both exist — tombstone wins, else cloud wins (newer server version)
      if (local._deleted) return local;  // preserve our tombstone
      if (cloud._deleted) return cloud;  // accept cloud tombstone
      return cloud; // cloud has the latest confirmed version
    });
  }

  // Settings: cloud wins if we don't have unsaved local changes
  if (cloudIndex.settings && !_dirtyIndex) {
    store.settings = cloudIndex.settings;
  }
}

/**
 * Derive the local project ID from a cloud project document.
 * Cloud docs store id as "adh-proj-{pid}", and preserve original in projectId field.
 */
function _localPidFrom(cloudProj) {
  return cloudProj.projectId || cloudProj.id.replace(/^adh-proj-/, '');
}

/**
 * Merge a single cloud project document into the local store.
 * - Preserves local photos (never uploaded to Cosmos).
 * - Skips items flagged _dirty (user has unsaved changes).
 * - Adds project if it doesn't exist locally yet.
 */
function _mergeProjectIntoLocal(cloudProj) {
  const localPid = _localPidFrom(cloudProj);

  // Snapshot local photos before merge
  const localPhotos = {};
  const localProj = store.projects.find(p => p.id === localPid);

  if (localProj) {
    if (localProj.coverPhoto) localPhotos['_cover'] = localProj.coverPhoto;
    (localProj.items || []).forEach(i => {
      if (i.photos && i.photos.length) localPhotos[i.id] = i.photos;
    });
  }

  function restorePhotos(item) {
    const out = Object.assign({}, item);
    const local = localPhotos[item.id] || [];
    // Cloud only has URL photos; local may also have base64 (not yet uploaded)
    const cloudUrls   = (item.photos || []).filter(p => p.url);
    const localUrlSet = new Set(local.map(p => p.url).filter(Boolean));
    const freshCloud  = cloudUrls.filter(p => !localUrlSet.has(p.url));
    out.photos = [...local, ...freshCloud];
    return out;
  }

  if (!localProj) {
    // New project from another device — add it
    const newProj = Object.assign({}, cloudProj, {
      id:        localPid,
      items:     (cloudProj.items || []).map(restorePhotos)
    });
    delete newProj.projectId; // only needed for Cosmos key lookup
    store.projects.push(newProj);
    return;
  }

  // Merge items: skip _dirty local items, merge the rest field-by-field
  const localItemMap = new Map((localProj.items || []).map(i => [i.id, i]));
  (cloudProj.items || []).forEach(ci => {
    const li = localItemMap.get(ci.id);
    if (!li) {
      // New item from another device
      localItemMap.set(ci.id, restorePhotos(ci));
    } else if (!li._dirty) {
      // Safe to merge — no unsaved local changes
      const merged = Object.assign({}, li, ci);
      merged.photos = restorePhotos(ci).photos;
      localItemMap.set(ci.id, merged);
    }
    // else: li._dirty → skip, preserve local version
  });

  // Merge project-level fields (cloud wins for confirmed data)
  const mergedProj = Object.assign({}, localProj, cloudProj, {
    id:        localPid,  // always keep local ID format
    items:     [...localItemMap.values()]
  });
  // Restore cover photo (never in Cosmos)
  if (localPhotos['_cover']) mergedProj.coverPhoto = localPhotos['_cover'];
  // Restore floor plan image data (never in Cosmos)
  if (localProj.floorPlan && localProj.floorPlan.imageData && mergedProj.floorPlan) {
    mergedProj.floorPlan.imageData = localProj.floorPlan.imageData;
  }
  delete mergedProj.projectId; // cleanup

  const idx = store.projects.findIndex(p => p.id === localPid);
  if (idx >= 0) store.projects[idx] = mergedProj;
}

// ── Main sync function ────────────────────────────────────────────────────────

async function _flushPendingPhotos(proj) {
  for (const item of proj.items || []) {
    for (const p of item.photos || []) {
      
      // Check if the URL is completely missing, OR if it is a temporary local string
      const isTemporaryUrl = p.url && (p.url.startsWith('data:') || p.url.startsWith('blob:'));

      // If it doesn't have a permanent Azure URL, upload it!
      if ((!p.url || isTemporaryUrl) && p.data) {
        try {
          const newUrl = await _uploadPhotoToAzureBlob(p.data, proj.id, item.id);
          if (newUrl) {
             p.url = newUrl; // Overwrite the temporary string with the real Azure link
          }
        } catch(uploadErr) {
          console.warn('[Sync] Pending photo upload failed:', uploadErr.message);
        }
      }
    }
  }
}

/**
 * Push dirty local data to the cloud.
 *
 * isAuto=true  : only pushes dirty items, silent on success
 * isAuto=false : pushes everything (full baseline), shows toast
 */
async function syncChanges(isAuto = false) {
  if (!navigator.onLine) {
    if (!isAuto) showToast('Offline — changes saved locally');
    return;
  }

  // ── Context-aware manual sync ─────────────────────────────────────────────
  if (!isAuto) {
    const r = route();
    const inProject = r.projectId &&
      ['project','si','schedule','env','manpower','activity','floorplan','tblog'].includes(r.view);
    if (inProject) {
      return _syncSingleProject(r.projectId);
    } else {
      return _pullAll();
    }
  }

  // ── Auto sync: push dirty OWNED items only ────────────────────────────────
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }

  try {
    const nothingDirty = !_dirtyIndex && _dirtyProjectIds.size === 0;
    if (nothingDirty) return;

    if (_dirtyIndex) {
      try {
        const result = await _apiSaveIndex(_buildIndexPayload());
        if (result.ok) {
          _dirtyIndex = false;
          if (result._ts) _cloudTs.index = result._ts;
        }
      } catch(err) { console.warn('[Sync] Index push failed:', err.message); }
    }

    const userId = _currentUser?.userId || '';
    const projectsToPush = [..._dirtyProjectIds]
      .map(pid => store.projects.find(p => p.id === pid))
      .filter(Boolean)
      .filter(p => !p.ownedBy || p.ownedBy === userId); // NEVER push foreign projects

    for (const proj of projectsToPush) {
      try {
        await _flushPendingPhotos(proj);
        const result = await _apiSaveProject(_buildProjectPayload(proj));
        if (result.ok) {
          _dirtyProjectIds.delete(proj.id);
          if (result._ts) _cloudTs.projects[proj.id] = result._ts;
          (proj.items || []).forEach(i => { i._dirty = false; });
        }
      } catch(err) { console.warn(`[Sync] Project ${proj.id} failed:`, err.message); }
    }

    await _saveCloudTs();
    await _persistDirtyState();
    await _idbSet('fap_v3', store);

  } catch(err) {
    console.error('[Sync Error]', err);
  } finally {
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  }
}

/**
 * Push+pull a single project. Called when the user hits 🔄 inside a project.
 * Push: upload any dirty local changes (only if we own the project).
 * Pull: download the latest cloud version and merge.
 */
async function _syncSingleProject(pid) {
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }

  let anyError = false;
  const proj   = store.projects.find(p => p.id === pid);
  const userId = _currentUser?.userId || '';

  if (!proj) {
    showToast('Project not found', 'red');
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
    return;
  }

  const isOwned = !proj.ownedBy || proj.ownedBy === userId;

  // ── Push (only if we own it and it's dirty) ────────────────────────────
  if (isOwned && _dirtyProjectIds.has(pid)) {
    try {
      await _flushPendingPhotos(proj);
      const result = await _apiSaveProject(_buildProjectPayload(proj));
      if (result.ok) {
        _dirtyProjectIds.delete(pid);
        if (result._ts) _cloudTs.projects[pid] = result._ts;
        (proj.items || []).forEach(i => { i._dirty = false; });
        await _persistDirtyState();
      } else { anyError = true; }
    } catch(err) {
      anyError = true;
      console.warn('[SyncProject] Push failed:', err.message);
    }
  }

  // ── Pull latest ────────────────────────────────────────────────────────
  try {
    const cp = await _apiGetProject(pid);
    if (cp) {
      const remoteTs = cp._ts || 0;
      const localTs  = _cloudTs.projects[pid] || 0;
      if (remoteTs > localTs) {
        _mergeProjectIntoLocal(cp);
        _cloudTs.projects[pid] = remoteTs;
        await _idbSet('fap_v3', store);
        await _saveCloudTs();
        render();
      }
    }
  } catch(err) {
    anyError = true;
    console.warn('[SyncProject] Pull failed:', err.message);
  }

  if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  showToast(
    anyError ? '⚠️ Sync had errors' : (isOwned ? '✓ Project synced' : '✓ Project refreshed'),
    anyError ? '' : 'green'
  );
}

/**
 * Pull everything from the cloud for this user.
 * Called when the user hits 🔄 from the home/root view.
 * Only fetches projects that belong to this user's index.
 */
async function _pullAll() {
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) { syncBtn.style.opacity = '0.5'; syncBtn.classList.add('spinning'); }
  showToast('⬇ Pulling your latest data…');

  try {
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));

    // Also push any dirty index/project data before pulling
    if (_dirtyIndex) {
      try {
        await _apiSaveIndex(_buildIndexPayload());
        _dirtyIndex = false;
      } catch(e) { console.warn('[PullAll] Index push failed:', e.message); }
    }

    const cloudIndex = await Promise.race([_apiGetIndex(), timeout(8000)]);
    if (cloudIndex) {
      _mergeIndexIntoLocal(cloudIndex);
      _cloudTs.index = cloudIndex._ts || 0;

      const projectIds = cloudIndex.projectIds || [];
      const fetches = projectIds.map(pid =>
        Promise.race([_apiGetProject(pid), timeout(6000)]).catch(() => null)
      );
      const cloudProjects = await Promise.all(fetches);

      let fetched = 0;
      cloudProjects.forEach((cp, i) => {
        if (!cp) return;
        _mergeProjectIntoLocal(cp);
        _cloudTs.projects[projectIds[i]] = cp._ts || 0;
        fetched++;
      });

      await _idbSet('fap_v3', store);
      await _saveCloudTs();
      render();
      showToast(`✓ ${fetched} project${fetched !== 1 ? 's' : ''} up to date`, 'green');
    } else {
      showToast('Nothing new from cloud', '');
    }
  } catch(err) {
    console.error('[PullAll]', err);
    showToast('Pull failed — check connection', 'red');
  } finally {
    if (syncBtn) { syncBtn.style.opacity = '1'; syncBtn.classList.remove('spinning'); }
  }
}

// ── Poll for remote changes ───────────────────────────────────────────────────

let _pollIntervalId  = null;
const POLL_MS        = 15000;

async function _pollForRemoteChanges() {
  if (!navigator.onLine) return;

  try {
    // ── 1. Check index ──────────────────────────────────────────────────────
    const cloudIndex = await _apiGetIndex();
    if (cloudIndex && (cloudIndex._ts || 0) > _cloudTs.index) {
      _mergeIndexIntoLocal(cloudIndex);
      _cloudTs.index = cloudIndex._ts;
      console.log('[Poll] Index updated from cloud');

      // ── 2. Check for project IDs that we don't have locally ──────────────
      const localIds = new Set(store.projects.map(p => p.id));
      const newIds   = (cloudIndex.projectIds || []).filter(id => !localIds.has(id));
      for (const newId of newIds) {
        try {
          const cp = await _apiGetProject(newId);
          if (cp) {
            _mergeProjectIntoLocal(cp);
            _cloudTs.projects[newId] = cp._ts || 0;
            console.log(`[Poll] New project ${newId} pulled from cloud`);
          }
        } catch(e) { console.warn(`[Poll] Could not fetch new project ${newId}:`, e.message); }
      }

      if (newIds.length > 0) {
        await _idbSet('fap_v3', store);
        render();
        showToast('🔄 New project available', 'green');
      }
    }

    // ── 3. Check currently open project ────────────────────────────────────
    const r = route();
    if (r.projectId) {
      const lastTs = _cloudTs.projects[r.projectId] || 0;
      try {
        const cp = await _apiGetProject(r.projectId);
        if (cp && (cp._ts || 0) > lastTs) {
          _mergeProjectIntoLocal(cp);
          _cloudTs.projects[r.projectId] = cp._ts;
          await _idbSet('fap_v3', store);
          render();
          showToast('🔄 Updated from cloud', 'green');
          console.log(`[Poll] Project ${r.projectId} updated from cloud`);
        }
      } catch(e) { console.warn(`[Poll] Project ${r.projectId} check failed:`, e.message); }
    }

    await _saveCloudTs();

  } catch(e) {
    console.warn('[Poll] Error:', e.message);
  }
}

function _startPolling() {
  if (_pollIntervalId) return;
  _pollIntervalId = setInterval(_pollForRemoteChanges, POLL_MS);
}

function _stopPolling() {
  clearInterval(_pollIntervalId);
  _pollIntervalId = null;
}

// ── Migrate from localStorage (one-time, legacy) ──────────────────────────────
async function _migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem('fap_v3');
    if (!raw) return null;
    const data = JSON.parse(raw);
    await _idbSet('fap_v3', data);
    localStorage.removeItem('fap_v3');
    console.log('[ADH] Migrated data from localStorage → IndexedDB');
    return data;
  } catch(e) { return null; }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function _initStore() {
  try {
    // ── 1. Load local data instantly (works offline) ───────────────────────
    let data = await _migrateFromLocalStorage();
    if (!data) data = await _idbGet('fap_v3');
    if (data) store = data;
  } catch(e) {
    console.warn('[ADH] Storage load error, using seed:', e);
    store = JSON.parse(JSON.stringify(SEED));
  }

  // ── Ensure required fields on migrated/old data ──────────────────────────
  if (!store.settings) store.settings = { isAdmin: false, theme: 'light' };
  if (store.settings.theme === undefined || store.settings.theme === 'default') store.settings.theme = 'light';
  if (!store.settings.displayName) store.settings.displayName = '';
  if (!store.folders)  store.folders  = [];
  if (!store.projects) store.projects = [];
  if (!store.contacts) store.contacts = [];
  if (!store.pendingSync) store.pendingSync = [];
  store.folders.forEach(f => { if (f.parentId === undefined) f.parentId = null; });
  store.contacts.forEach(c => { if (!c.project) c.project = 'Office'; });

  // Refresh branded SVG folder icons to use current CSS vars
  ['fld_ast','fld_ami','fld_acd','fld_acs','fld_adh','fld_acm'].forEach(id => {
    const f     = store.folders.find(folder => folder.id === id);
    const seedF = SEED.folders.find(sf => sf.id === id);
    if (f && seedF) f.icon = seedF.icon;
  });

  // One-time: add ACM folder if missing
  if (!store.folders.find(f => f.id === 'fld_acm')) {
    const seedAcm = SEED.folders.find(f => f.id === 'fld_acm');
    if (seedAcm) store.folders.push(JSON.parse(JSON.stringify(seedAcm)));
  }

  // Ensure new per-project fields
  store.projects.forEach(p => {
    if (!p.laborSettings) p.laborSettings = { show: false, workers: 4, hoursPerDay: 8, workDays: 5 };
    (p.items || []).forEach(i => {
      if (!i.towerWork) i.towerWork = { enabled: false, rooms: [] };
    });
  });
  _migrateManpower(store);

  // UI state init
  window.contactCategoryFilter = 'All';
  window.contactProjectFilter  = 'All';
  window.importMenuOpen        = false;
  window.exportMenuOpen        = false;
  window.selectedContacts      = new Set();

  isAdmin = store.settings.isAdmin;
  applyTheme(store.settings.theme);

  // Load section_rules (migrate from localStorage if present)
  try {
    const srLS = localStorage.getItem('section_rules');
    if (srLS) {
      const parsed = JSON.parse(srLS);
      await _idbSet('section_rules', parsed);
      localStorage.removeItem('section_rules');
      SECTION_RULES = parsed;
    } else {
      const srIDB = await _idbGet('section_rules');
      if (srIDB) SECTION_RULES = srIDB;
    }
  } catch(e) { /* keep default */ }

  // Instantly draw the UI using whatever is in the local IndexedDB
  render();

  // ── 2. NOW check the auth token in the background ─────────────────────────
  _currentUser = await _getAuthUser();
  if (!_currentUser) return; // redirect in progress or no cache offline

  // Set display name from Entra email (email prefix = first part before @)
  if (!store.settings.displayName && _currentUser.userDetails) {
    store.settings.displayName = _userName();
  }

  // Restore dirty state and timestamp cache from IDB
  await _loadDirtyState();
  await _loadCloudTs();

  // ── 3. Merge from cloud if online ─────────────────────────────────────────
  if (navigator.onLine) {
    try {
      const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));

      // Fetch index (fast, small doc)
      const cloudIndex = await Promise.race([_apiGetIndex(), timeout(4000)]);

      if (cloudIndex) {
        _mergeIndexIntoLocal(cloudIndex);
        _cloudTs.index = cloudIndex._ts || 0;

        // Fetch all projects in parallel (4s timeout each)
        const projectIds = cloudIndex.projectIds || [];
        const fetches = projectIds.map(pid =>
          Promise.race([_apiGetProject(pid), timeout(4000)]).catch(() => null)
        );
        const cloudProjects = await Promise.all(fetches);

        let fetched = 0;
        cloudProjects.forEach((cp, i) => {
          if (!cp) return;
          _mergeProjectIntoLocal(cp);
          _cloudTs.projects[projectIds[i]] = cp._ts || 0;
          fetched++;
        });

        await _idbSet('fap_v3', store);
        await _saveCloudTs();
        console.log(`[ADH] Loaded ${fetched}/${projectIds.length} projects from cloud`);
        
        // Re-render after cloud data comes in
        render();
      }
    } catch(e) {
      console.warn('[ADH] Cloud load on startup skipped:', e.message);
    }
  }

  // ── Start polling and auto-sync ────────────────────────────────────────────
  _startPolling();

  // Auto-sync every 30s if we have dirty data
  setInterval(() => {
    if (navigator.onLine && (_dirtyIndex || _dirtyProjectIds.size > 0)) {
      syncChanges(true);
    }
  }, 30000);

  // ── Online / offline handlers ──────────────────────────────────────────────
  function updateOnlineStatus() {
    document.body.classList.toggle('is-offline', !navigator.onLine);
    if (navigator.onLine) {
      _startPolling();
      _pollForRemoteChanges();
      // Flush any dirty data that accumulated while offline
      if (_dirtyIndex || _dirtyProjectIds.size > 0) syncChanges(true);
    } else {
      _stopPolling();
    }
  }
  window.addEventListener('online',  updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // ── Visibility change: pause poll when tab hidden ──────────────────────────
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      _stopPolling();
    } else {
      _startPolling();
      _pollForRemoteChanges();
    }
  });
}

async function saveAuditToDatabase(data) {
  // Legacy shim — routes to new per-project API
  const proj = data.projects && data.projects[0];
  if (!proj) return false;
  try {
    const result = await _apiSaveProject(_buildProjectPayload(proj));
    return result.ok;
  } catch(e) { return false; }
}

async function loadFromDatabase() {
  // Legacy shim — returns index (used by old code that checks _ts)
  try { return await _apiGetIndex(); } catch(e) { return null; }
}

async function patchAuditToDatabase(patch) {
  // Legacy shim — if called with itemsById or projectsById, route correctly
  if (patch.projectsById) {
    let ok = true;
    for (const [pid, proj] of Object.entries(patch.projectsById)) {
      try {
        const result = await _apiSaveProject(_buildProjectPayload(proj));
        if (!result.ok) ok = false;
      } catch(e) { ok = false; }
    }
    return { ok };
  }
  // itemsById or full store — push the affected projects
  if (patch.itemsById) {
    const affectedPids = new Set(
      Object.values(patch.itemsById).map(v => v.projectId).filter(Boolean)
    );
    let ok = true;
    for (const pid of affectedPids) {
      const proj = store.projects.find(p => p.id === pid);
      if (!proj) continue;
      try {
        const result = await _apiSaveProject(_buildProjectPayload(proj));
        if (!result.ok) ok = false;
      } catch(e) { ok = false; }
    }
    return { ok };
  }
  // Full store fallback
  try {
    const ir = await _apiSaveIndex(_buildIndexPayload());
    if (!ir.ok) return { ok: false };
    for (const proj of store.projects.filter(p => !p._deleted)) {
      await _apiSaveProject(_buildProjectPayload(proj));
    }
    return { ok: true };
  } catch(e) { return { ok: false, error: e.message }; }
}

// Helper function to parse mixed photo formats from IndexedDB
function getPhotoSrcForDisplay(p) {
  if (p.url) return p.url; // Remote Azure Blob URL
  
  // 1. Is it the new Blob format?
  if (p.data instanceof Blob) {
    // Convert the raw binary blob into a temporary local URL for the <img> tag
    // Cached internally as _blobUrl to prevent memory leaks during frequent UI re-renders
    if (!p._blobUrl) p._blobUrl = URL.createObjectURL(p.data);
    return p._blobUrl;
  }
  
  // 2. Is it the legacy Base64 string?
  if (typeof p.data === 'string' && p.data.startsWith('data:image')) {
    return p.data;
  }
  
  return p.data || null; // Fallback for corrupted data
}

// NAV STACK  { view, folderId, projectId, siId }
// ══════════════════════════════════════════
let stack = [];
const route = () => stack[stack.length-1] || {view:'root'};

function push(r) { stack.push(r); render(); }
function goBack() {
  if (!stack.length) return;
  // auto-save if leaving SI editor
  const cur = route();
  if (cur.view==='si') _doSave(cur.projectId, cur.siId, false);
  stack.pop();
  render();
}

function navToRoot() {
  // Flush editor fields before jumping home (same as goBack)
  const cur = route();
  if (cur.view === 'si') _doSave(cur.projectId, cur.siId, false);
  stack = [];
  render();
}
function navToFolder(fid)         { stack=[{view:'folder',folderId:fid}]; render(); }
function navToProject(pid,fid)    {
  // Keep folder in stack if provided
  stack = fid ? [{view:'folder',folderId:fid}] : [];
  stack.push({view:'project',folderId:fid||'',projectId:pid});
  render();
}
function navToSI(pid,sid) {
  const cur = route();
  // auto-save previous SI
  if (cur.view==='si'&&cur.siId!==sid) _doSave(cur.projectId,cur.siId,false);
  if (cur.view==='si') stack.pop();
  stack.push({view:'si',folderId:cur.folderId||'',projectId:pid,siId:sid});
  render();
}
function navToContacts() {
  stack = [{view:'contacts'}];
  render();
}

function navToToolbox() {
  stack = [{view:'toolbox'}];
  render();
}

function navToAWI() {
  stack = [{view:'awi'}];
  render();
}

function navToResources() {
  stack = [{view:'resources'}];
  render();
}

// Per-project Toolbox Talk log (mirrors navToActivity)
function navToTbLog(pid){
  const cur=route();
  stack=stack.filter(r=>r.view!=='activity'&&r.view!=='si'&&r.view!=='env'&&r.view!=='schedule'&&r.view!=='manpower'&&r.view!=='tblog');
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  stack.push({view:'tblog',folderId:cur.folderId||'',projectId:pid});
  render();
}

  setTimeout(() => {

  }, 0);
}

function renderLeft(r) {

  if (document.documentElement.classList.contains('is-phone')) {
    return;
  }

  const title = document.getElementById('left-panel-title');
  const scroll = document.getElementById('list-scroll');
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();

  if (r.view === 'contacts') {
    title.textContent = 'CONTACTS';
    const list = store.contacts.filter(c => {
      if (c._deleted) return false;
      const name = (c.name || '').toLowerCase();
      const comp = (c.company || '').toLowerCase();
      const role = (c.role || '').toLowerCase();
      return !q || name.includes(q) || comp.includes(q) || role.includes(q);
    }).sort((a,b) => a.name.localeCompare(b.name));
    scroll.innerHTML = list.map(c => `
      <div class="si-row" onclick="buildContactBookView('${c.id}')">
        <div class="si-thumb" style="font-size:16px">👤</div>
        <div class="si-info">

          <div class="si-title">${c.name}</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>`).join('') || emptyMsg('No contacts found');
    return;
  }

  if (r.view === 'toolbox') {
    title.textContent = 'TOOLBOX TALK';
    scroll.innerHTML = emptyMsg('Content coming soon');
    return;
  }

  if (r.view === 'awi') {
    title.textContent = 'AWI STANDARDS';
    scroll.innerHTML = emptyMsg('Content coming soon');
    return;
  }

  if (r.view === 'resources') {
    title.textContent = 'RESOURCES';
    scroll.innerHTML = emptyMsg('Field forms, QC & safety docs');
    return;
  }

  if (r.view === 'tblog') {
    title.textContent = 'TOOLBOX LOG';

    return;
  }

  // (folderId='') directly to a project still shows the SI list, not folders.

    let html='';
    proj.sections.forEach(sec=>{

      html+=`<div class="section-group">${sec.name}<span class="section-count">${items.length}</span></div>`;
      items.forEach(item=>{
        const thumb=item.photos.length?`<img src="${getPhotoSrcForDisplay(item.photos[0])}" loading="lazy" />`:`<span>📷</span>`;
        const tw = item.towerWork;
        const twEnabled = tw && tw.enabled && tw.rooms && tw.rooms.length > 0;
        const twDone = twEnabled ? tw.rooms.filter(r=>r.status==='completed').length : 0;
        const twTotal = twEnabled ? tw.rooms.length : 0;
        const twAllDone = twEnabled && twDone === twTotal;
        html+=`<div class="si-row ${r.siId===item.id?'active':''}"
          data-sid="${item.id}" data-pid="${proj.id}" data-secid="${item.sectionId}"
          draggable="true"
          onclick="navToSI('${proj.id}','${item.id}')">
          <div class="si-drag-handle" title="Drag to reorder">⠿</div>

          <div class="si-info">
            <div class="si-num">

              ${twEnabled ? `<span class="tw-badge ${twAllDone?'done':''}" style="margin-left:4px">🏢 ${twDone}/${twTotal}</span>` : ''}
            </div>
            <div class="si-title">${item.title}</div>

          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div class="si-status ${item.status}"></div>
          </div>
        </div>`;
      });
    });
    scroll.innerHTML = html || emptyMsg('No items');
    return;
  }

  if (!r.folderId) {
    title.textContent='FOLDERS';
    const list = store.folders.filter(f => f.parentId === null && (!q || f.name.toLowerCase().includes(q)));
    scroll.innerHTML = list.map(f=>`
      <div class="folder-row ${r.folderId===f.id?'active':''}" onclick="navToFolder('${f.id}')">
        <div class="folder-icon-wrap">${f.icon}</div>
        <div class="folder-info">
          <div class="folder-name">${f.name}</div>
          <div class="folder-meta">${f.projects.length} project${f.projects.length!==1?'s':''} · ${store.folders.filter(sub => sub.parentId === f.id).length} subfolders</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>`).join('') || emptyMsg('No folders');
    return;
  }
  if (r.folderId && !r.projectId) {
    const folder = getFolder(r.folderId);
    const isMain = MAIN_FOLDERS.includes(folder?.name);

    if (isMain) {
      title.textContent = 'SUBFOLDERS';
      const subs = store.folders.filter(f => f.parentId === r.folderId && (!q || f.name.toLowerCase().includes(q)));
      scroll.innerHTML = subs.map(f => `
        <div class="folder-row" onclick="navToFolder('${f.id}')">
          <div class="folder-icon-wrap">${f.icon}</div>
          <div class="folder-info">
            <div class="folder-name">${f.name}</div>
            <div class="folder-meta">${f.projects.length} proj · ${store.folders.filter(sub => sub.parentId === f.id).length} sub</div>
          </div>
          <div class="folder-arrow">›</div>
        </div>`).join('') || emptyMsg('No subfolders');
    } else {
      title.textContent = 'PROJECTS';
      const projs = (folder.projects || []).map(id => getProject(id)).filter(p => p && !p._deleted && (!q || p.name.toLowerCase().includes(q)));
      scroll.innerHTML = projs.map(p => {
        const ready = p.items.filter(i => i.status === 'completed').length;
        return `<div class="si-row ${r.projectId === p.id ? 'active' : ''}" onclick="navToProject('${p.id}','${r.folderId}')">
          <div class="si-thumb" style="font-size:16px">🏗</div>
          <div class="si-info">
            <div class="si-num">${p.date} · ${p.client}</div>
            <div class="si-title">${p.name}</div>
          </div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;flex-shrink:0">${ready}/${p.items.length}<br>ready</div>
        </div>`;
      }).join('') || emptyMsg('No projects');
    }
    return;
  }
}

function emptyMsg(t) { return `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">${t}</div>`; }

// ══════════════════════════════════════════
// SI DRAG-TO-REORDER ENGINE
// Works on both touch (iOS/Android) and mouse (desktop)
// ══════════════════════════════════════════

let _drag = {
  el: null,
  pid: null,
  secId: null,
  sid: null,
  startY: 0,
  currentOver: null,
  ghost: null,
  scrollEl: null,
  scrollTimer: null,
};

function _siDragInit() {
  const scroll = document.getElementById('list-scroll');
  if (!scroll) return;
  if (scroll._dragBound) return;
  scroll._dragBound = true;

  // ── Mouse drag ──────────────────────────
  scroll.addEventListener('dragstart', e => {
    const row = e.target.closest('.si-row[draggable]');
    if (!row) return;
    const handle = e.target.closest('.si-drag-handle');
    if (!handle) { e.preventDefault(); return; }
    _drag.el    = row;
    _drag.pid   = row.dataset.pid;
    _drag.secId = row.dataset.secid;
    _drag.sid   = row.dataset.sid;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _drag.sid);
    setTimeout(() => row.classList.add('dragging'), 0);
  });

  scroll.addEventListener('dragend', e => {
    const row = e.target.closest('.si-row[draggable]');
    if (row) row.classList.remove('dragging');
    _clearDragOver();
    _drag.el = null;
  });

  scroll.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.si-row[draggable]');
    if (!target || target === _drag.el) return;
    if (target.dataset.secid !== _drag.secId) return;
    _setDragOver(target);
  });

  scroll.addEventListener('dragleave', e => {
    if (!scroll.contains(e.relatedTarget)) _clearDragOver();
  });

  scroll.addEventListener('drop', e => {
    e.preventDefault();
    if (!_drag.currentOver || !_drag.el) return;
    _commitReorder(_drag.pid, _drag.secId, _drag.sid, _drag.currentOver.dataset.sid);
    _clearDragOver();
  });

  // ── Touch drag ──────────────────────────
  scroll.addEventListener('touchstart', e => {
    const handle = e.target.closest('.si-drag-handle');
    if (!handle) return;
    const row = handle.closest('.si-row[draggable]');
    if (!row) return;
    e.preventDefault();

    _drag.el    = row;
    _drag.pid   = row.dataset.pid;
    _drag.secId = row.dataset.secid;
    _drag.sid   = row.dataset.sid;
    _drag.startY = e.touches[0].clientY;
    _drag.scrollEl = scroll;

    const rect = row.getBoundingClientRect();
    const ghost = row.cloneNode(true);
    ghost.id = 'si-drag-ghost';
    ghost.style.cssText = [
      'position:fixed',
      `left:${rect.left}px`,
      `top:${rect.top}px`,
      `width:${rect.width}px`,
      'z-index:9999',
      'pointer-events:none',
      'opacity:0.85',
      'border-radius:8px',
      'background:var(--surface)',
      'box-shadow:0 8px 28px rgba(0,0,0,0.45)',
      'border:1px solid var(--accent)',
      'transition:none',
    ].join(';');
    document.body.appendChild(ghost);
    _drag.ghost = ghost;
    row.classList.add('dragging');
  }, { passive: false });

  scroll.addEventListener('touchmove', e => {
    if (!_drag.ghost) return;
    e.preventDefault();

    const touch = e.touches[0];
    const dy = touch.clientY - _drag.startY;
    const rect = _drag.el.getBoundingClientRect();
    _drag.ghost.style.top = (rect.top + dy + scroll.scrollTop - scroll.getBoundingClientRect().top) + 'px';

    _drag.ghost.style.display = 'none';
    const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
    _drag.ghost.style.display = '';
    const target = elBelow?.closest('.si-row[draggable]');
    if (target && target !== _drag.el && target.dataset.secid === _drag.secId) {
      _setDragOver(target);
    } else {
      _clearDragOver();
    }

    const scrollRect = scroll.getBoundingClientRect();
    const ZONE = 60;
    clearInterval(_drag.scrollTimer);
    if (touch.clientY < scrollRect.top + ZONE) {
      _drag.scrollTimer = setInterval(() => scroll.scrollBy(0, -6), 16);
    } else if (touch.clientY > scrollRect.bottom - ZONE) {
      _drag.scrollTimer = setInterval(() => scroll.scrollBy(0, 6), 16);
    }
  }, { passive: false });

  scroll.addEventListener('touchend', e => {
    clearInterval(_drag.scrollTimer);
    if (_drag.ghost) { _drag.ghost.remove(); _drag.ghost = null; }
    if (_drag.el) _drag.el.classList.remove('dragging');

    if (_drag.currentOver && _drag.el) {
      _commitReorder(_drag.pid, _drag.secId, _drag.sid, _drag.currentOver.dataset.sid);
    }
    _clearDragOver();
    _drag.el = null;
  }, { passive: true });
}

function _setDragOver(el) {
  if (_drag.currentOver === el) return;
  _clearDragOver();
  _drag.currentOver = el;
  el.classList.add('drag-over');
}

function _clearDragOver() {
  if (_drag.currentOver) {
    _drag.currentOver.classList.remove('drag-over');
    _drag.currentOver = null;
  }
}

function _commitReorder(pid, secId, draggedId, targetId) {
  if (draggedId === targetId) return;
  const proj = getProject(pid); if (!proj) return;

  const secItems = proj.items.filter(i => i.sectionId === secId);
  const fromIdx = secItems.findIndex(i => i.id === draggedId);
  const toIdx   = secItems.findIndex(i => i.id === targetId);
  if (fromIdx === -1 || toIdx === -1) return;

  const [moved] = secItems.splice(fromIdx, 1);
  secItems.splice(toIdx, 0, moved);

  const sectionOrder = proj.sections.map(s => s.id);
  const bySection = {};
  sectionOrder.forEach(sid => {
    bySection[sid] = proj.items.filter(i => i.sectionId === sid);
  });
  bySection[secId] = secItems;

  proj.items = sectionOrder.flatMap(sid => bySection[sid] || []);

  markProjectDirty(pid); save();
  renderLeft(route());
  if (navigator.vibrate) navigator.vibrate(18);
  showToast('✓ Reordered', 'green');
}

// Hook into renderLeft to (re)bind the drag engine after each render.
const _origRenderLeft = renderLeft;
renderLeft = function(r) {
  _origRenderLeft(r);
  requestAnimationFrame(_siDragInit);
};

function renderRight(r) {
  const views=['v-empty','v-root','v-folder','v-project','v-si','v-env','v-contacts','v-schedule','v-toolbox','v-awi','v-resources','v-tblog','v-manpower','v-activity','v-floorplan'];
  views.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });

  if (r.view==='contacts') { buildContactBookView(); show('v-contacts'); }
  else if (r.view==='toolbox') { buildToolboxView(); show('v-toolbox'); }
  else if (r.view==='awi')     { buildAWIView();     show('v-awi'); }
  else if (r.view==='resources'){ buildResourcesView(); show('v-resources'); }
  else if (r.view==='tblog')    { buildTbLogView(r.projectId); show('v-tblog'); }
  else if (r.view==='env') { buildEnvView(r.projectId); show('v-env'); }
  else if (r.view==='schedule') { buildScheduleView(r.projectId); show('v-schedule'); }
  else if (r.view==='manpower')  { buildManpowerView(r.projectId);  show('v-manpower');  }
  else if (r.view==='activity')  { buildActivityView(r.projectId);  show('v-activity');  }
  else if (r.view==='floorplan') { buildFloorPlanView(r.projectId); show('v-floorplan'); }
  else if (r.view==='si') { buildSIEditor(r.projectId,r.siId); show('v-si'); }
  else if (r.view==='project'&&!r.siId&&!r.envMode) { buildProjectView(r.projectId); show('v-project'); }
  else if (r.view==='folder'&&!r.projectId) { buildFolderView(r.folderId); show('v-folder'); }
  else if (r.view==='root'||!r.folderId) { buildRootView(); show('v-root'); }
  else show('v-empty');

  // Update mobile bottom nav active state
  updateMobileNav(r);
}

  el.style.display='flex'; el.style.flexDirection='column';
}

let _docManifest = null;
function loadDocManifest() {
  if (_docManifest) return Promise.resolve(_docManifest);
  return fetch('resources/manifest.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => { _docManifest = j; return j; })
    .catch(() => { _docManifest = { toolboxTalks: [], categories: [] }; return _docManifest; });
}
function _docHref(file) {
  return 'resources/' + String(file).split('/').map(encodeURIComponent).join('/');
}
function _esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── RESOURCES (Forms / QC / Site Safety) ──
const _CAT_LABEL = { 'Forms & Templates': 'Allegheny Field Forms' };
let _resSearch = '';
let _resOpen = {};
function buildResourcesView() {
  _ensureDocStyles();
  const el = document.getElementById('v-resources'); if (!el) return;
  el.innerHTML = `<div class="grid-wrap doc-wrap"><div class="env-header-title">📂 Resources</div><div class="doc-sub">Loading…</div></div>`;
  loadDocManifest().then(m => {
    if (route().view !== 'resources') return;
    el.innerHTML = `<div class="grid-wrap doc-wrap">
      <div class="env-header-title">📂 Resources</div>
      <div class="doc-sub">Field forms, quality-control plans, and site-safety programs. Tap any document to open or download.</div>
      <input class="doc-search" placeholder="Search all documents…" oninput="_resFilter(this.value)" value="${_esc(_resSearch)}">
      <div id="res-list">${_resBody(m.categories || [], _resSearch)}</div>
    </div>`;
  });
}
function _resBody(cats, q) {
  q = (q || '').toLowerCase();
  let html = '';
  cats.forEach((cat, ci) => {
    const label = _CAT_LABEL[cat.name] || cat.name;
    let cathtml = ''; let any = false;
    (cat.groups || []).forEach((g, gi) => {
      const items = (g.items || []).filter(it => !q ||
        it.title.toLowerCase().includes(q) || (g.name || '').toLowerCase().includes(q) || label.toLowerCase().includes(q));
      if (!items.length) return; any = true;
      const rows = items.map(it => `<a class="doc-item" href="${_docHref(it.file)}" target="_blank" rel="noopener">
        <span class="doc-ic ${it.type === 'docx' ? 'docx' : ''}">${(it.type || 'pdf').toUpperCase()}</span>
        <span class="doc-itt">${_esc(it.title)}</span><span class="doc-open">↗</span></a>`).join('');
      if (!g.name) {
        cathtml += `<div class="doc-grp open">${rows}</div>`;
      } else {
        const key = ci + '-' + gi;
        const open = q ? true : !!_resOpen[key];
        cathtml += `<div class="doc-grp ${open ? 'open' : ''}">
          <div class="doc-ghead" onclick="_resToggle('${key}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg> ${_esc(g.name)}<span class="doc-gcount">${items.length}</span></div>
          <div class="doc-glist">${rows}</div></div>`;
      }
    });
    if (any) html += `<div class="doc-cat">${_esc(label)}</div>` + cathtml;
  });
  return html || emptyMsg('No matches');
}
function _resFilter(q) {
  _resSearch = q;
  const c = document.getElementById('res-list');
  if (c) c.innerHTML = _resBody((_docManifest && _docManifest.categories) || [], q);
}
function _resToggle(key) {
  _resOpen[key] = !_resOpen[key];
  const c = document.getElementById('res-list');
  if (c) c.innerHTML = _resBody((_docManifest && _docManifest.categories) || [], _resSearch);
}

// ── PER-PROJECT TOOLBOX TALK LOG (stored on the project, synced) ──
let _tbLogOpen = null;
function buildTbLogView(pid) {
  _ensureDocStyles();
  const el = document.getElementById('v-tblog'); if (!el) return;
  const proj = getProject(pid);
  el.innerHTML = `<div class="grid-wrap doc-wrap"><div class="env-header-title">🦺 Toolbox Talk Log</div><div class="doc-sub">Loading…</div></div>`;
  loadDocManifest().then(m => {
    const r = route();
    if (r.view !== 'tblog' || r.projectId !== pid) return;
    const talks = m.toolboxTalks || [];
    const log = (proj && proj.toolboxTalks) || {};
    const done = talks.filter(t => log[t.week] && log[t.week].done).length;
    const pct = talks.length ? Math.round(done / talks.length * 100) : 0;
    const rows = talks.map(t => {
      const s = log[t.week] || {};
      const isOpen = _tbLogOpen === t.week;
      const meta = [];
      if (s.date) meta.push('📅 ' + s.date);
      if (s.supervisor) meta.push('👷 ' + _esc(s.supervisor));
      if (s.attendees) meta.push('👥 ' + _esc(s.attendees));
      return `<div class="tbl-card ${isOpen ? 'open' : ''}">
        <div class="tbl-row ${s.done ? 'done' : ''}" onclick="tbLogToggleOpen('${pid}',${t.week})">
          <div class="tbl-box" onclick="event.stopPropagation();tbLogToggleDone('${pid}',${t.week})"></div>
          <div style="min-width:0">
            <span class="tb-wk">WK ${String(t.week).padStart(2,'0')}</span>
            <div class="tb-ttl" style="margin-top:4px">${_esc(t.title)}</div>
            ${meta.length ? `<div class="tbl-meta">${meta.join('  ·  ')}</div>` : ''}
          </div>
          <svg class="tbl-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="tbl-panel">
          <div class="tbl-fields">
            <div><label>Date conducted</label><input type="date" value="${_esc(s.date||'')}" onchange="tbLogField('${pid}',${t.week},'date',this.value)"></div>
            <div><label>Supervisor</label><input value="${_esc(s.supervisor||'')}" placeholder="Name" onchange="tbLogField('${pid}',${t.week},'supervisor',this.value)"></div>
            <div><label>Attendees</label><input type="number" min="0" value="${_esc(s.attendees||'')}" placeholder="#" onchange="tbLogField('${pid}',${t.week},'attendees',this.value)"></div>
            <div class="tbl-full"><label>Notes</label><textarea rows="2" placeholder="Optional" onchange="tbLogField('${pid}',${t.week},'notes',this.value)">${_esc(s.notes||'')}</textarea></div>
          </div>
          <a class="tbl-open" href="${_docHref(t.file)}" target="_blank" rel="noopener">Open talk + sign-in ↗</a>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="grid-wrap doc-wrap">
      <div class="env-header-title">🦺 Toolbox Talk Log</div>
      <div class="doc-sub">Log each weekly safety talk for <b>${_esc(proj ? proj.name : '')}</b>. Saved with this project and synced to the cloud.</div>
      <div class="tbl-prog">
        <div class="tbl-ring" style="--p:${pct}"><span>${pct}%</span></div>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">${done} of ${talks.length} conducted</div>
        <div style="font-size:12px;color:var(--text3)">Tap the box to mark done · tap a row to log details</div></div>
      </div>
      ${rows || emptyMsg('No toolbox talks found')}
    </div>`;
  });
}
function _tbLogProj(pid) {
  const p = getProject(pid); if (!p) return null;
  if (!p.toolboxTalks) p.toolboxTalks = {};
  return p;
}
function tbLogToggleOpen(pid, wk) {
  _tbLogOpen = (_tbLogOpen === wk ? null : wk);
  buildTbLogView(pid);
}
function tbLogToggleDone(pid, wk) {
  const p = _tbLogProj(pid); if (!p) return;
  const cur = p.toolboxTalks[wk] || {};
  cur.done = !cur.done;
  if (cur.done && !cur.date) cur.date = new Date().toISOString().slice(0, 10);
  p.toolboxTalks[wk] = cur;
  markProjectDirty(pid); save();
  buildTbLogView(pid);
}
function tbLogField(pid, wk, key, val) {
  const p = _tbLogProj(pid); if (!p) return;
  const cur = p.toolboxTalks[wk] || {};
  cur[key] = val;
  let reflow = false;
  if (key === 'date' && val && !cur.done) { cur.done = true; reflow = true; }
  p.toolboxTalks[wk] = cur;
  markProjectDirty(pid); save();
  if (reflow) buildTbLogView(pid);
}

window.exportContactsVCF = function() {
  if (window.selectedContacts.size === 0) return showToast('Select contacts first');
  let vcf = '';
  window.selectedContacts.forEach(id => {
    const c = store.contacts.find(con => con.id === id);
    if (!c) return;
    vcf += 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
    vcf += `FN:${c.name}\r\nN:;${c.name};;;\r\n`;
    if (c.company)  vcf += `ORG:${c.company}\r\n`;
    if (c.category) vcf += `CATEGORIES:${c.category}\r\n`;
    if (c.role)     vcf += `TITLE:${c.role}\r\n`;
    if (c.phone)    vcf += `TEL;TYPE=CELL:${c.phone}\r\n`;
    if (c.email)    vcf += `EMAIL;TYPE=INTERNET:${c.email}\r\n`;
    if (c.notes)    vcf += `NOTE:${c.notes.replace(/\r?\n/g, '\\n')}\r\n`;
    if (c.project)  vcf += `X-ADH-PROJECT:${c.project}\r\n`;
    vcf += 'END:VCARD\r\n';
  });
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ADH_Contacts_${new Date().toISOString().slice(0,10)}.vcf`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  showToast(`✓ Exported ${window.selectedContacts.size} contacts as VCF`, 'green');
  window.selectedContacts.clear(); buildContactBookView();
};

window.handleContactCSV = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactCSV(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      markStoreDirty(); save();
      buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid contacts found in CSV', 'red');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function parseContactCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/['"]/g, ''));

  const map = { name:-1, role:-1, company:-1, phone:-1, email:-1, notes:-1, category:-1, project:-1 };
  headers.forEach((h, i) => {
    if      (/name/.test(h))                   map.name     = i;
    else if (/role|position|title/.test(h))    map.role     = i;
    else if (/company|org|firm/.test(h))       map.company  = i;
    else if (/phone|mobile|cell|tel/.test(h))  map.phone    = i;
    else if (/email|mail/.test(h))             map.email    = i;
    else if (/category|type|trade/.test(h))    map.category = i;
    else if (/note|comment|info/.test(h))      map.notes    = i;
    else if (/project|site/.test(h))           map.project  = i;
  });

  if (map.name === -1) return [];

  const result = [];
  lines.slice(1).forEach(line => {
    const cols = line.split(sep).map(c => c.trim().replace(/^["']|["']$/g, ''));
    if (cols[map.name]) {
      result.push({
        id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
        name:     cols[map.name],
        category: map.category !== -1 ? cols[map.category] || 'Other'    : 'Other',
        project:  map.project  !== -1 ? cols[map.project]  || 'Office'   : 'Office',
        role:     map.role     !== -1 ? cols[map.role]     || 'Contact'  : 'Contact',
        company:  map.company  !== -1 ? cols[map.company]  || 'External' : 'External',
        phone:    map.phone    !== -1 ? cols[map.phone]    || ''         : '',
        email:    map.email    !== -1 ? cols[map.email]    || ''         : '',
        notes:    map.notes    !== -1 ? cols[map.notes]    || ''         : ''
      });
    }
  });
  return result;
}

window.handleContactVCF = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactVCF(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      markStoreDirty(); save(); buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid vCards found in file', 'red');
    }
  };
  reader.readAsText(file); e.target.value = '';
};

function parseContactVCF(text) {
  // Unfold vCard folded lines (continuation lines start with space or tab)
  const unfolded = text.replace(/\r?\n[ \t]/g, '');
  const blocks = unfolded.split(/BEGIN:VCARD/i).slice(1);
  const results = [];

  blocks.forEach(block => {
    const endIdx = block.search(/END:VCARD/i);
    if (endIdx === -1) return;
    const lines = block.slice(0, endIdx).split(/\r?\n/).filter(l => l.trim());

    // Parse all key:value pairs; key may have type params (KEY;PARAM=val:value)
    const fields = {};
    lines.forEach(line => {
      const colon = line.indexOf(':');
      if (colon === -1) return;
      const rawKey = line.slice(0, colon).split(';')[0].toLowerCase().trim();
      const value  = line.slice(colon + 1).trim();
      if (!fields[rawKey]) fields[rawKey] = value; // keep first occurrence
    });

    const name = fields['fn'] || '';
    if (!name) return;

    results.push({
      id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
      name,
      category: fields['categories'] || 'Other',
      project:  fields['x-adh-project'] || 'Office',
      role:     fields['title'] || 'Contact',
      company:  (fields['org'] || '').split(';')[0] || 'External',
      phone:    fields['tel'] || '',
      email:    fields['email'] || '',
      notes:    (fields['note'] || '').replace(/\\n/g, '\n')
    });
  });
  return results;
}

// ── XLSX Import ─────────────────────────────────────────────────
window.handleContactXLSX = function(e) {
  const file = e.target.files[0]; if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb   = XLSX.read(ev.target.result, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      const list = rows.map(row => {
        // Normalize keys to lowercase for flexible matching
        const r = {};
        Object.keys(row).forEach(k => { r[k.toLowerCase().trim()] = String(row[k]).trim(); });
        const name = r['name'] || r['full name'] || r['contact name'] || '';
        if (!name) return null;
        return {
          id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
          name,
          category: r['category'] || r['type']         || 'Other',
          project:  r['project']  || r['site']         || 'Office',
          role:     r['role']     || r['title']        || r['position'] || 'Contact',
          company:  r['company']  || r['org']          || r['organization'] || 'External',
          phone:    r['phone']    || r['mobile']       || r['tel'] || '',
          email:    r['email']    || r['e-mail']       || '',
          notes:    r['notes']    || r['note']         || r['comments'] || ''
        };
      }).filter(Boolean);

      if (list.length > 0) {
        store.contacts = [...store.contacts, ...list];
        markStoreDirty(); save(); buildContactBookView();
        showToast(`✓ Imported ${list.length} contacts`, 'green');
      } else {
        showToast('No valid contacts found in file', 'red');
      }
    } catch(err) {
      showToast('Error reading Excel file', 'red');
    }
  };
  reader.readAsArrayBuffer(file); e.target.value = '';
};

// Global rebuild — called from inline onclick without .toString() issues
window.rebuildFolderProjs = function(fid) {
  const folder=getFolder(fid); if(!folder) return;
  const fs=getFolderState(fid);
  const area=document.getElementById('folder-proj-area'); if(!area) return;

  let projs=folder.projects.map(id=>getProject(id)).filter(Boolean);

  // Filter
  const q=(fs.filter||'').toLowerCase();
  if(q) projs=projs.filter(p=>
    p.name.toLowerCase().includes(q)||
    p.client.toLowerCase().includes(q)||
    p.auditor.toLowerCase().includes(q)||
    (p.projectType||'').toLowerCase().includes(q)
  );

  // Sort — always sort, folders always stay ordered
  projs.sort((a,b)=>{
    if(fs.sort==='date')   return (b.date||'').localeCompare(a.date||'');
    if(fs.sort==='client') return (a.client||'').localeCompare(b.client||'');
    if(fs.sort==='auditor')return (a.auditor||'').localeCompare(b.auditor||'');
    return a.name.localeCompare(b.name); // default A-Z
  });

  // Refresh sort button states
  ['name','date','client'].forEach(s=>{
    document.getElementById('sort-btn-'+s)?.classList.toggle('active', fs.sort===s);
  });
  const grpBtn=document.getElementById('sort-btn-auditor');
  if(grpBtn) grpBtn.classList.toggle('active', fs.groupBy==='auditor');

  // Render
  if(!projs.length) { area.innerHTML=emptyMsg('No projects match'); return; }

  if(fs.groupBy==='auditor') {
    const groups={};
    projs.forEach(p=>{ const k=p.auditor||'Unassigned'; if(!groups[k]) groups[k]=[]; groups[k].push(p); });
    area.innerHTML=Object.keys(groups).sort().map(aud=>`
      <div class="auditor-group-header">👤 ${aud} <span class="agh-count">${groups[aud].length}</span></div>
      <div class="proj-grid" style="margin-bottom:20px">${groups[aud].map(p=>projCardHTML(p,fid)).join('')}</div>
    `).join('');
  } else {
    area.innerHTML=`<div class="proj-grid">
      ${projs.map(p=>projCardHTML(p,fid)).join('')}
      <div class="proj-card new-card" onclick="showNewProjectModal('${fid}')">
        <div style="font-size:22px;opacity:0.4">＋</div><div style="font-size:12px">New Project</div>
      </div>
    </div>`;
  }
};

function navToEnv(pid) {
  const cur=route();
  // Remove duplicate views but keep project in stack so goBack() lands on project
  stack=stack.filter(r=>r.view!=='env'&&r.view!=='si'&&r.view!=='schedule'&&r.view!=='manpower');
  // Ensure project is in stack so Back works
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) {
    stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  }
  stack.push({view:'env', folderId:cur.folderId||'', projectId:pid});
  render();
}

function navToSchedule(pid) {
  const cur=route();
  stack=stack.filter(r=>r.view!=='schedule'&&r.view!=='si'&&r.view!=='env'&&r.view!=='manpower');
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) {
    stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  }
  stack.push({view:'schedule', folderId:cur.folderId||'', projectId:pid});
  render();
}

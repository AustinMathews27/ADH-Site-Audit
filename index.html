<style>
:root {
  --bg: #f1f5f9;              /* app background (Daylight) */
  --surface: #fffff8;         /* main cards */
  --surface2: #f8fafc;        /* inputs */
  --surface3: #e5e7eb;
  --border: #d1d5db;
  --border2: #cbd5e1;
  --accent: #2563eb;          /* blue 600 */
  --accent-dim: rgba(37,99,235,0.12);
  --green: #16a34a;
  --green-dim: rgba(22, 163, 74, 0.11);
  --yellow: #d97706;
  --yellow-dim: rgba(217, 119, 6, 0.11);
  --red: #dc2626;
  --red-dim: rgba(220, 38, 38, 0.11);
  --folder: #f59e0b;
  --folder-dim: rgba(245,158,11,0.11);
  --text: #0f172a;
  --text2: #475569;
  --text3: #5c6b7d; /* ~5:1 contrast on --bg, up from ~2.3:1 — legible in direct sunlight */
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

/* ── THEME OVERRIDES ── */
body.theme-dark {
  --bg: #0a0e14;
  --surface: #141a24;
  --surface2: #1c2431;
  --surface3: #262f3f;
  --border: #313c4c;
  --border2: #46586d;
  --accent: #f97316;          /* safety orange */
  --accent-dim: rgba(249,115,22,0.16);
  --text: #e5e7eb;
  --text2: #9ca3af;
  --text3: #8b95a5; /* ~6.3:1 contrast on --bg, up from ~4.0:1 */
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #fbbf24;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* iOS Safe Areas */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}

body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans);
  height: 100vh;
  height: 100dvh;
  min-height: -webkit-fill-available;
  padding-top: var(--sat);
  padding-left: var(--sal);
  padding-right: var(--sar);
  overflow:hidden; display:flex; flex-direction:column;
  position: relative;
  width: 100%;
  -webkit-overflow-scrolling: touch;
}

/* ── NAV BAR ── */
.nav-bar {
  display:flex; align-items:center;
  padding:0 14px; height:110px;
  background:var(--surface); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:6px;
}
.nav-logo {
  height: 100px;
  width: auto;
  display: block;
  object-fit: contain;
}
.offline-banner {
  display: none;
  background: #f97316;
  color: #000;
  text-align: center;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.4px;
  flex-shrink: 0;
}
body.is-offline .offline-banner { display: block; }
.update-banner {
  display:none; align-items:center; justify-content:space-between;
  background:#1e40af; color:#e2e8f0; padding:7px 16px; flex-shrink:0;
  font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.3px;
  gap:10px;
}
.update-banner.visible { display:flex; }
.update-banner-btn {
  padding:4px 12px; background:#3b82f6; color:#fff; border:none; border-radius:6px;
  font-family:var(--mono); font-size:10px; font-weight:700; cursor:pointer;
  white-space:nowrap; flex-shrink:0;
}
.update-banner-btn:hover { background:#2563eb; }
.nav-back-btn {
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface2);
  color:var(--text2); cursor:pointer; font-size:18px; font-weight:300;
  transition:all 0.15s; flex-shrink:0; user-select:none;
}
.nav-back-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.nav-back-btn.disabled { opacity:0.28; cursor:default; pointer-events:none; }
.breadcrumb {
  display:flex; align-items:center; gap:3px;
  flex:1; overflow:hidden; min-width:0;
}
.crumb {
  font-size:13px; font-weight:500; color:var(--text2);
  cursor:pointer; white-space:nowrap;
  padding:3px 6px; border-radius:6px; transition:all 0.12s;
  overflow:hidden; text-overflow:ellipsis;
}
.crumb:hover { color:var(--accent); background:var(--accent-dim); }
.crumb.active { color:var(--text); cursor:default; font-weight:600; }
.crumb.active:hover { background:none; color:var(--text); }
.crumb-sep { color:var(--text3); font-size:14px; flex-shrink:0; user-select:none; }
.nav-actions { display:flex; gap:6px; flex-shrink:0; }
.btn-icon {
  width:32px; height:32px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface2);
  color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:all 0.15s;
}
.btn-icon:hover { border-color:var(--accent); color:var(--accent); }

/* ── LAYOUT ── */
.app-body { display:flex; flex:1; overflow:hidden; }

/* ── LEFT PANEL ── */
.left-panel {
  width:310px; flex-shrink:0;
  display:flex; flex-direction:column;
  border-right:1px solid var(--border);
  background:var(--surface);
}
.panel-header {
  padding:11px 13px 9px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.panel-header-row {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
}
.panel-title {
  font-size:10px; font-weight:600; letter-spacing:1.3px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono);
}
.btn-add {
  display:flex; align-items:center; gap:3px;
  font-size:10px; font-weight:600; color:var(--accent);
  background:var(--accent-dim); border:1px solid rgba(61,184,245,0.22);
  border-radius:7px; padding:4px 9px; cursor:pointer;
  transition:all 0.15s; font-family:var(--mono);
}
.btn-add:hover { background:rgba(61,184,245,0.18); }
.search-box {
  display:flex; align-items:center; gap:7px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:6px 10px;
}
.search-box input {
  background:none; border:none; outline:none;
  font-size:13px; color:var(--text); width:100%; font-family:var(--sans);
}
.search-box input::placeholder { color:var(--text3); }
.search-icon { color:var(--text3); font-size:13px; flex-shrink:0; }
.list-scroll { overflow-y:auto; flex:1; padding:4px 0; }

/* ── FOLDER ROWS ── */
.folder-row {
  display:flex; align-items:center; gap:10px;
  padding:8px 13px; cursor:pointer; transition:background 0.1s; position:relative;
}
.folder-row:hover { background:var(--surface2); }
.folder-row.active { background:var(--folder-dim); }
.folder-row.active::before {
  content:''; position:absolute; left:0; top:4px; bottom:4px;
  width:3px; background:var(--folder); border-radius:0 2px 2px 0;
}
.folder-icon-wrap {
  width:36px; height:28px; border-radius:6px;
  background:var(--folder-dim); border:1px solid rgba(245,158,11,0.18);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.folder-icon-wrap svg, .fc-icon svg {
  width: 80%; height: 80%; display: block;
}
.crumb svg {
  width: 14px; height: 14px;
  display: inline-block; vertical-align: middle;
  margin-right: 4px; margin-top: -2px;
}
.folder-info { flex:1; min-width:0; }
.folder-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.folder-meta { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:1px; }
.folder-arrow { color:var(--text3); font-size:14px; }

/* ── SI / PROJECT ROWS ── */
.section-group {
  padding:7px 13px 2px;
  font-size:10px; font-weight:600; letter-spacing:1.3px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono);
  display:flex; align-items:center; justify-content:space-between;
}
.section-count {
  font-size:10px; background:var(--surface3);
  border:1px solid var(--border); border-radius:4px;
  padding:1px 5px; color:var(--text3);
}
.si-row {
  display:flex; align-items:center; gap:9px;
  padding:8px 13px; cursor:pointer; transition:background 0.1s; position:relative;
}
.si-row:hover { background:var(--surface2); }
.si-row.active { background:var(--accent-dim); }
.si-row.active::before {
  content:''; position:absolute; left:0; top:4px; bottom:4px;
  width:3px; background:var(--accent); border-radius:0 2px 2px 0;
}
.si-drag-handle {
  display:flex; align-items:center; justify-content:center;
  width:20px; height:32px; flex-shrink:0;
  color:var(--text3); font-size:14px; cursor:grab;
  opacity:0.45; transition:opacity 0.15s; touch-action:none;
  user-select:none; -webkit-user-select:none;
}
.si-drag-handle:hover { opacity:1; color:var(--accent); }
.si-drag-handle:active { cursor:grabbing; }
.si-row.dragging {
  opacity:0.35; background:var(--accent-dim) !important;
  border-left:3px solid var(--accent);
}
.si-row.drag-over {
  border-top:2px solid var(--accent);
  background:var(--surface2) !important;
}
.si-thumb {
  width:42px; height:32px; border-radius:6px;
  background:var(--surface3); overflow:hidden; flex-shrink:0;
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text3); font-size:13px;
}
.si-thumb img { width:100%; height:100%; object-fit:cover; }
.si-info { flex:1; min-width:0; }
.si-num { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); margin-bottom:1px; cursor:pointer; }
.si-title { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.si-status { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.si-status.completed     { background:#22c55e; box-shadow:0 0 4px #22c55e; }
.si-status.not-ready     { background:var(--red);    box-shadow:0 0 4px var(--red); }
.si-status.in-progress   { background:var(--yellow);  box-shadow:0 0 4px var(--yellow); }
.si-status.changed       { background:#f97316;         box-shadow:0 0 4px #f97316; }
.si-status.pending       { background:var(--text3); }
.si-status.punch-ongoing { background:#a855f7; box-shadow:0 0 4px #a855f7; }

.si-status.on-hold       { background:#f97316;         box-shadow:0 0 4px #f97316; }
.si-status.out-of-scope  { background:var(--text3); opacity:0.45; }

/* ── BULK ACTIONS ── */
.si-row-check {
  width:16px; height:16px; border-radius:4px;
  border:1.5px solid var(--border); background:var(--surface2);
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:10px; flex-shrink:0;
  transition:all 0.1s; margin-right:2px;
}
.si-row-check.checked { background:var(--accent); border-color:var(--accent); color:#000; }
.bulk-action-bar {
  display:none; align-items:center; gap:8px; padding:8px 13px;
  background:var(--accent-dim); border-top:1px solid var(--border);
  flex-shrink:0; flex-wrap:wrap;
}
.bulk-action-bar.visible { display:flex; }
.bulk-btn {
  font-size:10px; font-family:var(--mono); font-weight:700;
  padding:4px 8px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text2); cursor:pointer;
  transition:all 0.12s; white-space:nowrap;
}
.bulk-btn:hover { border-color:var(--accent); color:var(--accent); }
.bulk-btn.danger:hover { border-color:var(--red); color:var(--red); }

/* ── RIGHT PANEL ── */
.right-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* ── ROOT / FOLDER GRID VIEWS ── */
.grid-wrap { flex:1; overflow-y:auto; padding:20px; }
.section-divider {
  font-size:10px; font-weight:600; letter-spacing:1px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono);
  margin-bottom:12px; margin-top:4px;
}
.folder-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:24px;
}
.folder-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:16px 14px; cursor:pointer;
  transition:all 0.15s; display:flex; flex-direction:column; gap:8px;
}
.folder-card:hover { border-color:var(--folder); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.3); }
.folder-card.new-card { border-style:dashed; align-items:center; justify-content:center; color:var(--text3); }
.folder-card.new-card:hover { border-color:var(--accent); color:var(--accent); }
.fc-icon { font-size:28px; }
.fc-name { font-size:13px; font-weight:600; }
.fc-count { font-size:10px; color:var(--text3); font-family:var(--mono); }
.folder-logo-img { width:100%; height:100%; object-fit:contain; display:block; }
.fc-icon .folder-logo-img { width:auto; height:72px; max-width:100%; object-fit:contain; display:block; margin:0 auto; }
.logo-dark { display:none !important; }
html.dark .logo-light { display:none !important; }
html.dark .logo-dark { display:block !important; }
.folder-logo-img.logo-dark-bg { background:#1c1c1e !important; border-radius:8px !important; padding:7px !important; }
html.dark .folder-logo-img:not(.logo-dark):not(.logo-dark-bg) { background:rgba(255,255,255,0.93); border-radius:6px; padding:5px; }
.proj-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;
}
.proj-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; cursor:pointer; transition:all 0.15s;
}
.proj-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,0.3); }
.proj-card.new-card {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; min-height:140px; border-style:dashed; color:var(--text3);
}
.proj-card.new-card:hover { border-color:var(--accent); color:var(--accent); }

/* Skeleton Loaders */
@keyframes skeleton-pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}
.skeleton-card {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 12px; height: 180px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.skeleton-folder {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 12px; height: 74px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

.proj-card-menu-btn {
  position:absolute; top:8px; right:8px;
  width:28px; height:28px; border-radius:7px;
  background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.12);
  color:#fff; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.15s; line-height:1; padding-bottom:2px;
  opacity:0; z-index:10;
}
.proj-card:hover .proj-card-menu-btn { opacity:1; }
.proj-card-menu-btn:hover { background:rgba(0,0,0,0.7); border-color:rgba(255,255,255,0.3); }
.pc-photo {
  height:100px; background:var(--surface3);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; overflow:hidden;
}
.pc-photo .pc-placeholder { opacity:0.25; }
.pc-photo img { width:100%; height:100%; object-fit:cover; }
.pc-body { padding:11px 13px; }
.pc-name { font-size:13px; font-weight:600; margin-bottom:4px; }
.pc-meta { font-size:10px; color:var(--text2); font-family:var(--mono); }
.pc-stats { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
.stat-pill {
  font-size:10px; font-family:var(--mono);
  padding:2px 6px; border-radius:4px; border:1px solid var(--border); color:var(--text3);
}
.stat-pill.green    { background:var(--green-dim);              border-color:rgba(52,211,153,0.2);  color:var(--green); }
.stat-pill.red      { background:var(--red-dim);                border-color:rgba(248,113,113,0.2); color:var(--red); }
.stat-pill.yellow   { background:var(--yellow-dim);             border-color:rgba(251,191,36,0.2);  color:var(--yellow); }
.stat-pill.orange   { background:rgba(249,115,22,0.12);         border-color:rgba(249,115,22,0.25); color:#f97316; }
.stat-pill.completed{ background:rgba(34,197,94,0.12);          border-color:rgba(34,197,94,0.22);  color:#22c55e; }
.stat-pill.purple   { background:rgba(168,85,247,0.12);         border-color:rgba(168,85,247,0.22); color:#a855f7; }

/* ── PROJECT SUMMARY ── */
.summary-wrap { flex:1; overflow-y:auto; padding:20px; }
.proj-summary-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:13px; overflow:hidden; margin-bottom:16px;
}
.proj-summary-photo {
  height:160px; background:var(--surface3);
  display:flex; align-items:center; justify-content:center;
  font-size:44px; overflow:hidden; position:relative;
  cursor:pointer;
}
.proj-summary-photo img { width:100%; height:100%; object-fit:cover; }
.proj-summary-photo-placeholder { opacity:0.18; }
.proj-summary-photo-overlay {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0); transition:background 0.2s; gap:14px;
}
.proj-summary-photo:hover .proj-summary-photo-overlay { background:rgba(0,0,0,0.5); }
.proj-summary-photo-overlay .overlay-btn {
  color:#fff; font-size:11px; font-family:var(--mono); font-weight:600;
  opacity:0; transition:opacity 0.2s; letter-spacing:0.5px;
  background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35);
  border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap;
}
.proj-summary-photo:hover .overlay-btn { opacity:1; }
.overlay-btn.danger:hover { background:rgba(220,38,38,0.5); border-color:rgba(255,100,100,0.5); }
.proj-summary-info { padding:14px 16px; }
.proj-summary-name { font-size:17px; font-weight:600; margin-bottom:8px; }
.proj-meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px 16px; }
.meta-item .meta-label { font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text3); font-family:var(--mono); }
.meta-item .meta-val { font-size:12px; color:var(--text2); margin-top:1px; }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
.stats-row-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
.stats-row-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
.stat-num { font-family:var(--mono); font-size:24px; font-weight:600; line-height:1; margin-bottom:3px; }
.stat-label { font-size:10px; color:var(--text2); }
.action-list { display:flex; flex-direction:column; gap:7px; }
.action-row {
  display:flex; align-items:center; gap:11px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:11px 13px; cursor:pointer; transition:all 0.15s;
}
.action-row:hover { border-color:var(--accent); }
.action-icon {
  width:34px; height:34px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.action-body { flex:1; }
.action-title { font-size:13px; font-weight:500; }
.action-desc { font-size:11px; color:var(--text2); margin-top:1px; }
.action-arrow { color:var(--text3); font-size:15px; }

/* Styling for Empty State Component blocks */
.empty-project-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background: var(--surface2);
  border: 2px dashed var(--border);
  border-radius: 12px;
  text-align: center;
  margin: 10px 0 20px 0;
}
.empty-project-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: 0.6;
}
.empty-project-box h4 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.empty-project-box p {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.5;
  max-width: 290px;
  margin-bottom: 20px;
}

/* Touch target optimized CTA button for Android & iOS thumbs */
.btn-project-cta {
  width: 100%; max-width: 280px; min-height: 48px; padding: 12px 24px;
  background: var(--accent); color: #ffffff; border: none; border-radius: 10px;
  font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 12px var(--accent-dim);
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn-project-cta:active { transform: scale(0.97); opacity: 0.9; }

/* Adjust button color variables specifically inside dark mode overrides */
body.theme-dark .btn-project-cta { color: #000000; }

/* ── SI EDITOR ── */
.edit-header {
  padding:12px 16px; border-bottom:1px solid var(--border);
  flex-shrink:0; background:var(--surface);
}
.edit-title-row { display:flex; align-items:flex-start; margin-bottom:9px; gap:10px; }
.edit-title { font-size:15px; font-weight:600; flex:1; }
.edit-subtitle { font-size:11px; color:var(--text2); font-family:var(--mono); margin-top:2px; }
.status-pills { display:flex; gap:5px; flex-wrap:wrap; }
.status-pill {
  display:flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:20px;
  font-size:10px; font-weight:600; font-family:var(--mono);
  cursor:pointer; border:1px solid var(--border);
  background:var(--surface2); color:var(--text3);
  transition:all 0.15s;
}
.status-pill.active-status                    { box-shadow:0 0 0 2px currentColor; }
.status-pill.completed.active-status          { background:rgba(34,197,94,0.12);  color:#22c55e;   border-color:rgba(34,197,94,0.28); }
.status-pill.not-ready.active-status          { background:var(--red-dim);        color:var(--red); border-color:rgba(248,113,113,0.25); }
.status-pill.in-progress.active-status        { background:var(--yellow-dim);     color:var(--yellow); border-color:rgba(251,191,36,0.25); }
.status-pill.changed.active-status            { background:rgba(249,115,22,0.12); color:#f97316;   border-color:rgba(249,115,22,0.28); }
.status-pill.punch-ongoing.active-status      { background:rgba(168,85,247,0.12); color:#a855f7;   border-color:rgba(168,85,247,0.28); }
.status-pill.on-hold.active-status            { background:rgba(249,115,22,0.12); color:#f97316;   border-color:rgba(249,115,22,0.28); }
.status-pill.out-of-scope.active-status       { background:var(--surface2);       color:var(--text3); border-color:var(--border); }
.edit-body { flex:1; overflow-y:auto; padding:16px; }
.field-group { margin-bottom:16px; }
.field-label {
  font-size:10px; font-weight:600; letter-spacing:1.1px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono); margin-bottom:5px;
}
.field-input {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:9px 11px; font-size:13px; color:var(--text);
  font-family:var(--sans); outline:none; transition:border-color 0.15s;
}
.field-input:focus { border-color:var(--accent); }
.field-input::placeholder { color:var(--text3); }
textarea.field-input { resize:vertical; min-height:78px; line-height:1.55; }
select.field-input { cursor:pointer; }
.field-row { display:flex; gap:10px; }
.field-row .field-group { flex:1; }
.condition-tags { display:flex; gap:6px; flex-wrap:wrap; }
.cond-tag {
  display:flex; align-items:center; gap:4px;
  padding:4px 9px; border-radius:6px;
  font-size:10px; font-family:var(--mono);
  border:1px solid var(--border); background:var(--surface2);
  color:var(--text2); cursor:pointer; transition:all 0.15s;
}
.cond-tag:hover { border-color:var(--accent); color:var(--accent); }
.cond-tag.selected { background:var(--accent-dim); border-color:rgba(61,184,245,0.3); color:var(--accent); }
.cond-tag.custom-tag { border-color:rgba(124,58,237,0.3); color:#a78bfa; background:rgba(124,58,237,0.08); }
.cond-tag.custom-tag.selected { background:rgba(124,58,237,0.18); border-color:rgba(124,58,237,0.5); color:#c4b5fd; }
.cond-tag.custom-tag .tag-del { margin-left:3px; font-size:10px; opacity:0.6; }
.cond-tag.custom-tag .tag-del:hover { opacity:1; color:var(--red); }
.custom-tag-input-row {
  display:flex; gap:6px; margin-top:8px; align-items:center;
}
.custom-tag-input-row input {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:6px; padding:5px 9px; font-size:11px; color:var(--text);
  font-family:var(--mono); outline:none; transition:border-color 0.15s;
}
.custom-tag-input-row input:focus { border-color:#a78bfa; }
.custom-tag-input-row input::placeholder { color:var(--text3); }
.custom-tag-add-btn {
  padding:5px 10px; border-radius:6px;
  background:rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.3);
  color:#a78bfa; font-size:11px; font-weight:600; font-family:var(--mono);
  cursor:pointer; white-space:nowrap; transition:all 0.15s;
}
.custom-tag-add-btn:hover { background:rgba(124,58,237,0.22); }
.photo-actions { display:flex; gap:8px; margin-bottom:9px; }
.btn-photo {
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px; border-radius:9px;
  font-size:12px; font-weight:600; font-family:var(--mono);
  cursor:pointer; border:none; transition:all 0.15s;
}
.btn-photo.camera { background:var(--accent); color:#000; }
.btn-photo.camera:hover { background:#5cc8ff; }
.btn-photo.import { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-photo.import:hover { border-color:var(--accent); color:var(--accent); }
.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:7px; }
.photo-cell { display:flex; flex-direction:column; gap:3px; min-width:0; }
.photo-card {
  position:relative; border-radius:8px; overflow:hidden;
  background:var(--surface3); border:1px solid var(--border);
  aspect-ratio:4/3; cursor:pointer; transition:all 0.15s;
}
.photo-card:hover { transform:scale(1.03); border-color:var(--accent); }
.photo-card img { width:100%; height:100%; object-fit:cover; }
.photo-date-label {
  font-family:var(--mono); font-size:10px; color:var(--text3);
  text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.photo-card-overlay {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.75));
  padding:5px 6px; display:flex; align-items:center; justify-content:space-between;
}
.photo-num { font-family:var(--mono); font-size:10px; color:#fff; }
.photo-del {
  width:18px; height:18px; border-radius:4px;
  background:rgba(248,113,113,0.45); border:none; cursor:pointer;
  color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;
}
.photo-del:hover { background:rgba(248,113,113,0.75); }
.photo-menu-btn {
  width:26px; height:26px; border-radius:6px; flex-shrink:0;
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35);
  color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.photo-menu-btn:hover { background:rgba(255,255,255,0.32); }
.photo-empty {
  border:2px dashed var(--border); border-radius:8px;
  padding:22px; text-align:center; color:var(--text3); font-size:12px;
}
.photo-empty-icon { font-size:22px; margin-bottom:5px; opacity:0.35; }

/* ── SAVE BAR (replaced by autosave) ── */
.save-bar {
  padding:9px 16px; border-top:1px solid var(--border);
  background:var(--surface); display:flex; gap:7px; align-items:center; flex-shrink:0;
  padding-bottom: calc(9px + var(--sab));
}
.save-bar .btn-save { display:none; }
.si-mobile-back-bar {
  display:none; padding:0 16px calc(8px + var(--sab));
  background:var(--surface); border-top:none; flex-shrink:0;
}
.btn-nav {
  flex:1; padding:10px 13px; background:var(--surface2); color:var(--text2);
  border:1px solid var(--border); border-radius:9px;
  font-size:13px; font-weight:600; font-family:var(--mono); text-align:center;
  cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.btn-nav:hover { border-color:var(--text2); color:var(--text); }
.autosave-indicator {
  font-family:var(--mono); font-size:10px; color:var(--text3);
  padding:5px 10px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface2); flex-shrink:0; transition:all 0.4s;
}
.autosave-indicator.saved { color:var(--green); border-color:rgba(52,211,153,0.3); }

/* ── EMPTY STATE ── */
.empty-state {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  color:var(--text3); gap:10px; padding:40px;
}
.empty-state-icon { font-size:42px; opacity:0.16; }
.empty-state-text { font-size:13px; text-align:center; max-width:240px; line-height:1.55; }

/* ── MODAL ── */
.modal-overlay {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:14px; width:100%; max-width:410px; overflow:hidden;
}
.modal.wide { max-width:620px; }
.modal-header {
  padding:13px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-title { font-size:14px; font-weight:600; }
.modal-body { padding:16px; max-height:80vh; overflow-y:auto; }
.modal-footer {
  padding:10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); display:flex; gap:7px;
}

/* ── GLOBAL SEARCH ── */
.global-search-overlay {
  position:fixed; inset:0; z-index:900;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:80px; padding:80px 20px 20px;
}
.global-search-box {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:14px; width:100%; max-width:560px;
  overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.5);
}
.global-search-input-wrap {
  display:flex; align-items:center; gap:10px; padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.global-search-input-wrap input {
  flex:1; background:none; border:none; outline:none;
  font-size:16px; color:var(--text); font-family:var(--sans);
}
.global-search-input-wrap input::placeholder { color:var(--text3); }
.global-search-results { max-height:420px; overflow-y:auto; }
.gs-section-label {
  font-size:10px; font-weight:700; letter-spacing:1.2px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono);
  padding:10px 16px 4px;
}
.gs-result-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 16px; cursor:pointer; transition:background 0.1s;
}
.gs-result-row:hover, .gs-result-row.active { background:var(--accent-dim); }
.gs-result-icon { font-size:16px; flex-shrink:0; width:24px; text-align:center; }
.gs-result-main { flex:1; min-width:0; }
.gs-result-title { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gs-result-sub { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:1px; }
.gs-result-badge { font-size:10px; font-family:var(--mono); padding:2px 7px; border-radius:4px; background:var(--surface2); border:1px solid var(--border); color:var(--text3); flex-shrink:0; }
.gs-empty { padding:32px; text-align:center; color:var(--text3); font-size:13px; }
.gs-shortcut { font-family:var(--mono); font-size:10px; color:var(--text3); background:var(--surface2); border:1px solid var(--border); border-radius:5px; padding:2px 7px; }

/* ── ANNOTATION ── */
.annotation-overlay {
  position:fixed; inset:0; z-index:950;
  background:#000; display:flex; flex-direction:column;
}
.annotation-toolbar {
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:#1a1a1a; border-bottom:1px solid #333; flex-shrink:0; flex-wrap:wrap;
}
.ann-tool-btn {
  display:flex; align-items:center; gap:5px;
  padding:6px 12px; border-radius:8px; border:1px solid #444;
  background:#2a2a2a; color:#e4e7ef; font-size:11px; font-weight:600;
  font-family:var(--mono); cursor:pointer; transition:all 0.12s; white-space:nowrap;
}
.ann-tool-btn:hover { border-color:#3db8f5; color:#3db8f5; }
.ann-tool-btn.active { background:rgba(61,184,245,0.2); border-color:#3db8f5; color:#3db8f5; }
.ann-color-btn {
  width:26px; height:26px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; transition:all 0.12s; flex-shrink:0;
}
.ann-color-btn.active { border-color:#fff; transform:scale(1.2); }
.ann-canvas-wrap { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
#ann-canvas { cursor:crosshair; touch-action:none; max-width:100%; max-height:100%; }
.ann-text-input {
  position:absolute; background:rgba(0,0,0,0.7); border:1px solid #3db8f5;
  color:#fff; font-size:16px; padding:4px 8px; outline:none; border-radius:4px;
  font-family:var(--sans); min-width:120px;
}

/* ── PHOTO RECOVERY (ADMIN) ── */
.recovery-overlay {
  position:fixed; inset:0; z-index:940;
  background:var(--bg); display:flex; flex-direction:column;
}
.recovery-header {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
}
/* min-height:0 is load-bearing: without it a column-flex child refuses to
   shrink below its content height, so the photo grid could never scroll */
.recovery-body { flex:1; min-height:0; overflow-y:auto; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.recovery-proj-row {
  display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px;
  border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; transition:all 0.15s;
}
.recovery-proj-row:hover { border-color:var(--accent); }
.recovery-si-group { margin-bottom:18px; }
.recovery-si-title {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:12px; font-weight:700; margin-bottom:8px; color:var(--text1);
}
.recovery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
.recovery-card {
  position:relative; border:2px solid var(--border); border-radius:9px; overflow:hidden;
  background:var(--surface2); cursor:pointer; aspect-ratio:1;
}
.recovery-card img { width:100%; height:100%; object-fit:cover; display:block; }
.recovery-card.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-dim); }
.recovery-card .rec-check {
  position:absolute; top:5px; left:5px; width:20px; height:20px; border-radius:6px;
  background:rgba(0,0,0,0.55); border:1.5px solid #fff; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}
.recovery-card.selected .rec-check { background:var(--accent); border-color:var(--accent); }
.recovery-card .rec-open {
  position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:6px;
  background:rgba(0,0,0,0.55); color:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:11px;
}
.recovery-card .rec-date {
  position:absolute; bottom:0; left:0; right:0; padding:3px 5px;
  background:rgba(0,0,0,0.55); color:#fff; font-size:9px; font-family:var(--mono); text-align:center;
}
.recovery-card .rec-inapp {
  position:absolute; bottom:18px; left:5px; padding:2px 6px; border-radius:10px;
  background:rgba(22,101,52,0.85); color:#dcfce7; font-size:9px; font-weight:700;
}
.recovery-bar {
  display:flex; align-items:center; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
}
.recovery-btn {
  padding:8px 16px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text1); font-family:var(--mono); font-size:12px;
  font-weight:700; cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.recovery-btn:hover { border-color:var(--accent); color:var(--accent); }
.recovery-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.recovery-btn.danger { background:var(--red-dim); border-color:var(--red-dim); color:var(--red); }
.recovery-btn:disabled { opacity:0.4; cursor:default; pointer-events:none; }
.adm-tabs {
  display:flex; gap:6px; padding:8px 16px; overflow-x:auto; flex-shrink:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
}
.adm-tab {
  padding:7px 13px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); font-family:var(--mono); font-size:11px;
  font-weight:700; cursor:pointer; white-space:nowrap; transition:all 0.15s; flex-shrink:0;
}
.adm-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.adm-section {
  border:1px solid var(--border); border-radius:12px; background:var(--surface);
  padding:14px; margin-bottom:12px;
}
.adm-section-title { font-size:12px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.adm-stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:12px; }
.adm-stat { border:1px solid var(--border); border-radius:10px; background:var(--surface); padding:10px 12px; }
.adm-stat b { display:block; font-size:18px; font-family:var(--mono); }
.adm-stat span { font-size:10px; color:var(--text2); }
.adm-row {
  display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:6px;
  border:1px solid var(--border); border-radius:9px; background:var(--surface); font-size:12px;
}
.adm-row .adm-row-main { flex:1; min-width:0; overflow:hidden; }
.adm-row .adm-row-sub { font-size:10px; color:var(--text2); font-family:var(--mono); }

/* ── REPORT GENERATOR — SITE AUDIT PRO STYLE ── */
.rg-overlay {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(4px);
  display:flex; align-items:stretch; justify-content:center;
  padding:0;
}
.rg-shell {
  display:flex; width:100%; max-width:1200px;
  background:var(--bg); overflow:hidden;
}
.rg-sidebar {
  width:240px; min-width:240px; flex-shrink:0;
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto;
}
.rg-sidebar-topbar {
  padding:11px 14px; border-bottom:1px solid var(--border);
  font-size:12px; font-weight:700; color:var(--text);
  flex-shrink:0; background:var(--surface);
  display:flex; align-items:center; gap:8px;
}
.rg-filter-tabs {
  display:flex; border-bottom:1px solid var(--border); flex-shrink:0;
}
.rg-tab {
  flex:1; padding:8px 4px; font-size:11px; font-weight:600;
  text-align:center; cursor:pointer; color:var(--text3);
  border-bottom:2px solid transparent; transition:all 0.15s;
  font-family:var(--mono);
}
.rg-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.rg-section {
  border-bottom:1px solid var(--border); padding:0;
}
.rg-section-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; cursor:pointer; user-select:none;
  transition:background 0.1s;
}
.rg-section-hdr:hover { background:var(--surface2); }
.rg-section-title {
  display:flex; align-items:center; gap:7px;
  font-size:11px; font-weight:700; color:var(--text);
}
.rg-section-dot {
  width:14px; height:14px; border-radius:3px;
  background:var(--accent); display:flex;
  align-items:center; justify-content:center; flex-shrink:0;
}
.rg-section-dot svg { width:9px; height:9px; fill:#fff; }
.rg-chevron { font-size:10px; color:var(--text3); transition:transform 0.2s; }
.rg-chevron.open { transform:rotate(180deg); }
.rg-section-body { padding:8px 14px 12px; }
.rg-section-body.collapsed { display:none; }
.rg-radio-group { display:flex; flex-direction:column; gap:5px; }
/* Report style cards */
.rg-style-list { display:flex; flex-direction:column; gap:6px; }
.rg-style-card {
  display:block; padding:8px 10px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface2);
  cursor:pointer; transition:all 0.13s;
}
.rg-style-card:hover { border-color:var(--accent); }
.rg-style-card.active {
  border-color:var(--accent); background:var(--accent-dim);
  box-shadow:0 0 0 1px var(--accent);
}
.rg-style-name { font-size:11.5px; font-weight:700; color:var(--text); }
.rg-style-card.active .rg-style-name { color:var(--accent); }
.rg-style-desc { font-size:9.5px; color:var(--text3); margin-top:2px; line-height:1.4; }
.rg-radio-row {
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:var(--text2); cursor:pointer;
  padding:2px 0; transition:color 0.12s;
}
.rg-radio-row:hover { color:var(--text); }
.rg-radio-row input[type=radio] { accent-color:var(--accent); width:13px; height:13px; }
.rg-check-row {
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:var(--text2); cursor:pointer;
  padding:4px 0; transition:color 0.12s;
}
.rg-check-row:hover { color:var(--text); }
.rg-check-row input[type=checkbox] { accent-color:var(--accent); width:13px; height:13px; }
.rg-color-list { display:flex; flex-direction:column; gap:8px; }
.rg-color-item {
  display:flex; align-items:center; justify-content:space-between;
  font-size:11px; color:var(--text2);
}
.rg-color-item input[type=color] {
  width:26px; height:22px; border:1px solid var(--border);
  border-radius:4px; padding:1px; cursor:pointer;
  background:var(--surface2);
}

/* ── REPORT GENERATOR MAIN AREA ── */
.rg-main {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg);
}
.rg-topbar {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.rg-topbar-title { font-size:13px; font-weight:700; color:var(--text); }
.rg-topbar-actions { display:flex; gap:7px; align-items:center; }
.rg-btn-outline {
  padding:6px 14px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; border:1px solid var(--border); background:var(--surface2);
  color:var(--text2); font-family:var(--mono); transition:all 0.15s;
}
.rg-btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.rg-btn-primary {
  padding:6px 16px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; border:none; background:var(--accent); color:#000;
  font-family:var(--mono); transition:opacity 0.15s;
}
.rg-btn-primary:hover { opacity:0.88; }
.rg-btn-close {
  width:30px; height:30px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; transition:all 0.15s; margin-left:4px;
}
.rg-btn-close:hover { border-color:var(--red); color:var(--red); }

/* ── PREVIEW AREA ── */
.rg-preview-wrap {
  flex:1; overflow-y:auto; padding:24px;
  background:#d0d0d0; display:flex;
  flex-direction:column; align-items:center; gap:18px;
}
body.theme-dark .rg-preview-wrap { background:#1a1a1a; }
.rg-page {
  background:#fff; width:100%; max-width:560px;
  border-radius:4px; overflow:hidden; position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  flex-shrink:0;
}
.rg-page-num {
  position:absolute; top:7px; right:8px; z-index:20;
  background:rgba(0,0,0,0.45); color:#fff;
  font-size:10px; font-family:monospace;
  padding:2px 6px; border-radius:10px; pointer-events:none;
}

/* Cover page */
.rg-cover { position:relative; overflow:hidden; }
.rg-cover-logo-strip {
  padding:12px 16px; background:#fff;
  border-bottom:1px solid #eee;
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.rg-cover-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.74) 50%, rgba(0,0,0,0.15) 100%);
  pointer-events:none;
}
.rg-cover-text {
  position:absolute; bottom:18px; left:18px; right:18px; z-index:5;
}
.rg-cover-title {
  font-size:19px; font-weight:800; color:#fff; line-height:1.2; margin-bottom:5px;
}
.rg-cover-date { font-size:11px; font-weight:600; color:rgba(255,255,255,0.82); margin-bottom:3px; }
.rg-cover-prepared { font-size:11px; font-weight:600; color:rgba(255,255,255,0.82); margin-bottom:6px; }
.rg-cover-note { font-size:10px; color:rgba(255,255,255,0.7); line-height:1.55; }

/* Summary page */
.rg-summary-pg { padding:16px 18px; background:#fff; }
.rg-summary-stats {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;
}
.rg-stat-card {
  background:#f7f7f7; border-radius:6px; padding:9px 10px; text-align:center;
}
.rg-stat-num { font-size:20px; font-weight:800; color:#111; }
.rg-stat-label { font-size:10px; color:#888; margin-top:2px; }
.rg-progress-bar {
  height:7px; background:#ececec; border-radius:4px; overflow:hidden; margin-bottom:4px;
}
.rg-progress-fill { height:100%; border-radius:4px; transition:width 0.4s; }
.rg-toc-row {
  display:flex; justify-content:space-between; align-items:center;
  font-size:10px; color:#444; padding:4px 0;
  border-bottom:1px dotted #e5e5e5;
}
.rg-toc-pg { font-weight:700; font-size:10px; }

/* Item cards */
.rg-items-pg { background:#fff; }
.rg-item-card {
  display:flex; gap:12px; padding:11px 16px;
  border-bottom:1px solid #f0f0f0;
}
.rg-item-card:last-child { border-bottom:none; }
.rg-item-header-bar {
  width:3px; flex-shrink:0; border-radius:2px; align-self:stretch; min-height:40px;
}
.rg-item-photos-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:3px;
}
.rg-photo-thumb {
  aspect-ratio:1; border-radius:3px;
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.rg-photo-num {
  position:absolute; top:2px; left:2px;
  background:rgba(0,0,0,0.55); color:#fff;
  width:13px; height:13px; border-radius:50%;
  font-size:7.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.rg-photo-ts {
  position:absolute; bottom:2px; left:1px; right:1px;
  font-size:6.5px; color:#fff;
  background:rgba(0,0,0,0.45); padding:1px 2px;
  border-radius:1px; text-align:center;
}
.rg-item-info { flex:1; min-width:0; }
.rg-item-title { font-size:12px; font-weight:700; color:#111; margin-bottom:3px; }
.rg-item-status {
  display:inline-flex; align-items:center; gap:3px;
  font-size:10px; font-weight:700; margin-bottom:4px;
}
.rg-item-note { font-size:10px; color:#555; line-height:1.5; }

/* Phone: preview on top (with pinned export bar), settings as a bottom sheet */
@media (max-width:640px) {
  .rg-shell { flex-direction:column; }
  .rg-main { order:1; flex:1; min-height:0; }
  .rg-sidebar {
    order:2; width:100%; min-width:0;
    max-height:46dvh; flex-shrink:0;
    border-right:none; border-top:1px solid var(--border);
    padding-bottom:var(--sab);
  }
  .rg-preview-wrap { padding:12px; }
  .rg-topbar { padding:10px 12px; }
  .rg-btn-outline, .rg-btn-primary { padding:10px 14px; font-size:12px; }
  .rg-check-row, .rg-radio-row { padding:7px 0; font-size:12px; }
  .rg-check-row input[type=checkbox] { width:17px; height:17px; }
  .rg-style-card { padding:11px 12px; }
  .rg-style-name { font-size:13px; }
  .rg-style-desc { font-size:10.5px; }
}


/* ── ENVIRONMENTAL CONDITIONS ── */
.env-wrap { flex:1; overflow-y:auto; padding:20px; }
.env-header-row {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;
}
.env-header-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
.env-upload-row { display:flex; gap:8px; }
.env-upload-btn {
  display:flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:8px; font-size:11px; font-weight:600;
  font-family:var(--mono); cursor:pointer; transition:all 0.15s; border:none;
}
.env-upload-btn.screenshot { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(61,184,245,0.25); }
.env-upload-btn.screenshot:hover { background:rgba(61,184,245,0.2); }
.env-upload-btn.csv { background:var(--green-dim); color:var(--green); border:1px solid rgba(52,211,153,0.25); }
.env-upload-btn.csv:hover { background:rgba(52,211,153,0.2); }

/* Sensor cards */
.env-sensor-grid { display:flex; flex-direction:column; gap:16px; }
.env-sensor-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; overflow:hidden;
}
.env-sensor-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--border);
  background:var(--surface2);
}
.env-sensor-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.env-sensor-id { font-family:var(--mono); font-size:10px; color:var(--text3); }
.env-sensor-meta { display:flex; gap:14px; }
.env-sensor-stat { text-align:right; }
.env-sensor-stat-val { font-family:var(--mono); font-size:12px; font-weight:600; }
.env-sensor-stat-lbl { font-size:10px; color:var(--text3); font-family:var(--mono); }
.env-sensor-del {
  width:26px; height:26px; border-radius:6px; border:none;
  background:none; color:var(--text3); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; transition:all 0.12s; flex-shrink:0;
}
.env-sensor-del:hover { background:var(--red-dim); color:var(--red); }

/* Date range filter */
.env-date-filter {
  padding:10px 16px 8px; border-bottom:1px solid var(--border);
  background:var(--bg); display:flex; flex-direction:column; gap:6px;
}
.env-date-filter-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.env-date-filter-label { font-family:var(--mono); font-size:10px; color:var(--text3); letter-spacing:0.8px; text-transform:uppercase; white-space:nowrap; }
.env-date-range-display {
  font-family:var(--mono); font-size:10px; color:var(--accent);
  background:var(--accent-dim); border:1px solid rgba(61,184,245,0.2);
  border-radius:5px; padding:2px 8px;
}
.env-range-track {
  position:relative; height:20px; display:flex; align-items:center;
}
.env-range-bar {
  position:absolute; left:0; right:0; height:4px;
  background:var(--border); border-radius:2px;
}
.env-range-fill {
  position:absolute; height:4px; background:var(--accent);
  border-radius:2px; pointer-events:none;
}
.env-range-input {
  position:absolute; width:100%; height:4px;
  -webkit-appearance:none; appearance:none;
  background:transparent; outline:none; pointer-events:none;
}
.env-range-input::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:var(--accent); border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--accent); cursor:pointer; pointer-events:all;
}
.env-range-presets { display:flex; gap:5px; flex-wrap:wrap; }
.env-preset-btn {
  font-family:var(--mono); font-size:10px; padding:3px 8px;
  border-radius:5px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text3); cursor:pointer; transition:all 0.12s;
}
.env-preset-btn:hover { border-color:var(--accent); color:var(--accent); }
.env-preset-btn.active { background:var(--accent-dim); border-color:rgba(61,184,245,0.35); color:var(--accent); }

/* Chart area */
.env-charts { padding:14px 16px; display:flex; flex-direction:column; gap:16px; }
.env-chart-block { margin-bottom:8px; }
.env-chart-label {
  font-size:10px; font-weight:600; letter-spacing:1px;
  text-transform:uppercase; font-family:var(--mono);
  margin-bottom:6px; display:flex; align-items:center; justify-content:space-between;
}
.env-chart-canvas-wrap {
  position:relative; width:100%; height:90px;
  background:var(--surface2); border-radius:8px;
  border:1px solid var(--border); overflow:hidden; display:block;
}
canvas.env-canvas { display:block; width:100%; height:100%; }

/* Stats strip */
.env-stats-strip {
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--border); border-radius:6px; overflow:hidden;
  margin-top:8px;
}
.env-stat-cell {
  background:var(--surface2); padding:7px 10px; text-align:center;
}
.env-stat-cell-val { font-family:var(--mono); font-size:12px; font-weight:600; }
.env-stat-cell-lbl { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:2px; }

/* Screenshot card */
.env-screenshot-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; overflow:hidden; margin-bottom:14px;
}
.env-screenshot-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--surface2); border-bottom:1px solid var(--border);
}
.env-screenshot-title { font-size:12px; font-weight:600; color:var(--text2); font-family:var(--mono); }
.env-screenshot-img { width:100%; display:block; max-height:360px; object-fit:contain; background:var(--surface3); }

/* Empty env state */
.env-empty {
  text-align:center; padding:52px 24px; color:var(--text3);
}
.env-empty-icon { font-size:42px; opacity:0.18; margin-bottom:12px; }
.env-empty-title { font-size:14px; font-weight:600; color:var(--text2); margin-bottom:6px; }
.env-empty-desc { font-size:12px; line-height:1.65; max-width:300px; margin:0 auto; }

/* Range badge */
.range-badge {
  font-family:var(--mono); font-size:10px; padding:2px 7px;
  border-radius:4px; border:1px solid var(--border); color:var(--text3);
}

/* ── THRESHOLD WARNINGS ── */
.env-threshold-bar {
  padding:10px 16px; border-bottom:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.env-threshold-inputs { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.env-threshold-field {
  display:flex; align-items:center; gap:6px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:5px 10px;
}
.env-threshold-field label { font-size:10px; font-family:var(--mono); color:var(--text3); white-space:nowrap; }
.env-threshold-field input {
  width:52px; background:none; border:none; outline:none;
  font-family:var(--mono); font-size:12px; color:var(--text); text-align:center;
}
.env-threshold-field.temp-field { border-color:rgba(249,115,22,0.3); }
.env-threshold-field.hum-field  { border-color:rgba(248,113,113,0.3); }
.env-zone-presets { display:flex; gap:5px; align-items:center; }
.env-zone-btn {
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.5px;
  padding:4px 9px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); cursor:pointer; transition:all 0.15s;
  white-space:nowrap;
}
.env-zone-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.env-zone-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.env-warnings-list { display:flex; flex-direction:column; gap:6px; margin:0 16px 10px; }
.env-warn-item {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-radius:8px; font-size:11px; font-family:var(--mono);
  animation: warnIn 0.25s ease;
}
@keyframes warnIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
.env-warn-item.temp-warn { background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.3); color:#f97316; }
.env-warn-item.hum-warn  { background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); color:#f87171; }
.env-warn-icon { font-size:14px; flex-shrink:0; }
.toast {
  position:fixed; bottom:calc(68px + var(--sab)); left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:8px 14px; font-size:11px; font-family:var(--mono);
  color:var(--text); opacity:0; transition:all 0.22s; z-index:999;
  white-space:nowrap; pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.green { border-color:var(--green); color:var(--green); }

input[type="radio"] {
  width: 14px;
  height: 14px;
  cursor: pointer;
}

@keyframes fieldShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.field-error {
  border-color: var(--red) !important;
  box-shadow: 0 0 0 2px var(--red-dim) !important;
  animation: fieldShake 0.3s ease-in-out 2;
}

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
#file-input, #env-file-input { display:none; }

/* ── RESPONSIVE BREAKPOINTS ── */

/* Mobile bottom nav */
.mobile-bottom-nav {
  display:none;
  position:fixed; bottom:0; left:0; right:0;
  background:var(--surface); border-top:1px solid var(--border);
  padding:8px 0 calc(8px + var(--sab));
  z-index:300;
  grid-template-columns:repeat(5,1fr);
}
.mbn-item {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; padding:4px 0;
  color:var(--text3); transition:color 0.15s;
}
.mbn-item.active { color:var(--accent); }
.mbn-icon { font-size:20px; }
.mbn-label { font-size:10px; font-family:var(--mono); letter-spacing:0.5px; }

/* Phone: stack vertically, hide left panel, show bottom nav */
@media (max-width:640px) {
  .app-body { flex-direction:column; }
  .right-panel { flex:1; overflow:hidden; }
  .mobile-bottom-nav { display:grid; }
  body { padding-bottom: calc(56px + var(--sab)); }
  .grid-wrap { padding:12px; }
  .folder-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .proj-grid { grid-template-columns:1fr; gap:8px; }
  .stats-row { grid-template-columns:repeat(3,1fr); font-size:11px; }
  .stats-row-5 { grid-template-columns:repeat(3,1fr); font-size:11px; }
  .stats-row-4 { grid-template-columns:repeat(2,1fr); }
  .env-threshold-bar { flex-wrap:wrap; gap:8px; }
  .env-threshold-inputs { flex-wrap:wrap; }
  .field-row { flex-direction:column; gap:0; }
  .modal {
    max-width:100%; margin:0;
    border-radius:16px 16px 0 0;
    max-height:92dvh;
    overflow-y:auto;
  }
  .modal-overlay { align-items:flex-end; padding:0; }
  .status-pills { flex-wrap:wrap; gap:4px; }
  .edit-header { padding:10px 12px; }
  .save-bar { padding:8px 12px calc(8px + var(--sab)); }
  .si-mobile-back-bar { display:flex; }
}

/* Tablet: narrower left panel */
@media (min-width:641px) and (max-width:1024px) {
  .left-panel { width:240px; }
  .proj-grid { grid-template-columns:repeat(2,1fr); }
  .folder-grid { grid-template-columns:repeat(3,1fr); }
  .stats-row { grid-template-columns:repeat(5,1fr); }
}

/* Desktop: full layout */
@media (min-width:1025px) {
  .left-panel { width:310px; }
  .proj-grid { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .folder-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
}

/* ── 1:1 PHOTO GRID ── */
.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:7px; }
.photo-card {
  position:relative; border-radius:8px; overflow:hidden;
  background:var(--surface3); border:1px solid var(--border);
  aspect-ratio:1/1; cursor:pointer; transition:all 0.15s;
}
.photo-card:hover { transform:scale(1.03); border-color:var(--accent); }
.photo-card img { width:100%; height:100%; object-fit:cover; }

/* ── FOLDER SORT/FILTER BAR ── */
.folder-controls {
  display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap;
}
.sort-btn {
  display:flex; align-items:center; gap:4px;
  font-size:10px; font-family:var(--mono); padding:4px 9px;
  border-radius:6px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); cursor:pointer;
  transition:all 0.12s; white-space:nowrap;
}
.sort-btn:hover { border-color:var(--accent); color:var(--accent); }
.sort-btn.active { background:var(--accent-dim); border-color:rgba(61,184,245,0.3); color:var(--accent); }
.filter-input {
  flex:1; min-width:100px; background:var(--surface2); border:1px solid var(--border);
  border-radius:7px; padding:5px 9px; font-size:12px; color:var(--text);
  font-family:var(--sans); outline:none;
}
.filter-input:focus { border-color:var(--accent); }
.filter-input::placeholder { color:var(--text3); }

/* ── AUDITOR GROUP HEADER ── */
.auditor-group-header {
  font-size:10px; font-weight:700; letter-spacing:1.2px;
  text-transform:uppercase; color:var(--text3); font-family:var(--mono);
  padding:14px 0 6px; border-bottom:1px solid var(--border);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.auditor-group-header .agh-count {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:4px; padding:1px 6px; font-size:10px; color:var(--text3);
}

/* ── PROJECT TYPE BADGE ── */
.proj-type-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-family:var(--mono); padding:2px 7px;
  border-radius:4px; background:var(--surface2); border:1px solid var(--border);
  color:var(--text3); margin-top:3px;
}
.proj-type-badge.division-4 { background: rgba(249, 115, 22, 0.12); border-color: rgba(249, 115, 22, 0.25); color: #f97316; }
.proj-type-badge.division-6 { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.25); color: #10b981; }
.proj-type-badge.division-8 { background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.25); color: #3b82f6; }
.proj-type-badge.division-10 { background: rgba(139, 92, 246, 0.12); border-color: rgba(139, 92, 246, 0.25); color: #8b5cf6; }

/* ── SECTION MOVE CONTROLS ── */
.section-mgr-item {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:8px 11px; margin-bottom:4px;
}
.section-mgr-name { flex:1; font-size:13px; }
.section-mgr-moves { display:flex; gap:3px; }
.section-mgr-move {
  width:24px; height:24px; border-radius:5px; border:1px solid var(--border);
  background:var(--surface3); color:var(--text2); cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; transition:all 0.12s;
}
.section-mgr-move:hover { border-color:var(--accent); color:var(--accent); }
.section-mgr-del {
  width:24px; height:24px; border-radius:6px; border:none;
  background:none; color:var(--text3); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; transition:all 0.12s;
}
.section-mgr-del:hover { background:var(--red-dim); color:var(--red); }

/* ── 6-WEEK LOOK AHEAD SCHEDULE ── */
.schedule-wrap { flex:1; overflow-y:auto; padding:16px; }
.schedule-header-row {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px;
}
.schedule-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
.week-grid {
  display:grid;
  grid-template-columns:200px repeat(6,1fr);
  gap:1px; background:var(--border);
  border-radius:10px; overflow:hidden; margin-bottom:16px;
  font-size:11px;
}
.week-cell {
  background:var(--surface2); padding:8px 10px; min-height:36px;
}
.week-cell.header {
  background:var(--surface); font-family:var(--mono); font-size:10px;
  font-weight:700; letter-spacing:0.8px; color:var(--text3);
  text-transform:uppercase; text-align:center;
}
.week-cell.si-label {
  background:var(--surface); font-size:11px; font-weight:500; color:var(--text);
  display:flex; flex-direction:column; gap:2px;
}
.week-cell.si-label .si-lbl-num { font-family:var(--mono); font-size:10px; color:var(--text3); }
.week-cell.editable {
  cursor:pointer; transition:background 0.1s;
}
.week-cell.editable:hover { background:var(--surface3); }
.week-cell.editable input {
  width:100%; background:transparent; border:none; outline:none;
  font-size:10px; color:var(--text); font-family:var(--sans);
}
.sched-status-dot {
  display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px;
}
.week-col-date { font-size:10px; color:var(--text3); font-family:var(--mono); display:block; }
.schedule-export-btn {
  display:flex; align-items:center; gap:7px; padding:9px 18px;
  background:var(--green-dim); color:var(--green);
  border:1px solid rgba(52,211,153,0.3); border-radius:9px;
  font-family:var(--mono); font-size:12px; font-weight:700;
  cursor:pointer; transition:all 0.15s;
}
.schedule-export-btn:hover { background:rgba(52,211,153,0.2); }
.labor-toggle-btn {
  display:flex; align-items:center; gap:6px; padding:9px 14px;
  background:var(--surface2); color:var(--text2);
  border:1px solid var(--border); border-radius:9px;
  font-family:var(--mono); font-size:12px; font-weight:700;
  cursor:pointer; transition:all 0.15s;
}
.labor-toggle-btn.active { background:rgba(96,165,250,0.12); color:#60a5fa; border-color:rgba(96,165,250,0.3); }
.labor-toggle-btn:hover { background:var(--surface3); }
.labor-panel {
  display:none; align-items:center; flex-wrap:wrap; gap:12px;
  padding:12px 16px; margin-bottom:12px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; font-size:11px;
}
.labor-panel.open { display:flex; }
.labor-panel-label { font-family:var(--mono); font-size:10px; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
.labor-num-input {
  width:54px; padding:5px 8px; background:var(--surface); border:1px solid var(--border);
  border-radius:7px; font-family:var(--mono); font-size:12px; font-weight:600;
  color:var(--text); text-align:center; outline:none;
}
.labor-num-input:focus { border-color:var(--accent); }
.workday-btns { display:flex; gap:3px; }
.workday-btn {
  padding:5px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text3); font-family:var(--mono);
  font-size:11px; font-weight:700; cursor:pointer; transition:all 0.1s;
}
.workday-btn.active { background:rgba(96,165,250,0.15); color:#60a5fa; border-color:rgba(96,165,250,0.35); }
.week-cell.labor-row {
  background:var(--accent); color:#fff;
  font-family:var(--mono); font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.5px;
  display:flex; flex-direction:column; gap:2px; padding:8px 10px;
}
body.theme-dark .week-cell.labor-row { background:var(--accent); color:#000; }
.labor-bar-wrap { width:100%; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; margin-top:3px; }
.labor-bar { height:4px; border-radius:2px; transition:width 0.3s; }
.cell-labor-inputs { display:flex; gap:6px; margin-top:5px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.07); align-items:center; }
.cell-labor-field { display:flex; align-items:center; gap:2px; font-size:10px; color:var(--text3); font-family:var(--mono); }
.cell-labor-inp {
  width:38px; padding:2px 4px; background:rgba(255,255,255,0.05);
  border:1px solid var(--border); border-radius:4px;
  font-size:10px; color:var(--text); font-family:var(--mono);
  text-align:center; outline:none;
}
.cell-labor-inp:focus { border-color:rgba(96,165,250,0.5); background:rgba(96,165,250,0.06); }
.si-rem-hours { font-size:10px; font-family:var(--mono); margin-top:1px; color:var(--text3); }
.si-rem-hours.low { color:#f97316; }
.si-rem-hours.done { color:#22c55e; }

/* ── TOWER WORK ── */
.tower-section { border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:4px; }
.tower-toggle-btn {
  width:100%; display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:var(--surface2); border:none; cursor:pointer;
  font-size:12px; font-weight:700; font-family:var(--mono); color:var(--text2);
  transition:all 0.15s; text-align:left;
}
.tower-toggle-btn.active { background:rgba(96,165,250,0.1); color:#60a5fa; }
.tower-toggle-btn .tw-chevron { margin-left:auto; font-size:10px; transition:transform 0.2s; }
.tower-toggle-btn.active .tw-chevron { transform:rotate(180deg); }
.tower-body { padding:12px 14px; background:var(--surface); }
.tw-stats-row { display:flex; gap:16px; margin-bottom:10px; align-items:flex-end; }
.tw-stat { display:flex; flex-direction:column; gap:1px; }
.tw-stat-num { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--text); line-height:1; }
.tw-stat-label { font-size:10px; font-family:var(--mono); color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; }
.tw-progress-bar { height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; margin-bottom:12px; }
.tw-progress-fill { height:100%; border-radius:3px; transition:width 0.3s; }
.tw-room-list { max-height:220px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:3px; }
.tw-room-row {
  display:flex; align-items:center; gap:8px; padding:6px 8px;
  border-radius:7px; background:var(--surface2); font-size:11px;
  cursor:pointer; transition:background 0.1s; user-select:none;
}
.tw-room-row:hover { background:var(--surface3); }
.tw-room-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.tw-room-num { font-family:var(--mono); font-weight:700; font-size:12px; color:var(--text); min-width:44px; }
.tw-room-type { flex:1; color:var(--text2); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tw-room-status-lbl { font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap; }
.tw-room-del { font-size:10px; color:var(--text3); cursor:pointer; padding:2px 6px; border-radius:4px; border:none; background:transparent; flex-shrink:0; }
.tw-room-del:hover { background:var(--red-dim); color:var(--red); }
.tw-add-section { border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:7px; }
.tw-input-row { display:flex; gap:6px; align-items:center; }
.tw-input {
  flex:1; padding:7px 10px; background:var(--surface2); border:1px solid var(--border);
  border-radius:7px; font-size:11px; color:var(--text); outline:none; min-width:0;
}
.tw-input:focus { border-color:var(--accent); }
.tw-input.narrow { flex:0 0 72px; text-align:center; }
.tw-add-btn {
  padding:7px 12px; background:rgba(96,165,250,0.12); color:#60a5fa;
  border:1px solid rgba(96,165,250,0.3); border-radius:7px;
  font-size:11px; font-weight:700; font-family:var(--mono); cursor:pointer; white-space:nowrap;
}
.tw-add-btn:hover { background:rgba(96,165,250,0.22); }
.tw-badge {
  font-family:var(--mono); font-size:10px; font-weight:700;
  padding:2px 6px; border-radius:20px;
  background:rgba(96,165,250,0.12); color:#60a5fa;
  border:1px solid rgba(96,165,250,0.25); white-space:nowrap; flex-shrink:0;
}
.tw-badge.done { background:rgba(34,197,94,0.12); color:#22c55e; border-color:rgba(34,197,94,0.3); }

/* ── CONTEXT MENU ── */
.ctx-menu {
  position:fixed; z-index:800;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:11px; overflow:hidden;
  box-shadow:0 12px 36px rgba(0,0,0,0.5);
  min-width:190px;
  animation:ctxIn 0.12s ease;
}
@keyframes ctxIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
.ctx-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; cursor:pointer; font-size:13px;
  transition:background 0.1s; color:var(--text);
}
.ctx-item:hover { background:var(--surface3); }
.ctx-item.danger { color:var(--red); }
.ctx-item.danger:hover { background:var(--red-dim); }
.ctx-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
.ctx-divider { height:1px; background:var(--border); margin:2px 0; }
.ctx-backdrop { position:fixed; inset:0; z-index:799; }

/* ── DUPLICATE OPTIONS TOGGLE ── */
.dup-option {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer; transition:all 0.15s;
}
.dup-option:hover { border-color:var(--border2); }
.dup-option-left { display:flex; align-items:center; gap:10px; }
.dup-option-icon { font-size:18px; }
.dup-option-title { font-size:13px; font-weight:500; }
.dup-option-desc { font-size:11px; color:var(--text2); margin-top:2px; }
.toggle-switch {
  width:38px; height:22px; border-radius:11px;
  background:var(--border); position:relative;
  transition:background 0.2s; flex-shrink:0;
}
.toggle-switch.on { background:var(--accent); }
.toggle-switch::after {
  content:''; position:absolute;
  width:16px; height:16px; border-radius:50%;
  background:#fff; top:3px; left:3px;
  transition:transform 0.2s;
}
.toggle-switch.on::after { transform:translateX(16px); }

/* ── SECTION MANAGER ── */
.section-mgr-list { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.section-mgr-item {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:8px 11px;
}
.section-mgr-name { flex:1; font-size:13px; }
.section-mgr-del {
  width:24px; height:24px; border-radius:6px; border:none;
  background:none; color:var(--text3); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.12s;
}
.section-mgr-del:hover { background:var(--red-dim); color:var(--red); }

/* ── XLS IMPORT ── */
.import-xls-btn {
  display:flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:8px; font-size:11px; font-weight:600;
  font-family:var(--mono); cursor:pointer; transition:all 0.15s;
  background:rgba(251,191,36,0.12); color:#fbbf24;
  border:1px solid rgba(251,191,36,0.25);
}
.import-xls-btn:hover { background:rgba(251,191,36,0.2); }
.innergy-btn { background:rgba(139,92,246,0.12) !important; color:#a78bfa !important; border-color:rgba(139,92,246,0.25) !important; }
.innergy-btn:hover { background:rgba(139,92,246,0.22) !important; }
.innergy-job-list { display:flex; flex-direction:column; gap:6px; max-height:min(52vh,480px); overflow-y:auto; margin-top:8px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.innergy-job-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); cursor:pointer; transition:all 0.15s; }
.innergy-job-row:hover { border-color:#a78bfa; background:rgba(139,92,246,0.08); }
.innergy-job-row.selected { border-color:#a78bfa; background:rgba(139,92,246,0.15); }
.innergy-job-num { font-family:var(--mono); font-size:11px; font-weight:700; color:#a78bfa; min-width:70px; }
.innergy-job-name { flex:1; font-size:13px; font-weight:500; }
.innergy-job-client { font-size:11px; color:var(--text2); }
.innergy-job-status { font-size:10px; padding:2px 7px; border-radius:20px; background:var(--surface3); color:var(--text2); white-space:nowrap; }
.innergy-search { width:100%; box-sizing:border-box; margin-bottom:10px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text1); font-size:13px; outline:none; }
.innergy-search:focus { border-color:#a78bfa; }
.innergy-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
.innergy-detail-field { display:flex; flex-direction:column; gap:3px; }
.innergy-detail-label { font-size:10px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.innergy-detail-value { font-size:13px; color:var(--text1); }
.innergy-section-title { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
.innergy-labor-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.innergy-labor-row:last-child { border-bottom:none; }
.innergy-labor-row span:last-child { font-family:var(--mono); color:#a78bfa; font-weight:700; }
.xls-preview-wrap { display:flex; flex-direction:column; gap:0; }
.xls-preview-meta {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; margin-bottom:10px;
}
.xls-preview-meta-row { display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; }
.xls-meta-field { display:flex; flex-direction:column; gap:2px; }
.xls-meta-label { font-size:10px; font-family:var(--mono); color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; }
.xls-meta-val { font-size:12px; color:var(--text); font-weight:500; }
.xls-sheet-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
.xls-sheet-tab {
  font-size:10px; font-family:var(--mono); padding:4px 10px;
  border-radius:6px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text3); cursor:pointer; transition:all 0.12s;
}
.xls-sheet-tab:hover { border-color:var(--accent); color:var(--accent); }
.xls-sheet-tab.active { background:var(--accent-dim); border-color:rgba(61,184,245,0.35); color:var(--accent); }
.xls-section-group { margin-bottom:6px; }
.xls-section-hdr {
  display:flex; align-items:center; gap:8px; padding:7px 10px;
  background:var(--surface); border:1px solid var(--border); border-radius:6px 6px 0 0;
  font-size:10px; font-weight:700; color:var(--text2); font-family:var(--mono);
  letter-spacing:0.6px; text-transform:uppercase; cursor:pointer; user-select:none;
}
.xls-section-hdr:hover { background:var(--surface2); }
.xls-section-check {
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border);
  background:var(--surface2); cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:10px; flex-shrink:0; transition:all 0.1s;
}
.xls-section-check.on { background:var(--accent); border-color:var(--accent); color:#000; }
.xls-section-count { margin-left:auto; font-size:10px; color:var(--text3); }
.xls-si-list { border:1px solid var(--border); border-top:none; border-radius:0 0 6px 6px; overflow:hidden; margin-bottom:8px; }
.xls-si-row {
  display:flex; align-items:center; gap:10px; padding:7px 12px;
  border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.1s;
}
.xls-si-row:last-child { border-bottom:none; }
.xls-si-row:hover { background:var(--surface2); }
.xls-si-row.excluded { opacity:0.38; }
.xls-row-check {
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border);
  background:var(--surface2); display:flex; align-items:center;
  justify-content:center; font-size:10px; flex-shrink:0; transition:all 0.1s;
}
.xls-row-check.on { background:var(--accent); border-color:var(--accent); color:#000; }
.xls-si-num { font-family:var(--mono); font-size:10px; color:var(--accent); min-width:38px; flex-shrink:0; }
.xls-si-desc { font-size:11px; color:var(--text); flex:1; line-height:1.4; }
.xls-si-loc { font-size:10px; color:var(--text3); font-family:var(--mono); white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
.xls-scroll { overflow-y:auto; max-height:40vh; }
.xls-footer {
  display:flex; align-items:center; justify-content:space-between;
  padding-top:10px; border-top:1px solid var(--border); margin-top:4px; flex-wrap:wrap; gap:8px;
}
.xls-count-badge { font-size:11px; font-family:var(--mono); color:var(--text2); }
.xls-count-badge span { color:var(--accent); font-weight:700; }
.xls-select-all {
  font-size:10px; font-family:var(--mono); color:var(--text3); cursor:pointer;
  padding:3px 8px; border-radius:5px; border:1px solid var(--border);
  background:var(--surface2); transition:all 0.12s;
}
.xls-select-all:hover { color:var(--accent); border-color:var(--accent); }
.xls-import-progress {
  text-align:center; padding:30px; color:var(--text3); font-family:var(--mono); font-size:12px;
}
.xls-import-progress .spin { font-size:28px; animation:spin 1s linear infinite; display:block; margin-bottom:10px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── MANPOWER TRACKING v1.0 ── */

/* Labor log panel inside SI editor */
#labor-log-panel { margin-top: 4px; }

/* Manpower dashboard column header alignment */
.mp-table-header {
  display: grid;
  grid-template-columns: 100px 1fr 80px 80px 80px 140px 36px;
  background: var(--surface2);
  border-bottom: 2px solid var(--border);
}

/* Number inputs in labor log form — hide spinners for cleaner look */
input[type="number"].mp-input::-webkit-inner-spin-button,
input[type="number"].mp-input::-webkit-outer-spin-button {
  opacity: 0.4;
}

/* Burn bar animation */
@keyframes burnBarIn {
  from { width: 0%; }
}
.mp-burn-bar {
  animation: burnBarIn 0.5s ease;
}

/* ── SCHEDULE GRID v2.0 ── */
.sched-cell {
  padding: 7px 9px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  min-height: 38px;
  box-sizing: border-box;
}
.sched-si-col {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--surface) !important;
  border-right: 2px solid var(--border2) !important;
  box-shadow: 2px 0 8px rgba(0,0,0,0.08);
}
.sched-week-header {
  background: var(--surface);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--text3);
  text-transform: uppercase;
  text-align: center;

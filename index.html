window.handleContactCSV = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactCSV(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      save();
      buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid contacts found in CSV', 'red');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function parseContactCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/['"]/g, ''));

  const map = { name:-1, role:-1, company:-1, phone:-1, email:-1, notes:-1, category:-1, project:-1 };
  headers.forEach((h, i) => {
    if      (/name/.test(h))                   map.name     = i;
    else if (/role|position|title/.test(h))    map.role     = i;
    else if (/company|org|firm/.test(h))       map.company  = i;
    else if (/phone|mobile|cell|tel/.test(h))  map.phone    = i;
    else if (/email|mail/.test(h))             map.email    = i;
    else if (/category|type|trade/.test(h))    map.category = i;
    else if (/note|comment|info/.test(h))      map.notes    = i;
    else if (/project|site/.test(h))           map.project  = i;
  });

  if (map.name === -1) return [];

  const result = [];
  lines.slice(1).forEach(line => {
    const cols = line.split(sep).map(c => c.trim().replace(/^["']|["']$/g, ''));
    if (cols[map.name]) {
      result.push({
        id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
        name:     cols[map.name],
        category: map.category !== -1 ? cols[map.category] || 'Other'    : 'Other',
        project:  map.project  !== -1 ? cols[map.project]  || 'Office'   : 'Office',
        role:     map.role     !== -1 ? cols[map.role]     || 'Contact'  : 'Contact',
        company:  map.company  !== -1 ? cols[map.company]  || 'External' : 'External',
        phone:    map.phone    !== -1 ? cols[map.phone]    || ''         : '',
        email:    map.email    !== -1 ? cols[map.email]    || ''         : '',
        notes:    map.notes    !== -1 ? cols[map.notes]    || ''         : ''
      });
    }
  });
  return result;
}

// ── VCF (vCard) Import ──────────────────────────────────────────
window.handleContactVCF = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactVCF(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      save(); buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid vCards found in file', 'red');
    }
  };
  reader.readAsText(file); e.target.value = '';
};

function parseContactVCF(text) {
  // Unfold vCard folded lines (continuation lines start with space or tab)
  const unfolded = text.replace(/\r?\n[ \t]/g, '');
  const blocks = unfolded.split(/BEGIN:VCARD/i).slice(1);
  const results = [];

  blocks.forEach(block => {
    const endIdx = block.search(/END:VCARD/i);
    if (endIdx === -1) return;
    const lines = block.slice(0, endIdx).split(/\r?\n/).filter(l => l.trim());

    // Parse all key:value pairs; key may have type params (KEY;PARAM=val:value)
    const fields = {};
    lines.forEach(line => {
      const colon = line.indexOf(':');
      if (colon === -1) return;
      const rawKey = line.slice(0, colon).split(';')[0].toLowerCase().trim();
      const value  = line.slice(colon + 1).trim();
      if (!fields[rawKey]) fields[rawKey] = value; // keep first occurrence
    });

    const name = fields['fn'] || '';
    if (!name) return;

    results.push({
      id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
      name,
      category: fields['categories'] || 'Other',
      project:  fields['x-adh-project'] || 'Office',
      role:     fields['title'] || 'Contact',
      company:  (fields['org'] || '').split(';')[0] || 'External',
      phone:    fields['tel'] || '',
      email:    fields['email'] || '',
      notes:    (fields['note'] || '').replace(/\\n/g, '\n')
    });
  });
  return results;
}

// ── XLSX Import ─────────────────────────────────────────────────
window.handleContactXLSX = function(e) {
  const file = e.target.files[0]; if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb   = XLSX.read(ev.target.result, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      const list = rows.map(row => {
        // Normalize keys to lowercase for flexible matching
        const r = {};
        Object.keys(row).forEach(k => { r[k.toLowerCase().trim()] = String(row[k]).trim(); });
        const name = r['name'] || r['full name'] || r['contact name'] || '';
        if (!name) return null;
        return {
          id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
          name,
          category: r['category'] || r['type']         || 'Other',
          project:  r['project']  || r['site']         || 'Office',
          role:     r['role']     || r['title']        || r['position'] || 'Contact',
          company:  r['company']  || r['org']          || r['organization'] || 'External',
          phone:    r['phone']    || r['mobile']       || r['tel'] || '',
          email:    r['email']    || r['e-mail']       || '',
          notes:    r['notes']    || r['note']         || r['comments'] || ''
        };
      }).filter(Boolean);

      if (list.length > 0) {
        store.contacts = [...store.contacts, ...list];
        save(); buildContactBookView();
        showToast(`✓ Imported ${list.length} contacts`, 'green');
      } else {
        showToast('No valid contacts found in file', 'red');
      }
    } catch(err) {
      showToast('Error reading Excel file', 'red');
    }
  };
  reader.readAsArrayBuffer(file); e.target.value = '';
};

function getFolderState(fid) {
  if(!_folderState[fid]) _folderState[fid]={sort:'name',filter:'',groupBy:'none'};
  return _folderState[fid];

// Global rebuild — called from inline onclick without .toString() issues
window.rebuildFolderProjs = function(fid) {
  const folder=getFolder(fid); if(!folder) return;
  const fs=getFolderState(fid);
  const area=document.getElementById('folder-proj-area'); if(!area) return;

  let projs=folder.projects.map(id=>getProject(id)).filter(Boolean);

  // Filter
  const q=(fs.filter||'').toLowerCase();
  if(q) projs=projs.filter(p=>
    p.name.toLowerCase().includes(q)||
    p.client.toLowerCase().includes(q)||
    p.auditor.toLowerCase().includes(q)||
    (p.projectType||'').toLowerCase().includes(q)
  );

  // Sort — always sort, folders always stay ordered
  projs.sort((a,b)=>{
    if(fs.sort==='date')   return (b.date||'').localeCompare(a.date||'');
    if(fs.sort==='client') return (a.client||'').localeCompare(b.client||'');
    if(fs.sort==='auditor')return (a.auditor||'').localeCompare(b.auditor||'');
    return a.name.localeCompare(b.name); // default A-Z
  });

  // Refresh sort button states
  ['name','date','client'].forEach(s=>{
    document.getElementById('sort-btn-'+s)?.classList.toggle('active', fs.sort===s);
  });
  const grpBtn=document.getElementById('sort-btn-auditor');
  if(grpBtn) grpBtn.classList.toggle('active', fs.groupBy==='auditor');

  // Render
  if(!projs.length) { area.innerHTML=emptyMsg('No projects match'); return; }

  if(fs.groupBy==='auditor') {
    const groups={};
    projs.forEach(p=>{ const k=p.auditor||'Unassigned'; if(!groups[k]) groups[k]=[]; groups[k].push(p); });
    area.innerHTML=Object.keys(groups).sort().map(aud=>`
      <div class="auditor-group-header">👤 ${aud} <span class="agh-count">${groups[aud].length}</span></div>
      <div class="proj-grid" style="margin-bottom:20px">${groups[aud].map(p=>projCardHTML(p,fid)).join('')}</div>
    `).join('');
  } else {
    area.innerHTML=`<div class="proj-grid">
      ${projs.map(p=>projCardHTML(p,fid)).join('')}
      <div class="proj-card new-card" onclick="showNewProjectModal('${fid}')">
        <div style="font-size:22px;opacity:0.4">＋</div><div style="font-size:12px">New Project</div>
      </div>
    </div>`;
  }
};

function startRenameNum(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  const displayEl = document.getElementById('si-num-display');
  if(!displayEl) return;
  displayEl.onclick = null;
  const currentNum = item.num.replace(/^SI\s+/, '');
  displayEl.innerHTML = `
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-size:16px; font-weight:700; color:var(--text3)">SI#</span>
      <input id="rename-num-input" class="field-input"
        style="font-size:16px;font-weight:700;padding:2px 6px;width:90px;"
        value="${currentNum.replace(/"/g,'&quot;')}" />
      <button onclick="confirmRenameNum('${pid}','${sid}')"
        style="background:var(--accent);color:#000;border:none;border-radius:7px;
        padding:4px 12px;font-size:11px;font-weight:700;font-family:var(--mono);cursor:pointer;">
        ✓
      </button>
    </div>`;
  const inp = document.getElementById('rename-num-input');
  if(inp) {
    inp.focus(); inp.select();
    inp.addEventListener('keydown', e => {
      if(e.key==='Enter') { e.preventDefault(); confirmRenameNum(pid, sid); }
      if(e.key==='Escape') buildSIEditor(pid, sid);
    });
  }
}

function confirmRenameNum(pid, sid) {
  const inp = document.getElementById('rename-num-input'); if(!inp) return;
  let newNum = inp.value.trim();
  if(!newNum) { showToast('Number cannot be empty'); return; }
  const item = getSI(pid, sid); if(!item) return;
  syncEditorToStore(pid, sid);
  item.num = 'SI ' + newNum;
  save();
  buildSIEditor(pid, sid);
  renderLeft(route());
  showToast('✓ SI# Updated', 'green');
}

function showRenameSINumModal(pid, sid) {
  const item = getSI(pid, sid);
  if (!item) return;
  const currentNum = item.num.replace(/^SI\s+/, '');

  makeModal(
    `Rename SI# ${currentNum}`,
    `<div class="field-group">
      <div class="field-label">New SI Number</div>
      <input id="rename-si-modal-input" class="field-input" value="${currentNum.replace(/"/g,'&quot;')}" />
    </div>`,
    () => {
      const newNum = document.getElementById('rename-si-modal-input')?.value.trim();
      if (!newNum) {
        showToast('Number cannot be empty');
        return;
      }
      item.num = 'SI ' + newNum;
      save();
      closeModal();
      // If the SI editor is open for this item, refresh it
      const currentRoute = route();

        buildSIEditor(pid, sid);

      renderLeft(route()); // Always refresh the left panel

}

function buildScheduleView(pid) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.schedule) proj.schedule = {};
  if(!proj.laborSettings) proj.laborSettings = { show:false, workers:4, hoursPerDay:8, workDays:5 };
  if(!proj.laborLog) proj.laborLog = {};
  const ls = proj.laborSettings;

  const el = document.getElementById('v-schedule');
  const items = proj.items;

  function getMonday(d) {
    const day = d.getDay(), diff = d.getDate() - day + (day===0?-6:1);
    return new Date(d.setDate(diff));
  }
  const mon = getMonday(new Date());
  const weeks = Array.from({length:6},(_,i)=>{
    const d = new Date(mon); d.setDate(mon.getDate()+i*7);
    const end = new Date(d); end.setDate(d.getDate()+6);
    return { label:`Wk ${i+1}`, dates:`${d.getMonth()+1}/${d.getDate()} – ${end.getMonth()+1}/${end.getDate()}`, key:`w${i}` };
  });

  function statusDot(s) {
    const c={completed:'#22c55e','punch-ongoing':'#a855f7','not-ready':'#ef4444','in-progress':'#fbbf24','on-hold':'#f97316',pending:'#4e5669'};
    return `<span class="sched-status-dot" style="background:${c[s]||c.pending}"></span>`;
  }

  // Per-week labor totals
  const weekLabor = weeks.map(w => {
    const scheduled = items.reduce((sum, item) => {
      const hasCell = !!(proj.schedule[`${item.id}_${w.key}`] || '').trim();
      return sum + (hasCell && item.laborHours ? item.laborHours : 0);
    }, 0);
    const logged = items.reduce((sum, item) => {
      const log = proj.laborLog[`${item.id}_${w.key}`] || {};
      return sum + (log.hours || 0);
    }, 0);
    const capacity = ls.workers * ls.hoursPerDay * ls.workDays;
    const display = logged > 0 ? logged : scheduled;
    const pct = capacity > 0 ? Math.round((display / capacity) * 100) : 0;
    const barColor = pct > 100 ? '#ef4444' : pct >= 80 ? '#fbbf24' : '#22c55e';
    return { scheduled, logged, capacity, pct, barColor, display };
  });

  const headerRow = `
    <div class="week-cell header">SI Item</div>
    ${weeks.map(w=>`<div class="week-cell header">${w.label}<span class="week-col-date">${w.dates}</span></div>`).join('')}`;

  const dataRows = items.map(item => {
    const totalLogged = weeks.reduce((sum, w) => {
      const log = proj.laborLog[`${item.id}_${w.key}`] || {};
      return sum + (log.hours || 0);
    }, 0);
    const remaining = (item.laborHours || 0) - totalLogged;
    const remPct = item.laborHours > 0 ? remaining / item.laborHours : 1;
    const remClass = remaining <= 0 ? 'done' : remPct < 0.25 ? 'low' : '';
    const remLabel = remaining <= 0 ? '✓ Fully logged' : `${remaining}h left`;
    return `
    <div class="week-cell si-label">
      <span class="si-lbl-num">${statusDot(item.status)}${item.num}</span>
      <span style="font-size:10px;line-height:1.3">${item.title}</span>
      ${item.laborHours != null ? `<span style="font-size:9px;font-family:var(--mono);color:var(--text3);margin-top:1px">⏱ ${item.laborHours}h est.</span>` : ''}
      ${ls.show && item.laborHours ? `<span class="si-rem-hours ${remClass}">${remLabel}</span>` : ''}
    </div>
    ${weeks.map(w => {
      const key = `${item.id}_${w.key}`;
      const val = (proj.schedule[key] || '').replace(/'/g, '&#39;');
      const log = proj.laborLog[key] || {};
      return `<div class="week-cell editable">
        <input type="text" value="${val}" placeholder="—"
          onchange="saveScheduleCell('${pid}','${key}',this.value)"
          onfocus="this.select()" />
        ${ls.show && item.laborHours ? `
          <div class="cell-labor-inputs">
            <div class="cell-labor-field">👷 <input type="number" class="cell-labor-inp" min="0" max="99"
              value="${log.workers || ''}" placeholder="0"
              onchange="saveLaborLog('${pid}','${key}','workers',+this.value||0)"
              title="Workers on this item this week" /></div>
            <div class="cell-labor-field">⏱ <input type="number" class="cell-labor-inp" min="0" max="9999"
              value="${log.hours || ''}" placeholder="0h"
              onchange="saveLaborLog('${pid}','${key}','hours',+this.value||0)"
              title="Hours logged this week" /></div>
          </div>` : ''}
      </div>`;
    }).join('')}
  `;
  }).join('');

  const laborRow = ls.show ? `
    <div class="week-cell labor-row" style="justify-content:center">👷 LABOR</div>
    ${weekLabor.map(wl=>`
      <div class="week-cell labor-row">
        <span style="color:#93c5fd;font-size:10px">${wl.logged > 0 ? wl.logged + 'h logged' : wl.scheduled + 'h est'} <span style="color:#475569;font-size:9px">/ ${wl.capacity}h cap</span></span>
        <span style="font-size:9px;color:${wl.barColor}">${wl.pct}% utilized</span>
        <div class="labor-bar-wrap"><div class="labor-bar" style="width:${Math.min(wl.pct,100)}%;background:${wl.barColor}"></div></div>
      </div>`).join('')}` : '';

  const laborPanelHTML = `
    <div class="labor-panel ${ls.show ? 'open' : ''}" id="labor-panel-${pid}">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="labor-panel-label">Workers</span>
        <input type="number" class="labor-num-input" min="1" max="999" value="${ls.workers}"
          onchange="saveScheduleSetting('${pid}','workers',+this.value||1)" />
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="labor-panel-label">Hrs / Day</span>
        <input type="number" class="labor-num-input" min="1" max="24" value="${ls.hoursPerDay}"
          onchange="saveScheduleSetting('${pid}','hoursPerDay',+this.value||8)" />
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="labor-panel-label">Work Days</span>
        <div class="workday-btns">
          ${[5,6,7].map(d=>`<button class="workday-btn ${ls.workDays===d?'active':''}"
            onclick="saveScheduleSetting('${pid}','workDays',${d})">${d}d</button>`).join('')}
        </div>
      </div>
      <div style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">
        Capacity: ${ls.workers * ls.hoursPerDay * ls.workDays}h/wk per crew
      </div>
    </div>`;

  el.innerHTML=`
    <div class="schedule-wrap">
      <div class="schedule-header-row">
        <div class="schedule-title">📅 6-Week Look Ahead
          <span style="font-size:11px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="labor-toggle-btn ${ls.show?'active':''}" onclick="saveScheduleSetting('${pid}','show',${!ls.show})">
            👷 Manpower
          </button>
          <button class="schedule-export-btn" onclick="exportSchedulePDF('${pid}')">
            ⬇ Export Schedule PDF
          </button>
        </div>
      </div>

      ${ls.show ? laborPanelHTML : ''}

      ${items.length===0?`
        <div style="text-align:center;padding:48px;color:var(--text3)">
          <div style="font-size:36px;opacity:0.2;margin-bottom:12px">📅</div>
          <div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px">No site items yet</div>
          <div style="font-size:12px">Add SI items to the project first, then schedule them here.</div>
        </div>
      `:`
        <div style="overflow-x:auto;">
          <div class="week-grid" style="min-width:700px">
            ${headerRow}
            ${dataRows}
            ${laborRow}
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:10px;font-family:var(--mono)">
          💡 Tap any cell to enter planned activity. Schedule exports separately from the audit PDF.
        </div>
      `}
    </div>`;
}

window.saveScheduleCell=function(pid,key,val){
  const proj=getProject(pid); if(!proj) return;
  if(!proj.schedule) proj.schedule={};
  if(val.trim()) proj.schedule[key]=val.trim();
  else delete proj.schedule[key];
  save();
};

window.saveScheduleSetting=function(pid,field,value){
  const proj=getProject(pid); if(!proj) return;
  if(!proj.laborSettings) proj.laborSettings={show:false,workers:4,hoursPerDay:8,workDays:5};
  proj.laborSettings[field]=value;
  save();
  buildScheduleView(pid);
};

window.saveLaborLog=function(pid,key,field,value){
  const proj=getProject(pid); if(!proj) return;
  if(!proj.laborLog) proj.laborLog={};
  if(!proj.laborLog[key]) proj.laborLog[key]={workers:0,hours:0};
  proj.laborLog[key][field]=value;
  if(!proj.laborLog[key].workers && !proj.laborLog[key].hours) delete proj.laborLog[key];
  save();
  buildScheduleView(pid);
};

async function exportSchedulePDF(pid) {
  const proj=getProject(pid); if(!proj) return;

  // Wait for jsPDF
  let attempts=0;
  while(typeof window.jspdf==='undefined'&&attempts<32){
    await new Promise(r=>setTimeout(r,250)); attempts++;
  }
  if(typeof window.jspdf==='undefined') return showToast('PDF library not loaded');

  showPDFProgress('Building Schedule PDF…',0);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const PW=297,PH=210;

  // Colors
  const BG='#1e3a5f', FG='#ffffff', ROW1='#f8fafc', ROW2='#eef2f7', BORDER='#cbd5e1';
  function h2r(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

  // Header
  doc.setFillColor(...h2r(BG)); doc.rect(0,0,PW,22,'F');
  doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
  doc.text('6-WEEK LOOK AHEAD',14,10);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(proj.name+'  ·  Auditor: '+(proj.auditor||'—')+'  ·  Generated: '+new Date().toLocaleDateString(),14,17);

  // Week headers
  function getMonday(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);return new Date(d.setDate(diff));}
  const mon=getMonday(new Date());
  const weeks=Array.from({length:6},(_,i)=>{
    const d=new Date(mon); d.setDate(mon.getDate()+i*7);
    const e=new Date(d); e.setDate(d.getDate()+6);
    return {label:`Week ${i+1}`,dates:`${d.getMonth()+1}/${d.getDate()}–${e.getMonth()+1}/${e.getDate()}`,key:`w${i}`};
  });

  const colW=(PW-14-80)/6;
  const rowH=10;
  const startY=26;
  const siColW=80;

  // Column headers
  doc.setFillColor(...h2r(BG)); doc.rect(14,startY,siColW,8,'F');
  doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
  doc.text('SITE ITEM',16,startY+5.5);
  weeks.forEach((w,i)=>{
    const x=14+siColW+i*colW;
    doc.setFillColor(...h2r(BG)); doc.rect(x,startY,colW,8,'F');
    doc.setTextColor(...h2r(FG)); doc.text(w.label,x+2,startY+4,{maxWidth:colW-4});
    doc.setFontSize(6); doc.setFont('helvetica','normal'); doc.setTextColor(180,200,220);
    doc.text(w.dates,x+2,startY+7.5,{maxWidth:colW-4});
    doc.setFontSize(7); doc.setFont('helvetica','bold');
  });

  // Rows
  let y=startY+8;
  proj.items.forEach((item,ri)=>{
    if(y+rowH>PH-10){
      doc.addPage();
      y=14;
    }
    const bg=ri%2===0?ROW1:ROW2;
    doc.setFillColor(...h2r(bg)); doc.rect(14,y,PW-28,rowH,'F');
    doc.setDrawColor(...h2r(BORDER)); doc.setLineWidth(0.2);
    doc.rect(14,y,PW-28,rowH,'S');

    doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(30,58,95);
    doc.text(item.num,16,y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(50,70,100);
    doc.text(item.title,16,y+8,{maxWidth:siColW-4});

    weeks.forEach((w,i)=>{
      const x=14+siColW+i*colW;
      const val=proj.schedule?.[`${item.id}_${w.key}`]||'';
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(50,70,100);
      if(val) doc.text(val,x+2,y+6,{maxWidth:colW-4});
    });
    y+=rowH;
  });

  // Labor row (if manpower panel was on)
  const ls = proj.laborSettings;
  if(ls && ls.show) {
    if(y+rowH>PH-10){ doc.addPage(); y=14; }
    doc.setFillColor(...h2r(BG)); doc.rect(14,y,PW-28,rowH+2,'F');
    doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...h2r(FG));
    doc.text('👷 LABOR',16,y+6);
    weeks.forEach((w,i)=>{
      const x=14+siColW+i*colW;
      const scheduled = proj.items.reduce((sum,item)=>{
        const hasCell=!!(proj.schedule?.[`${item.id}_${w.key}`]||'').trim();
        return sum+(hasCell&&item.laborHours?item.laborHours:0);
      },0);
      const capacity = ls.workers*ls.hoursPerDay*ls.workDays;
      const pct = capacity>0?Math.round((scheduled/capacity)*100):0;
      const [r,g,b] = pct>100?[239,68,68]:pct>=80?[251,191,36]:[34,197,94];
      doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(147,197,253);
      doc.text(`${scheduled}h / ${capacity}h`,x+2,y+5,{maxWidth:colW-4});
      doc.setTextColor(r,g,b); doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
      doc.text(`${pct}% utilized`,x+2,y+9,{maxWidth:colW-4});
    });
    y+=rowH+2;
  }

  // Footer
  const pc=doc.getNumberOfPages();
  for(let p=1;p<=pc;p++){
    doc.setPage(p);
    doc.setFillColor(...h2r(BG)); doc.rect(0,PH-8,PW,8,'F');
    doc.setFontSize(6); doc.setFont('helvetica','normal'); doc.setTextColor(...h2r(FG));
    doc.text(proj.name,14,PH-3);
    doc.text(`Page ${p} of ${pc}`,PW-14,PH-3,{align:'right'});
  }

  updatePDFProgress('Saving…',95);
  await new Promise(r=>setTimeout(r,80));

  const filename=proj.name.replace(/[^a-z0-9]/gi,'_')+'_6week_schedule.pdf';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  hidePDFProgress();

  if(isIOS){
    const blob=doc.output('blob');
    const url=URL.createObjectURL(blob);
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;';
    ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:24px;max-width:320px;text-align:center;">
      <div style="font-size:36px;margin-bottom:10px">📅</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">Schedule PDF Ready</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:18px;line-height:1.6">Tap <strong style="color:var(--text)">Open PDF</strong> then Share ⬆ → Save to Files</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="window.open('${url}','_blank');this.closest('div[style]').remove();"
          style="background:var(--green);color:#000;border:none;border-radius:10px;padding:12px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;">Open PDF ↗</button>
        <button onclick="this.closest('div[style]').remove();"
          style="background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;cursor:pointer;">Cancel</button>
      </div></div>`;
    document.body.appendChild(ov);
  } else {
    doc.save(filename);
    showToast('✓ Schedule PDF Downloaded','green');
  }
}

// ENVIRONMENTAL CONDITIONS VIEW
// ══════════════════════════════════════════

// Per-sensor filter state: { startPct:0, endPct:100 }
const _envFilters = {};

function getEnvFilter(pid, si) {
  const key = pid+'_'+si;
  if(!_envFilters[key]) _envFilters[key] = {startPct:0, endPct:100, preset:'all'};
  return _envFilters[key];
}

function filterData(data, startPct, endPct) {
  if(!data||!data.length) return [];
  const s = Math.floor(data.length * startPct/100);
  const e = Math.ceil(data.length * endPct/100);
  return data.slice(s, Math.max(s+1, e));
}

function buildEnvView(pid) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) proj.envData = { sensors:[], screenshots:[] };
  if(!proj.envData.thresholds) proj.envData.thresholds = { minTemp:50, maxTemp:80, minHum:20, maxHum:60 };
  const env = proj.envData;
  const thr = env.thresholds;
  const el = document.getElementById('v-env');

  const screenshotCards = env.screenshots.map((s,i)=>`
    <div class="env-screenshot-card">
      <div class="env-screenshot-header">
        <span class="env-screenshot-title">📷 ${s.label||'Sensor Screenshot'}</span>
        <button class="env-sensor-del" onclick="deleteEnvScreenshot('${pid}',${i})">✕</button>
      </div>
      <img class="env-screenshot-img" src="${s.data}" />
    </div>`).join('');

  const sensorCards = env.sensors.map((s,si)=>buildSensorCard(pid,s,si)).join('');

  // Compute threshold violations across all sensors
  const warnings = [];
  env.sensors.forEach((s,si)=>{
    const flt = getEnvFilter(pid, si);
    const td = filterData(s.temperature||[], flt.startPct, flt.endPct);
    const hd = filterData(s.humidity||[],    flt.startPct, flt.endPct);
    const tOver  = td.filter(d=>d.v > thr.maxTemp);
    const tUnder = td.filter(d=>d.v < thr.minTemp);
    const hOver  = hd.filter(d=>d.v > thr.maxHum);
    const hUnder = hd.filter(d=>d.v < thr.minHum);
    if(tOver.length) {
      const peak = Math.max(...tOver.map(d=>d.v)).toFixed(1);
      warnings.push({type:'temp', dir:'high', msg:`${s.name||'Sensor '+(si+1)}: Temp exceeded max ${thr.maxTemp}°F — peak ${peak}°F (${tOver.length} readings)`, cls:'temp-warn'});
    }
    if(tUnder.length) {
      const low = Math.min(...tUnder.map(d=>d.v)).toFixed(1);
      warnings.push({type:'temp', dir:'low', msg:`${s.name||'Sensor '+(si+1)}: Temp dropped below min ${thr.minTemp}°F — low ${low}°F (${tUnder.length} readings)`, cls:'temp-warn'});
    }
    if(hOver.length) {
      const peak = Math.max(...hOver.map(d=>d.v)).toFixed(1);
      warnings.push({type:'hum', dir:'high', msg:`${s.name||'Sensor '+(si+1)}: Humidity exceeded max ${thr.maxHum}% — peak ${peak}% (${hOver.length} readings)`, cls:'hum-warn'});
    }
    if(hUnder.length) {
      const low = Math.min(...hUnder.map(d=>d.v)).toFixed(1);
      warnings.push({type:'hum', dir:'low', msg:`${s.name||'Sensor '+(si+1)}: Humidity dropped below min ${thr.minHum}% — low ${low}% (${hUnder.length} readings)`, cls:'hum-warn'});
    }
  });

  const warningsHTML = warnings.length ? `
    <div class="env-warnings-list">
      ${warnings.map(w=>`
        <div class="env-warn-item ${w.cls}">
          <span class="env-warn-icon">${w.type==='temp'?'🌡️':'💧'}</span>
          <span style="margin-right:4px">${w.dir==='high'?'▲':'▼'}</span> ${w.msg}
        </div>`).join('')}
    </div>` : '';

  const emptyState = (!env.sensors.length && !env.screenshots.length) ? `
    <div class="env-empty">
      <div class="env-empty-icon">🌡️</div>
      <div class="env-empty-title">No environmental data yet</div>
      <div class="env-empty-desc">Upload a sensor screenshot to capture a visual snapshot, or import CSV data to display live temperature &amp; humidity charts.</div>
    </div>` : '';

  el.innerHTML=`
    <div class="env-wrap">
      <div class="env-header-row">
        <div class="env-header-title">🌡️ Environmental Conditions
          <span style="font-size:10px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
        </div>
        <div class="env-upload-row">
          <button class="env-upload-btn screenshot" onclick="triggerEnvScreenshot('${pid}')">📷 Screenshot</button>
          <button class="env-upload-btn csv" onclick="triggerEnvCSV('${pid}')">📊 Import CSV</button>
        </div>
      </div>

      <!-- Threshold settings -->
      <div class="env-threshold-bar">
        <span style="font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;flex-shrink:0">Thresholds</span>
        <div class="env-zone-presets">
          ${[
            {id:'Z1', minH:25, maxH:45},
            {id:'Z2', minH:30, maxH:55},
            {id:'Z3', minH:43, maxH:65},
          ].map(z => {
            const active = thr.minTemp===60&&thr.maxTemp===90&&thr.minHum===z.minH&&thr.maxHum===z.maxH;
            return `<button class="env-zone-btn${active?' active':''}" onclick="applyZonePreset('${pid}','${z.id}')" title="${z.id}: 60–90°F · ${z.minH}–${z.maxH}%">${z.id}</button>`;
          }).join('')}
        </div>
        <div class="env-threshold-inputs">
          <div class="env-threshold-field temp-field">
            <label>🌡️ MIN</label>
            <input type="number" id="thr-mintemp-${pid}" value="${thr.minTemp??50}" min="-40" max="200" step="0.5"
              onchange="updateThreshold('${pid}','minTemp',this.value)" />
            <label style="color:var(--text2)">°F</label>
          </div>
          <div class="env-threshold-field temp-field">
            <label>🌡️ MAX</label>
            <input type="number" id="thr-maxtemp-${pid}" value="${thr.maxTemp??80}" min="-40" max="200" step="0.5"
              onchange="updateThreshold('${pid}','maxTemp',this.value)" />
            <label style="color:var(--text2)">°F</label>
          </div>
          <div class="env-threshold-field hum-field">
            <label>💧 MIN</label>
            <input type="number" id="thr-minhum-${pid}" value="${thr.minHum??20}" min="0" max="100" step="1"
              onchange="updateThreshold('${pid}','minHum',this.value)" />
            <label style="color:var(--text2)">%</label>
          </div>
          <div class="env-threshold-field hum-field">
            <label>💧 MAX</label>
            <input type="number" id="thr-maxhum-${pid}" value="${thr.maxHum??60}" min="0" max="100" step="1"
              onchange="updateThreshold('${pid}','maxHum',this.value)" />
            <label style="color:var(--text2)">%</label>
          </div>
        </div>
        ${warnings.length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--red);font-weight:600;flex-shrink:0">⚠ ${warnings.length} violation${warnings.length!==1?'s':''}</span>` : `<span style="font-family:var(--mono);font-size:10px;color:var(--green);flex-shrink:0">✓ All OK</span>`}
      </div>

      ${warningsHTML}
      ${emptyState}
      ${screenshotCards}
      <div class="env-sensor-grid" id="env-sensor-grid">${sensorCards}</div>
    </div>`;

  setTimeout(()=>{
    env.sensors.forEach((s,si)=> drawSensorCharts(pid, s, si));
  }, 80);
}

function buildSensorCard(pid, s, si) {
  const flt = getEnvFilter(pid, si);
  const allTemp = s.temperature||[];
  const allHum  = s.humidity||[];
  const tempData = filterData(allTemp, flt.startPct, flt.endPct);
  const humData  = filterData(allHum,  flt.startPct, flt.endPct);

  function stats(arr) {
    if(!arr.length) return {max:'—',min:'—',avg:'—'};
    const vals = arr.map(d=>d.v);
    return {
      max: Math.max(...vals).toFixed(1),
      min: Math.min(...vals).toFixed(1),
      avg: (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)
    };
  }
  const ts = stats(tempData), hs = stats(humData);
  const pts = tempData.length || humData.length;

  // Date range label for filtered window
  function rangeLabel(arr) {
    const withDates = arr.filter(d=>d.label);
    if(withDates.length<2) return s.dateRange||'';
    return withDates[0].label+' – '+withDates[withDates.length-1].label;
  }

  const presets = ['7d','30d','90d','all'];

  return `
  <div class="env-sensor-card" id="sensor-card-${si}">
    <div class="env-sensor-header">
      <div>
        <div class="env-sensor-name">📡 ${s.name||'Sensor'}
          <span class="env-sensor-id">${s.deviceId?'ID: '+s.deviceId:''}</span>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono)">${pts} points · ${rangeLabel(tempData.length?tempData:humData)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="env-sensor-meta">
          ${allTemp.length?`<div class="env-sensor-stat">
            <div class="env-sensor-stat-val" style="color:#f97316">${ts.avg}°F</div>
            <div class="env-sensor-stat-lbl">AVG TEMP</div>
          </div>`:''}
          ${allHum.length?`<div class="env-sensor-stat">
            <div class="env-sensor-stat-val" style="color:var(--accent)">${hs.avg}%</div>
            <div class="env-sensor-stat-lbl">AVG HUM</div>
          </div>`:''}
        </div>
        <button class="env-sensor-del" onclick="deleteEnvSensor('${pid}',${si})">✕</button>
      </div>
    </div>

    <!-- Date Range Filter -->
    <div class="env-date-filter">
      <div class="env-date-filter-row">
        <span class="env-date-filter-label">Date Range</span>
        <div class="env-range-presets">
          ${presets.map(p=>`<button class="env-preset-btn ${flt.preset===p?'active':''}"
            onclick="applyEnvPreset('${pid}',${si},'${p}')">${p.toUpperCase()}</button>`).join('')}
        </div>
        <span class="env-date-range-display" id="range-display-${si}">${Math.round(flt.startPct)}% – ${Math.round(flt.endPct)}%</span>
      </div>
      <div class="env-range-track">
        <div class="env-range-bar"></div>
        <div class="env-range-fill" id="range-fill-${si}"
          style="left:${flt.startPct}%;right:${100-flt.endPct}%"></div>
        <input type="range" class="env-range-input" id="range-start-${si}"
          min="0" max="100" value="${flt.startPct}" step="1"
          oninput="updateEnvRange('${pid}',${si},'start',this.value)" />
        <input type="range" class="env-range-input" id="range-end-${si}"
          min="0" max="100" value="${flt.endPct}" step="1"
          oninput="updateEnvRange('${pid}',${si},'end',this.value)" />
      </div>
    </div>

    <div class="env-charts">
      ${allTemp.length?`
      <div class="env-chart-block">
        <div class="env-chart-label">
          <span style="color:#f97316">▬ TEMPERATURE (°F)</span>
          <span class="range-badge">MIN ${ts.min} · MAX ${ts.max}</span>
        </div>
        <div class="env-chart-canvas-wrap" id="wrap-temp-${si}">
          <canvas class="env-canvas" id="canvas-temp-${si}"></canvas>
        </div>
        <div class="env-stats-strip">
          <div class="env-stat-cell"><div class="env-stat-cell-val" style="color:#f97316">${ts.max}°F</div><div class="env-stat-cell-lbl">MAX</div></div>
          <div class="env-stat-cell"><div class="env-stat-cell-val">${ts.avg}°F</div><div class="env-stat-cell-lbl">AVG</div></div>
          <div class="env-stat-cell"><div class="env-stat-cell-val" style="color:var(--accent)">${ts.min}°F</div><div class="env-stat-cell-lbl">MIN</div></div>
        </div>
      </div>`:''}
      ${allHum.length?`
      <div class="env-chart-block">
        <div class="env-chart-label">
          <span style="color:#f87171">▬ RELATIVE HUMIDITY (%)</span>
          <span class="range-badge">MIN ${hs.min} · MAX ${hs.max}</span>
        </div>
        <div class="env-chart-canvas-wrap" id="wrap-hum-${si}">
          <canvas class="env-canvas" id="canvas-hum-${si}"></canvas>
        </div>
        <div class="env-stats-strip">
          <div class="env-stat-cell"><div class="env-stat-cell-val" style="color:#f87171">${hs.max}%</div><div class="env-stat-cell-lbl">MAX</div></div>
          <div class="env-stat-cell"><div class="env-stat-cell-val">${hs.avg}%</div><div class="env-stat-cell-lbl">AVG</div></div>
          <div class="env-stat-cell"><div class="env-stat-cell-val" style="color:var(--green)">${hs.min}%</div><div class="env-stat-cell-lbl">MIN</div></div>
        </div>
      </div>`:''}
    </div>
  </div>`;
}

// ── DATE RANGE CONTROLS ───────────────
window.updateEnvRange = function(pid, si, handle, val) {
  const flt = getEnvFilter(pid, si);
  val = parseFloat(val);
  if(handle==='start') {
    flt.startPct = Math.min(val, flt.endPct-5);
    document.getElementById('range-start-'+si).value = flt.startPct;
  } else {
    flt.endPct = Math.max(val, flt.startPct+5);
    document.getElementById('range-end-'+si).value = flt.endPct;
  }
  flt.preset='custom';
  updateEnvRangeUI(pid, si);
};

window.applyEnvPreset = function(pid, si, preset) {
  const flt = getEnvFilter(pid, si);
  const proj = getProject(pid);
  const s = proj?.envData?.sensors?.[si];
  if(!s) return;

  const totalPts = Math.max((s.temperature||[]).length,(s.humidity||[]).length);
  flt.preset = preset;

  if(preset==='all') { flt.startPct=0; flt.endPct=100; }
  else {
    // approximate: 7d=last ~7/365 of data, 30d=30/365, 90d=90/365
    const fracs = {'7d':7/365,'30d':30/365,'90d':90/365};
    const frac = fracs[preset]||1;
    flt.startPct = Math.max(0, Math.round((1-frac)*100));
    flt.endPct = 100;
  }

  document.getElementById('range-start-'+si).value = flt.startPct;
  document.getElementById('range-end-'+si).value   = flt.endPct;
  updateEnvRangeUI(pid, si);
};

function updateEnvRangeUI(pid, si) {
  const flt = getEnvFilter(pid, si);
  const fill = document.getElementById('range-fill-'+si);
  const disp = document.getElementById('range-display-'+si);
  if(fill) { fill.style.left=flt.startPct+'%'; fill.style.right=(100-flt.endPct)+'%'; }
  if(disp) disp.textContent = Math.round(flt.startPct)+'% – '+Math.round(flt.endPct)+'%';

  ['7d','30d','90d','all'].forEach(p=>{
    const btn = document.querySelector(`#sensor-card-${si} .env-preset-btn[onclick*="'${p}'"]`);
    if(btn) btn.classList.toggle('active', flt.preset===p);
  });

  const proj = getProject(pid);
  const s = proj?.envData?.sensors?.[si];
  if(s) drawSensorCharts(pid, s, si);
}

window.updateThreshold = function(pid, metric, val) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) return;
  if(!proj.envData.thresholds) proj.envData.thresholds = {minTemp:50, maxTemp:80, minHum:20, maxHum:60};
  const thr = proj.envData.thresholds;
  const num = parseFloat(val);
  if(metric==='minTemp') thr.minTemp = isNaN(num)?50:num;
  else if(metric==='maxTemp') thr.maxTemp = isNaN(num)?80:num;
  else if(metric==='minHum')  thr.minHum  = isNaN(num)?20:num;
  else if(metric==='maxHum')  thr.maxHum  = isNaN(num)?60:num;
  save();
  buildEnvView(pid);
};

const ZONE_PRESETS = {
  Z1: { minTemp:60, maxTemp:90, minHum:25, maxHum:45 },
  Z2: { minTemp:60, maxTemp:90, minHum:30, maxHum:55 },
  Z3: { minTemp:60, maxTemp:90, minHum:43, maxHum:65 },
};
window.applyZonePreset = function(pid, zone) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) proj.envData = { sensors:[], screenshots:[] };
  proj.envData.thresholds = { ...ZONE_PRESETS[zone] };
  save();
  buildEnvView(pid);
  showToast(`✓ ${zone} thresholds applied`, 'green');
};

// ── CHART DRAWING ─────────────────────
function drawSensorCharts(pid, s, si) {
  const proj = getProject(pid);
  const thr = proj?.envData?.thresholds || {maxTemp:80, maxHum:60};
  const flt = getEnvFilter(pid, si);
  const tempData = filterData(s.temperature||[], flt.startPct, flt.endPct);
  const humData  = filterData(s.humidity||[],    flt.startPct, flt.endPct);

  function drawChart(wrapperId, canvasId, data, lineColor, fillColor, maxThreshold, minThreshold) {
    const wrap = document.getElementById(wrapperId);
    const canvas = document.getElementById(canvasId);
    if(!wrap||!canvas||!data.length) return;

    const W = wrap.offsetWidth;
    const H = wrap.offsetHeight;
    if(W===0||H===0) return;

    const dpr = window.devicePixelRatio||1;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W+'px';
    canvas.style.height = H+'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const pad = {t:10, b:22, l:38, r:10};
    const cw = W - pad.l - pad.r;
    const ch = H - pad.t - pad.b;

    // Background
    ctx.fillStyle = '#272b34';
    ctx.fillRect(0,0,W,H);

    const vals = data.map(d=>d.v);
    const mn = Math.min(...vals);
    const mx = Math.max(...vals);
    // Expand range to show both threshold lines
    const dispMin = Math.min(mn, minThreshold!==undefined ? minThreshold-2 : mn, maxThreshold!==undefined ? maxThreshold-2 : mn);
    const dispMax = Math.max(mx, maxThreshold!==undefined ? maxThreshold+2 : mx, minThreshold!==undefined ? minThreshold+2 : mx);
    const range = dispMax - dispMin || 1;

    // Grid
    const gridLevels = 4;
    for(let g=0;g<=gridLevels;g++){
      const f = g/gridLevels;
      const y = pad.t + ch*(1-f);
      ctx.strokeStyle='rgba(255,255,255,0.05)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.font='8px monospace';
      ctx.textAlign='right';
      ctx.fillText((dispMin+range*f).toFixed(1), pad.l-3, y+3);
    }

    // X-axis labels (up to 6)
    const n = data.length;
    const xStep = Math.max(1, Math.floor(n/6));
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='8px monospace';
    ctx.textAlign='center';
    for(let i=0;i<n;i+=xStep){
      const x = pad.l + cw*(i/(n-1||1));
      ctx.fillText(data[i].label||'', x, H-4);
    }

    // Threshold lines (max = red dashed, min = blue dashed)
    function drawThreshLine(thrVal, color, labelPrefix) {
      if(thrVal === undefined) return;
      const thrY = pad.t + ch*(1-(thrVal-dispMin)/range);
      if(thrY < pad.t || thrY > pad.t+ch) return; // outside visible area
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(pad.l, thrY); ctx.lineTo(pad.l+cw, thrY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.font='bold 8px monospace';
      ctx.textAlign='left';
      ctx.fillText(labelPrefix+' '+thrVal, pad.l+2, thrY-2);
      ctx.restore();
    }
    drawThreshLine(maxThreshold, 'rgba(239,68,68,0.75)',   'MAX');
    drawThreshLine(minThreshold, 'rgba(96,165,250,0.75)',  'MIN');

    // Fill under curve
    ctx.beginPath();
    data.forEach((d,i)=>{
      const x = pad.l + cw*(i/(n-1||1));
      const y = pad.t + ch*(1-(d.v-dispMin)/range);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.lineTo(pad.l+cw*((n-1)/(n-1||1)), pad.t+ch);
    ctx.lineTo(pad.l, pad.t+ch);
    ctx.closePath();
    const fillGrad = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
    fillGrad.addColorStop(0, fillColor+'44');
    fillGrad.addColorStop(1, fillColor+'08');
    ctx.fillStyle = fillGrad;
    ctx.fill();

    // Line — red above maxThreshold, blue below minThreshold, normal otherwise
    for(let i=1;i<n;i++){
      const x0 = pad.l + cw*((i-1)/(n-1||1));
      const y0 = pad.t + ch*(1-(data[i-1].v-dispMin)/range);
      const x1 = pad.l + cw*(i/(n-1||1));
      const y1 = pad.t + ch*(1-(data[i].v-dispMin)/range);
      const aboveMax = maxThreshold!==undefined && (data[i-1].v>maxThreshold || data[i].v>maxThreshold);
      const belowMin = minThreshold!==undefined && (data[i-1].v<minThreshold || data[i].v<minThreshold);
      ctx.beginPath();
      ctx.strokeStyle = aboveMax ? '#ef4444' : belowMin ? '#60a5fa' : lineColor;
      ctx.lineWidth   = (aboveMax||belowMin) ? 2.2 : 1.6;
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.stroke();
    }
  }

  if(tempData.length) drawChart('wrap-temp-'+si, 'canvas-temp-'+si, tempData, '#f97316', '#f97316', thr.maxTemp, thr.minTemp);
  if(humData.length)  drawChart('wrap-hum-'+si,  'canvas-hum-'+si,  humData,  '#f87171', '#f87171', thr.maxHum,  thr.minHum);
}

// ── CSV / SCREENSHOT TRIGGERS ─────────

function triggerEnvScreenshot(pid) {

function handleEnvFile(e) {
  const file = e.target.files[0]; if(!file) return;
  const {pid, type} = _envTarget;
  const proj = getProject(pid); if(!proj) return;
  if(!proj.envData) proj.envData={sensors:[],screenshots:[]};

  if(type==='screenshot') {
    const reader=new FileReader();
    reader.onload=ev=>{
      proj.envData.screenshots.push({data:ev.target.result, label:file.name.replace(/\.[^.]+$/,'')});
      save(); buildEnvView(pid);
    };
    reader.readAsDataURL(file);
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{
      const sensor = parseEnvCSV(ev.target.result, file.name);
      if(!sensor) return showToast('Could not parse CSV — expected columns: timestamp, temperature, humidity');
      proj.envData.sensors.push(sensor);
      const newSi = proj.envData.sensors.length-1;
      save(); buildEnvView(pid);
      setTimeout(()=>drawSensorCharts(pid, sensor, newSi), 120);
    };
    reader.readAsText(file);
  }
  e.target.value='';
}

// ── CSV PARSER ────────────────────────
function parseEnvCSV(text, filename) {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h=>h.trim().toLowerCase().replace(/['"]/g,''));

  let timeIdx=-1, tempIdx=-1, humIdx=-1;
  headers.forEach((h,i)=>{
    if(timeIdx===-1 && /time|date|timestamp/.test(h)) timeIdx=i;
    if(tempIdx===-1 && /temp/.test(h))                tempIdx=i;
    if(humIdx===-1  && /hum|rh(?!\w)|humidity/.test(h)) humIdx=i;
  });

  // Fallback: positional
  if(timeIdx===-1) timeIdx=0;
  if(tempIdx===-1) tempIdx=1;
  if(humIdx===-1)  humIdx=2;

  const rows = lines.slice(1);
  const tempData=[], humData=[], dates=[];

  rows.forEach(row=>{
    const cols = row.split(sep).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length < 2) return;
    const rawDate = cols[timeIdx]||'';
    const tVal = parseFloat(cols[tempIdx]);
    const hVal = humIdx < cols.length ? parseFloat(cols[humIdx]) : NaN;

    let label='';
    try {
      const d = new Date(rawDate);
      if(!isNaN(d.getTime())) {
        label = (d.getMonth()+1)+'/'+(d.getDate());
        dates.push(d);
      }
    } catch(err){}

    if(!isNaN(tVal) && tVal > -100 && tVal < 300) tempData.push({v:tVal, label, raw:rawDate});
    if(!isNaN(hVal) && hVal >= 0   && hVal <= 100) humData.push({v:hVal, label, raw:rawDate});
  });

  if(!tempData.length && !humData.length) return null;

  // Downsample to max 400 points for performance
  function downsample(arr, max) {
    if(arr.length<=max) return arr;
    const step = arr.length/max;
    return Array.from({length:max},(_,i)=>arr[Math.min(arr.length-1,Math.round(i*step))]);
  }

  const dateRange = dates.length>=2 ?
    `${(dates[0].getMonth()+1)}/${dates[0].getDate()}/${dates[0].getFullYear()} – ${(dates[dates.length-1].getMonth()+1)}/${dates[dates.length-1].getDate()}/${dates[dates.length-1].getFullYear()}` : '';

  return {
    name: filename.replace(/\.[^.]+$/,''),
    deviceId: '',
    dateRange,
    temperature: downsample(tempData, 400),
    humidity:    downsample(humData,  400),
  };
}

  const API_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

  try {

      method: 'POST',

// Flush the SI editor DOM fields into the store without saving.
// Must be called before save() whenever the editor DOM will be rebuilt.
function syncEditorToStore(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  const n  = document.getElementById('notes-input');
  const a  = document.getElementById('assigned-input');
  const d  = document.getElementById('due-input');
  const dd = document.getElementById('si-delivery-date');
  const pd = document.getElementById('si-punch-date');
  if(n)  item.notes        = n.value;
  if(a)  item.assignedTo   = a.value;
  if(d)  item.dueDate      = d.value;
  if(dd) item.deliveryDate = dd.value;
  if(pd) item.punchDate    = pd.value;
}

  syncEditorToStore(pid, sid);

  save();
  renderLeft(route());
  if(toast) showToast('✓ Saved','green');
}

let _autoSaveTimer = null;

function scheduleAutoSave(pid, sid) {
  clearTimeout(_autoSaveTimer);
  const ind = document.getElementById('autosave-ind');
  if(ind) { ind.textContent = '… saving'; ind.className = 'autosave-indicator'; }
  _autoSaveTimer = setTimeout(() => {
    _doSave(pid, sid, false);
    const ind2 = document.getElementById('autosave-ind');
    if(ind2) {
      ind2.textContent = '✓ saved';
      ind2.className = 'autosave-indicator saved';
      setTimeout(() => {
        const ind3 = document.getElementById('autosave-ind');
        if(ind3) { ind3.textContent = '✦ auto-save'; ind3.className = 'autosave-indicator'; }
      }, 1800);
    }
  }, 800);
}

let _pt={pid:null,sid:null};

function triggerCamera(pid,sid) {

function handleFileImport(e) {
  const item=getSI(_pt.pid,_pt.sid); if(!item) return;
  const files=Array.from(e.target.files); let loaded=0;

  // Extract EXIF DateTimeOriginal from JPEG binary
  function getExifDate(arrayBuffer) {
    try {
      const view=new DataView(arrayBuffer);
      // JPEG marker check
      if(view.getUint16(0)!==0xFFD8) return null;
      let offset=2;
      while(offset<view.byteLength-2) {
        const marker=view.getUint16(offset);
        if(marker===0xFFE1) { // APP1 / EXIF
          const segLen=view.getUint16(offset+2);
          const exifHeader=String.fromCharCode(...new Uint8Array(arrayBuffer,offset+4,4));
          if(exifHeader==='Exif') {
            const tiffStart=offset+10;
            const endian=view.getUint16(tiffStart);
            const le=endian===0x4949;
            const ifdOffset=le?view.getUint32(tiffStart+4,true):view.getUint32(tiffStart+4,false);
            const numEntries=le?view.getUint16(tiffStart+ifdOffset,true):view.getUint16(tiffStart+ifdOffset,false);
            for(let i=0;i<numEntries;i++){
              const entryOffset=tiffStart+ifdOffset+2+i*12;
              const tag=le?view.getUint16(entryOffset,true):view.getUint16(entryOffset,false);
              // 0x9003 = DateTimeOriginal, 0x0132 = DateTime
              if(tag===0x9003||tag===0x0132) {
                const valOffset=le?view.getUint32(entryOffset+8,true):view.getUint32(entryOffset+8,false);
                let str='';
                for(let c=0;c<19;c++){
                  const ch=view.getUint8(tiffStart+valOffset+c);
                  if(ch===0) break;
                  str+=String.fromCharCode(ch);
                }
                // Format: "YYYY:MM:DD HH:MM:SS"
                const m=str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                if(m) return `${m[2]}/${m[3]}/${m[1]} ${m[4]}:${m[5]}`;
              }
            }
          }
        }
        if(marker===0xFFDA) break; // SOS — end of headers
        if(offset+2+view.getUint16(offset+2)>=view.byteLength) break;
        offset+=2+view.getUint16(offset+2);
      }
    } catch(err){}
    return null;
  }

  files.forEach(file=>{
    const arrReader=new FileReader();
    arrReader.onload=arrEv=>{
      const takenAt = getExifDate(arrEv.target.result) ||
        // fallback: use file lastModified
        (()=>{
          const d=new Date(file.lastModified);
          return (d.getMonth()+1).toString().padStart(2,'0')+'/'+
            d.getDate().toString().padStart(2,'0')+'/'+d.getFullYear()+' '+
            d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
        })();

      const dataReader=new FileReader();
      dataReader.onload=dataEv=>{
        // Resize/Compress before saving to localStorage to prevent QuotaExceededError
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1200; // Resizing to 1200px is plenty for audit reports
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const compressedData = canvas.toDataURL('image/jpeg', 0.7); // 0.7 quality is the sweet spot
          item.photos.push({data:compressedData, caption:'', takenAt});
          if(++loaded===files.length){ save(); buildSIEditor(_pt.pid,_pt.sid); renderLeft(route()); }
        };
        img.src = dataEv.target.result;
      };
      dataReader.readAsDataURL(file);
    };
    arrReader.readAsArrayBuffer(file);
  });
  e.target.value='';
}

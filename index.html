  }
  
  const bc = document.getElementById('breadcrumb');
  const logoSrc = 'logo-white.png';
  let crumbs = [`<span class="crumb ${stack.length===0?'active':''}" onclick="navToRoot()"><img src="${logoSrc}" alt="ADH Audit" class="nav-logo"></span>`];
  
  if (r.folderId) {
    const path = [];
    let curr = getFolder(r.folderId);
    while (curr) {
      path.unshift(curr);
      curr = curr.parentId ? getFolder(curr.parentId) : null;
    }
    path.forEach((f, idx) => {
      crumbs.push(`<span class="crumb-sep">›</span>`);
      crumbs.push(`<span class="crumb ${r.view==='folder' && idx === path.length-1 ? 'active':''}" onclick="navToFolder('${f.id}')" title="${f.name}">${f.icon && !f.icon.includes('<img') ? f.icon + ' ' : ''}${f.name}</span>`);
    });
  }
  if (r.projectId) {
    const p = getProject(r.projectId);
    if (p) {
      const isLast = r.view==='project';
      crumbs.push(`<span class="crumb-sep">›</span>`);
      crumbs.push(`<span class="crumb ${isLast?'active':''}" onclick="navToProject('${p.id}','${r.folderId||''}')" title="${p.name}">${p.name}</span>`);
    }
  }
  if (r.siId) {
    const si = getSI(r.projectId,r.siId);
    if (si) {
      crumbs.push(`<span class="crumb-sep">›</span>`);
      crumbs.push(`<span class="crumb active" title="${si.num}">${si.num}</span>`);
    }
  }
  if (r.view==='env') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">🌡️ Environmental</span>`);
  }
  if (r.view==='schedule') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">📅 6-Week Schedule</span>`);
  }
  if (r.view==='manpower') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">👷 Manpower</span>`);
  }
  if (r.view==='contacts') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">📇 Contact Book</span>`);
  }
  if (r.view==='toolbox') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">🦺 Toolbox Talk / Safety</span>`);
  }
  if (r.view==='awi') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">📐 AWI Standards</span>`);
  }
  if (r.view==='resources') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">📂 Resources</span>`);
  }
  if (r.view==='tblog') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">🦺 Toolbox Log</span>`);
  }
  if (r.view==='activity') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">📋 Activity Feed</span>`);
  }
  if (r.view==='floorplan') {
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb active">🗺️ Floor Plan</span>`);

}

function updateMobileNav(r) {
  document.querySelectorAll('.mbn-item').forEach(el=>el.classList.remove('active'));
  if(r.view==='root'||!r.folderId) document.getElementById('mbn-home')?.classList.add('active');
  if(r.view==='contacts') document.getElementById('mbn-contacts')?.classList.add('active');
}

// ── MOBILE DRAWER (phone left panel) ─────
function toggleMobileDrawer() {
  if (document.body.classList.contains('drawer-open')) { closeMobileDrawer(); return; }
  window._drawerRoute = JSON.stringify(route()); // remember where it was opened
  document.body.classList.add('drawer-open');
  document.getElementById('mbn-browse')?.classList.add('active');
  renderLeft(route()); // panel is skipped while closed — build it now
}
function closeMobileDrawer() {
  document.body.classList.remove('drawer-open');
  document.getElementById('mbn-browse')?.classList.remove('active');
}

// ── LEFT PANEL ───────────────────────────
function renderLeft(r) {
  // Hide left panel on root home screen (option C) — folders shown in main grid instead
  const leftPanel = document.querySelector('.left-panel');
  const isRootView = !r.folderId && !r.projectId &&
    !['contacts','toolbox','awi','resources','tblog','env','schedule','manpower','activity','floorplan'].includes(r.view);

  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const isPhone = document.documentElement.classList.contains('is-phone');

  // When a global search query is active, always show the left panel.
  // On phones the panel is a drawer — never hard-hide it there.
  if (leftPanel) leftPanel.classList.toggle('is-hidden', isRootView && !q && !isPhone);

  // Do not waste CPU building the panel while the phone drawer is closed
  if (isPhone && !document.body.classList.contains('drawer-open')) {
    return;
  }

  const title = document.getElementById('left-panel-title');
  const scroll = document.getElementById('list-scroll');

  // ── GLOBAL SEARCH ─────────────────────────────────────────────
  // When a query is present, search across ALL folders, projects, and SIs
  // regardless of current navigation context.
  if (q) {
    title.textContent = 'SEARCH RESULTS';
    let html = '';

    // 1. Matching folders
    const matchFolders = store.folders.filter(f =>
      f.name.toLowerCase().includes(q)
    );
    if (matchFolders.length) {
      html += `<div class="section-group">Folders<span class="section-count">${matchFolders.length}</span></div>`;
      matchFolders.forEach(f => {
        const parent = f.parentId ? getFolder(f.parentId) : null;
        const meta = parent ? parent.name : '';
        const pc = (f.projects || []).length;
        const sc = store.folders.filter(sub => sub.parentId === f.id).length;
        const parts = []; if (pc > 0) parts.push(`${pc} project${pc !== 1 ? 's' : ''}`); if (sc > 0) parts.push(`${sc} sub`);
        html += `<div class="folder-row" onclick="navToFolder('${f.id}')">
          <div class="folder-icon-wrap">${f.icon}</div>
          <div class="folder-info">
            <div class="folder-name">${f.name}</div>
            ${meta ? `<div class="folder-meta">${meta}${parts.length ? ' · ' + parts.join(' · ') : ''}</div>` : (parts.length ? `<div class="folder-meta">${parts.join(' · ')}</div>` : '')}
          </div>
          <div class="folder-arrow">›</div>
        </div>`;
      });
    }

    // 2. Matching projects + their matching SIs
    const activeProjects = store.projects.filter(p => !p._deleted);
    activeProjects.forEach(p => {
      const folder = store.folders.find(f => (f.projects || []).includes(p.id));
      const fid = folder ? folder.id : '';
      const folderName = folder ? folder.name : '';

      const projNameMatch =
        p.name.toLowerCase().includes(q) ||
        (p.client || '').toLowerCase().includes(q) ||
        (p.date || '').toLowerCase().includes(q);

      const matchingSIs = p.items.filter(i => !i._deleted && (
        i.title.toLowerCase().includes(q) ||
        i.num.toLowerCase().includes(q) ||
        (i.notes || '').toLowerCase().includes(q) ||
        (i.fieldCheck || '').toLowerCase().includes(q) ||
        (i._updatedBy || '').toLowerCase().includes(q) ||
        (Array.isArray(i.conditions) ? i.conditions.join(' ').toLowerCase().includes(q) : false)
      ));

      if (!projNameMatch && !matchingSIs.length) return;

      // Project group header (clickable → navigates to project)
      const siCount = matchingSIs.length;
      html += `<div class="section-group" style="cursor:pointer" onclick="navToProject('${p.id}','${fid}')">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">
          ${folderName ? `<span style="opacity:0.55">${folderName} › </span>` : ''}${_htmlEsc(p.name)}
        </span>
        ${siCount ? `<span class="section-count">${siCount} SI${siCount !== 1 ? 's' : ''}</span>` : ''}
      </div>`;

      if (!siCount) {
        // Only project name/meta matched — show a project row
        const _act = activeItems(p);
        const ready = _act.filter(i => i.status === 'completed').length;
        html += `<div class="si-row" onclick="navToProject('${p.id}','${fid}')">
          <div class="si-thumb" style="font-size:16px">🏗</div>
          <div class="si-info">
            <div class="si-num">${_htmlEsc(p.date)} · ${_htmlEsc(p.client)}</div>
            <div class="si-title">${_htmlEsc(p.name)}</div>
          </div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;flex-shrink:0">${ready}/${_act.length}<br>ready</div>
        </div>`;
      } else {
        // Show matching SI rows
        matchingSIs.forEach(item => {
          const thumbSrc = item.photos && item.photos.length ? getPhotoSrcForDisplay(item.photos[0]) : null;
          const thumb = thumbSrc ? `<img src="${thumbSrc}" loading="lazy" />` : `<span>📷</span>`;
          html += `<div class="si-row ${r.siId === item.id ? 'active' : ''}" onclick="navToSI('${p.id}','${item.id}')">
            <div class="si-thumb">${thumb}</div>
            <div class="si-info">
              <div class="si-num">SI# ${_htmlEsc(item.num.replace(/^SI\s+/, ''))}</div>
              <div class="si-title">${_htmlEsc(item.title)}</div>
              ${_updatedByBadge ? _updatedByBadge(item) : ''}
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              <div class="si-status ${item.status}"></div>
            </div>
          </div>`;
        });
      }
    });

    scroll.innerHTML = html || emptySearch(q);
    return;
  }
  // ── END GLOBAL SEARCH ─────────────────────────────────────────

  if (r.view === 'contacts') {
    title.textContent = 'CONTACTS';
    const list = store.contacts.filter(c => {
      if (c._deleted) return false;
      const name = (c.name || '').toLowerCase();
      const comp = (c.company || '').toLowerCase();
      const role = (c.role || '').toLowerCase();
      return !q || name.includes(q) || comp.includes(q) || role.includes(q);
    }).sort((a,b) => a.name.localeCompare(b.name));
    scroll.innerHTML = list.map(c => `
      <div class="si-row" onclick="buildContactBookView('${c.id}')">
        <div class="si-thumb" style="font-size:16px">👤</div>
        <div class="si-info">
          <div class="si-num">${c.role} @ ${c.company}</div>
          <div class="si-title">${c.name}</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>`).join('') || emptyMsg('No contacts found');
    return;
  }

  if (r.view === 'toolbox') {
    title.textContent = 'TOOLBOX TALK';
    scroll.innerHTML = emptyMsg('Content coming soon');
    return;
  }

  if (r.view === 'awi') {
    title.textContent = 'AWI STANDARDS';
    scroll.innerHTML = emptyMsg('Content coming soon');
    return;
  }

  if (r.view === 'resources') {
    title.textContent = 'RESOURCES';
    scroll.innerHTML = emptyMsg('Field forms, QC & safety docs');
    return;
  }

  if (r.view === 'tblog') {
    title.textContent = 'TOOLBOX LOG';
    scroll.innerHTML = emptyMsg('Per-project weekly log');
    return;
  }

  // ── IMPORTANT: check projectId BEFORE folderId so navigating from root
  // (folderId='') directly to a project still shows the SI list, not folders.
  if (r.projectId) {
    title.textContent='SCOPE ITEMS';
    const proj = getProject(r.projectId);
    if (!proj) { scroll.innerHTML = emptyMsg('Project not found'); return; }
    let html='';
    proj.sections.forEach(sec=>{
      const items=proj.items.filter(i=>!i._deleted&&i.sectionId===sec.id&&(!q||
        i.title.toLowerCase().includes(q)||
        i.num.toLowerCase().includes(q)||
        (i.notes||'').toLowerCase().includes(q)||
        (i.fieldCheck||'').toLowerCase().includes(q)||
        (i._updatedBy||'').toLowerCase().includes(q)||
        (Array.isArray(i.conditions)?i.conditions.join(' ').toLowerCase().includes(q):false)
      ));
      if(!items.length&&q) return;
      html+=`<div class="section-group">${sec.name}<span class="section-count">${items.length}</span></div>`;
      items.forEach(item=>{
        const thumbSrc=item.photos.length?getPhotoSrcForDisplay(item.photos[0]):null;
        const thumb=thumbSrc?`<img src="${thumbSrc}" loading="lazy" />`:`<span>📷</span>`;
        const tw = item.towerWork;
        const twEnabled = tw && tw.enabled && tw.rooms && tw.rooms.length > 0;
        const twDone = twEnabled ? tw.rooms.filter(r=>r.status==='completed').length : 0;
        const twTotal = twEnabled ? tw.rooms.length : 0;
        const twAllDone = twEnabled && twDone === twTotal;
        html+=`<div class="si-row ${r.siId===item.id?'active':''}"
          data-sid="${item.id}" data-pid="${proj.id}" data-secid="${item.sectionId}"
          draggable="true"
          onclick="navToSI('${proj.id}','${item.id}')">
          <div class="si-drag-handle" title="Drag to reorder">⠿</div>
          <div class="si-row-check ${window._bulkSelected?.has(item.id)?'checked':''}"
            onclick="toggleBulkSelect('${proj.id}','${item.id}',event)">${window._bulkSelected?.has(item.id)?'✓':''}</div>
          <div class="si-thumb">${thumb}</div>
          <div class="si-info">
            <div class="si-num">
              SI# ${item.num.replace(/^SI\s+/, '')}
              ${twEnabled ? `<span class="tw-badge ${twAllDone?'done':''}" style="margin-left:4px">🏢 ${twDone}/${twTotal}</span>` : ''}
            </div>
            <div class="si-title">${item.title}</div>
            ${_updatedByBadge(item)}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div class="si-status ${item.status}"></div>
          </div>
        </div>`;
      });
    });
    scroll.innerHTML = html || (q ? emptySearch(q) : emptyMsg('No items'));
    return;
  }

  if (!r.folderId) {
    title.textContent='FOLDERS';
    const list = store.folders.filter(f => f.parentId === null && (!q || f.name.toLowerCase().includes(q)));
    scroll.innerHTML = list.map(f=>{
      const pc=f.projects.length, sc=store.folders.filter(sub=>sub.parentId===f.id).length;
      const parts=[]; if(pc>0) parts.push(`${pc} project${pc!==1?'s':''}`); if(sc>0) parts.push(`${sc} sub`);
      return `<div class="folder-row ${r.folderId===f.id?'active':''}" onclick="navToFolder('${f.id}')">
        <div class="folder-icon-wrap">${f.icon}</div>
        <div class="folder-info">
          <div class="folder-name">${f.name}</div>
          ${parts.length?`<div class="folder-meta">${parts.join(' · ')}</div>`:''}
        </div>
        <div class="folder-arrow">›</div>
      </div>`;
    }).join('') || (q ? emptySearch(q) : emptyMsg('No folders'));
    return;
  }
  if (r.folderId && !r.projectId) {
    const folder = getFolder(r.folderId);
    const isMain = MAIN_FOLDERS.includes(folder?.name);

    if (isMain) {
      title.textContent = 'SUBFOLDERS';
      const subs = store.folders.filter(f => f.parentId === r.folderId && (!q || f.name.toLowerCase().includes(q)));
      scroll.innerHTML = subs.map(f => {
        const pc=f.projects.length, sc=store.folders.filter(sub=>sub.parentId===f.id).length;
        const parts=[]; if(pc>0) parts.push(`${pc} proj`); if(sc>0) parts.push(`${sc} sub`);
        return `<div class="folder-row" onclick="navToFolder('${f.id}')">
          <div class="folder-icon-wrap">${f.icon}</div>
          <div class="folder-info">
            <div class="folder-name">${f.name}</div>
            ${parts.length?`<div class="folder-meta">${parts.join(' · ')}</div>`:''}
          </div>
          <div class="folder-arrow">›</div>
        </div>`;
      }).join('') || (q ? emptySearch(q) : emptyMsg('No subfolders'));
    } else {
      title.textContent = 'PROJECTS';
      const projs = (folder.projects || []).map(id => getProject(id)).filter(p => p && !p._deleted && (!q || p.name.toLowerCase().includes(q)));
      scroll.innerHTML = projs.map(p => {
        const _act = activeItems(p);
        const ready = _act.filter(i => i.status === 'completed').length;
        return `<div class="si-row ${r.projectId === p.id ? 'active' : ''}" onclick="navToProject('${p.id}','${r.folderId}')">
          <div class="si-thumb" style="font-size:16px">🏗</div>
          <div class="si-info">
            <div class="si-num">${p.date} · ${p.client}</div>
            <div class="si-title">${p.name}</div>
          </div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;flex-shrink:0">${ready}/${_act.length}<br>ready</div>
        </div>`;
      }).join('') || (q ? emptySearch(q) : emptyMsg('No projects'));
    }
    return;
  }
}

function emptyMsg(t) { return `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">${t}</div>`; }
function _htmlEsc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function emptySearch(q) {
  return `<div class="empty-state" style="padding:28px 16px;text-align:center">
    <div class="empty-state-icon" style="font-size:26px;margin-bottom:10px;opacity:0.5">🔍</div>
    <div class="empty-state-text" style="font-size:13px;color:var(--text3)">No results for <strong style="color:var(--text2)">"${_htmlEsc(q)}"</strong></div>
  </div>`;
}

// ══════════════════════════════════════════
// SI DRAG-TO-REORDER ENGINE
// Works on both touch (iOS/Android) and mouse (desktop)
// ══════════════════════════════════════════

let _drag = {
  el: null,
  pid: null,
  secId: null,
  sid: null,
  startY: 0,
  currentOver: null,
  ghost: null,
  scrollEl: null,
  scrollTimer: null,
};

function _siDragInit() {
  const scroll = document.getElementById('list-scroll');
  if (!scroll) return;
  if (scroll._dragBound) return;
  scroll._dragBound = true;

  // ── Mouse drag ──────────────────────────
  scroll.addEventListener('dragstart', e => {
    const row = e.target.closest('.si-row[draggable]');
    if (!row) return;
    const handle = e.target.closest('.si-drag-handle');
    if (!handle) { e.preventDefault(); return; }
    _drag.el    = row;
    _drag.pid   = row.dataset.pid;
    _drag.secId = row.dataset.secid;
    _drag.sid   = row.dataset.sid;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _drag.sid);
    setTimeout(() => row.classList.add('dragging'), 0);
  });

  scroll.addEventListener('dragend', e => {
    const row = e.target.closest('.si-row[draggable]');
    if (row) row.classList.remove('dragging');
    _clearDragOver();
    _drag.el = null;
  });

  scroll.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.si-row[draggable]');
    if (!target || target === _drag.el) return;
    if (target.dataset.secid !== _drag.secId) return;
    _setDragOver(target);
  });

  scroll.addEventListener('dragleave', e => {
    if (!scroll.contains(e.relatedTarget)) _clearDragOver();
  });

  scroll.addEventListener('drop', e => {
    e.preventDefault();
    if (!_drag.currentOver || !_drag.el) return;
    _commitReorder(_drag.pid, _drag.secId, _drag.sid, _drag.currentOver.dataset.sid);
    _clearDragOver();
  });

  // ── Touch drag ──────────────────────────
  scroll.addEventListener('touchstart', e => {
    const handle = e.target.closest('.si-drag-handle');
    if (!handle) return;
    const row = handle.closest('.si-row[draggable]');
    if (!row) return;
    e.preventDefault();

    _drag.el    = row;
    _drag.pid   = row.dataset.pid;
    _drag.secId = row.dataset.secid;
    _drag.sid   = row.dataset.sid;
    _drag.startY = e.touches[0].clientY;
    _drag.scrollEl = scroll;

    const rect = row.getBoundingClientRect();
    const ghost = row.cloneNode(true);
    ghost.id = 'si-drag-ghost';
    ghost.style.cssText = [
      'position:fixed',
      `left:${rect.left}px`,
      `top:${rect.top}px`,
      `width:${rect.width}px`,
      'z-index:9999',
      'pointer-events:none',
      'opacity:0.85',
      'border-radius:8px',
      'background:var(--surface)',
      'box-shadow:0 8px 28px rgba(0,0,0,0.45)',
      'border:1px solid var(--accent)',
      'transition:none',
    ].join(';');
    document.body.appendChild(ghost);
    _drag.ghost = ghost;
    row.classList.add('dragging');
  }, { passive: false });

  scroll.addEventListener('touchmove', e => {
    if (!_drag.ghost) return;
    e.preventDefault();

    const touch = e.touches[0];
    const dy = touch.clientY - _drag.startY;
    const rect = _drag.el.getBoundingClientRect();
    _drag.ghost.style.top = (rect.top + dy + scroll.scrollTop - scroll.getBoundingClientRect().top) + 'px';

    _drag.ghost.style.display = 'none';
    const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
    _drag.ghost.style.display = '';
    const target = elBelow?.closest('.si-row[draggable]');
    if (target && target !== _drag.el && target.dataset.secid === _drag.secId) {
      _setDragOver(target);
    } else {
      _clearDragOver();
    }

    const scrollRect = scroll.getBoundingClientRect();
    const ZONE = 60;
    clearInterval(_drag.scrollTimer);
    if (touch.clientY < scrollRect.top + ZONE) {
      _drag.scrollTimer = setInterval(() => scroll.scrollBy(0, -6), 16);
    } else if (touch.clientY > scrollRect.bottom - ZONE) {
      _drag.scrollTimer = setInterval(() => scroll.scrollBy(0, 6), 16);
    }
  }, { passive: false });

  scroll.addEventListener('touchend', e => {
    clearInterval(_drag.scrollTimer);
    if (_drag.ghost) { _drag.ghost.remove(); _drag.ghost = null; }
    if (_drag.el) _drag.el.classList.remove('dragging');

    if (_drag.currentOver && _drag.el) {
      _commitReorder(_drag.pid, _drag.secId, _drag.sid, _drag.currentOver.dataset.sid);
    }
    _clearDragOver();
    _drag.el = null;
  }, { passive: true });
}

function _setDragOver(el) {
  if (_drag.currentOver === el) return;
  _clearDragOver();
  _drag.currentOver = el;
  el.classList.add('drag-over');
}

function _clearDragOver() {
  if (_drag.currentOver) {
    _drag.currentOver.classList.remove('drag-over');
    _drag.currentOver = null;
  }
}

function _commitReorder(pid, secId, draggedId, targetId) {
  if (draggedId === targetId) return;
  const proj = getProject(pid); if (!proj) return;

  const secItems = proj.items.filter(i => i.sectionId === secId);
  const fromIdx = secItems.findIndex(i => i.id === draggedId);
  const toIdx   = secItems.findIndex(i => i.id === targetId);
  if (fromIdx === -1 || toIdx === -1) return;

  const [moved] = secItems.splice(fromIdx, 1);
  secItems.splice(toIdx, 0, moved);

  const sectionOrder = proj.sections.map(s => s.id);
  const bySection = {};
  sectionOrder.forEach(sid => {
    bySection[sid] = proj.items.filter(i => i.sectionId === sid);
  });
  bySection[secId] = secItems;

  proj.items = sectionOrder.flatMap(sid => bySection[sid] || []);

  markProjectDirty(pid); save();
  renderLeft(route());
  if (navigator.vibrate) navigator.vibrate(18);
  showToast('✓ Reordered', 'green');
}

// Hook into renderLeft to (re)bind the drag engine after each render.
const _origRenderLeft = renderLeft;
renderLeft = function(r) {
  _origRenderLeft(r);
  requestAnimationFrame(_siDragInit);
};

// ── RIGHT PANEL ──────────────────────────
function renderRight(r) {
  const views=['v-empty','v-root','v-folder','v-project','v-si','v-env','v-contacts','v-schedule','v-toolbox','v-awi','v-resources','v-tblog','v-manpower','v-activity','v-floorplan'];
  views.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });

  if (r.view==='contacts') { buildContactBookView(); show('v-contacts'); }
  else if (r.view==='toolbox') { buildToolboxView(); show('v-toolbox'); }
  else if (r.view==='awi')     { buildAWIView();     show('v-awi'); }
  else if (r.view==='resources'){ buildResourcesView(); show('v-resources'); }
  else if (r.view==='tblog')    { buildTbLogView(r.projectId); show('v-tblog'); }
  else if (r.view==='env') { buildEnvView(r.projectId); show('v-env'); }
  else if (r.view==='schedule') { buildScheduleView(r.projectId); show('v-schedule'); }
  else if (r.view==='manpower')  { buildManpowerView(r.projectId);  show('v-manpower');  }
  else if (r.view==='activity')  { buildActivityView(r.projectId);  show('v-activity');  }
  else if (r.view==='floorplan') { buildFloorPlanView(r.projectId); show('v-floorplan'); }
  else if (r.view==='si') { buildSIEditor(r.projectId,r.siId); show('v-si'); }
  else if (r.view==='project'&&!r.siId&&!r.envMode) { buildProjectView(r.projectId); show('v-project'); }
  else if (r.view==='folder'&&!r.projectId) { buildFolderView(r.folderId); show('v-folder'); }
  else if (r.view==='root'||!r.folderId) { buildRootView(); show('v-root'); }
  else show('v-empty');

  // Update mobile bottom nav active state
  updateMobileNav(r);
}
function show(id) {
  const el=document.getElementById(id);
  el.style.display='flex'; el.style.flexDirection='column';
}

function _folderIconHTML(icon, px) {
  if (!icon) return '';
  if (icon.includes('<img')) {
    const sized = icon.replace(/(<img[^>]*)(class='folder-logo-img[^']*')/g,
      `$1$2 style='width:${px}px;height:${px}px;object-fit:contain;display:block;'`);
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${px}px;height:${px}px;flex-shrink:0;overflow:hidden">${sized}</span>`;
  }
  return `<span style="font-size:${px}px;line-height:1">${icon}</span>`;
}

function folderCardHTML(f) {
  const hasLogo = f.icon && f.icon.includes('<img');
  const projCount = f.projects.length;
  const subCount = store.folders.filter(s => s.parentId === f.id).length;
  const parts = [];
  if (projCount > 0) parts.push(`${projCount} project${projCount !== 1 ? 's' : ''}`);
  if (subCount > 0) parts.push(`${subCount} sub`);
  const countHTML = parts.length
    ? `<div class="fc-count">${parts.join(' · ')}</div>`
    : '';
  return `<div class="folder-card${hasLogo ? ' folder-card--logo' : ''}" data-fid="${f.id}" onclick="navToFolder('${f.id}')">
    <div class="fc-icon">${f.icon}</div>
    <div class="fc-name">${f.name}</div>
    ${countHTML}
  </div>`;
}

function _patchFolderCardCounts() {
  store.folders.forEach(f => {
    const card = document.querySelector(`.folder-card[data-fid="${f.id}"]`);
    if (!card) return;
    const projCount = f.projects.length;
    const subCount = store.folders.filter(s => s.parentId === f.id).length;
    const parts = [];
    if (projCount > 0) parts.push(`${projCount} project${projCount !== 1 ? 's' : ''}`);
    if (subCount > 0) parts.push(`${subCount} sub`);
    let countEl = card.querySelector('.fc-count');
    if (parts.length) {
      if (!countEl) {
        countEl = document.createElement('div');
        countEl.className = 'fc-count';
        card.appendChild(countEl);
      }
      countEl.textContent = parts.join(' · ');
    } else {
      if (countEl) countEl.remove();
    }
  });
}

let _docManifest = null;
function loadDocManifest() {
  if (_docManifest) return Promise.resolve(_docManifest);
  return fetch('resources/manifest.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => { _docManifest = j; return j; })
    .catch(() => { _docManifest = { toolboxTalks: [], categories: [] }; return _docManifest; });
}
function _docHref(file) {
  return 'resources/' + String(file).split('/').map(encodeURIComponent).join('/');
}
const _DL_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
function _docDlBtn(file) {
  const base = String(file).split('/').pop();
  return `<a class="doc-dl-btn" href="${_docHref(file)}" download="${_esc(base)}" onclick="event.stopPropagation()" title="Download">${_DL_ICON}</a>`;
}
function _esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── RESOURCES (Forms / QC / Site Safety) ──
const _CAT_LABEL = { 'Forms & Templates': 'Allegheny Field Forms' };
let _resSearch = '';
let _resOpen = {};
function buildResourcesView() {
  _ensureDocStyles();
  const el = document.getElementById('v-resources'); if (!el) return;
  el.innerHTML = `<div class="grid-wrap doc-wrap"><div class="env-header-title">📂 Resources</div><div class="doc-sub">Loading…</div></div>`;
  loadDocManifest().then(m => {
    if (route().view !== 'resources') return;
    el.innerHTML = `<div class="grid-wrap doc-wrap">
      <div class="env-header-title">📂 Resources</div>
      <div class="doc-sub">Field forms, quality-control plans, and site-safety programs. Tap any document to open or download.</div>
      <input class="doc-search" placeholder="Search all documents…" oninput="_resFilter(this.value)" value="${_esc(_resSearch)}">
      <div id="res-list">${_resBody(m.categories || [], _resSearch)}</div>
    </div>`;
  });
}
function _resBody(cats, q) {
  q = (q || '').toLowerCase();
  let html = '';
  cats.forEach((cat, ci) => {
    const label = _CAT_LABEL[cat.name] || cat.name;
    let cathtml = ''; let any = false;
    (cat.groups || []).forEach((g, gi) => {
      const items = (g.items || []).filter(it => !q ||
        it.title.toLowerCase().includes(q) || (g.name || '').toLowerCase().includes(q) || label.toLowerCase().includes(q));
      if (!items.length) return; any = true;
      const rows = items.map(it => `<div class="doc-item" onclick="window.open('${_docHref(it.file)}','_blank','noopener')">
        <span class="doc-ic ${it.type === 'docx' ? 'docx' : ''}">${(it.type || 'pdf').toUpperCase()}</span>
        <span class="doc-itt">${_esc(it.title)}</span>
        ${_docDlBtn(it.file)}</div>`).join('');
      if (!g.name) {
        cathtml += `<div class="doc-grp open">${rows}</div>`;
      } else {
        const key = ci + '-' + gi;
        const open = q ? true : !!_resOpen[key];
        cathtml += `<div class="doc-grp ${open ? 'open' : ''}">
          <div class="doc-ghead" onclick="_resToggle('${key}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg> ${_esc(g.name)}<span class="doc-gcount">${items.length}</span></div>
          <div class="doc-glist">${rows}</div></div>`;
      }
    });
    if (any) html += `<div class="doc-cat">${_esc(label)}</div>` + cathtml;
  });
  return html || emptyMsg('No matches');
}
function _resFilter(q) {
  _resSearch = q;
  const c = document.getElementById('res-list');
  if (c) c.innerHTML = _resBody((_docManifest && _docManifest.categories) || [], q);
}
function _resToggle(key) {
  _resOpen[key] = !_resOpen[key];
  const c = document.getElementById('res-list');
  if (c) c.innerHTML = _resBody((_docManifest && _docManifest.categories) || [], _resSearch);
}

// ── PER-PROJECT TOOLBOX TALK LOG (stored on the project, synced) ──
let _tbLogOpen = null;
function buildTbLogView(pid) {
  _ensureDocStyles();
  const el = document.getElementById('v-tblog'); if (!el) return;
  const proj = getProject(pid);
  el.innerHTML = `<div class="grid-wrap doc-wrap"><div class="env-header-title">🦺 Toolbox Talk Log</div><div class="doc-sub">Loading…</div></div>`;
  loadDocManifest().then(m => {
    const r = route();
    if (r.view !== 'tblog' || r.projectId !== pid) return;
    const talks = m.toolboxTalks || [];
    const log = (proj && proj.toolboxTalks) || {};
    const done = talks.filter(t => log[t.week] && log[t.week].done).length;
    const pct = talks.length ? Math.round(done / talks.length * 100) : 0;
    const rows = talks.map(t => {
      const s = log[t.week] || {};
      const isOpen = _tbLogOpen === t.week;
      const meta = [];
      if (s.date) meta.push('📅 ' + s.date);
      if (s.supervisor) meta.push('👷 ' + _esc(s.supervisor));
      if (s.attendees) meta.push('👥 ' + _esc(s.attendees));
      return `<div class="tbl-card ${isOpen ? 'open' : ''}">
        <div class="tbl-row ${s.done ? 'done' : ''}" onclick="tbLogToggleOpen('${pid}',${t.week})">
          <div class="tbl-box" onclick="event.stopPropagation();tbLogToggleDone('${pid}',${t.week})"></div>
          <div style="min-width:0">
            <span class="tb-wk">WK ${String(t.week).padStart(2,'0')}</span>
            <div class="tb-ttl" style="margin-top:4px">${_esc(t.title)}</div>
            ${meta.length ? `<div class="tbl-meta">${meta.join('  ·  ')}</div>` : ''}
          </div>
          <svg class="tbl-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="tbl-panel">
          <div class="tbl-fields">
            <div><label>Date conducted</label><input type="date" value="${_esc(s.date||'')}" onchange="tbLogField('${pid}',${t.week},'date',this.value)"></div>
            <div><label>Supervisor</label><input value="${_esc(s.supervisor||'')}" placeholder="Name" onchange="tbLogField('${pid}',${t.week},'supervisor',this.value)"></div>
            <div><label>Attendees</label><input type="number" min="0" value="${_esc(s.attendees||'')}" placeholder="#" onchange="tbLogField('${pid}',${t.week},'attendees',this.value)"></div>
            <div class="tbl-full"><label>Notes</label><textarea rows="2" placeholder="Optional" onchange="tbLogField('${pid}',${t.week},'notes',this.value)">${_esc(s.notes||'')}</textarea></div>
          </div>
          <a class="tbl-open" href="${_docHref(t.file)}" target="_blank" rel="noopener">Open talk + sign-in ↗</a>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="grid-wrap doc-wrap">
      <div class="env-header-title">🦺 Toolbox Talk Log</div>
      <div class="doc-sub">Log each weekly safety talk for <b>${_esc(proj ? proj.name : '')}</b>. Saved with this project and synced to the cloud.</div>
      <div class="tbl-prog">
        <div class="tbl-ring" style="--p:${pct}"><span>${pct}%</span></div>
        <div><div style="font-weight:700;font-size:15px;color:var(--text)">${done} of ${talks.length} conducted</div>
        <div style="font-size:12px;color:var(--text3)">Tap the box to mark done · tap a row to log details</div></div>
      </div>
      ${rows || emptyMsg('No toolbox talks found')}
    </div>`;
  });
}
function _tbLogProj(pid) {
  const p = getProject(pid); if (!p) return null;
  if (!p.toolboxTalks) p.toolboxTalks = {};
  return p;
}
function tbLogToggleOpen(pid, wk) {
  _tbLogOpen = (_tbLogOpen === wk ? null : wk);
  buildTbLogView(pid);
}
function tbLogToggleDone(pid, wk) {
  const p = _tbLogProj(pid); if (!p) return;
  const cur = p.toolboxTalks[wk] || {};
  cur.done = !cur.done;
  if (cur.done && !cur.date) cur.date = new Date().toISOString().slice(0, 10);
  p.toolboxTalks[wk] = cur;
  markProjectDirty(pid); save();
  buildTbLogView(pid);
}
function tbLogField(pid, wk, key, val) {
  const p = _tbLogProj(pid); if (!p) return;
  const cur = p.toolboxTalks[wk] || {};
  cur[key] = val;
  let reflow = false;
  if (key === 'date' && val && !cur.done) { cur.done = true; reflow = true; }
  p.toolboxTalks[wk] = cur;
  markProjectDirty(pid); save();
  if (reflow) buildTbLogView(pid);
}

window.toggleSelectAllContacts = function() {
  const q    = (document.getElementById('search-input')?.value || '').toLowerCase();
  const cat  = window.contactCategoryFilter || 'All';
  const proj = window.contactProjectFilter  || 'All';
  const visible = store.contacts.filter(c => {
    if (c._deleted) return false;
    const name = (c.name || '').toLowerCase();
    const comp = (c.company || '').toLowerCase();
    const matchesSearch = !q    || name.includes(q) || comp.includes(q);
    const matchesCat    = cat  === 'All' || c.category === cat;
    const matchesProj   = proj === 'All' || c.project  === proj;
    return matchesSearch && matchesCat && matchesProj;
  });
  const allSelected = visible.length > 0 && visible.every(c => window.selectedContacts.has(c.id));
  if (allSelected) {
    visible.forEach(c => window.selectedContacts.delete(c.id));
  } else {
    visible.forEach(c => window.selectedContacts.add(c.id));
  }
  buildContactBookView();
};

window.exportContactsVCF = function() {
  if (window.selectedContacts.size === 0) return showToast('Select contacts first');
  let vcf = '';
  window.selectedContacts.forEach(id => {
    const c = store.contacts.find(con => con.id === id);
    if (!c) return;
    vcf += 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
    vcf += `FN:${c.name}\r\nN:;${c.name};;;\r\n`;
    if (c.company)  vcf += `ORG:${c.company}\r\n`;
    if (c.category) vcf += `CATEGORIES:${c.category}\r\n`;
    if (c.role)     vcf += `TITLE:${c.role}\r\n`;
    if (c.phone)    vcf += `TEL;TYPE=CELL:${c.phone}\r\n`;
    if (c.email)    vcf += `EMAIL;TYPE=INTERNET:${c.email}\r\n`;
    if (c.notes)    vcf += `NOTE:${c.notes.replace(/\r?\n/g, '\\n')}\r\n`;
    if (c.project)  vcf += `X-ADH-PROJECT:${c.project}\r\n`;
    vcf += 'END:VCARD\r\n';
  });
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ADH_Contacts_${new Date().toISOString().slice(0,10)}.vcf`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  showToast(`✓ Exported ${window.selectedContacts.size} contacts as VCF`, 'green');
  window.selectedContacts.clear(); buildContactBookView();
};

window.exportContactsXLSX = function() {
  if (window.selectedContacts.size === 0) return showToast('Select contacts first');
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const rows = [];
  window.selectedContacts.forEach(id => {
    const c = store.contacts.find(con => con.id === id);
    if (!c) return;
    rows.push({
      Name:     c.name     || '',
      Category: c.category || 'Other',
      Project:  c.project  || 'Office',
      Role:     c.role     || '',
      Company:  c.company  || '',
      Phone:    c.phone    || '',
      Email:    c.email    || '',
      Notes:    c.notes    || ''
    });
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Contacts');
  XLSX.writeFile(wb, `ADH_Contacts_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast(`✓ Exported ${window.selectedContacts.size} contacts as XLSX`, 'green');
  window.selectedContacts.clear(); buildContactBookView();
};

window.handleContactCSV = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactCSV(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      markStoreDirty(); save();
      buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid contacts found in CSV', 'red');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function parseContactCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/['"]/g, ''));

  const map = { name:-1, role:-1, company:-1, phone:-1, email:-1, notes:-1, category:-1, project:-1 };
  headers.forEach((h, i) => {
    if      (/name/.test(h))                   map.name     = i;
    else if (/role|position|title/.test(h))    map.role     = i;
    else if (/company|org|firm/.test(h))       map.company  = i;
    else if (/phone|mobile|cell|tel/.test(h))  map.phone    = i;
    else if (/email|mail/.test(h))             map.email    = i;
    else if (/category|type|trade/.test(h))    map.category = i;
    else if (/note|comment|info/.test(h))      map.notes    = i;
    else if (/project|site/.test(h))           map.project  = i;
  });

  if (map.name === -1) return [];

  const result = [];
  lines.slice(1).forEach(line => {
    const cols = line.split(sep).map(c => c.trim().replace(/^["']|["']$/g, ''));
    if (cols[map.name]) {
      result.push({
        id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
        name:     cols[map.name],
        category: map.category !== -1 ? cols[map.category] || 'Other'    : 'Other',
        project:  map.project  !== -1 ? cols[map.project]  || 'Office'   : 'Office',
        role:     map.role     !== -1 ? cols[map.role]     || 'Contact'  : 'Contact',
        company:  map.company  !== -1 ? cols[map.company]  || 'External' : 'External',
        phone:    map.phone    !== -1 ? cols[map.phone]    || ''         : '',
        email:    map.email    !== -1 ? cols[map.email]    || ''         : '',
        notes:    map.notes    !== -1 ? cols[map.notes]    || ''         : ''
      });
    }
  });
  return result;
}

// ── VCF (vCard) Import ──────────────────────────────────────────
window.handleContactVCF = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const list = parseContactVCF(ev.target.result);
    if (list.length > 0) {
      store.contacts = [...store.contacts, ...list];
      markStoreDirty(); save(); buildContactBookView();
      showToast(`✓ Imported ${list.length} contacts`, 'green');
    } else {
      showToast('No valid vCards found in file', 'red');
    }
  };
  reader.readAsText(file); e.target.value = '';
};

function parseContactVCF(text) {
  // Unfold vCard folded lines (continuation lines start with space or tab)
  const unfolded = text.replace(/\r?\n[ \t]/g, '');
  const blocks = unfolded.split(/BEGIN:VCARD/i).slice(1);
  const results = [];

  blocks.forEach(block => {
    const endIdx = block.search(/END:VCARD/i);
    if (endIdx === -1) return;
    const lines = block.slice(0, endIdx).split(/\r?\n/).filter(l => l.trim());

    // Parse all key:value pairs; key may have type params (KEY;PARAM=val:value)
    const fields = {};
    lines.forEach(line => {
      const colon = line.indexOf(':');
      if (colon === -1) return;
      const rawKey = line.slice(0, colon).split(';')[0].toLowerCase().trim();
      const value  = line.slice(colon + 1).trim();
      if (!fields[rawKey]) fields[rawKey] = value; // keep first occurrence
    });

    const name = fields['fn'] || '';
    if (!name) return;

    results.push({
      id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
      name,
      category: fields['categories'] || 'Other',
      project:  fields['x-adh-project'] || 'Office',
      role:     fields['title'] || 'Contact',
      company:  (fields['org'] || '').split(';')[0] || 'External',
      phone:    fields['tel'] || '',
      email:    fields['email'] || '',
      notes:    (fields['note'] || '').replace(/\\n/g, '\n')
    });
  });
  return results;
}

// ── XLSX Import ─────────────────────────────────────────────────
window.handleContactXLSX = function(e) {
  const file = e.target.files[0]; if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb   = XLSX.read(ev.target.result, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      const list = rows.map(row => {
        // Normalize keys to lowercase for flexible matching
        const r = {};
        Object.keys(row).forEach(k => { r[k.toLowerCase().trim()] = String(row[k]).trim(); });
        const name = r['name'] || r['full name'] || r['contact name'] || '';
        if (!name) return null;
        return {
          id:       'cnt_' + Date.now() + Math.random().toString(36).substr(2, 5),
          name,
          category: r['category'] || r['type']         || 'Other',
          project:  r['project']  || r['site']         || 'Office',
          role:     r['role']     || r['title']        || r['position'] || 'Contact',
          company:  r['company']  || r['org']          || r['organization'] || 'External',
          phone:    r['phone']    || r['mobile']       || r['tel'] || '',
          email:    r['email']    || r['e-mail']       || '',
          notes:    r['notes']    || r['note']         || r['comments'] || ''
        };
      }).filter(Boolean);

      if (list.length > 0) {
        store.contacts = [...store.contacts, ...list];
        markStoreDirty(); save(); buildContactBookView();
        showToast(`✓ Imported ${list.length} contacts`, 'green');
      } else {
        showToast('No valid contacts found in file', 'red');
      }
    } catch(err) {
      showToast('Error reading Excel file', 'red');
    }
  };
  reader.readAsArrayBuffer(file); e.target.value = '';
};

const _folderState = {};
function getFolderState(fid) {
  if(!_folderState[fid]) _folderState[fid]={sort:'name',filter:'',groupBy:'none'};
  return _folderState[fid];
}

// Global rebuild — called from inline onclick without .toString() issues
window.rebuildFolderProjs = function(fid) {
  const folder=getFolder(fid); if(!folder) return;
  const fs=getFolderState(fid);
  const area=document.getElementById('folder-proj-area'); if(!area) return;

  let projs=folder.projects.map(id=>getProject(id)).filter(Boolean);

  // Filter
  const q=(fs.filter||'').toLowerCase();
  if(q) projs=projs.filter(p=>
    p.name.toLowerCase().includes(q)||
    p.client.toLowerCase().includes(q)||
    p.auditor.toLowerCase().includes(q)||
    (p.projectType||'').toLowerCase().includes(q)
  );

  // Sort — always sort, folders always stay ordered
  projs.sort((a,b)=>{
    if(fs.sort==='date')   return (b.date||'').localeCompare(a.date||'');
    if(fs.sort==='client') return (a.client||'').localeCompare(b.client||'');
    if(fs.sort==='auditor')return (a.auditor||'').localeCompare(b.auditor||'');
    return a.name.localeCompare(b.name); // default A-Z
  });

  // Refresh sort button states
  ['name','date','client'].forEach(s=>{
    document.getElementById('sort-btn-'+s)?.classList.toggle('active', fs.sort===s);
  });
  const grpBtn=document.getElementById('sort-btn-auditor');
  if(grpBtn) grpBtn.classList.toggle('active', fs.groupBy==='auditor');

  // Render
  if(!projs.length) { area.innerHTML=emptyMsg('No projects match'); return; }

  if(fs.groupBy==='auditor') {
    const groups={};
    projs.forEach(p=>{ const k=p.auditor||'Unassigned'; if(!groups[k]) groups[k]=[]; groups[k].push(p); });
    area.innerHTML=Object.keys(groups).sort().map(aud=>`
      <div class="auditor-group-header">👤 ${aud} <span class="agh-count">${groups[aud].length}</span></div>
      <div class="proj-grid" style="margin-bottom:20px">${groups[aud].map(p=>projCardHTML(p,fid)).join('')}</div>
    `).join('');
  } else {
    area.innerHTML=`<div class="proj-grid">
      ${projs.map(p=>projCardHTML(p,fid)).join('')}
      <div class="proj-card new-card" onclick="showNewProjectModal('${fid}')">
        <div style="font-size:22px;opacity:0.4">＋</div><div style="font-size:12px">New Project</div>
      </div>
    </div>`;
  }
};

function navToEnv(pid) {
  const cur=route();
  // Remove duplicate views but keep project in stack so goBack() lands on project
  stack=stack.filter(r=>r.view!=='env'&&r.view!=='si'&&r.view!=='schedule'&&r.view!=='manpower');
  // Ensure project is in stack so Back works
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) {
    stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  }
  stack.push({view:'env', folderId:cur.folderId||'', projectId:pid});
  render();
}

function navToSchedule(pid) {
  const cur=route();
  stack=stack.filter(r=>r.view!=='schedule'&&r.view!=='si'&&r.view!=='env'&&r.view!=='manpower');
  if(!stack.find(r=>r.view==='project'&&r.projectId===pid)) {
    stack.push({view:'project',folderId:cur.folderId||'',projectId:pid});
  }
  stack.push({view:'schedule', folderId:cur.folderId||'', projectId:pid});
  render();
}

// ══════════════════════════════════════════
// 6-WEEK LOOK AHEAD SCHEDULE  v2.0
// — Absolute ISO week keys (YYYY-Www)
// — Full Timeline + 6-Week window toggle
// — Sliding window navigation
// — Export range modal
// ══════════════════════════════════════════

// ── ISO week helpers ─────────────────────

/** Returns ISO week string "YYYY-Www" for a given Date */
function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
}

/** Returns Monday Date for an ISO week key "YYYY-Www" */
function isoWeekMonday(key) {
  const [year, wPart] = key.split('-W');
  const y = parseInt(year), w = parseInt(wPart);
  // Jan 4 is always in week 1
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1) + (w - 1) * 7);
  return monday;
}

/** Format date as M/D */
function fmtMD(d) { return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; }

/** Add weeks to an ISO key */
function addWeeks(key, n) {
  const mon = isoWeekMonday(key);
  mon.setUTCDate(mon.getUTCDate() + n * 7);
  return isoWeekKey(mon);
}

/** Compare two ISO week keys */
function weekCmp(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

/** Current ISO week key */
function currentWeekKey() { return isoWeekKey(new Date()); }

/** Array of N consecutive week keys starting from startKey */
function weekRange(startKey, n) {
  return Array.from({length: n}, (_, i) => addWeeks(startKey, i));
}

// ── Per-project schedule view state ──────
const _schedState = {};
function getSchedState(pid) {
  if (!_schedState[pid]) {
    _schedState[pid] = {
      mode: '6week',          // '6week' | 'full'
      windowStart: null,      // ISO key — null = auto (current week)
    };
  }
  return _schedState[pid];
}

// ── Legacy key migration ──────────────────
// Old keys: "${itemId}_w0" … "${itemId}_w5" (relative to some past Monday)
// New keys: "${itemId}_YYYY-Www"
// We migrate by assuming w0 = current week at time of migration (best guess).
function _migrateLegacySchedule(proj) {
  if (!proj.schedule) return;
  const cur = currentWeekKey();
  const newSched = {};
  let migrated = 0;
  Object.entries(proj.schedule).forEach(([key, val]) => {
    const m = key.match(/^(.+)_(w\d)$/);
    if (m) {
      const itemId = m[1];
      const wIdx = parseInt(m[2].slice(1));
      const newKey = `${itemId}_${addWeeks(cur, wIdx)}`;
      newSched[newKey] = val;
      migrated++;
    } else {
      newSched[key] = val;
    }
  });
  if (migrated > 0) {
    proj.schedule = newSched;
    console.log(`[ADH] Migrated ${migrated} legacy schedule keys to ISO format`);
  }

  // Also migrate laborLog
  if (proj.laborLog) {
    const newLog = {};
    Object.entries(proj.laborLog).forEach(([key, val]) => {
      const m = key.match(/^(.+)_(w\d)$/);
      if (m) {
        const itemId = m[1];
        const wIdx = parseInt(m[2].slice(1));
        newLog[`${itemId}_${addWeeks(cur, wIdx)}`] = val;
      } else {
        newLog[key] = val;
      }
    });
    proj.laborLog = newLog;
  }
}

// ── Compute full timeline extent ──────────
// ONLY uses actual schedule entries — never item date fields
// (those can be years out from work order imports and cause infinite loops)
// Hard cap: max 52 weeks before current, max 26 weeks after current
function _getProjectWeekExtent(proj) {
  const cur = currentWeekKey();
  const hardEarliest = addWeeks(cur, -52); // never go more than 1 year back
  const hardLatest   = addWeeks(cur, 26);  // never go more than 6 months forward
  let earliest = cur, latest = addWeeks(cur, 5);

  // Only scan actual entered schedule cells — not item metadata dates
  Object.keys(proj.schedule || {}).forEach(key => {
    const m = key.match(/(\d{4}-W\d{2})$/);
    if (!m) return;
    const wk = m[1];
    // Ignore any key outside the hard caps (safety guard)
    if (weekCmp(wk, hardEarliest) < 0 || weekCmp(wk, hardLatest) > 0) return;
    if (weekCmp(wk, earliest) < 0) earliest = wk;
    if (weekCmp(wk, latest) > 0) latest = wk;
  });

  // Ensure at least 6 weeks visible beyond current
  if (weekCmp(addWeeks(cur, 5), latest) > 0) latest = addWeeks(cur, 5);
  // Never go earlier than hard cap
  if (weekCmp(earliest, hardEarliest) < 0) earliest = hardEarliest;
  // If no schedule entries exist yet, default to current + 11 weeks
  if (weekCmp(earliest, cur) > 0) earliest = cur;
  if (weekCmp(latest, addWeeks(cur, 11)) < 0) latest = addWeeks(cur, 11);

  return { earliest, latest };
}

// ── Build week column metadata ────────────
function _buildWeekCols(weeks) {
  return weeks.map(wk => {
    const mon = isoWeekMonday(wk);
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    const isCurrent = wk === currentWeekKey();
    const isPast = weekCmp(wk, currentWeekKey()) < 0;
    return {
      key: wk,
      label: fmtMD(mon) + '–' + fmtMD(sun),
      month: mon.toLocaleString('default', {month:'short', timeZone:'UTC'}),
      isCurrent,
      isPast,
      mon, sun
    };
  });
}

// ── Group weeks by month for header ───────
function _groupByMonth(weekCols) {
  const groups = [];
  weekCols.forEach(wc => {
    const m = wc.month;
    if (!groups.length || groups[groups.length-1].month !== m) {
      groups.push({ month: m, count: 1 });
    } else {
      groups[groups.length-1].count++;
    }
  });
  return groups;
}

// ── Phase color mapping (from Excel) ──────
const PHASE_COLORS = {
  'SDS':  { bg:'rgba(59,130,246,0.18)',  text:'#60a5fa', border:'rgba(59,130,246,0.35)' },
  'FSS':  { bg:'rgba(59,130,246,0.18)',  text:'#60a5fa', border:'rgba(59,130,246,0.35)' },
  'SDA':  { bg:'rgba(16,185,129,0.18)',  text:'#34d399', border:'rgba(16,185,129,0.35)' },
  'FSA':  { bg:'rgba(16,185,129,0.18)',  text:'#34d399', border:'rgba(16,185,129,0.35)' },
  'RTS':  { bg:'rgba(245,158,11,0.18)',  text:'#fbbf24', border:'rgba(245,158,11,0.35)' },
  'DEL':  { bg:'rgba(249,115,22,0.22)',  text:'#fb923c', border:'rgba(249,115,22,0.4)'  },
  'GLASS':{ bg:'rgba(167,139,250,0.18)', text:'#a78bfa', border:'rgba(167,139,250,0.35)'},
  'MEP':  { bg:'rgba(239,68,68,0.15)',   text:'#f87171', border:'rgba(239,68,68,0.3)'  },
  'TBD':  { bg:'rgba(100,116,139,0.15)', text:'#94a3b8', border:'rgba(100,116,139,0.3)'},
  'DELAYED':{ bg:'rgba(239,68,68,0.12)',text:'#f87171', border:'rgba(239,68,68,0.25)' },
};

function _cellStyle(val) {
  if (!val) return '';
  const upper = val.toUpperCase().trim();
  for (const [k, c] of Object.entries(PHASE_COLORS)) {
    if (upper === k || upper.startsWith(k + ' ') || upper.includes(k)) {
      return `background:${c.bg};color:${c.text};border:1px solid ${c.border};border-radius:5px;font-weight:600;font-size:10px;`;
    }
  }
  return '';
}

// ── Main buildScheduleView ────────────────
function buildScheduleView(pid) {
  const proj = getProject(pid); if(!proj) return;
  if(!proj.schedule) proj.schedule = {};
  if(!proj.laborSettings) proj.laborSettings = { show:false, workers:4, hoursPerDay:8, workDays:5 };
  if(!proj.laborLog) proj.laborLog = {};

  // Migrate legacy keys on first open
  _migrateLegacySchedule(proj);

  const ls = proj.laborSettings;
  const state = getSchedState(pid);
  const cur = currentWeekKey();

  // Determine which weeks to show
  let weekKeys;
  if (state.mode === 'full') {
    const { earliest, latest } = _getProjectWeekExtent(proj);
    weekKeys = [];
    let wk = earliest;
    let safety = 0;
    while (weekCmp(wk, latest) <= 0 && safety < 80) { // hard cap: 80 weeks max
      weekKeys.push(wk);
      wk = addWeeks(wk, 1);
      safety++;
    }
  } else {
    // 6-week sliding window
    const windowStart = state.windowStart || cur;
    weekKeys = weekRange(windowStart, 6);
  }

  const weekCols = _buildWeekCols(weekKeys);
  const monthGroups = _groupByMonth(weekCols);
  const items = activeItems(proj);
  const el = document.getElementById('v-schedule');

  // ── Per-week labor totals ─────────────
  const weekLabor = weekCols.map(wc => {
    const scheduled = items.reduce((sum, item) => {
      const hasCell = !!(proj.schedule[`${item.id}_${wc.key}`] || '').trim();
      return sum + (hasCell && item.laborHours ? item.laborHours : 0);
    }, 0);
    const logged = items.reduce((sum, item) => {
      const log = proj.laborLog[`${item.id}_${wc.key}`] || {};
      return sum + (log.hours || 0);
    }, 0);
    const capacity = ls.workers * ls.hoursPerDay * ls.workDays;
    const display = logged > 0 ? logged : scheduled;
    const pct = capacity > 0 ? Math.round((display / capacity) * 100) : 0;
    const barColor = pct > 100 ? '#ef4444' : pct >= 80 ? '#fbbf24' : '#22c55e';
    return { scheduled, logged, capacity, pct, barColor, display };
  });

  // ── Status dot helper ─────────────────
  function statusDot(s) {
    const c = { completed:'#22c55e','punch-ongoing':'#a855f7','not-ready':'#ef4444','in-progress':'#fbbf24','on-hold':'#f97316',pending:'#475569' };
    return `<span class="sched-status-dot" style="background:${c[s]||c.pending}"></span>`;
  }

  // ── Column widths ─────────────────────
  const SI_COL = 170; // px, fixed
  const WEEK_COL = state.mode === 'full' ? Math.max(72, Math.min(110, Math.floor((window.innerWidth - SI_COL - 80) / weekCols.length))) : 110;

  // ── Navigation controls ───────────────

        style="width:28px;height:28px;border-radius:6px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.12s"

    ${weekCols.map(wc => `
      <div class="sched-cell sched-week-header ${wc.isCurrent?'sched-current-week':''} ${wc.isPast?'sched-past-week':''}"

        <div style="font-family:var(--mono);font-size:9px;font-weight:700;color:${wc.isCurrent?'var(--accent)':wc.isPast?'var(--text3)':'var(--text2)'};letter-spacing:0.3px">${wc.label}</div>

            <input type="number" min="0" max="9999" value="${log.hours||''}" placeholder="⏱"

    return `
      <div class="sched-cell sched-si-col" style="background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:38px;">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">${statusDot(item.status)}${item.num}</span>

  // ── Labor summary row ─────────────────
  const laborRowHTML = ls.show ? `
    <div class="sched-cell sched-si-col" style="background:rgba(30,58,95,0.85);display:flex;align-items:center;padding:8px 10px;">
      <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:#93c5fd;letter-spacing:0.8px;text-transform:uppercase">👷 LABOR</span>

      const wl = weekLabor[i];

        <div style="height:3px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden">

        </div>

    }).join('')}` : '';

  // ── Legend HTML ───────────────────────
  const legendHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 0;border-top:1px solid var(--border)">
      ${Object.entries(PHASE_COLORS).slice(0,7).map(([k,c]) => `
        <div style="display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:${c.text};
          background:${c.bg};border:1px solid ${c.border};border-radius:4px;padding:2px 7px;">
          ${k}
        </div>`).join('')}
      <span style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-left:4px">— tap cell to enter phase / notes</span>
    </div>`;

  // ── Labor settings panel ──────────────
  const laborPanelHTML = ls.show ? `
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 14px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:11px;">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Workers</span>
        <input type="number" class="labor-num-input" min="1" max="999" value="${ls.workers}"
          onchange="saveScheduleSetting('${pid}','workers',+this.value||1)" />
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Hrs/Day</span>
        <input type="number" class="labor-num-input" min="1" max="24" value="${ls.hoursPerDay}"
          onchange="saveScheduleSetting('${pid}','hoursPerDay',+this.value||8)" />
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Work Days</span>
        <div style="display:flex;gap:3px">
          ${[5,6,7].map(d=>`<button onclick="saveScheduleSetting('${pid}','workDays',${d})"
            style="padding:4px 9px;border-radius:6px;border:1px solid ${ls.workDays===d?'rgba(96,165,250,0.5)':'var(--border)'};
            background:${ls.workDays===d?'rgba(96,165,250,0.15)':'var(--surface)'};
            color:${ls.workDays===d?'#60a5fa':'var(--text3)'};font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;">${d}d</button>`).join('')}
        </div>
      </div>
      <div style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">
        Cap: ${ls.workers * ls.hoursPerDay * ls.workDays}h/wk
      </div>
    </div>` : '';

  // ── Assemble the grid ─────────────────
  const gridCols = `${SI_COL}px repeat(${weekCols.length}, ${WEEK_COL}px)`;

  el.innerHTML = `
    <div class="schedule-wrap">
      <!-- Header row -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="schedule-title">📅 Look Ahead
            <span style="font-size:11px;color:var(--text3);font-weight:400;font-family:var(--mono)">${proj.name}</span>
          </div>
          ${navControlsHTML}
        </div>
        <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
          <!-- Mode toggle -->
          <div style="display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0">

              6-WEEK
            </button>
            <button onclick="schedSetMode('${pid}','full')"
              style="padding:7px 13px;border:none;background:${state.mode==='full'?'var(--accent)':'none'};
              color:${state.mode==='full'?'#000':'var(--text2)'};font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap">
              FULL TIMELINE
            </button>
          </div>
          <button class="labor-toggle-btn ${ls.show?'active':''}" onclick="saveScheduleSetting('${pid}','show',${!ls.show})"
            style="padding:7px 13px;white-space:nowrap">
            👷 Manpower
          </button>
          <button class="schedule-export-btn" onclick="showScheduleExportModal('${pid}')">
            ⬇ Export PDF
          </button>
        </div>
      </div>

      ${laborPanelHTML}

      ${items.length === 0 ? `
        <div style="text-align:center;padding:60px;color:var(--text3)">
          <div style="font-size:40px;opacity:0.18;margin-bottom:12px">📅</div>
          <div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px">No scope items yet</div>
          <div style="font-size:12px">Add SI items to the project first.</div>
        </div>
      ` : `
        <div style="overflow-x:auto;flex:1;border:1px solid var(--border);border-radius:10px;overflow:hidden">
          <div id="sched-grid-inner" style="display:grid;grid-template-columns:${gridCols};min-width:${SI_COL + weekCols.length * WEEK_COL}px">
            ${monthHeaderHTML}
            ${weekHeaderHTML}
            ${dataRowsHTML}
            ${laborRowHTML}
          </div>
        </div>
        ${legendHTML}

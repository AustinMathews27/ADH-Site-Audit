function deletePhoto(pid,sid,idx) {
  const item=getSI(pid,sid); if(!item) return;
  syncEditorToStore(pid,sid);
  const [removed] = item.photos.splice(idx,1);
  markAsDirty(sid); save();
  buildSIEditor(pid,sid); renderLeft(route());

  // Free memory if it was a local blob (crucial memory cleanup)
  if (removed && removed._blobUrl) {
    URL.revokeObjectURL(removed._blobUrl);
  }

  // If the photo was uploaded to Azure Blob, delete it server-side too
  if (removed && removed.url) {
    fetch('/api/deleteBlob', {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ blobUrl: removed.url }),
    }).catch(e => console.warn('[Photo] Blob delete failed (non-fatal):', e.message));
  }
}
function previewPhoto(pid,sid,idx) {
  const item=getSI(pid,sid); if(!item) return;
  const src=getPhotoSrcForDisplay(item.photos[idx]);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.93);display:flex;align-items:center;justify-content:center;cursor:pointer;';
  ov.innerHTML=src
    ?`<img src="${src}" style="max-width:92%;max-height:92%;border-radius:10px;object-fit:contain;" />`
    :`<div style="color:#8b95a8;text-align:center;font-size:14px"><div style="font-size:40px;margin-bottom:10px">🚫</div>This photo's image data was lost before it could upload.<br>It needs to be retaken.</div>`;
  ov.onclick=()=>document.body.removeChild(ov);
  document.body.appendChild(ov);
}

// ══════════════════════════════════════════════════════════════════
// PHOTO RECOVERY (ADMIN ONLY)
// Browses every blob in the Azure Storage container, grouped by the
// app's project → scope item names and sorted by date, and re-links
// selected photos into their SIs in bulk. Orphaned blobs (uploaded but
// no longer referenced by any photo entry — e.g. after the markup-save
// data loss) are exactly what this recovers. Read-only against Azure:
// restore just re-attaches URLs, it never moves or deletes blobs.
// ══════════════════════════════════════════════════════════════════
let _rec = null; // recovery tab state: { blobs:[], pid:null, sel:Set<idx> }
let _admTab = 'recovery';
let _admBlobCache = null; // shared blob listing for Recovery / Dead Photos / Storage tabs

const _ADM_TABS = [
  ['recovery', '📷 Recovery'], ['sweeper', '🧹 Dead Photos'], ['cleanup', '🗄 Storage'],
  ['trash', '🗑 Trash'], ['sync', '⇅ Sync'], ['activity', '📜 Activity'],
  ['backup', '💾 Backup'], ['system', '⚙️ System'],
];

function showAdminConsole(tab) {
  if (!isAdmin) { showToast('Admin access required', 'red'); return; }
  document.getElementById('admin-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'recovery-overlay';
  ov.id = 'admin-overlay';
  ov.innerHTML = `
    <div class="recovery-header">
      <span style="font-size:15px;font-weight:700">🛠 Admin Console</span>
      <span id="rec-crumb" style="font-size:12px;color:var(--text2);flex:1;min-width:120px"></span>
      <button class="recovery-btn" onclick="_admRefresh()">↻ Refresh</button>
      <button class="recovery-btn" onclick="_admClose()">✕ Close</button>
    </div>
    <div class="adm-tabs" id="adm-tabs"></div>
    <div class="recovery-body" id="rec-body"></div>
    <div class="recovery-bar" id="rec-bar" style="display:none"></div>`;
  document.body.appendChild(ov);
  _admSwitch(tab || _admTab || 'recovery');
}
function showPhotoRecovery() { showAdminConsole('recovery'); } // legacy entry point

function _admClose() {
  document.getElementById('admin-overlay')?.remove();
  _rec = null;
}

function _admSwitch(tab) {
  _admTab = tab;
  const tabs = document.getElementById('adm-tabs');
  if (tabs) tabs.innerHTML = _ADM_TABS.map(([id, label]) =>
    `<button class="adm-tab ${id === tab ? 'active' : ''}" onclick="_admSwitch('${id}')">${label}</button>`).join('');
  const bar = document.getElementById('rec-bar');
  if (bar) { bar.style.display = 'none'; bar.innerHTML = ''; }
  const body = document.getElementById('rec-body');
  if (body) body.innerHTML = '';
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = '';
  const renderers = {
    recovery: _recEnter, sweeper: _admRenderSweeper, cleanup: _admRenderCleanup,
    trash: _admRenderTrash, sync: _admRenderSync, activity: _admRenderActivity,
    backup: _admRenderBackup, system: _admRenderSystem,
  };
  (renderers[tab] || _recEnter)();
}

function _admRefresh() {
  if (['recovery', 'sweeper', 'cleanup'].includes(_admTab)) _admBlobCache = null;
  _admSwitch(_admTab);
}

async function _admLoadBlobs() {
  if (_admBlobCache) return _admBlobCache;
  const res = await fetch('/api/listBlobs');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const blobs = (data.blobs || []).map((b, i) => {
    const parts = b.name.split('/');
    const file  = parts[parts.length - 1] || '';
    const m     = file.match(/^(\d{13})-/);
    return {
      idx: i, name: b.name, url: b.url, size: b.size || 0,
      projId: parts[0] || '',
      siId:   parts.length >= 3 ? parts[1] : '',
      date:   m ? new Date(+m[1]) : (b.lastModified ? new Date(b.lastModified) : null),
    };
  });
  _admBlobCache = { blobs, truncated: !!data.truncated };
  if (data.truncated) showToast('⚠️ Blob list truncated at ' + blobs.length, 'red');
  return _admBlobCache;
}

// ── Tab: Photo Recovery ─────────────────────────────────────────────
async function _recEnter() {
  _rec = { blobs: [], pid: null, sel: new Set() };
  const body = document.getElementById('rec-body');
  if (body) body.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text2)">Loading blob storage…</div>`;
  try {
    _rec.blobs = (await _admLoadBlobs()).blobs;
    _recRender();
  } catch (e) {
    if (body) body.innerHTML = `<div style="color:var(--red);padding:24px;text-align:center">Could not list blob storage: ${_htmlEsc(e.message)}<br>
      <span style="font-size:11px;color:var(--text2)">Requires the listBlobs API and storage settings in Azure.</span></div>`;
  }
}

/** Set of every photo URL the app currently references (SI photos + covers). */
function _recAppUrls() {
  const set = new Set();
  (store.projects || []).forEach(p => {
    if (p.coverPhoto && !p.coverPhoto.startsWith('data:')) set.add(p.coverPhoto);
    (p.items || []).forEach(it => (it.photos || []).forEach(ph => { if (ph.url) set.add(ph.url); }));
  });
  return set;
}

function _recFmtDate(d) {
  if (!d || isNaN(d)) return '';
  return (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getDate().toString().padStart(2,'0') + '/' + d.getFullYear()
    + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function _recRender() {
  if (!_rec) return;
  if (_rec.pid) _recRenderProject(); else _recRenderProjects();
}

// ── Level 1: projects ───────────────────────────────────────────────
function _recRenderProjects() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  const bar   = document.getElementById('rec-bar');
  if (crumb) crumb.textContent = 'All projects in blob storage';
  if (bar) bar.style.display = 'none';

  const appUrls = _recAppUrls();
  const groups = {};
  _rec.blobs.forEach(b => {
    (groups[b.projId] = groups[b.projId] || { blobs: [], newest: 0, orphans: 0 }).blobs.push(b);
    const t = b.date ? b.date.getTime() : 0;
    if (t > groups[b.projId].newest) groups[b.projId].newest = t;
    if (!appUrls.has(b.url)) groups[b.projId].orphans++;
  });

  const rows = Object.entries(groups)
    .sort((a, b) => b[1].newest - a[1].newest)
    .map(([pid, g]) => {
      const proj  = getProject(pid);
      const title = proj ? proj.name : pid + ' (not in app)';
      const dates = g.blobs.map(b => b.date).filter(Boolean).sort((a, b) => a - b);
      const range = dates.length ? _recFmtDate(dates[0]).split(' ')[0] + ' – ' + _recFmtDate(dates[dates.length-1]).split(' ')[0] : '';
      const mb    = (g.blobs.reduce((s, b) => s + b.size, 0) / 1048576).toFixed(1);
      return `<div class="recovery-proj-row" onclick="_recOpenProject('${_htmlEsc(pid)}')">
        <span style="font-size:20px">${proj ? '📁' : '❓'}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(title)}</div>
          <div style="font-size:11px;color:var(--text2);font-family:var(--mono)">${g.blobs.length} photo${g.blobs.length!==1?'s':''} · ${mb} MB${range ? ' · ' + range : ''}</div>
        </div>
        ${g.orphans > 0 ? `<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;background:var(--red-dim);color:var(--red)">${g.orphans} not in app</span>` : `<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;background:var(--green-dim,rgba(22,101,52,0.15));color:var(--green,#16a34a)">all linked</span>`}
        <span style="color:var(--text3)">›</span>
      </div>`;
    }).join('');

  if (body) body.innerHTML = `
    <div style="font-size:11px;color:var(--text2);margin-bottom:10px">${_rec.blobs.length} photos in storage · projects sorted by newest photo · <strong>"not in app"</strong> = uploaded but no longer linked to any scope item (recoverable)</div>
    ${rows || '<div style="text-align:center;padding:30px;color:var(--text2)">Blob storage is empty</div>'}`;
}

function _recOpenProject(pid) {
  if (!_rec) return;
  _rec.pid = pid;
  _rec.sel = new Set();
  _recRenderProject();
}

// ── Level 2: one project, grouped by SI, sorted by date ─────────────
function _recRenderProject() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  const pid   = _rec.pid;
  const proj  = getProject(pid);
  const appUrls = _recAppUrls();

  if (crumb) crumb.innerHTML = `<a onclick="_rec.pid=null;_recRender()" style="cursor:pointer;color:var(--accent)">‹ All projects</a> · ${_htmlEsc(proj ? proj.name : pid)}`;

  const blobs = _rec.blobs.filter(b => b.projId === pid);
  const groups = {};
  blobs.forEach(b => (groups[b.siId] = groups[b.siId] || []).push(b));

  const keyOf = sid => {
    if (sid === 'cover') return { order: '1', label: '🖼 Project Cover Photos', si: null };
    const si = proj ? (proj.items || []).find(i => i.id === sid) : null;
    if (si) return { order: '0' + String(si.num || ''), label: `${_htmlEsc((si.num || '').replace(/^SI\s+/, 'SI# '))} — ${_htmlEsc(si.title || '')}${si._deleted ? ' <span style="color:var(--red)">(deleted SI)</span>' : ''}`, si };
    return { order: '2' + sid, label: `${_htmlEsc(sid || '(no folder)')} <span style="color:var(--text3)">(SI not found in app)</span>`, si: null };
  };

  const sections = Object.keys(groups)
    .map(sid => ({ sid, ...keyOf(sid) }))
    .sort((a, b) => a.order.localeCompare(b.order, undefined, { numeric: true }))
    .map(sec => {
      const shots = groups[sec.sid].slice().sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
      const missing = shots.filter(b => !appUrls.has(b.url));
      const cards = shots.map(b => {
        const inApp = appUrls.has(b.url);
        const selected = _rec.sel.has(b.idx);
        return `<div class="recovery-card ${selected ? 'selected' : ''}" id="rec-card-${b.idx}" onclick="_recToggle(${b.idx})">
          <img src="${b.url}" loading="lazy" alt="">
          <div class="rec-check">${selected ? '✓' : ''}</div>
          <button class="rec-open" onclick="event.stopPropagation();window.open('${b.url}','_blank')" title="Open full size">⤢</button>
          ${inApp ? '<div class="rec-inapp">in app</div>' : ''}
          <div class="rec-date">${_recFmtDate(b.date) || '—'}</div>
        </div>`;
      }).join('');
      const selBtn = missing.length
        ? `<button class="recovery-btn" style="font-size:10px;padding:4px 10px" onclick="_recSelectMissing('${_htmlEsc(sec.sid)}')">Select ${missing.length} missing</button>`
        : `<span style="font-size:10px;color:var(--green,#16a34a);font-weight:700">all linked ✓</span>`;
      return `<div class="recovery-si-group">
        <div class="recovery-si-title">${sec.label}<span style="font-weight:400;color:var(--text3);font-size:11px">· ${shots.length} photo${shots.length!==1?'s':''}</span>${selBtn}</div>
        <div class="recovery-grid">${cards}</div>
      </div>`;
    }).join('');

  if (body) body.innerHTML = `
    ${proj ? '' : `<div style="font-size:12px;color:var(--red);margin-bottom:10px">⚠️ This project is not in the app${'—'} photos can be viewed and opened, but restore needs the project to exist locally.</div>`}
    ${sections || '<div style="text-align:center;padding:30px;color:var(--text2)">No photos for this project</div>'}`;
  _recUpdateBar();
}

function _recToggle(idx) {
  if (!_rec) return;
  if (_rec.sel.has(idx)) _rec.sel.delete(idx); else _rec.sel.add(idx);
  const card = document.getElementById('rec-card-' + idx);
  if (card) {
    card.classList.toggle('selected', _rec.sel.has(idx));
    const chk = card.querySelector('.rec-check');
    if (chk) chk.textContent = _rec.sel.has(idx) ? '✓' : '';
  }
  _recUpdateBar();
}

function _recSelectMissing(sid) {
  if (!_rec) return;
  const appUrls = _recAppUrls();
  _rec.blobs.filter(b => b.projId === _rec.pid && b.siId === sid && !appUrls.has(b.url))
    .forEach(b => _rec.sel.add(b.idx));
  _recRenderProject();
}

function _recUpdateBar() {
  const bar = document.getElementById('rec-bar');
  if (!bar || !_rec) return;
  const n = _rec.sel.size;
  bar.style.display = 'flex';
  bar.innerHTML = `
    <span style="font-size:12px;color:var(--text2);flex:1">${n} selected</span>
    <button class="recovery-btn" onclick="_rec.sel=new Set();_recRenderProject()" ${n ? '' : 'disabled'}>Clear</button>
    <button class="recovery-btn danger" onclick="_recDeleteSelected()" ${n ? '' : 'disabled'}>🗑 Delete ${n || ''} from storage</button>
    <button class="recovery-btn primary" onclick="_recRestoreSelected()" ${n ? '' : 'disabled'}>⤵ Restore ${n || ''} to app</button>`;
}

// Permanently delete selected blobs from Azure — for photos the admin has
// decided NOT to recover. Photos still linked in the app are skipped (remove
// them from their scope item first, or they'd become dead entries).
function _recDeleteSelected() {
  if (!_rec || !_rec.sel.size) return;
  const appUrls   = _recAppUrls();
  const targets   = [..._rec.sel].map(i => _rec.blobs[i]).filter(Boolean);
  const linked    = targets.filter(b => appUrls.has(b.url));
  const deletable = targets.filter(b => !appUrls.has(b.url));
  if (!deletable.length) {
    showToast('All selected photos are still linked in the app — remove them from their scope items instead', 'red');
    return;
  }
  makeModal('Delete Photos from Storage', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:13px;color:var(--red);font-weight:600;margin-bottom:6px">Permanently delete ${deletable.length} photo${deletable.length !== 1 ? 's' : ''} from Azure Storage?</div>
      <div style="font-size:12px;color:var(--text2)">They can never be recovered after this.${linked.length ? `<br>${linked.length} selected photo${linked.length !== 1 ? 's are' : ' is'} still linked in the app and will be skipped.` : ''}</div>
    </div>`, async () => {
    closeModal();
    let done = 0, failed = 0;
    showToast(`Deleting 0/${deletable.length}…`);
    for (const b of deletable) {
      try {
        const res = await fetch('/api/deleteBlob', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blobUrl: b.url }),
        });
        if (res.ok) done++; else failed++;
      } catch (e) { failed++; }
      if ((done + failed) % 10 === 0) showToast(`Deleting ${done + failed}/${deletable.length}…`);
    }
    _admBlobCache = null;
    _rec.sel = new Set();
    showToast(`✓ ${done} deleted${failed ? ` · ${failed} failed` : ''}${linked.length ? ` · ${linked.length} skipped (still in app)` : ''}`, failed ? 'red' : 'green');
    try { _rec.blobs = (await _admLoadBlobs()).blobs; } catch (e) {}
    _recRender();
  });
}

function _recRestoreSelected() {
  if (!_rec || !_rec.sel.size) return;
  const appUrls = _recAppUrls();
  let restored = 0, skipped = 0, already = 0;
  const dirtySIs = new Set();
  let projDirty = false;

  _rec.sel.forEach(idx => {
    const b = _rec.blobs[idx];
    if (!b) { skipped++; return; }
    if (appUrls.has(b.url)) { already++; return; }
    const proj = getProject(b.projId);
    if (!proj) { skipped++; return; }
    if (b.siId === 'cover') {
      // Only fill an empty cover — never overwrite one that exists
      if (!proj.coverPhoto) { proj.coverPhoto = b.url; projDirty = true; restored++; }
      else skipped++;
      return;
    }
    const si = (proj.items || []).find(i => i.id === b.siId && !i._deleted);
    if (!si) { skipped++; return; }
    si.photos = si.photos || [];
    si.photos.push({ url: b.url, caption: '', takenAt: _recFmtDate(b.date) });
    dirtySIs.add(si.id);
    restored++;
  });

  dirtySIs.forEach(sid => markAsDirty(sid));
  if (projDirty) markProjectDirty(_rec.pid);
  if (dirtySIs.size || projDirty) { save(); scheduleDirtySync(); }

  const bits = [`✓ ${restored} restored`];
  if (already) bits.push(`${already} already linked`);
  if (skipped) bits.push(`${skipped} skipped (no matching SI)`);
  showToast(bits.join(' · '), restored ? 'green' : 'red');

  _rec.sel = new Set();
  _recRenderProject();
}

// ── Tab: Dead Photos (sweeper) ──────────────────────────────────────
// Photo entries that can never display again: no local image data AND
// either no URL or a URL whose blob no longer exists in storage.
let _admDeadGroups = [];

async function _admRenderSweeper() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'Photo entries whose image no longer exists anywhere';
  if (body) body.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text2)">Scanning all projects…</div>`;

  let blobSet = null;
  try { blobSet = new Set((await _admLoadBlobs()).blobs.map(b => b.url)); } catch (e) { blobSet = null; }

  const hasData = ph => (ph.data instanceof Blob) || (typeof ph.data === 'string' && ph.data.startsWith('data:'));
  _admDeadGroups = [];
  let total = 0;
  (store.projects || []).filter(p => !p._deleted).forEach(p => {
    (p.items || []).filter(i => !i._deleted).forEach(it => {
      const dead = (it.photos || []).filter(ph => {
        if (hasData(ph)) return false;
        if (!ph.url) return true;                       // stub: no url, no data
        if (blobSet && !blobSet.has(ph.url)) return true; // url points at a deleted blob
        return false;
      });
      if (dead.length) {
        _admDeadGroups.push({ pid: p.id, pname: p.name, sid: it.id,
          label: (it.num || '').replace(/^SI\s+/, 'SI# ') + (it.title ? ' — ' + it.title : ''), dead });
        total += dead.length;
      }
    });
  });

  const rows = _admDeadGroups.map(g => `
    <div class="adm-row">
      <span style="font-size:16px">🚫</span>
      <div class="adm-row-main">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(g.pname)}</div>
        <div class="adm-row-sub">${_htmlEsc(g.label)}</div>
      </div>
      <span style="font-size:11px;font-weight:700;color:var(--red)">${g.dead.length} dead</span>
    </div>`).join('');

  if (body) body.innerHTML = `
    <div style="font-size:11px;color:var(--text2);margin-bottom:10px">
      These entries show as "Photo unavailable" tiles — the image data is gone from every device and from storage, so removing them only clears clutter.
      ${blobSet ? '' : '<br>⚠️ Blob storage unreachable — only checking entries with no URL at all this pass.'}
    </div>
    ${total ? rows : '<div style="text-align:center;padding:30px;color:var(--text2)">✓ No dead photo entries found</div>'}`;

  const bar = document.getElementById('rec-bar');
  if (bar) {
    bar.style.display = total ? 'flex' : 'none';
    bar.innerHTML = total ? `
      <span style="font-size:12px;color:var(--text2);flex:1">${total} dead entr${total !== 1 ? 'ies' : 'y'} across ${_admDeadGroups.length} scope item${_admDeadGroups.length !== 1 ? 's' : ''}</span>
      <button class="recovery-btn danger" onclick="_admSweepDead()">🧹 Remove all ${total}</button>` : '';
  }
}

function _admSweepDead() {
  const total = _admDeadGroups.reduce((s, g) => s + g.dead.length, 0);
  if (!total) return;
  makeModal('Remove Dead Photo Entries', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🧹</div>
      <div style="font-size:13px;color:var(--text2)">Remove ${total} dead photo entr${total !== 1 ? 'ies' : 'y'}?<br>
      These have no recoverable image — this only deletes the empty placeholders.</div>
    </div>`, () => {
    let removed = 0;
    _admDeadGroups.forEach(g => {
      const it = getSI(g.pid, g.sid);
      if (!it || !it.photos) return;
      const rm = new Set(g.dead);
      const before = it.photos.length;
      it.photos = it.photos.filter(ph => !rm.has(ph));
      removed += before - it.photos.length;
      markAsDirty(g.sid);
    });
    if (removed) { save(); scheduleDirtySync(); }
    closeModal();
    showToast(`✓ Removed ${removed} dead entr${removed !== 1 ? 'ies' : 'y'}`, 'green');
    _admRenderSweeper();
  });
}

// ── Tab: Storage cleanup ────────────────────────────────────────────
// Blobs in Azure that no project references anymore. Deleting them is
// permanent — guarded by an age filter and a confirm step.
let _admCleanAge = 30;
let _admCleanSel = new Set(); // blob idx

async function _admRenderCleanup() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'Orphaned blobs — in storage but not referenced by any project';
  if (body) body.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text2)">Comparing storage against app data…</div>`;

  let blobs;
  try { blobs = (await _admLoadBlobs()).blobs; }
  catch (e) { if (body) body.innerHTML = `<div style="color:var(--red);padding:24px;text-align:center">Could not list blob storage: ${_htmlEsc(e.message)}</div>`; return; }

  const appUrls = _recAppUrls(); // includes tombstoned projects, so trash-restorable photos are protected
  const cutoff  = Date.now() - _admCleanAge * 86400000;
  const orphans = blobs.filter(b => !appUrls.has(b.url) &&
    (_admCleanAge === 0 || !b.date || b.date.getTime() < cutoff));
  const orphanIdx = new Set(orphans.map(b => b.idx));
  _admCleanSel = new Set([..._admCleanSel].filter(i => orphanIdx.has(i)));

  const groups = {};
  orphans.forEach(b => (groups[b.projId] = groups[b.projId] || []).push(b));
  const rows = Object.entries(groups).map(([pid, list]) => {
    const proj = getProject(pid);
    const mb = (list.reduce((s, b) => s + b.size, 0) / 1048576).toFixed(1);
    const allSel = list.every(b => _admCleanSel.has(b.idx));
    return `<div class="adm-row" style="cursor:pointer" onclick="_admCleanToggleGroup('${_htmlEsc(pid)}')">
      <span style="font-size:15px">${allSel ? '☑️' : '⬜'}</span>
      <div class="adm-row-main">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(proj ? proj.name : pid)}${proj && proj._deleted ? ' <span style="color:var(--red);font-size:10px">(deleted project)</span>' : ''}</div>
        <div class="adm-row-sub">${list.length} orphaned blob${list.length !== 1 ? 's' : ''} · ${mb} MB</div>
      </div>
    </div>`;
  }).join('');

  const totalMb = (orphans.reduce((s, b) => s + b.size, 0) / 1048576).toFixed(1);
  if (body) body.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--text2)">
      <span>⚠️ Deleting blobs is <strong>permanent</strong>. The Recovery tab can no longer restore anything deleted here.</span>
      <label style="margin-left:auto;display:flex;align-items:center;gap:6px">Older than
        <select onchange="_admCleanAge=+this.value;_admRenderCleanup()" style="padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text1)">
          <option value="7"  ${_admCleanAge === 7  ? 'selected' : ''}>7 days</option>
          <option value="30" ${_admCleanAge === 30 ? 'selected' : ''}>30 days</option>
          <option value="90" ${_admCleanAge === 90 ? 'selected' : ''}>90 days</option>
          <option value="0"  ${_admCleanAge === 0  ? 'selected' : ''}>any age</option>
        </select>
      </label>
    </div>
    ${orphans.length ? rows : `<div style="text-align:center;padding:30px;color:var(--text2)">✓ No orphaned blobs${_admCleanAge ? ' older than ' + _admCleanAge + ' days' : ''}</div>`}`;

  const bar = document.getElementById('rec-bar');
  if (bar) {
    const n = _admCleanSel.size;
    bar.style.display = orphans.length ? 'flex' : 'none';
    bar.innerHTML = orphans.length ? `
      <span style="font-size:12px;color:var(--text2);flex:1">${orphans.length} orphaned · ${totalMb} MB · ${n} selected</span>
      <button class="recovery-btn danger" onclick="_admCleanDelete()" ${n ? '' : 'disabled'}>🗑 Delete ${n || ''} permanently</button>` : '';
  }
}

function _admCleanToggleGroup(pid) {
  const list = (_admBlobCache?.blobs || []).filter(b => b.projId === pid);
  const appUrls = _recAppUrls();
  const cutoff = Date.now() - _admCleanAge * 86400000;
  const orphans = list.filter(b => !appUrls.has(b.url) && (_admCleanAge === 0 || !b.date || b.date.getTime() < cutoff));
  const allSel = orphans.every(b => _admCleanSel.has(b.idx));
  orphans.forEach(b => allSel ? _admCleanSel.delete(b.idx) : _admCleanSel.add(b.idx));
  _admRenderCleanup();
}

function _admCleanDelete() {
  const n = _admCleanSel.size;
  if (!n) return;
  makeModal('Delete Orphaned Blobs', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:13px;color:var(--red);font-weight:600;margin-bottom:6px">Permanently delete ${n} blob${n !== 1 ? 's' : ''} from Azure Storage?</div>
      <div style="font-size:12px;color:var(--text2)">This cannot be undone. Make sure nothing here still needs recovering.</div>
    </div>`, async () => {
    closeModal();
    const targets = (_admBlobCache?.blobs || []).filter(b => _admCleanSel.has(b.idx));
    let done = 0, failed = 0;
    showToast(`Deleting 0/${targets.length}…`);
    for (const b of targets) {
      try {
        const res = await fetch('/api/deleteBlob', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blobUrl: b.url }),
        });
        if (res.ok) done++; else failed++;
      } catch (e) { failed++; }
      if ((done + failed) % 10 === 0) showToast(`Deleting ${done + failed}/${targets.length}…`);
    }
    _admBlobCache = null;
    _admCleanSel = new Set();
    showToast(`✓ ${done} deleted${failed ? ' · ' + failed + ' failed' : ''}`, failed ? 'red' : 'green');
    _admRenderCleanup();
  });
}

// ── Tab: Trash ──────────────────────────────────────────────────────
// Tombstoned projects and scope items. SI restore clears the flag in
// place. Project restore must resurrect under a NEW id — the cloud index
// merges tombstones as newest-wins, so a deleted project id can never
// come back; a fresh id sidesteps that permanently.
function _admRenderTrash() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'Deleted projects and scope items still held locally';

  const deadProjects = (store.projects || []).filter(p => p._deleted);
  const deadSIs = [];
  (store.projects || []).filter(p => !p._deleted).forEach(p =>
    (p.items || []).filter(i => i._deleted).forEach(i => deadSIs.push({ p, i })));

  const projRows = deadProjects.map(p => `
    <div class="adm-row">
      <span style="font-size:16px">📁</span>
      <div class="adm-row-main">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(p.name)}</div>
        <div class="adm-row-sub">${(p.items || []).filter(i => !i._deleted).length} scope items · deleted ${p._deletedAt ? _timeAgo(p._deletedAt) : '—'}</div>
      </div>
      <button class="recovery-btn" style="font-size:10px;padding:5px 12px" onclick="_admRestoreProject('${_htmlEsc(p.id)}')">↩ Restore</button>
    </div>`).join('');

  const siRows = deadSIs.map(({ p, i }) => `
    <div class="adm-row">
      <span style="font-size:16px">📋</span>
      <div class="adm-row-main">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc((i.num || '').replace(/^SI\s+/, 'SI# '))} — ${_htmlEsc(i.title || '')}</div>
        <div class="adm-row-sub">${_htmlEsc(p.name)} · deleted ${i._deletedAt ? _timeAgo(i._deletedAt) : '—'}</div>
      </div>
      <button class="recovery-btn" style="font-size:10px;padding:5px 12px" onclick="_admRestoreSI('${_htmlEsc(p.id)}','${_htmlEsc(i.id)}')">↩ Restore</button>
    </div>`).join('');

  if (body) body.innerHTML = `
    <div style="font-size:11px;color:var(--text2);margin-bottom:12px">
      Deletions keep a hidden copy so they sync across devices; old ones are purged automatically after ~90 days.
      Photo blobs are removed from storage at delete time, so a restored item may need the <strong>Dead Photos</strong> sweep — and check <strong>Recovery</strong> in case some photos survived.
    </div>
    <div class="adm-section">
      <div class="adm-section-title">📁 Deleted projects <span style="color:var(--text3);font-weight:400">${deadProjects.length}</span></div>
      ${projRows || '<div style="font-size:12px;color:var(--text2)">Nothing here</div>'}
    </div>
    <div class="adm-section">
      <div class="adm-section-title">📋 Deleted scope items <span style="color:var(--text3);font-weight:400">${deadSIs.length}</span></div>
      ${siRows || '<div style="font-size:12px;color:var(--text2)">Nothing here</div>'}
    </div>`;
}

function _admRestoreProject(pid) {
  const src = (store.projects || []).find(p => p.id === pid && p._deleted);
  if (!src) return;
  // Resurrect as a fresh project id (see comment above _admRenderTrash)
  const ts = Date.now();
  const clone = JSON.parse(JSON.stringify(src, (k, v) => (v instanceof Blob ? undefined : v)));
  clone.id = 'proj_' + ts;
  delete clone._deleted; delete clone._deletedAt;
  clone._fieldTs = clone._fieldTs || {}; delete clone._fieldTs._deleted;
  clone.ownedBy = _currentUser?.userId || '';
  const secMap = {};
  clone.sections = (clone.sections || []).map(s => {
    const nid = 'sec_' + Math.random().toString(36).slice(2);
    secMap[s.id] = nid;
    return { ...s, id: nid };
  });
  clone.items = (clone.items || []).filter(i => !i._deleted).map((item, i) => ({
    ...item,
    id: 'si_' + (ts + i),
    sectionId: secMap[item.sectionId] || item.sectionId,
    // keep only photos that still have a cloud copy — local blobs died with the old project
    photos: (item.photos || []).filter(ph => ph.url).map(ph => ({ url: ph.url, caption: ph.caption || '', takenAt: ph.takenAt || '' })),
  }));
  store.projects.push(clone);
  const fld = store.folders.find(f => (f.projects || []).includes(pid)) || store.folders[0];
  if (fld) { fld.projects = fld.projects || []; fld.projects.push(clone.id); }
  markProjectDirty(clone.id);
  markStoreDirty(); save(); scheduleDirtySync();
  showToast(`✓ Restored "${src.name}"${fld ? ' → ' + fld.name : ''}`, 'green');
  _admRenderTrash();
}

function _admRestoreSI(pid, sid) {
  const proj = getProject(pid); if (!proj) return;
  const item = (proj.items || []).find(i => i.id === sid && i._deleted);
  if (!item) return;
  item._deleted = false;
  delete item._deletedAt;
  item._fieldTs = item._fieldTs || {};
  item._fieldTs._deleted = Date.now();
  item._dirty = true; // guard the restore against a stale cloud merge
  markAsDirty(sid);
  scheduleDirtySync();
  showToast(`✓ Restored ${item.num || 'scope item'}`, 'green');
  _admRenderTrash();
}

// ── Tab: Sync health ────────────────────────────────────────────────
function _admRenderSync() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'What this device still owes the cloud';

  const dirty = [..._dirtyProjectIds].map(pid => getProject(pid)).filter(Boolean);
  const pending = [];
  let stubCount = 0;
  (store.projects || []).filter(p => !p._deleted).forEach(p => {
    let up = 0;
    (p.items || []).filter(i => !i._deleted).forEach(it => (it.photos || []).forEach(ph => {
      const hasData = (ph.data instanceof Blob) || (typeof ph.data === 'string' && ph.data.startsWith('data:'));
      if (hasData && (!ph.url || ph._needsUpload)) up++;
      if (!hasData && !ph.url) stubCount++;
    }));
    if (up) pending.push({ p, up });
  });

  if (body) body.innerHTML = `
    <div class="adm-stat-grid">
      <div class="adm-stat"><b style="color:${navigator.onLine ? 'var(--green,#16a34a)' : 'var(--red)'}">${navigator.onLine ? 'Online' : 'Offline'}</b><span>connection</span></div>
      <div class="adm-stat"><b>${dirty.length + (_dirtyIndex ? 1 : 0)}</b><span>unsynced change set${dirty.length !== 1 ? 's' : ''}${_dirtyIndex ? ' (incl. folders/settings)' : ''}</span></div>
      <div class="adm-stat"><b style="color:${pending.length ? 'var(--yellow,#ca8a04)' : 'inherit'}">${pending.reduce((s, x) => s + x.up, 0)}</b><span>photos waiting to upload</span></div>
      <div class="adm-stat"><b style="color:${stubCount ? 'var(--red)' : 'inherit'}">${stubCount}</b><span>dead photo entries (see 🧹)</span></div>
      <div class="adm-stat"><b style="font-size:13px">${store.lastUpdated ? _timeAgo(store.lastUpdated) : '—'}</b><span>last local change</span></div>
    </div>
    ${dirty.length ? `<div class="adm-section"><div class="adm-section-title">⇡ Projects with unpushed changes</div>
      ${dirty.map(p => `<div class="adm-row"><div class="adm-row-main">${_htmlEsc(p.name)}</div></div>`).join('')}</div>` : ''}
    ${pending.length ? `<div class="adm-section"><div class="adm-section-title">📤 Photo uploads pending</div>
      ${pending.map(x => `<div class="adm-row"><div class="adm-row-main">${_htmlEsc(x.p.name)}</div><span style="font-size:11px;font-weight:700;color:var(--yellow,#ca8a04)">${x.up} photo${x.up !== 1 ? 's' : ''}</span></div>`).join('')}
      <div style="font-size:11px;color:var(--text2);margin-top:6px">These upload automatically on the next sync — or push now below.</div></div>` : ''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="recovery-btn primary" onclick="showToast('Pushing…');syncChanges(false).then(()=>_admTab==='sync'&&_admRenderSync())">⇡ Push everything now</button>
      <button class="recovery-btn" onclick="showToast('Pulling…');_pullAll().then(()=>_admTab==='sync'&&_admRenderSync())">⇣ Pull all from cloud</button>
    </div>`;
}

// ── Tab: Activity log ───────────────────────────────────────────────
let _admActPid = 'all';
let _admActQuery = '';

function _admRenderActivity() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'Who did what, when';

  const live = (store.projects || []).filter(p => !p._deleted)
    .slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  let entries = [];
  live.forEach(p => {
    if (_admActPid !== 'all' && p.id !== _admActPid) return;
    (p.activityLog || []).forEach(e => entries.push({ ...e, _pname: p.name }));
  });
  entries.sort((a, b) => (b.at || 0) - (a.at || 0));
  const q = _admActQuery.toLowerCase();
  if (q) entries = entries.filter(e =>
    ((e.by || '') + ' ' + (e.detail || '') + ' ' + (e.type || '') + ' ' + (e.siNum || '') + ' ' + e._pname).toLowerCase().includes(q));
  const shown = entries.slice(0, 300);

  const icons = { photo: '📷', status: '🚦', note: '📝', si: '📋', delete: '🗑' };
  const rows = shown.map(e => `
    <div class="adm-row">
      <span style="font-size:15px">${icons[e.type] || '•'}</span>
      <div class="adm-row-main">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(e.detail || e.type || '')}${e.siNum ? ` <span style="color:var(--accent);font-family:var(--mono);font-size:11px">${_htmlEsc(String(e.siNum).replace(/^SI\s+/, 'SI# '))}</span>` : ''}</div>
        <div class="adm-row-sub">${_htmlEsc(e._pname)} · ${_htmlEsc(e.by || '?')} · ${e.at ? _timeAgo(e.at) : ''}</div>
      </div>
    </div>`).join('');

  if (body) body.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <select onchange="_admActPid=this.value;_admRenderActivity()" style="padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text1);font-size:12px;max-width:260px">
        <option value="all" ${_admActPid === 'all' ? 'selected' : ''}>All projects</option>
        ${live.map(p => `<option value="${_htmlEsc(p.id)}" ${_admActPid === p.id ? 'selected' : ''}>${_htmlEsc(p.name)}</option>`).join('')}
      </select>
      <input placeholder="Filter by person, SI, action…" value="${_htmlEsc(_admActQuery)}"
        oninput="_admActQuery=this.value;_admRenderActivity()"
        style="flex:1;min-width:160px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text1);font-size:12px;outline:none">
    </div>
    ${rows || `<div style="text-align:center;padding:30px;color:var(--text2)">No activity recorded${q ? ' matching the filter' : ' yet'}</div>`}
    ${entries.length > 300 ? `<div style="font-size:11px;color:var(--text2);padding:6px 0">Showing newest 300 of ${entries.length} — narrow with the filter.</div>` : ''}`;
}

// ── Tab: Backup ─────────────────────────────────────────────────────
function _admRenderBackup() {
  const body  = document.getElementById('rec-body');
  const crumb = document.getElementById('rec-crumb');
  if (crumb) crumb.textContent = 'Export or restore the entire dataset';

  const projCount = (store.projects || []).filter(p => !p._deleted).length;
  if (body) body.innerHTML = `
    <div class="adm-section">
      <div class="adm-section-title">💾 Export backup</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
        Downloads everything — folders, ${projCount} projects, scope items, notes, statuses, photo links, contacts and settings — as a JSON file you keep somewhere safe.
        Photos that are still device-only (not yet uploaded) can't be included; the cloud links of uploaded photos are.
      </div>
      <button class="recovery-btn primary" onclick="_admExportBackup()">⬇ Download backup file</button>
    </div>
    <div class="adm-section">
      <div class="adm-section-title">📥 Restore from backup</div>
      <div style="font-size:12px;color:var(--red);margin-bottom:10px">
        ⚠️ Replaces ALL data on this device with the backup, then syncs that state to the cloud. Only use this to recover from serious data loss.
      </div>
      <input type="file" id="adm-import-file" accept=".json,application/json" style="display:none" onchange="_admImportBackup(this)">
      <button class="recovery-btn danger" onclick="document.getElementById('adm-import-file').click()">⬆ Choose backup file…</button>
    </div>`;
}

function _admExportBackup() {
  try {
    const payload = {
      _adhBackup: 2,
      exportedAt: new Date().toISOString(),
      exportedBy: store.settings?.displayName || _currentUser?.userDetails || '',
      store,
    };
    const json = JSON.stringify(payload, (k, v) => (v instanceof Blob ? undefined : v));
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = `adh-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    showToast('✓ Backup downloaded — ' + (json.length / 1048576).toFixed(1) + ' MB', 'green');
  } catch (e) {
    showToast('Backup failed: ' + e.message, 'red');
  }
}

function _admImportBackup(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { showToast('Not a valid backup file', 'red'); return; }
    const incoming = data._adhBackup ? data.store : data; // accept raw store exports too
    if (!incoming || !Array.isArray(incoming.projects) || !Array.isArray(incoming.folders)) {
      showToast('Not a valid backup file', 'red'); return;
    }
    const pc = incoming.projects.filter(p => !p._deleted).length;
    makeModal('Restore Backup', `
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:32px;margin-bottom:10px">📥</div>
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">${_htmlEsc(file.name)}</div>
        <div style="font-size:12px;color:var(--text2)">${pc} projects${data.exportedAt ? ' · exported ' + _htmlEsc(String(data.exportedAt).slice(0, 10)) : ''}</div>
        <div style="font-size:12px;color:var(--red);margin-top:10px">This replaces everything on this device and pushes it to the cloud.</div>
      </div>`, () => {

    </div>`;

  fetch('/sw.js', { cache: 'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/CACHE_VERSION\s*=\s*'([^']+)'/);
    const el = document.getElementById('adm-sys-cache');
    if (el) el.textContent = m ? m[1].replace('adh-audit-', '') : '?';
  }).catch(() => {});

    navigator.storage.estimate().then(est => {
      const el = document.getElementById('adm-sys-storage');
      if (el) el.textContent = (est.usage / 1048576).toFixed(0) + ' MB of ' + (est.quota / 1073741824).toFixed(1) + ' GB';

async function _admSysHealth() {
  const el = document.getElementById('adm-sys-health');
  if (!el) return;
  el.textContent = 'Checking…';
  const checks = [
    ['Cloud database (Cosmos)', () => fetch('/api/getIndex?userId=' + encodeURIComponent(_currentUser?.userId || '')).then(r => r.ok || r.status === 404)],
    ['Photo storage (Blob)',    () => fetch('/api/getBlobSasUrl').then(r => r.ok)],
    ['Blob listing (Recovery)', () => fetch('/api/listBlobs').then(r => r.ok)],
    ['Innergy proxy',           () => fetch('/api/innergy/health').then(r => r.ok ? r.json().then(j => !!j.ok) : false)],
  ];
  const results = await Promise.all(checks.map(([label, fn]) =>
    fn().then(ok => ({ label, ok })).catch(() => ({ label, ok: false }))));
  el.innerHTML = results.map(r =>
    `<div style="padding:3px 0">${r.ok ? '✅' : '❌'} ${r.label}</div>`).join('');
}

async function _admForceRefresh() {
  showToast('Clearing cache…');
  try {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    const regs = await (navigator.serviceWorker?.getRegistrations?.() || Promise.resolve([]));
    await Promise.all(regs.map(r => r.update().catch(() => {})));
  } catch (e) {}
  location.reload();
}

async function _admSetCredentials() {
  const id  = document.getElementById('adm-cred-id')?.value.trim();
  const pw  = document.getElementById('adm-cred-pw')?.value;
  const pw2 = document.getElementById('adm-cred-pw2')?.value;
  if (!id || !pw) { showToast('Enter both an ID and a password', 'red'); return; }
  if (pw.length < 6) { showToast('Password must be at least 6 characters', 'red'); return; }
  if (pw !== pw2) { showToast('Passwords do not match', 'red'); return; }
  const enc = new TextEncoder();
  const hashHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const [idHash, pwHash] = await Promise.all([
    crypto.subtle.digest('SHA-256', enc.encode(id)).then(hashHex),
    crypto.subtle.digest('SHA-256', enc.encode(pw)).then(hashHex),
  ]);
  store.settings.adminIdHash = idHash;
  store.settings.adminPwHash = pwHash;
  markStoreDirty(); save(); scheduleDirtySync();
  showToast('✓ Admin credentials updated', 'green');
  ['adm-cred-id', 'adm-cred-pw', 'adm-cred-pw2'].forEach(i => { const e = document.getElementById(i); if (e) e.value = ''; });
}

    }

    _rebuildSidebar(); _rebuildPreview();
  };

  window._rgSelectLogo = async function(path) {
    if (!path) return;
    try {
      const resp = await fetch(path);
      const blob = await resp.blob();
      const reader = new FileReader();
      reader.onload = ev => {
        const data = ev.target.result;
        const cid = window._pdfBranding.companyId || 'ami';
        if (!window._pdfBranding.logos) window._pdfBranding.logos = {};
        window._pdfBranding.logos[cid] = data;

        _rebuildSidebar(); _rebuildPreview();
      };
      reader.readAsDataURL(blob);
    } catch(e) { showToast('Failed to load logo', 'red'); }
  };

  window._rgToggleSigPad = function() {
    const wrap = document.getElementById('rg-sigpad-wrap');
    if (!wrap) return;
    const isOpen = wrap.style.display !== 'none';
    wrap.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) _rgInitSigPadCanvas();
  };

  function _rgInitSigPadCanvas() {
    const canvas = document.getElementById('rg-sigpad');
    if (!canvas || canvas._sigInit) return;
    canvas._sigInit = true;
    const ctx = canvas.getContext('2d');
    let drawing = false, lastX = 0, lastY = 0;
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const src = e.touches ? e.touches[0] : e;
      return [(src.clientX - rect.left) * scaleX, (src.clientY - rect.top) * scaleY];
    }
    function start(e) { e.preventDefault(); drawing = true; [lastX, lastY] = getPos(e); }
    function move(e) {
      e.preventDefault();
      if (!drawing) return;
      const [x, y] = getPos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
      ctx.strokeStyle = '#111827'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.stroke();
      [lastX, lastY] = [x, y];
    }
    function end() { drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  window._rgSigPadClear = function() {
    const canvas = document.getElementById('rg-sigpad');
    if (!canvas) return;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  };

  window._rgSigPadSave = function() {
    const canvas = document.getElementById('rg-sigpad');
    if (!canvas) return;
    const dataURL = canvas.toDataURL('image/png');
    const cid = window._pdfBranding.companyId || 'ami';
    if (!window._pdfBranding.auditorSigs) window._pdfBranding.auditorSigs = {};
    window._pdfBranding.auditorSigs[cid] = dataURL;
    window._pdfBranding.auditorSig = dataURL;
    _saveBranding();
    showToast('✓ Signature saved', 'green');
    const wrap = document.getElementById('rg-sigpad-wrap');
    if (wrap) wrap.style.display = 'none';
    _rebuildSidebar(); _rebuildPreview();
  };
  window._rgToggle = key => {
    const acts = {
      photos:      () => _rgInclPhotos = !_rgInclPhotos,
      ts:          () => _rgInclTS     = !_rgInclTS,
      notes:       () => _rgInclNotes  = !_rgInclNotes,
      tags:        () => _rgInclTags   = !_rgInclTags,
      cover:       () => _rgInclCover  = !_rgInclCover,
      env:         () => _rgInclEnv    = !_rgInclEnv,
      square:      () => _rgSquare     = !_rgSquare,
      pagenums:    () => _rgPageNums   = !_rgPageNums,
      whitelabel:  () => _rgWhiteLabel = !_rgWhiteLabel,
    };
    if (acts[key]) { acts[key](); _rebuildSidebar(); _rebuildPreview(); }
  };

  // ── Mount the overlay ──────────────────────────────────────────────────────
  closeModal();
  // A previous generator instance must be removed first — duplicate IDs make
  // the rebuild helpers target the OLD instance, leaving the new one blank.
  document.getElementById('rg-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'rg-overlay';
  ov.id = 'rg-overlay';
  ov.innerHTML = `
    <div class="rg-shell">
      <div class="rg-sidebar" id="rg-sidebar-inner"></div>
      <div class="rg-main">
        <div class="rg-topbar">
          <div class="rg-topbar-title">Report Generator</div>

          </div>
        </div>
        <div class="rg-preview-wrap" id="rg-preview-inner"></div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  _rebuildSidebar();
  _rebuildPreview();
  // Open branding section by default if no logo set yet
  if (!window._pdfBranding?.logo) {
    _sec.branding = true;
    _rebuildSidebar();
  }
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}

// ── EXPORT CSV ────────────────────────
function exportCSV(pid) {
  const proj=getProject(pid); if(!proj) return;
  const rows = [];
  // Header
  rows.push(['item_id','si_number','title','status','assigned_to','due_date','tags','notes'].join(','));
  activeItems(proj).forEach(it => {
    const safe = v => '"' + String((v===undefined||v===null)?'':v).replace(/"/g,'""') + '"';
    const tags = (it.tags||[]).join(';');
    rows.push([
      safe(it.id), safe(it.num), safe(it.title), safe(it.status), safe(it.assignedTo), safe(it.dueDate), safe(tags), safe(it.notes)
    ].join(','));
  });
  const csv = rows.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = proj.name.replace(/[^a-z0-9]/gi,'_') + '_audit.csv';
  a.click(); closeModal(); showToast('✓ CSV Downloaded','green');
}

function makeModal(title,bodyHTML,onConfirm,noFooter=false) {
  closeModal();
  const ov=document.createElement('div');
  ov.className='modal-overlay'; ov.id='modal-overlay';
  ov.onclick=e=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML=`
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">${title}</span>
        <div class="btn-icon" onclick="closeModal()">✕</div>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${!noFooter?`<div class="modal-footer">
        <button class="btn-nav" style="flex:1;text-align:center" onclick="closeModal()">Cancel</button>
        <button class="btn-save" style="flex:1" onclick="window._modalConfirm&&window._modalConfirm()">Confirm</button>
      </div>`:''}
    </div>`;
  document.body.appendChild(ov);
  window._modalConfirm = onConfirm;
  const escHandler = e => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  ov._escHandler = escHandler;
  // iOS: delay focus to avoid keyboard interfering with layout
  setTimeout(()=>{
    const inp=ov.querySelector('input[type="text"]');
    if(inp && !('ontouchstart' in window)) inp.focus();
  }, 150);
}

// ── DUPLICATE PROJECT ─────────────────────
function duplicateProject(pid,fid,opts) {
  const src=getProject(pid); if(!src) return;
  const ts=Date.now();
  const newProj=JSON.parse(JSON.stringify(src));
  newProj.id='proj_'+ts;
  newProj.name=src.name+' (Copy)';
  // Remap section IDs
  const secMap={};
  newProj.sections=newProj.sections.map(s=>{
    const nid='sec_'+Math.random().toString(36).slice(2);
    secMap[s.id]=nid;
    return {...s,id:nid};
  });
  // Remap items — keep status as requested
  newProj.items=newProj.items.map((item,i)=>{
    const nitem={
      ...item,
      id:'si_'+(ts+i),
      sectionId:secMap[item.sectionId]||item.sectionId,
      // Status preserved from original
    };
    if(!opts.keepPhotos) nitem.photos=[];
    if(!opts.keepNotes){ nitem.notes=''; nitem.tags=[]; nitem.assignedTo=''; nitem.dueDate=''; }
    return nitem;
  });
  // A duplicate belongs to whoever made it (the source may be foreign-owned,
  // and foreign-owned projects are never pushed or indexed for this user).
  newProj.ownedBy = _currentUser?.userId || '';
  // Don't copy tombstoned (deleted) scope items into the fresh copy
  newProj.items = newProj.items.filter(i => !i._deleted);
  store.projects.push(newProj);
  // Add to same folder
  if(fid){ const f=getFolder(fid); if(f) f.projects.push(newProj.id); }
  markProjectDirty(newProj.id);  // push the doc, not just the index entry
  markStoreDirty(); save(); closeModal();
  scheduleDirtySync();
  // Rebuild current view
  const r=route();
  if(r.view==='folder') buildFolderView(fid);
  else buildRootView();
  showToast('✓ Project duplicated','green');
}

// ── DELETE SCOPE ITEM ─────────────────────
// Tombstone a single scope item (mirrors project/contact deletion). The item
// stays in proj.items with _deleted=true so the removal propagates to other
// devices even if they were offline; every render path filters it out via
// activeItems(). Kept intentionally off the happy path in the SI editor.
window.confirmDeleteSI = function(pid, sid) {
  const proj = getProject(pid); if(!proj) return;
  const item = getSI(pid, sid); if(!item) return;
  const label = `${item.num}${item.title ? ' — ' + item.title : ''}`;
  makeModal('Delete Scope Item', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${_htmlEsc(label)}</div>
      <div style="font-size:12px;color:var(--text2)">Photos go with it. This cannot be undone.</div>
    </div>`, () => {
    item._deleted   = true;
    item._deletedAt = Date.now();
    item._fieldTs   = item._fieldTs || {};
    item._fieldTs._deleted = item._deletedAt;
    item._dirty     = true;             // guard our tombstone against a stale cloud merge
    // Best-effort: the modal says "Photos go with it" — delete its Azure blobs
    _deleteBlobUrls((item.photos || []).map(p => p.url));
    markProjectDirty(pid);
    closeModal();
    // We were inside this SI's editor — drop back to the project view.
    navToProject(pid, route().folderId || '');
    showToast('Scope item deleted');
  });
};

// ── DELETE PROJECT ────────────────────────
function confirmDeleteProject(pid,fid) {
  const proj=getProject(pid); if(!proj) return;
  makeModal('Delete Project',`
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:32px;margin-bottom:10px">🗑</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${proj.name}</div>
      <div style="font-size:12px;color:var(--text2)">This will permanently delete the project and all its items and photos. This cannot be undone.</div>
    </div>`,()=>{
    // Remove from all folders
    store.folders.forEach(f=>{ f.projects=f.projects.filter(id=>id!==pid); });
    // Tombstone the project — kept in the array with _deleted flag so the
    // deletion propagates to other devices even if they were offline.
    // Render paths filter out _deleted projects. Garbage-collected later.
    const _delProj = store.projects.find(p=>p.id===pid);
    const _delTs   = Date.now();
    if (_delProj) {
      _delProj._deleted   = true;
      _delProj._deletedAt = _delTs;
      _delProj._fieldTs   = _delProj._fieldTs || {};
      _delProj._fieldTs._deleted = _delTs;
      // Best-effort: remove this project's photo blobs from Azure Storage
      // so deleted projects don't leave orphaned blobs behind.
      _deleteBlobUrls((_delProj.items || []).flatMap(i => (i.photos || []).map(p => p.url)));
    }
    // Register the tombstone so saveIndex removes the ID from the cloud
    // index (projectIds is merged as a union — this is the only way out).
    store.projectTombstones = store.projectTombstones || {};
    store.projectTombstones[pid] = _delTs;
    delete _cloudTs.projects[pid];
    // Push both the doc tombstone and the index promptly.
    markProjectDirty(pid);
    markStoreDirty(); save(); closeModal();
    scheduleDirtySync();
    _patchFolderCardCounts();
    // If we were inside this project, go back
    if(route().projectId===pid) fid?navToFolder(fid):navToRoot();
    else {
      const r=route();
      if(r.view==='folder') buildFolderView(r.folderId);
      else buildRootView();
      renderLeft(r);
    }
    showToast('Project deleted');
  });
}

let _xlsTargetFid = null;

  inp.value = '';

/* =========================================
   XLS IMPORT — NORMALIZATION & FILTERING
   ========================================= */

function normalizeSI(raw) {
  if (!raw) return null;
  const m = String(raw).match(/\d{2,4}/);
  if (!m) return null;
  return m[0].padStart(4, '0');
}

function isJunkRow(values) {
  const blacklist = [
    'job name','truck','delivery','arrival','notes',
    'address','vendor','mail out','gc info','installer',
    'scope','logo','load date','delivery date'
  ];
  const text = values.join(' ').toLowerCase();
  return blacklist.some(k => text.includes(k));
}

/* =========================================
   V1.5-B — SECTION MAPPING RULES
   ========================================= */
// Default SECTION_RULES — overwritten by _initStore() once IndexedDB loads
let SECTION_RULES = {
  'center bar': 'Center Bar',
  'casino bar': 'Casino Bar',
  'steak': 'Steakhouse Restaurant'
};

function mapSection(desc) {
  const d = desc.toLowerCase();
  for (const k in SECTION_RULES) {
    if (d.includes(k)) return SECTION_RULES[k];
  }
  return 'General';
}

/* =========================================
   V2-A — DELIVERY METADATA EXTRACTION
   ========================================= */
function extractDelivery(row) {
  const date = row.find(c => typeof c === 'string' && /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(c));
  const truck = row.find(c => typeof c === 'string' && /truck/i.test(c));
  return { deliveryDate: date || '', truck: truck || '' };
}

function flagImportDuplicates(items) {
  const seen = new Set();
  items.forEach(i => {
    if (seen.has(i.si)) i._duplicate = true;
    seen.add(i.si);
  });
}

/* =========================================
   V2-B — AUTO STATUS RULES
   ========================================= */
function applyDeliveryRules(si) {
  if (!si.delivery?.deliveryDate) return;
  const dDate = new Date(si.delivery.deliveryDate);
  const iDate = si.dueDate ? new Date(si.dueDate) : null; // Mapping installDate to existing dueDate

  if (iDate && !isNaN(dDate) && !isNaN(iDate) && dDate > iDate) {
    si.status = 'not-ready';
    if (!si.notes.includes('Delivery scheduled after install window')) {
      si.notes = (si.notes ? si.notes + '\n' : '') + '⚠️ Delivery scheduled after install window.';
    }
  }
}

/* =========================================
   XLS IMPORT — SHEET PARSING
   ========================================= */
function extractSIFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, {
    header: 1,
    raw: false,
    defval: ''
  });

  const items = [];
  const skipped = [];

  rows.forEach((row, idx) => {
    if (!row || row.length < 2) return;
    if (isJunkRow(row)) return;

    let si = null;
    row.forEach(c => { if (!si) si = normalizeSI(c); });

    if (!si) return;

    const desc = row.find(c =>
      typeof c === 'string' &&
      c.length > 6 &&
      !normalizeSI(c) &&
      !/tbd|xxxx|vendor/i.test(c)
    );

    if (!desc) {
      skipped.push({ row: idx + 1, reason: 'Missing description' });
      return;
    }

    const section = mapSection(desc);
    const delivery = extractDelivery(row);
    
    items.push({
      si,
      title: desc.trim(),
      section,
      delivery,
      _checked: true
    });
  });

  return { items, skipped };
}

function buildImportWarnings(parsed) {
  const warnings = [];
  if (parsed.skipped?.length) {
    warnings.push(`⚠ ${parsed.skipped.length} rows skipped (no description)`);
  }
  const general = parsed.items.filter(i => i.section === 'General');
  if (general.length) {
    warnings.push(`⚠ ${general.length} items defaulted to General section`);
  }
  return warnings;
}

function showXLSPreviewModal(fileName, data, onConfirm) {
  let html = `
    <div class="xls-preview-wrap">
      <div class="xls-preview-meta">
        <div><strong>File:</strong> ${fileName}</div>
        <div style="color:var(--text3);font-size:11px;margin-top:4px">
          ${data.items.length} SI detected
        </div>
      </div>
  `;

  const warnings = buildImportWarnings(data);
  if (warnings.length) {
    html += `
      <div style="background:var(--yellow-dim);
                  border:1px solid rgba(217,119,6,0.4);
                  border-radius:8px;
                  padding:10px;
                  margin-bottom:12px;
                  font-size:11px">
        ${warnings.map(w => `<div>${w}</div>`).join('')}
      </div>
    `;
  }

  const groups = {};
  data.items.forEach(i => {
    if (!groups[i.section]) groups[i.section] = [];
    groups[i.section].push(i);
  });

  Object.keys(groups).forEach(sec => {
    html += `
      <div class="xls-section-group">
        <div class="xls-section-hdr" onclick="toggleXLSSection('${sec}')">
          <div class="xls-section-check on" data-sec="${sec}">✓</div>
          ${sec}
          <span class="xls-section-count">${groups[sec].length}</span>
        </div>
        <div class="xls-si-list">
    `;

    groups[sec].forEach((i, idx) => {
      html += `
        <div class="xls-si-row">
          <div class="xls-row-check on" 
               data-index="${data.items.indexOf(i)}">✓</div>
          <div class="xls-si-num">SI ${i.si}</div>
          <div class="xls-si-desc">
            ${i.title} 
            ${i._duplicate ? `<span style="color:#f97316;font-size:10px;margin-left:8px">⚠️ Duplicate SI</span>` : ''}
            ${i.delivery?.truck ? `<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">📦 ${i.delivery.truck} — ${i.delivery.deliveryDate}</div>` : ''}
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  html += `
    <div class="xls-footer">
      <span class="xls-count-badge">
        Importing <span id="xls-import-count">${data.items.length}</span> SI
      </span>
    </div>
  </div>`;

  makeModal(
    'Preview Excel Import',
    html,
    () => {
      const selected = data.items.filter(i => i._checked);
      if (!selected.length) {
        showToast('No SI selected', 'red');
        return;
      }
      onConfirm(selected);
    }
  );

  // Toggle hooks
  document.querySelectorAll('.xls-row-check').forEach(el => {
    el.onclick = () => {
      const idx = +el.dataset.index;
      data.items[idx]._checked = !data.items[idx]._checked;
      el.classList.toggle('on');
      el.textContent = data.items[idx]._checked ? '✓' : '';
      document.getElementById('xls-import-count').textContent =
        data.items.filter(i => i._checked).length;
    };
  });

  window.toggleXLSSection = function(sec) {
    const hdrCheck = document.querySelector(`.xls-section-check[data-sec="${sec}"]`);
    if (!hdrCheck) return;
    const newState = !hdrCheck.classList.contains('on');
    hdrCheck.classList.toggle('on', newState);
    hdrCheck.textContent = newState ? '✓' : '';
    const group = hdrCheck.closest('.xls-section-group');
    if (!group) return;
    group.querySelectorAll('.xls-row-check').forEach(rowCheck => {
      const idx = +rowCheck.dataset.index;
      if (!isNaN(idx) && idx < data.items.length) {
        data.items[idx]._checked = newState;
        rowCheck.classList.toggle('on', newState);
        rowCheck.textContent = newState ? '✓' : '';
      }
    });
    const countEl = document.getElementById('xls-import-count');
    if (countEl) countEl.textContent = data.items.filter(i => i._checked).length;
  };
}

function handleXLSImport(e) {
  const folderId = _xlsTargetFid;
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(ev.target.result, { type: 'binary' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const parsed = extractSIFromSheet(sheet);
    flagImportDuplicates(parsed.items);

    if (!parsed.items.length) {
      showToast('No SI found in file', 'red');
      return;
    }

    showXLSPreviewModal(file.name, parsed, selectedSI => {
      createProjectFromImport(selectedSI, folderId);
      closeModal();
      showToast(`Imported ${selectedSI.length} SI`, 'green');
    });
  };

  reader.readAsBinaryString(file);
  e.target.value = '';
}

function createProjectFromImport(items, folderId) {
  const pid = 'proj_' + Date.now();
  const sections = {};
  const siItems = [];

  items.forEach(i => {
    if (!sections[i.section]) {
      sections[i.section] = { id: 'sec_' + i.section.replace(/\s+/g, '_') };
    }

    siItems.push({
      id: 'si_' + i.si,
      sectionId: sections[i.section].id,
      num: 'SI ' + i.si,
      title: i.title,
      status: 'pending',
      delivery: i.delivery || { deliveryDate: '', truck: '' },
      notes: '',
      tags: [],
      photos: []
    });
    applyDeliveryRules(siItems[siItems.length - 1]);
  });

  const project = {
    id: pid,
    name: 'Imported Project ' + new Date().toLocaleDateString(),
    ownedBy: _currentUser?.userId || '',
    client: '',
    company: '',
    auditor: '',
    date: new Date().toLocaleDateString(),
    sections: Object.entries(sections).map(([name, s]) => ({
      id: s.id,
      name
    })),
    items: siItems
  };

  store.projects.push(project);
  if (folderId) {
    const f = getFolder(folderId);
    if (f && !f.projects.includes(pid)) f.projects.push(pid);
  }

  // Both the doc and the index entry must sync (doc first — see syncChanges)
  markProjectDirty(pid);
  markStoreDirty();
  save();
  scheduleDirtySync();
  navToProject(pid, folderId);
}

// GLOBAL SEARCH OVERLAY (⌘K / nav-bar button)
// ══════════════════════════════════════════
function openGlobalSearch() {
  if (document.getElementById('gs-overlay')) return;

  const overlay = document.createElement('div');
  overlay.className = 'global-search-overlay';
  overlay.id = 'gs-overlay';

  const box = document.createElement('div');
  box.className = 'global-search-box';

  const inputWrap = document.createElement('div');
  inputWrap.className = 'global-search-input-wrap';
  inputWrap.innerHTML = '<span style="font-size:16px;opacity:0.5;flex-shrink:0">⌕</span>';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search folders, projects, scope items…';
  input.autocomplete = 'off';
  inputWrap.appendChild(input);

  const esc = document.createElement('span');
  esc.className = 'gs-shortcut';
  esc.textContent = 'ESC';
  inputWrap.appendChild(esc);

  const results = document.createElement('div');
  results.className = 'global-search-results';

  box.appendChild(inputWrap);
  box.appendChild(results);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }

  function buildResults(q) {
    q = (q || '').toLowerCase().trim();
    if (!q) {
      results.innerHTML = '<div class="gs-empty">Start typing to search everything…</div>';
      return;
    }

    const rows = []; // { type, icon, title, sub, badge, action }

    // 1. Matching folders
    const matchFolders = store.folders.filter(f => f.name.toLowerCase().includes(q));
    if (matchFolders.length) {
      rows.push({ type: 'label', text: 'Folders' });
      matchFolders.forEach(f => {
        const parent = f.parentId ? getFolder(f.parentId) : null;
        const sub = parent ? parent.name : ((f.projects||[]).length + ' project' + ((f.projects||[]).length !== 1 ? 's' : ''));
        rows.push({ icon: f.icon || '📁', title: f.name, sub, badge: 'Folder',
          action: () => navToFolder(f.id) });
      });
    }

    // 2. Matching projects
    const matchProjects = store.projects.filter(p => !p._deleted && (
      p.name.toLowerCase().includes(q) ||
      (p.client||'').toLowerCase().includes(q) ||
      (p.date||'').toLowerCase().includes(q)
    ));
    if (matchProjects.length) {
      rows.push({ type: 'label', text: 'Projects' });
      matchProjects.forEach(p => {
        const folder = store.folders.find(f => (f.projects||[]).includes(p.id));
        const fid = folder ? folder.id : '';
        const sub = [p.date, p.client, folder ? folder.name : ''].filter(Boolean).join(' · ');
        rows.push({ icon: '🏗', title: p.name, sub, badge: 'Project',
          action: () => navToProject(p.id, fid) });
      });
    }

    // 3. Matching SIs
    const matchSIs = [];
    store.projects.filter(p => !p._deleted).forEach(p => {
      const folder = store.folders.find(f => (f.projects||[]).includes(p.id));
      const fid = folder ? folder.id : '';
      p.items.forEach(i => {
        if (i._deleted) return;
        if (
          i.title.toLowerCase().includes(q) ||
          i.num.toLowerCase().includes(q) ||
          (i.notes||'').toLowerCase().includes(q) ||
          (i.fieldCheck||'').toLowerCase().includes(q) ||
          (i._updatedBy||'').toLowerCase().includes(q) ||
          (Array.isArray(i.conditions) ? i.conditions.join(' ').toLowerCase().includes(q) : false)
        ) {
          matchSIs.push({ item: i, proj: p, fid });
        }
      });
    });
    if (matchSIs.length) {
      rows.push({ type: 'label', text: 'Scope Items' });
      matchSIs.slice(0, 40).forEach(({ item, proj }) => {
        const sub = 'SI# ' + item.num.replace(/^SI\s+/, '') + ' · ' + proj.name;
        rows.push({ icon: '📋', title: item.title, sub, badge: item.status || '—',
          action: () => navToSI(proj.id, item.id) });
      });
      if (matchSIs.length > 40) {
        rows.push({ type: 'more', text: '…and ' + (matchSIs.length - 40) + ' more — refine your search' });
      }
    }

    results.innerHTML = '';

    if (!rows.length) {
      results.innerHTML = '<div class="gs-empty">No results for "<strong>' + _htmlEsc(q) + '</strong>"</div>';
      return;
    }

    rows.forEach(row => {
      if (row.type === 'label') {
        const el = document.createElement('div');
        el.className = 'gs-section-label';
        el.textContent = row.text;
        results.appendChild(el);
        return;
      }
      if (row.type === 'more') {
        const el = document.createElement('div');
        el.className = 'gs-empty';
        el.style.cssText = 'padding:8px 16px;font-size:11px';
        el.textContent = row.text;
        results.appendChild(el);
        return;
      }
      const el = document.createElement('div');
      el.className = 'gs-result-row';
      el.innerHTML =
        '<div class="gs-result-icon">' + row.icon + '</div>' +
        '<div class="gs-result-main">' +
          '<div class="gs-result-title">' + _htmlEsc(row.title) + '</div>' +
          (row.sub ? '<div class="gs-result-sub">' + _htmlEsc(row.sub) + '</div>' : '') +
        '</div>' +
        '<div class="gs-result-badge">' + _htmlEsc(row.badge) + '</div>';
      el.addEventListener('click', () => { close(); row.action(); });
      results.appendChild(el);
    });
  }

  input.addEventListener('input', () => buildResults(input.value));

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  }
  document.addEventListener('keydown', onKey);

  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });

  buildResults('');
  setTimeout(() => input.focus(), 30);
}

// ── MOBILE QoL ENHANCEMENTS ───────────────
function _initMobileQoL() {
  // ── Swipe-left-from-edge = goBack() on mobile ──
  let _touchStartX = 0;
  let _touchStartY = 0;
  const EDGE_THRESHOLD = 30;  // px from left edge to begin swipe
  const SWIPE_MIN = 80;       // px minimum horizontal swipe distance

  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    _touchStartX = t.clientX;
    _touchStartY = t.clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - _touchStartX;
    const dy = Math.abs(t.clientY - _touchStartY);
    // Swipe right (from left edge) = back; only on mobile width
    if (_touchStartX < EDGE_THRESHOLD && dx > SWIPE_MIN && dy < 60 && window.innerWidth <= 640) {
      if (stack.length > 0) {
        if (navigator.vibrate) navigator.vibrate(12);
        goBack();
      }
    }
  }, { passive: true });

  // ── Prevent pull-to-refresh rubber-banding on iOS in PWA mode ──
  let _lastY = 0;
  document.addEventListener('touchmove', e => {
    const el = e.target.closest('[data-scroll]') || e.target.closest('.list-scroll') ||
                e.target.closest('.edit-scroll') || e.target.closest('.grid-wrap') ||
                e.target.closest('.env-wrap') || e.target.closest('[style*="overflow"]');
    if (!el) {
      e.preventDefault();
    }
  }, { passive: false });
}

// Inject manifest dynamically — works at any URL depth (Azure, GitHub Pages, etc.)
(function injectManifest() {
  // Compute base path so start_url/scope work regardless of subdirectory deployment
  const pathParts = window.location.pathname.split('/');
  pathParts.pop(); // remove filename (or empty string for trailing slash)
  const basePath = pathParts.join('/') || '/';
  const startUrl = window.location.origin + basePath + '/';
  const iconBase = window.location.origin + basePath;

  const manifest = {
    name: 'ADH Field Audit Tool',
    short_name: 'ADH Audit',
    description: 'Field conditions audit for construction and installation teams',
    start_url: startUrl,
    scope: startUrl,
    display: 'standalone',
    orientation: 'any',
    background_color: '#16181d',
    theme_color: '#16181d',
    // iOS Safari requires PNG icons — SVG icons are silently ignored on phones
    icons: [
      { src: iconBase + '/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: iconBase + '/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
      { src: iconBase + '/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },

    ],
    categories: ['business', 'productivity', 'utilities'],
    lang: 'en-US'
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel   = 'manifest';
  link.href  = url;
  document.head.appendChild(link);
})();

// ── SERVICE WORKER ────────────────────────
(function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;

  let _reg = null;

  function showUpdateBanner() {
    const el = document.getElementById('update-banner');
    if (el) el.classList.add('visible');
  }

  window.applyAppUpdate = function() {
    if (_reg && _reg.waiting) {
      // Tell waiting SW to skip waiting and take over immediately
      _reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    } else {
      window.location.reload();
    }
  };

  // When the SW takes control (after SKIP_WAITING), reload once
  let _reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_reloading) return;
    _reloading = true;
    window.location.reload();
  });

  // Ask the browser to protect our storage from eviction. Without this,
  // iOS Safari can silently wipe IndexedDB (photos, unsynced edits) after
  // ~7 days of non-use for non-installed web apps. Installed PWAs and
  // persisted origins are exempt. Fire-and-forget — denial is harmless.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(already => {
      if (!already) navigator.storage.persist().then(granted =>
        console.log('[ADH Audit] storage.persist:', granted ? 'granted' : 'denied'));
    }).catch(() => {});
  }

  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(reg => {
      _reg = reg;
      console.log('[ADH Audit] SW registered');

      // Detect new SW installing
      function trackInstall(worker) {
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      }
      if (reg.installing) trackInstall(reg.installing);
      reg.addEventListener('updatefound', () => trackInstall(reg.installing));

      // Periodically poll for new SW (every 30 min)
      setInterval(() => reg.update(), 30 * 60 * 1000);

      // Also check when user returns to the tab
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    })
    .catch(err => {
      console.log('[ADH Audit] SW not available:', err.message);
    });
})();

// ── SAVE-ON-EXIT HANDLERS ─────────────────
// Flush any pending editor state before the page/app is closed or backgrounded.
(function() {
  function flushAndSave() {
    clearTimeout(_autoSaveTimer);
    clearTimeout(_saveTimer);   // cancel debounce
    const r = route();
    if (r.view === 'si') {
      syncEditorToStore(r.projectId, r.siId);
    }
    // Synchronous fallback: write to localStorage as a safety net
    // (IDB writes are async and may not complete before the page is killed)
    // Blobs don't survive JSON (they serialize to {}) and giant base64 strings
    // blow the ~5MB localStorage quota, so strip binary payloads: photos keep
    // their cloud url/caption/timestamp, and oversized inline data is dropped.
    try {
      const snapshot = JSON.stringify(store, (key, value) => {
        if (value instanceof Blob) return undefined;
        if (typeof value === 'string' && value.length > 100000 && value.startsWith('data:')) return undefined;
        return value;
      });
      if (snapshot.length < 4000000) localStorage.setItem('fap_v3_exit', snapshot);
    } catch(e) {}
    // Also kick off the async IDB write — may or may not finish in time
    _idbSet('fap_v3', store).catch(() => {});
  }
  window.addEventListener('beforeunload', flushAndSave);
  window.addEventListener('pagehide', flushAndSave);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flushAndSave();
  });

  // On next startup, recover from the exit snapshot if IDB was empty
  (async () => {
    try {
      const snap = localStorage.getItem('fap_v3_exit');
      if (!snap) return;
      const idbData = await _idbGet('fap_v3');
      if (!idbData) {
        await _idbSet('fap_v3', JSON.parse(snap));
        console.log('[ADH] Recovered exit snapshot → IndexedDB');
      }
      localStorage.removeItem('fap_v3_exit');
    } catch(e) {}
  })();
})();

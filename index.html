// TOWER WORK / MULTIPLE ROOMS
// ═══════════════════════════════════════════════════════════════════════════
const TW_STATUS_CYCLE = ['pending', 'in-progress', 'completed'];
const TW_STATUS_COLOR = { pending:'#64748b', 'in-progress':'#fbbf24', completed:'#22c55e' };
const TW_STATUS_LABEL = { pending:'Pending', 'in-progress':'In Progress', completed:'Done' };

function _twEnsure(item) {
  if (!item.towerWork) item.towerWork = { enabled: false, rooms: [] };
  if (!item.towerWork.rooms) item.towerWork.rooms = [];
}

function _buildTowerPanelHTML(pid, sid) {
  const item = getSI(pid, sid); if (!item) return '';
  _twEnsure(item);
  const tw = item.towerWork;
  const enabled = tw.enabled;

  if (!enabled) {
    return `<button class="tower-toggle-btn" onclick="toggleTowerWork('${pid}','${sid}')">
      🏢 Tower Work / Multiple Rooms
      <span style="margin-left:auto;font-size:10px;color:var(--text3);font-weight:400">Tap to enable</span>
      <span class="tw-chevron">▼</span>
    </button>`;
  }

  const rooms = [...tw.rooms].sort((a,b) => {
    const na = parseInt(a.number) || 0, nb = parseInt(b.number) || 0;
    return na !== nb ? na - nb : a.number.localeCompare(b.number);
  });
  const total = rooms.length;
  const done = rooms.filter(r => r.status === 'completed').length;
  const inProg = rooms.filter(r => r.status === 'in-progress').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const barColor = pct === 100 ? '#22c55e' : pct >= 50 ? '#60a5fa' : '#fbbf24';

  const roomsHTML = rooms.length ? rooms.map(rm => `
    <div class="tw-room-row" onclick="cycleTowerRoomStatus('${pid}','${sid}','${rm.id}')">
      <div class="tw-room-dot" style="background:${TW_STATUS_COLOR[rm.status]||TW_STATUS_COLOR.pending}"></div>
      <span class="tw-room-num">${rm.number}</span>
      <span class="tw-room-type">${rm.type || '—'}</span>
      <span class="tw-room-status-lbl" style="color:${TW_STATUS_COLOR[rm.status]||TW_STATUS_COLOR.pending}">${TW_STATUS_LABEL[rm.status]||'Pending'}</span>
      <button class="tw-room-del" onclick="event.stopPropagation();deleteTowerRoom('${pid}','${sid}','${rm.id}')">✕</button>
    </div>`).join('')
    : `<div style="text-align:center;padding:14px;font-size:11px;color:var(--text3)">No rooms added yet</div>`;

  return `
    <button class="tower-toggle-btn active" onclick="toggleTowerWork('${pid}','${sid}')">
      🏢 Tower Work / Multiple Rooms
      <span class="tw-chevron">▲</span>
    </button>
    <div class="tower-body">
      <div class="tw-stats-row">
        <div class="tw-stat"><span class="tw-stat-num" style="color:#22c55e">${done}</span><span class="tw-stat-label">Done</span></div>
        <div class="tw-stat"><span class="tw-stat-num" style="color:#fbbf24">${inProg}</span><span class="tw-stat-label">In Progress</span></div>
        <div class="tw-stat"><span class="tw-stat-num" style="color:var(--text3)">${total - done - inProg}</span><span class="tw-stat-label">Pending</span></div>
        <div class="tw-stat" style="margin-left:auto"><span class="tw-stat-num">${total}</span><span class="tw-stat-label">Total Rooms</span></div>
      </div>
      <div class="tw-progress-bar">
        <div class="tw-progress-fill" style="width:${pct}%;background:${barColor}"></div>
      </div>
      <div class="tw-room-list">${roomsHTML}</div>
      <div class="tw-add-section">
        <div style="font-size:10px;font-family:var(--mono);color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Add Rooms</div>
        <div class="tw-input-row">
          <input class="tw-input narrow" id="tw-room-num-${sid}" placeholder="Room #" maxlength="10"
            onkeydown="if(event.key==='Enter')addTowerRoom('${pid}','${sid}')" />
          <input class="tw-input" id="tw-room-type-${sid}" placeholder="Type (e.g. King, Suite…)"
            list="tw-type-list-${sid}"
            onkeydown="if(event.key==='Enter')addTowerRoom('${pid}','${sid}')" />
          <datalist id="tw-type-list-${sid}">
            <option value="King"><option value="Queen"><option value="Double Queen">
            <option value="Suite"><option value="Accessible"><option value="Studio">
            <option value="Corridor"><option value="Bathroom"><option value="Lobby">
            <option value="Conference"><option value="Penthouse">
          </datalist>
          <button class="tw-add-btn" onclick="addTowerRoom('${pid}','${sid}')">＋ Add</button>
        </div>
        <div class="tw-input-row" style="margin-top:4px">
          <input class="tw-input" id="tw-range-${sid}" placeholder="Range: 101-110 or 201,203,205"
            onkeydown="if(event.key==='Enter')addTowerRoomRange('${pid}','${sid}')" />
          <input class="tw-input" id="tw-range-type-${sid}" placeholder="Type for all"
            list="tw-type-list-${sid}"
            onkeydown="if(event.key==='Enter')addTowerRoomRange('${pid}','${sid}')" />
          <button class="tw-add-btn" onclick="addTowerRoomRange('${pid}','${sid}')">＋ Range</button>
        </div>
      </div>
    </div>`;
}

function _refreshTowerPanel(pid, sid) {
  const el = document.getElementById(`tower-panel-${sid}`);
  if (el) el.innerHTML = _buildTowerPanelHTML(pid, sid);
  renderLeft(route()); // refresh badge in list
}

window.toggleTowerWork = function(pid, sid) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  item.towerWork.enabled = !item.towerWork.enabled;
  markAsDirty(sid); save();
  _refreshTowerPanel(pid, sid);
};

window.addTowerRoom = function(pid, sid) {
  const numEl = document.getElementById(`tw-room-num-${sid}`);
  const typeEl = document.getElementById(`tw-room-type-${sid}`);
  const num = (numEl?.value || '').trim();
  const type = (typeEl?.value || '').trim();
  if (!num) { showToast('Enter a room number', 'red'); numEl?.focus(); return; }
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  // Prevent duplicate room numbers
  if (item.towerWork.rooms.some(r => r.number === num)) {
    showToast(`Room ${num} already exists`, 'red'); return;
  }
  item.towerWork.rooms.push({ id:'rm_'+Date.now()+'_'+Math.random().toString(36).slice(2,5), number:num, type, status:'pending' });
  markAsDirty(sid); save();
  if (numEl) numEl.value = '';
  if (typeEl) typeEl.value = '';
  _refreshTowerPanel(pid, sid);
  // Re-focus for rapid entry
  setTimeout(() => document.getElementById(`tw-room-num-${sid}`)?.focus(), 50);
};

window.addTowerRoomRange = function(pid, sid) {
  const rangeEl = document.getElementById(`tw-range-${sid}`);
  const typeEl  = document.getElementById(`tw-range-type-${sid}`);
  const raw  = (rangeEl?.value || '').trim();
  const type = (typeEl?.value || '').trim();
  if (!raw) { showToast('Enter a range or list', 'red'); rangeEl?.focus(); return; }

  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  const existing = new Set(item.towerWork.rooms.map(r => r.number));

  // Parse "101-110" range or "201,203,205" list
  let numbers = [];
  if (/^\d+-\d+$/.test(raw)) {
    const [from, to] = raw.split('-').map(Number);
    if (to < from || to - from > 500) { showToast('Invalid range (max 500 rooms)', 'red'); return; }
    for (let n = from; n <= to; n++) numbers.push(String(n));
  } else {
    numbers = raw.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
  }

  let added = 0;
  numbers.forEach(num => {
    if (!existing.has(num)) {
      item.towerWork.rooms.push({ id:'rm_'+Date.now()+'_'+Math.random().toString(36).slice(2,5)+'_'+num, number:num, type, status:'pending' });
      existing.add(num);
      added++;
    }
  });

  markAsDirty(sid); save();
  if (rangeEl) rangeEl.value = '';
  _refreshTowerPanel(pid, sid);
  showToast(`＋${added} room${added!==1?'s':''} added`, 'green');
};

window.cycleTowerRoomStatus = function(pid, sid, roomId) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  const room = item.towerWork.rooms.find(r => r.id === roomId);
  if (!room) return;
  const idx = TW_STATUS_CYCLE.indexOf(room.status);
  room.status = TW_STATUS_CYCLE[(idx + 1) % TW_STATUS_CYCLE.length];
  markAsDirty(sid); save();
  _refreshTowerPanel(pid, sid);
};

window.deleteTowerRoom = function(pid, sid, roomId) {
  const item = getSI(pid, sid); if (!item) return;
  _twEnsure(item);
  item.towerWork.rooms = item.towerWork.rooms.filter(r => r.id !== roomId);
  markAsDirty(sid); save();
  _refreshTowerPanel(pid, sid);
};

// ── DATA HELPERS ─────────────────────────

/** Ensure laborEntries array exists on an item */
function _mpEnsure(item) {
  if (!item.laborEntries) item.laborEntries = [];
}

/** Total hours logged for an item */
function _mpTotalLogged(item) {
  _mpEnsure(item);
  return item.laborEntries.reduce((sum, e) => sum + (e.hours || 0), 0);
}

/** Remaining hours for an item (null if no estimate) */
function _mpRemaining(item) {
  if (item.laborHours == null) return null;
  return Math.max(0, item.laborHours - _mpTotalLogged(item));
}

/** Burn percent 0-100+ */
function _mpBurnPct(item) {
  if (!item.laborHours) return 0;
  return Math.round((_mpTotalLogged(item) / item.laborHours) * 100);
}

/** Color based on burn % */
function _mpColor(pct) {
  if (pct >= 100) return '#ef4444';
  if (pct >= 80)  return '#f97316';
  if (pct >= 50)  return '#fbbf24';
  return '#22c55e';
}

/** Today's date as YYYY-MM-DD */
function _todayISO() {
  return new Date().toISOString().slice(0, 10);
}

/** Format YYYY-MM-DD as M/D/YY */
function _fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${parseInt(m)}/${parseInt(d)}/${y.slice(2)}`;
}

// ── ENSURE FIELD ON ALL ITEMS (called in _initStore migration) ───
function _migrateManpower(store) {
  store.projects.forEach(p => {
    (p.items || []).forEach(i => { _mpEnsure(i); });
  });
}

/** Toggle open/closed state */
window.toggleLaborLog = function(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  item._laborLogOpen = !item._laborLogOpen;
  _refreshLaborLog(pid, sid);
};

/** Refresh just the labor log panel without rebuilding the whole SI editor */
function _refreshLaborLog(pid, sid) {
  const el = document.getElementById(`labor-log-panel-${sid}`);
  if (el) el.innerHTML = _buildLaborLogPanelHTML(pid, sid);
}

/** Add a labor entry */
window.addLaborEntry = function(pid, sid) {
  const item = getSI(pid, sid); if(!item) return;
  _mpEnsure(item);

  const dateEl    = document.getElementById(`mp-date-${sid}`);
  const workersEl = document.getElementById(`mp-workers-${sid}`);
  const hoursEl   = document.getElementById(`mp-hours-${sid}`);
  const noteEl    = document.getElementById(`mp-note-${sid}`);

  const date    = dateEl?.value;
  const workers = parseInt(workersEl?.value);
  const hours   = parseFloat(hoursEl?.value);
  const note    = noteEl?.value.trim() || '';

  if (!date)          return showToast('Select a date', 'red');
  if (!workers || workers < 1) return showToast('Enter number of workers', 'red');
  if (!hours || hours <= 0)    return showToast('Enter hours per worker', 'red');

  syncEditorToStore(pid, sid);

  item.laborEntries.push({
    id:      'lbr_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    date,
    workers,
    hours,
    note,
    total:   workers * hours
  });

  markAsDirty(sid); save();
  _refreshLaborLog(pid, sid);
  // Also refresh any open manpower dashboard
  _refreshManpowerDashboardIfOpen(pid);

  const total = workers * hours;
  showToast(`✓ ${total}h logged (${workers} workers × ${hours}h)`, 'green');

  // Clear inputs except date
  if(workersEl) workersEl.value = '';
  if(hoursEl)   hoursEl.value  = '';
  if(noteEl)    noteEl.value   = '';
};

/** Delete a labor entry */
window.deleteLaborEntry = function(pid, sid, entryId) {
  const item = getSI(pid, sid); if(!item) return;
  _mpEnsure(item);
  syncEditorToStore(pid, sid);
  item.laborEntries = item.laborEntries.filter(e => e.id !== entryId);
  markAsDirty(sid); save();
  _refreshLaborLog(pid, sid);
  _refreshManpowerDashboardIfOpen(pid);
  showToast('Entry deleted');
};

/** Quick log modal — works from dashboard (any SI) or SI editor */
window.showQuickLogModal = function(pid, preselectedSid) {
  const proj = getProject(pid); if(!proj) return;

  const siOptions = activeItems(proj).map(i =>
    `<option value="${i.id}" ${i.id===preselectedSid?'selected':''}>${i.num.replace(/^SI\s+/,'SI ')} — ${i.title}</option>`
  ).join('');

  makeModal('Log Labor Hours', `
    <div class="field-group">
      <div class="field-label">Scope Item</div>
      <select class="field-input" id="ql-si" onchange="updateQLEstimate('${pid}')">
        ${preselectedSid ? '' : `<option value="">— Select SI —</option>`}
        ${siOptions}
      </select>
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Date</div>
        <input type="date" class="field-input" id="ql-date" value="${_todayISO()}" />
      </div>
      <div class="field-group">
        <div class="field-label">Workers</div>
        <input type="number" class="field-input" id="ql-workers" min="1" max="99" placeholder="2"
          oninput="updateQLPreview()" />
      </div>
      <div class="field-group">
        <div class="field-label">Hrs / Worker</div>
        <input type="number" class="field-input" id="ql-hours" min="0.5" max="24" step="0.5" placeholder="8"
          oninput="updateQLPreview()" />
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Note (optional)</div>
      <input type="text" class="field-input" id="ql-note" placeholder="e.g. Framing, blocking, trim..." />
    </div>
    <div id="ql-preview" style="font-family:var(--mono);font-size:11px;color:var(--text2);padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;min-height:36px;margin-top:4px"></div>
    <div id="ql-estimate" style="font-size:10px;color:var(--text3);margin-top:6px"></div>
  `, () => {
    const siId   = document.getElementById('ql-si')?.value;
    const date   = document.getElementById('ql-date')?.value;
    const workers = parseInt(document.getElementById('ql-workers')?.value);
    const hours  = parseFloat(document.getElementById('ql-hours')?.value);
    const note   = document.getElementById('ql-note')?.value.trim() || '';

    if (!siId)              return showToast('Select a scope item', 'red');
    if (!date)              return showToast('Select a date', 'red');
    if (!workers || workers < 1) return showToast('Enter number of workers', 'red');
    if (!hours || hours <= 0)    return showToast('Enter hours per worker', 'red');

    const item = getSI(pid, siId); if(!item) return;
    _mpEnsure(item);

    item.laborEntries.push({
      id:      'lbr_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
      date,
      workers,
      hours,
      note,
      total:   workers * hours
    });

    markAsDirty(siId); save(); closeModal();

    // Refresh whichever view is open
    _refreshLaborLog(pid, siId);
    _refreshManpowerDashboardIfOpen(pid);

    showToast(`✓ ${workers * hours}h logged on ${item.num}`, 'green');
  });

  // Init preview
  setTimeout(() => {
    updateQLEstimate(pid);
    document.getElementById('ql-workers')?.focus();
  }, 100);
};

window.updateQLPreview = function() {
  const w = parseFloat(document.getElementById('ql-workers')?.value) || 0;
  const h = parseFloat(document.getElementById('ql-hours')?.value)   || 0;
  const el = document.getElementById('ql-preview');
  if (!el) return;
  if (w && h) {
    el.textContent = `${w} workers × ${h}h = ${w*h}h total logged`;
    el.style.color = 'var(--accent)';
  } else {
    el.textContent = 'Enter workers and hours to see total';
    el.style.color = 'var(--text3)';
  }
};

window.updateQLEstimate = function(pid) {
  const siId = document.getElementById('ql-si')?.value;
  const el   = document.getElementById('ql-estimate');
  if (!el || !siId) return;
  const item = getSI(pid, siId); if(!item) return;
  _mpEnsure(item);
  if (item.laborHours == null) {
    el.textContent = 'No estimate set on this SI';
  } else {
    const logged = _mpTotalLogged(item);
    const rem    = Math.max(0, item.laborHours - logged);
    const pct    = _mpBurnPct(item);
    el.textContent = `SI budget: ${item.laborHours}h est · ${logged}h logged · ${rem}h remaining (${pct}% used)`;
    el.style.color = _mpColor(pct);
  }
  updateQLPreview();
};

/** Delete from dashboard activity feed */
window.deleteAnyLaborEntry = function(pid, siId, entryId) {
  const item = getSI(pid, siId); if(!item) return;
  _mpEnsure(item);
  item.laborEntries = item.laborEntries.filter(e => e.id !== entryId);
  markAsDirty(siId); save();
  _refreshManpowerDashboardIfOpen(pid);
  _refreshLaborLog(pid, siId);
  showToast('Entry deleted');
};

/** Refresh dashboard if currently visible */
function _refreshManpowerDashboardIfOpen(pid) {
  const r = route();
  if (r.view === 'manpower' && r.projectId === pid) {
    buildManpowerView(pid);
  }
}

const WO_HEADER_ALIASES = {
  name:            ['name','item','description','work order','work order name'],
  type:            ['type'],
  plannedCritical: ['planned critical date','critical date','need by','required date'],
  workflow:        ['workflow name','workflow'],
  plannedStart:    ['planned start date','start date','install date'],
  shipmentDate:    ['actual shipment date','shipment date','ship date'],
  laborHours:      ['estimated total labor hours','total labor hours','labor hours','hours'],
  deliveryDate:    ['delivery/on site date','delivery date','on site date','on-site date','delivery'],
  siNumber:        ['si #','si#','si number','si no','si']
};

function _woNormalizeHeader(h) {
  return String(h || '').toLowerCase().replace(/[\s_\-\/#\.]+/g, ' ').trim();
}

function _woBuildHeaderIndex(headerRow) {
  const idx = {};
  headerRow.forEach((h, i) => {
    const norm = _woNormalizeHeader(h);
    for (const canonical in WO_HEADER_ALIASES) {
      if (WO_HEADER_ALIASES[canonical].some(alias => _woNormalizeHeader(alias) === norm)) {
        idx[canonical] = i;
        return;
      }
    }
  });
  return idx;
}

function _woParseName(name) {
  if (!name) return { si: null, title: '' };
  const s = String(name).trim();
  const lead = s.match(/^(\d{2,4})\s*[-–:.\s]?\s*(.*)$/);
  if (lead) return { si: lead[1].padStart(4, '0'), title: lead[2].trim() || s };
  const any = s.match(/\b(\d{2,4})\b/);
  return { si: any ? any[1].padStart(4, '0') : null, title: s };
}

function _woToISODate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if (m) {
    let [, mo, da, yr] = m;
    if (yr.length === 2) yr = '20' + yr;
    const iso = `${yr}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`;
    return isNaN(new Date(iso)) ? '' : iso;
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}

function _woToNumber(v) {
  if (v == null || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}

function extractWorkOrdersFromSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, cellDates: true, defval: '' });
  if (!rows.length) return { items: [], skipped: [], headerFound: false };

  let headerRowIdx = -1, headerIdx = null;
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    const h = _woBuildHeaderIndex(rows[i]);
    if ('name' in h && ('plannedStart' in h || 'plannedCritical' in h || 'deliveryDate' in h)) {
      headerRowIdx = i; headerIdx = h; break;
    }
  }
  if (headerRowIdx === -1) return { items: [], skipped: [], headerFound: false };

  const items = [], skipped = [];
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(c => c === '' || c == null)) continue;
    const rawName = headerIdx.name != null ? row[headerIdx.name] : '';
    const { si, title } = _woParseName(rawName);
    if (!si) { skipped.push({ row: r + 1, reason: 'No SI number detected in Name' }); continue; }
    items.push({
      si, title: title || rawName,
      type:            String(headerIdx.type        != null ? row[headerIdx.type]        : '').trim(),
      workflow:        String(headerIdx.workflow     != null ? row[headerIdx.workflow]    : '').trim(),
      plannedStart:    _woToISODate(headerIdx.plannedStart    != null ? row[headerIdx.plannedStart]    : ''),
      plannedCritical: _woToISODate(headerIdx.plannedCritical != null ? row[headerIdx.plannedCritical] : ''),
      shipmentDate:    _woToISODate(headerIdx.shipmentDate    != null ? row[headerIdx.shipmentDate]    : ''),
      deliveryDate:    _woToISODate(headerIdx.deliveryDate    != null ? row[headerIdx.deliveryDate]    : ''),
      laborHours:      _woToNumber( headerIdx.laborHours      != null ? row[headerIdx.laborHours]      : ''),
      _checked: true
    });
  }
  const seen = new Map();
  items.forEach(it => { if (seen.has(it.si)) it._duplicate = true; seen.set(it.si, true); });
  return { items, skipped, headerFound: true };
}

function _woWeekKeyFor(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return null;
  const today = new Date();
  const day = today.getDay();
  const diff = today.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(today.getFullYear(), today.getMonth(), diff);
  const wIdx = Math.floor((d - monday) / (7 * 24 * 60 * 60 * 1000));
  if (wIdx < 0 || wIdx > 5) return null;
  return 'w' + wIdx;
}

function _woBuildSIItem(it, sectionId) {
  return {
    id: 'si_' + it.si + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    sectionId, num: 'SI ' + it.si, title: it.title,
    status: 'pending', assignedTo: '', dueDate: it.plannedStart || '',
    notes: '', tags: [], customTags: [], photos: [],
    plannedStart: it.plannedStart || '', plannedCritical: it.plannedCritical || '',
    shipmentDate: it.shipmentDate || '', deliveryDate: it.deliveryDate || '',
    laborHours: it.laborHours, workflow: it.workflow || '', workOrderType: it.type || '',
    delivery: { deliveryDate: it.deliveryDate || '', truck: '' }
  };
}

function _woPopulateSchedule(project, items) {
  if (!project.schedule) project.schedule = {};
  let populated = 0;
  items.forEach(si => {
    const wkey = _woWeekKeyFor(si.plannedStart);
    if (!wkey) return;
    const cellKey = `${si.id}_${wkey}`;
    if (!project.schedule[cellKey]) { project.schedule[cellKey] = 'Planned Start'; populated++; }
  });
  return populated;
}

function createProjectFromWorkOrders(items, projectName, folderId) {
  const pid = 'proj_' + Date.now();
  const section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' };
  const siItems = items.map(it => _woBuildSIItem(it, section.id));
  const project = {
    id: pid, name: projectName || 'Work Orders Import',
    ownedBy: _currentUser?.userId || '',
    client: '', company: '', auditor: '', date: new Date().toLocaleDateString(),
    projectType: '', coverPhoto: null, sections: [section], items: siItems,
    schedule: {}, importLog: []
  };
  const populated = _woPopulateSchedule(project, siItems);
  store.projects.push(project);
  if (folderId) { const f = getFolder(folderId); if (f && !f.projects.includes(pid)) f.projects.push(pid); }
  project.importLog.push({ date: new Date().toISOString(), summary: { added: siItems.length, modified: 0, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  // Both the doc and the index entry must sync (doc first — see syncChanges)
  markProjectDirty(pid);
  markStoreDirty();
  save();
  scheduleDirtySync();
  return { pid, added: siItems.length, scheduled: populated };
}

function mergeWorkOrdersIntoProject(project, items) {
  let section = project.sections.find(s => s.name === 'Imported Work Orders');
  if (!section) { section = { id: 'sec_imported_' + Date.now(), name: 'Imported Work Orders' }; project.sections.push(section); }
  const existingBySI = new Map();
  project.items.forEach(i => { const m = String(i.num||'').match(/\d{2,4}/); if (m) existingBySI.set(m[0].padStart(4,'0'), i); });
  let added = 0, updated = 0;
  const newOrUpdatedItems = [];
  items.forEach(it => {
    const existing = existingBySI.get(it.si);
    if (existing) {
      existing.dueDate         = it.plannedStart    || existing.dueDate;
      existing.plannedStart    = it.plannedStart    || existing.plannedStart    || '';
      existing.plannedCritical = it.plannedCritical || existing.plannedCritical || '';
      existing.shipmentDate    = it.shipmentDate    || existing.shipmentDate    || '';
      existing.deliveryDate    = it.deliveryDate    || existing.deliveryDate    || '';
      existing.laborHours      = (it.laborHours != null) ? it.laborHours : existing.laborHours;
      existing.workflow        = it.workflow     || existing.workflow     || '';
      existing.workOrderType   = it.type         || existing.workOrderType || '';
      if (it.deliveryDate) { existing.delivery = existing.delivery || { deliveryDate:'', truck:'' }; existing.delivery.deliveryDate = it.deliveryDate; }
      newOrUpdatedItems.push(existing); updated++;
    } else {
      const si = _woBuildSIItem(it, section.id);
      project.items.push(si); newOrUpdatedItems.push(si); added++;
    }
  });
  const populated = _woPopulateSchedule(project, newOrUpdatedItems);
  if (!project.importLog) project.importLog = [];
  project.importLog.push({ date: new Date().toISOString(), summary: { added, modified: updated, removed: 0, conflicts: 0, scheduled: populated }, source: 'work-orders-xlsx' });
  save();
  return { added, updated, scheduled: populated };
}

window.handleWorkOrdersXLSX = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') return showToast('XLSX library not loaded', 'red');
  const folderId = _woTargetFid, mergePid = _woTargetPid;
  const reader = new FileReader();
  reader.onload = ev => {
    let wb;
    try { wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true }); }
    catch (err) { console.error('[WO Import] read failed:', err); return showToast('Could not read spreadsheet', 'red'); }
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const parsed = extractWorkOrdersFromSheet(sheet);
    showWorkOrdersPreviewModal(file.name, parsed, (selected, projectName) => {
      if (mergePid) {
        const proj = getProject(mergePid);
        if (!proj) { closeModal(); return showToast('Target project not found', 'red'); }
        const res = mergeWorkOrdersIntoProject(proj, selected);
        markProjectDirty(mergePid);
        closeModal();
        showToast(`✓ +${res.added} new · ~${res.updated} updated · 📅 ${res.scheduled} scheduled`, 'green');
        render();
      } else {
        const res = createProjectFromWorkOrders(selected, projectName, folderId);
        closeModal();
        showToast(`✓ Imported ${res.added} SI · 📅 ${res.scheduled} scheduled`, 'green');
        setTimeout(() => navToProject(res.pid, folderId), 50);
      }
      _woTargetFid = null; _woTargetPid = null;
    });
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

// FEATURE: _timeAgo + _logActivity helpers
// ══════════════════════════════════════════════════════════════════
function _timeAgo(ts) {
  if(!ts) return '';
  const diff=Date.now()-ts;
  const m=Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function _logActivity(pid,entry) {
  const proj=getProject(pid); if(!proj) return;
  if(!proj.activityLog) proj.activityLog=[];
  proj.activityLog.unshift({...entry,at:Date.now()});
  if(proj.activityLog.length>300) proj.activityLog.length=300;
  markProjectDirty(pid);
}

  };

    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload)
  }).catch(() => {/* offline — silently ignore */});
}

let _voiceRec=null, _voiceActive=false;
function toggleVoice(pid,sid) {
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){ showToast('Voice not supported on this browser',''); return; }
  const btn=document.getElementById('voice-btn');
  if(_voiceActive){ _voiceRec?.stop(); return; }
  _voiceRec=new SpeechRecognition();
  _voiceRec.continuous=true; _voiceRec.interimResults=true; _voiceRec.lang='en-US';
  _voiceRec.onstart=()=>{ _voiceActive=true; if(btn)btn.classList.add('recording'); showToast('🎤 Listening…'); };
  _voiceRec.onresult=e=>{
    const ta=document.getElementById('notes-input'); if(!ta) return;
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ');
    // Only append final results to avoid duplication
    if(e.results[e.results.length-1].isFinal){
      ta.value=(ta.value?ta.value+' ':'')+e.results[e.results.length-1][0].transcript.trim();

  _voiceRec.onerror=()=>{ _voiceActive=false; if(btn)btn.classList.remove('recording'); };
  _voiceRec.onend=()=>{ _voiceActive=false; if(btn)btn.classList.remove('recording'); _voiceRec=null; };

}

let _attachTarget={pid:null,sid:null};
function triggerAttach(pid,sid){
  _attachTarget={pid,sid};

}
function handleAttachmentImport(e){
  const {pid,sid}=_attachTarget;
  const item=getSI(pid,sid); if(!item) return;
  if(!item.attachments) item.attachments=[];
  const files=Array.from(e.target.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const ext=file.name.split('.').pop().toLowerCase();
      const icons={pdf:'📄',doc:'📝',docx:'📝',xlsx:'📊',xls:'📊',pptx:'📑',csv:'📊',txt:'📃',zip:'🗜️',png:'🖼️',jpg:'🖼️',jpeg:'🖼️'};
      const attach={id:'att_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:file.name,type:file.type,ext,icon:icons[ext]||'📎',size:file.size,data:ev.target.result,addedAt:Date.now(),addedBy:store.settings.displayName||'You'};
      item.attachments.push(attach);
      _logActivity(pid,{type:'attach',siId:sid,siNum:item.num,detail:file.name,by:attach.addedBy});
      if(++loaded===files.length){
        markAsDirty(sid); save();
        const el=document.getElementById('attach-list-'+sid);
        if(el) el.innerHTML=_buildAttachListHTML(pid,sid);
        showToast('✓ File attached','green');
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function _buildAttachListHTML(pid,sid){
  const item=getSI(pid,sid); if(!item||!item.attachments||!item.attachments.length) return '<div style="font-size:11px;color:var(--text3);padding:6px 0">No files attached yet</div>';
  return item.attachments.map(a=>`
    <div class="attach-row">
      <span class="attach-icon">${a.icon||'📎'}</span>
      <span class="attach-name" title="${a.name}">${a.name}</span>
      <span class="attach-size">${(a.size/1024).toFixed(0)}KB</span>
      ${a.data?`<button class="attach-del" style="color:var(--accent);background:none" onclick="event.stopPropagation();_openAttachment('${a.id}','${pid}','${sid}')" title="Open">⬇</button>`:''}
      <button class="attach-del" onclick="deleteAttachment('${pid}','${sid}','${a.id}')">✕</button>
    </div>`).join('');
}
function _openAttachment(attId,pid,sid){
  const item=getSI(pid,sid); if(!item) return;
  const a=item.attachments?.find(x=>x.id===attId); if(!a||!a.data) return;
  const link=document.createElement('a');
  link.href=a.data; link.download=a.name; link.click();
}
function deleteAttachment(pid,sid,attId){
  const item=getSI(pid,sid); if(!item) return;
  item.attachments=(item.attachments||[]).filter(a=>a.id!==attId);
  markAsDirty(sid); save();
  const el=document.getElementById('attach-list-'+sid);
  if(el) el.innerHTML=_buildAttachListHTML(pid,sid);
  showToast('Attachment removed');
}

// FEATURE: Pre-export required-field validation + red highlighting
// ══════════════════════════════════════════════════════════════════
// An item is "incomplete" unless its status is in EXPORT_EXEMPT_STATUSES.
// Every incomplete item must have a Field Check (statusCode), Field Notes,
// and at least one Field Photo before the project PDF can be exported.
// Missing fields are surfaced in a blocking modal (red chips) and
// highlighted in red inside the SI editor so the superintendent can fix them.

// Tunable: add 'out-of-scope' or 'not-ready' here to exempt those too.
window.EXPORT_EXEMPT_STATUSES = ['completed','punch-ongoing'];
window._exportExemptStatus = it => window.EXPORT_EXEMPT_STATUSES.includes(it && it.status);

window.REQUIRED_EXPORT_FIELDS = [
  { key:'statusCode', label:'Field Check', test: it => !!it.statusCode },
  { key:'notes',      label:'Field Notes', test: it => !!(it.notes && String(it.notes).trim()) },
  { key:'photos',     label:'Field Photo', test: it => Array.isArray(it.photos) && it.photos.length > 0 },
];

// Returns array of missing field labels for one item (empty if complete/exempt).
window._siMissingRequired = function(it){
  if (!it || it._deleted) return [];
  if (window._exportExemptStatus(it)) return [];
  return window.REQUIRED_EXPORT_FIELDS.filter(f => !f.test(it)).map(f => f.label);
};

// Scans a project; returns [{id,num,title,missing:[labels]}] for incomplete items.
window.checkRequiredBeforeExport = function(proj){
  if (!proj || !Array.isArray(proj.items)) return [];
  const out = [];
  for (const it of proj.items){
    const missing = window._siMissingRequired(it);
    if (missing.length) out.push({ id: it.id, num: it.num, title: it.title || '', missing });
  }
  return out;
};

// Renders the blocking modal listing every incomplete item + its missing fields.
window.showExportValidationModal = function(pid, missing){
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const proj = (typeof getProject==='function') ? getProject(pid) : null;
  missing = missing || window.checkRequiredBeforeExport(proj);
  const n = missing.length;
  const rows = missing.map(m => `
    <div class="exv-item">
      <div class="exv-item-head">
        <span class="exv-num">${esc(m.num||'SI')}</span>
        <span class="exv-title">${esc(m.title||'(untitled)')}</span>
        <button class="exv-jump" onclick="closeModal(); navToSI('${pid}','${m.id}')">Open ›</button>
      </div>
      <div class="exv-miss">
        ${m.missing.map(lbl=>`<span class="exv-chip">${esc(lbl)}</span>`).join('')}
      </div>
    </div>`).join('');
  const body = `
    <div class="exv-intro">
      <strong>${n} item${n>1?'s':''}</strong> ${n>1?'are':'is'} missing required field${n>1?'s':''} and must be completed before this report can be exported.
      Each incomplete item needs a <strong>Field Check</strong>, <strong>Field Notes</strong>, and at least one <strong>Photo</strong>.
      Tap <strong>Open ›</strong> to jump to an item — the missing fields are outlined in red.
    </div>
    ${rows}`;
  makeModal('⚠ Cannot Export — Required Fields Missing', body, null, true);
};

// ── Highlight missing required fields inside the SI editor ───────────
window._flagRequiredFields = function(pid, sid){
  const proj = (typeof getProject==='function') ? getProject(pid) : null; if (!proj) return;
  const it = (typeof getSI==='function') ? getSI(pid,sid) : (proj.items||[]).find(i=>i.id===sid);
  const root = document.getElementById('v-si'); if (!root) return;
  // Clear any prior flags first (render-time refresh)
  root.querySelectorAll('.field-group.req-missing').forEach(el => el.classList.remove('req-missing'));
  root.querySelectorAll('.req-flag').forEach(el => el.remove());
  if (!it) return;
  const missing = window._siMissingRequired(it);
  if (!missing.length) return;
  const flag = (groupEl) => {
    if (!groupEl || groupEl.classList.contains('req-missing')) return;
    groupEl.classList.add('req-missing');
    const lbl = groupEl.querySelector('.field-label');
    if (lbl && !lbl.querySelector('.req-flag')){
      const pill = document.createElement('span');
      pill.className = 'req-flag'; pill.textContent = 'Required';
      lbl.appendChild(pill);
    }
  };
  if (missing.includes('Field Photo')){ const g = root.querySelector('.photo-grid'); if (g) flag(g.closest('.field-group')); }
  if (missing.includes('Field Notes')){ const t = root.querySelector('#notes-input'); if (t) flag(t.closest('.field-group')); }
  if (missing.includes('Field Check')){ const r = root.querySelector('input[name="si-status-code"]'); if (r) flag(r.closest('.field-group')); }
};

/** Parse Innergy EstimatedHours — stored as .NET TimeSpan "d.hh:mm:ss.fff" */
function _innergyParseHours(s) {
  if (!s) return null;
  const str = String(s).trim();
  const m = str.match(/^(\d+)\.(\d+):(\d+)/);
  if (m) return Math.round((+m[1] * 24 + +m[2] + +m[3] / 60) * 10) / 10;
  const h = str.match(/^(\d+):(\d+)/);
  if (h) return Math.round((+h[1] + +h[2] / 60) * 10) / 10;
  const n = parseFloat(str);
  return isNaN(n) ? null : Math.round(n * 10) / 10;
}

/** Map Innergy work order status → app status */
function _innergyMapStatus(s) {
  const st = (s || '').toLowerCase();
  if (st.includes('closed') || st.includes('complete')) return 'complete';
  if (st.includes('cancel')) return 'na';
  if (st.includes('progress') || st.includes('production')) return 'in-progress';
  return 'pending';
}

/** Map a single Innergy work order → an SI scope item */
function _innergyWOtoSIItem(wo, sectionId, includeHours, includeDates) {
  const { si, title } = _woParseName(wo.Name || wo.name || '');
  const hours = includeHours ? _innergyParseHours(wo.EstimatedHours || wo.estimatedHours) : null;
  return {
    id: 'si_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    sectionId,
    num: 'SI ' + (si || '0001'),
    title: title || wo.Name || '—',
    status: _innergyMapStatus(wo.Status || wo.status),
    assignedTo: '', notes: '', tags: [], customTags: [], photos: [],
    dueDate:         includeDates ? (_woToISODate(wo.PlannedCriticalDate || wo.plannedCriticalDate) || '') : '',
    plannedStart:    includeDates ? (_woToISODate(wo.PlannedStartDate    || wo.plannedStartDate)    || '') : '',
    plannedCritical: includeDates ? (_woToISODate(wo.PlannedCriticalDate || wo.plannedCriticalDate) || '') : '',
    shipmentDate:    includeDates ? (_woToISODate(wo.PlannedShipmentDate || wo.ShipmentDate         || wo.shipmentDate) || '') : '',
    deliveryDate: '',
    laborHours: hours,
    workflow: wo.WorkflowName || wo.workflowName || '',
    workOrderType: wo.Type || wo.type || '',
    innergyWONumber: wo.Number || wo.number || '',
    delivery: { deliveryDate: '', truck: '' }
  };
}

/** Fetch from the Azure Function proxy at /api/innergy/*.
 *  Works on Azure Static Web Apps (via api/innergy/index.js Azure Function)
 *  and on local Replit dev (via server.js which handles /api/innergy/*). */
async function _innergyFetch(path) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try {
    res = await fetch('/api/innergy' + path, {
      headers: { Accept: 'application/json' },
      signal: ctrl.signal,
    });
  } catch(e) {
    clearTimeout(timer);
    throw new Error(e.name === 'AbortError' ? 'Request timed out (15s)' : e.message);
  }
  clearTimeout(timer);
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error || ''; } catch(e2) {}
    throw new Error(`Innergy HTTP ${res.status}${detail ? ': ' + detail : ''}`);
  }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('Proxy returned non-JSON — check Azure app settings for INNERGY_API_KEY'); }
}

/** Derive a short status label — Innergy uses PascalCase field names */
function _innergyStatus(proj) {
  const s = (proj.Status || proj.status || '').toLowerCase();
  if (s.includes('complet')) return 'Completed';
  if (s.includes('close'))   return 'Closed';
  if (s.includes('hold'))    return 'On Hold';
  if (s.includes('cancel'))  return 'Cancelled';
  if (s.includes('open'))    return 'Open';
  return proj.Status || proj.status || '—';
}

/** Extract customer/client name — Innergy shape: { Customer: { Name: "..." } } */
function _innergyClient(proj) {
  return proj.Customer?.Name
    || proj.customerName
    || proj.customer?.name
    || proj.clientName
    || (proj.CustomerInformation && proj.CustomerInformation.Name)
    || '—';
}

/** Extract project number — Innergy field is "Number" (PascalCase) */
function _innergyNumber(proj) {
  return proj.Number || proj.number || proj.ExternalId || proj.Id || proj.id || '—';
}

/** Extract project name — Innergy field is "Name" (PascalCase) */
function _innergyName(proj) {
  return proj.Name || proj.name || '—';
}

/** Extract address string from Innergy Address object */
function _innergyAddr(proj) {
  const a = proj.Address || proj.address || {};
  return [a.Address1 || a.address1, a.City || a.city, a.State || a.state]
    .filter(Boolean).join(', ') || '—';
}

/** Total labor hours from budget groups response — handles Items or plain array */
// State for the two-step Innergy modal
let _innergyFid = '';
let _innergyAllProjects = [];
let _innergyHiddenClosed = 0;
let _innergySelected = null;
let _innergyBudgetGroups = [];
let _innergyWorkOrders = [];   // Installation (and optionally other types) WOs

async function showInnergyImport(fid) {
  _innergyFid = fid;
  _innergyAllProjects = [];
  _innergyHiddenClosed = 0;
  _innergySelected = null;
  _innergyBudgetGroups = [];

  makeModal('⚡ Import from Innergy',
    `<div style="text-align:center;padding:24px 0;color:var(--text2)">Loading projects from Innergy…</div>`,
    null, true
  );

  try {
    const data = await _innergyFetch('/api/projects');
    // Innergy wraps results in { Items: [...] } (capital I)
    const fetched = Array.isArray(data) ? data
      : Array.isArray(data.Items) ? data.Items
      : Array.isArray(data.items) ? data.items
      : [];

    if (!fetched.length) {
      _innergyShowError('No projects found in Innergy. Check that your API key has Project → View permission.');
      return;
    }

    // Closed projects don't need a site audit — keep them out of the picker
    _innergyAllProjects = fetched.filter(p => {
      const s = String(p.Status || p.status || '').toLowerCase();
      return !s.includes('close');
    });
    _innergyHiddenClosed = fetched.length - _innergyAllProjects.length;

    if (!_innergyAllProjects.length) {
      _innergyShowError(`All ${fetched.length} Innergy projects are closed — nothing to audit.`);
      return;
    }

    // Newest project numbers first, so the list is browsable when you
    // don't know the number offhand
    _innergyAllProjects.sort((a, b) =>
      String(_innergyNumber(b)).localeCompare(String(_innergyNumber(a)), undefined, { numeric: true }));

    _innergyRenderPicker();
  } catch(e) {
    _innergyShowError('Could not reach Innergy: ' + e.message);
  }
}

function _innergyShowError(msg) {
  const el = document.querySelector('#modal-overlay .modal-body');
  if (el) el.innerHTML = `<div style="color:var(--red);padding:16px 0">${_htmlEsc(msg)}</div>`;
}

function _innergyRenderPicker(filter) {
  const q = (filter || '').toLowerCase();
  const projs = q
    ? _innergyAllProjects.filter(p =>
        (_innergyNumber(p) + ' ' + _innergyName(p) + ' ' + _innergyClient(p)).toLowerCase().includes(q))
    : _innergyAllProjects;

  const rows = projs.map(p => {
    const num    = _htmlEsc(_innergyNumber(p));
    const name   = _htmlEsc(_innergyName(p));
    const client = _htmlEsc(_innergyClient(p));
    const status = _htmlEsc(_innergyStatus(p));
    const pid    = p.Id || p.id || '';
    const sel    = _innergySelected && (_innergySelected.Id || _innergySelected.id) === pid ? 'selected' : '';
    return `<div class="innergy-job-row ${sel}" onclick="_innergySelectJob('${pid}')">
      <span class="innergy-job-num">${num}</span>
      <span class="innergy-job-name">${name}</span>
      <span class="innergy-job-client">${client}</span>
      <span class="innergy-job-status">${status}</span>
    </div>`;
  }).join('');

  const body = `
    <input class="innergy-search" id="innergy-search" placeholder="Search by number, name or client…"
      oninput="_innergyRenderPicker(this.value)" value="${_htmlEsc(filter||'')}">
    <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${projs.length} project${projs.length!==1?'s':''} · scroll or search · click one to preview${_innergyHiddenClosed>0?` · ${_innergyHiddenClosed} closed hidden`:''}</div>
    <div class="innergy-job-list">${rows || '<div style="padding:16px;color:var(--text2);text-align:center">No matches</div>'}</div>
    <div id="innergy-detail"></div>`;

  const bodyEl = document.querySelector('#modal-overlay .modal-body');
  if (bodyEl) {
    bodyEl.innerHTML = body;
    const si = document.getElementById('innergy-search');
    if (si && filter) { si.focus(); const v=si.value; si.value=''; si.value=v; }
  }
}

async function _innergySelectJob(projectId) {
  _innergySelected = _innergyAllProjects.find(p => (p.Id || p.id) === projectId) || null;
  if (!_innergySelected) return;

  document.querySelectorAll('.innergy-job-row').forEach(r => r.classList.remove('selected'));
  const row = [...document.querySelectorAll('.innergy-job-row')]
    .find(r => r.getAttribute('onclick') === `_innergySelectJob('${projectId}')`);
  if (row) row.classList.add('selected');

  const detailEl = document.getElementById('innergy-detail');
  if (detailEl) detailEl.innerHTML = `<div style="text-align:center;padding:12px;color:var(--text2);font-size:12px">Loading work orders…</div>`;

  // Fetch work orders (scope items) — budget groups are typically empty (permissions)
  _innergyWorkOrders = [];
  _innergyBudgetGroups = [];
  try {
    const woData = await _innergyFetch(`/api/projects/${projectId}/workOrders`);
    const allWOs = Array.isArray(woData) ? woData
      : Array.isArray(woData?.Items) ? woData.Items
      : Array.isArray(woData?.items) ? woData.items : [];
    _innergyWorkOrders = allWOs;
  } catch(e) { _innergyWorkOrders = []; }

  const p      = _innergySelected;
  const num    = _innergyNumber(p);
  const client = _innergyClient(p);
  const addr   = _innergyAddr(p);

  const installs = _innergyWorkOrders.filter(w => (w.Type||w.type||'') === 'Installation');
  const others   = _innergyWorkOrders.filter(w => (w.Type||w.type||'') !== 'Installation');
  const typeGroups = {};
  others.forEach(w => { const t = w.Type||w.type||'Other'; typeGroups[t] = (typeGroups[t]||0)+1; });

  const totalHrs = _innergyWorkOrders.reduce((s, w) => {
    const h = _innergyParseHours(w.EstimatedHours || w.estimatedHours);
    return s + (h || 0);
  }, 0);

  const woPreviewRows = installs.slice(0, 5).map(w => {
    const { si, title } = _woParseName(w.Name || '');
    const hrs = _innergyParseHours(w.EstimatedHours);
    return `<div class="innergy-labor-row">
      <span style="font-family:var(--mono);font-size:11px;color:var(--accent);flex-shrink:0">SI ${si||'?'}</span>
      <span style="flex:1;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_htmlEsc(title)}</span>
      ${hrs ? `<span style="font-size:11px;color:var(--text2);flex-shrink:0">${hrs}h</span>` : ''}
    </div>`;
  }).join('');

  if (detailEl) detailEl.innerHTML = `
    <div class="innergy-section-title">Project Preview</div>
    <div class="innergy-detail-grid">
      <div class="innergy-detail-field"><div class="innergy-detail-label">Project #</div><div class="innergy-detail-value">${_htmlEsc(num)}</div></div>
      <div class="innergy-detail-field"><div class="innergy-detail-label">Client</div><div class="innergy-detail-value">${_htmlEsc(client)}</div></div>
      <div class="innergy-detail-field"><div class="innergy-detail-label">Status</div><div class="innergy-detail-value">${_htmlEsc(_innergyStatus(p))}</div></div>
      <div class="innergy-detail-field"><div class="innergy-detail-label">Address</div><div class="innergy-detail-value">${_htmlEsc(addr)}</div></div>
      <div class="innergy-detail-field"><div class="innergy-detail-label">Installation WOs</div><div class="innergy-detail-value" style="color:#a78bfa;font-weight:700">${installs.length} scope items</div></div>
      ${Object.entries(typeGroups).map(([t,c]) => `<div class="innergy-detail-field"><div class="innergy-detail-label">${_htmlEsc(t)} WOs</div><div class="innergy-detail-value">${c}</div></div>`).join('')}
      ${totalHrs > 0 ? `<div class="innergy-detail-field"><div class="innergy-detail-label">Est. Total Hours</div><div class="innergy-detail-value">${Math.round(totalHrs)} h</div></div>` : ''}
    </div>
    ${installs.length ? `<div class="innergy-section-title">Installation Work Orders (preview)</div><div>${woPreviewRows}${installs.length > 5 ? `<div style="font-size:11px;color:var(--text2);padding:4px 0">…and ${installs.length-5} more</div>` : ''}</div>` : '<div style="font-size:12px;color:var(--text2);padding:8px 0">No Installation work orders found.</div>'}
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-add" onclick="_innergyCreateProject()" ${!installs.length ? 'disabled title="No Installation work orders to import"' : ''} style="background:rgba(139,92,246,0.15);border-color:rgba(139,92,246,0.4);color:#a78bfa;font-size:13px;padding:9px 20px">
        ＋ Create Project from This
      </button>
    </div>`;
}

function _innergyCreateProject() {
  const p = _innergySelected;
  if (!p) return;

  const num    = _innergyNumber(p);
  const client = _innergyClient(p);
  const fid    = _innergyFid;

  const installs = _innergyWorkOrders.filter(w => (w.Type||w.type||'') === 'Installation');
  const otherTypes = [...new Set(_innergyWorkOrders
    .filter(w => (w.Type||w.type||'') !== 'Installation')
    .map(w => w.Type||w.type||'Other'))];

  closeModal();

  // ── Build the selection + options modal ──────────────────────────────────
  const toggleRows = otherTypes.map(t => {
    const count = _innergyWorkOrders.filter(w => (w.Type||w.type||'') === t).length;
    const tid   = 'innergy-tog-' + t.replace(/\W/g,'_');
    return `<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:4px">
      <input type="checkbox" id="${tid}" style="accent-color:var(--accent)">
      Also include <strong style="color:var(--text1)">${_htmlEsc(t)}</strong> work orders (${count})
    </label>`;
  }).join('');

  const woRows = installs.map((wo, idx) => {
    const { si, title } = _woParseName(wo.Name || '');
    const hrs = _innergyParseHours(wo.EstimatedHours);
    const wid = 'innergy-wo-' + idx;
    return `<label style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer">
      <input type="checkbox" class="innergy-wo-check" data-idx="${idx}" checked style="accent-color:var(--accent);margin-top:2px;flex-shrink:0">
      <span style="font-family:var(--mono);font-size:11px;color:var(--accent);flex-shrink:0;min-width:38px">SI ${si||'?'}</span>
      <span style="flex:1;font-size:12px;color:var(--text1)">${_htmlEsc(title)}</span>
      ${hrs ? `<span style="font-size:11px;color:var(--text2);flex-shrink:0">${hrs}h</span>` : ''}
    </label>`;
  }).join('');

  makeModal('⚡ Import from Innergy', `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:7px 10px;border-radius:8px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2)">
      <span style="font-size:14px">⚡</span>
      <span style="font-size:12px;color:#a78bfa">Importing from <strong>${_htmlEsc(num)}</strong> · ${_htmlEsc(_innergyName(p))}</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="field-group" style="margin:0"><div class="field-label">Project Name</div><input class="field-input" id="m-name" value="${_htmlEsc(_innergyName(p))}" /></div>
      <div class="field-group" style="margin:0"><div class="field-label">Project #</div><input class="field-input" id="m-projnum" value="${_htmlEsc(num)}" /></div>
      <div class="field-group" style="margin:0"><div class="field-label">Client</div><input class="field-input" id="m-client" value="${_htmlEsc(client)}" /></div>
      <div class="field-group" style="margin:0"><div class="field-label">Your Company</div><input class="field-input" id="m-company" placeholder="Your company" /></div>
      <div class="field-group" style="margin:0"><div class="field-label">Auditor</div><input class="field-input" id="m-auditor" placeholder="Your name" /></div>
      <div class="field-group" style="margin:0"><div class="field-label">Project Type</div>
        <select class="field-input" id="m-type">
          <option value="">— Select —</option>
          <option>Division 4</option><option>Division 6</option><option>Division 8</option><option>Division 10</option>
        </select>
      </div>
    </div>

    <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">
      Scope Items · Installation Work Orders
      <span style="font-weight:400;text-transform:none;margin-left:6px">
        <label style="cursor:pointer"><input type="checkbox" id="innergy-chk-all" checked style="accent-color:var(--accent)"> select all</label>
      </span>
    </div>
    <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin-bottom:10px">
      ${woRows || '<div style="padding:8px;color:var(--text2);font-size:12px">No Installation work orders found.</div>'}
    </div>

    ${toggleRows ? `<div style="margin-bottom:10px">${toggleRows}</div>` : ''}

    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer">
        <input type="checkbox" id="innergy-inc-hours" checked style="accent-color:var(--accent)"> Include estimated hours
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer">
        <input type="checkbox" id="innergy-inc-dates" checked style="accent-color:var(--accent)"> Include planned dates
      </label>
    </div>
  `, () => {
    const name = document.getElementById('m-name')?.value.trim();
    if (!name) return showToast('Project name required');

    const includeHours = document.getElementById('innergy-inc-hours')?.checked ?? true;
    const includeDates = document.getElementById('innergy-inc-dates')?.checked ?? true;

    // Collect selected Installation WOs
    const selectedInstalls = installs.filter((_, idx) => {
      const cb = document.querySelector(`.innergy-wo-check[data-idx="${idx}"]`);
      return cb ? cb.checked : true;
    });

    // Collect any additionally toggled types
    const extraWOs = [];
    otherTypes.forEach(t => {
      const tid = 'innergy-tog-' + t.replace(/\W/g,'_');
      if (document.getElementById(tid)?.checked) {
        extraWOs.push(..._innergyWorkOrders.filter(w => (w.Type||w.type||'') === t));
      }
    });

    const allSelectedWOs = [...selectedInstalls, ...extraWOs];

    // Build sections: one per type, Installation first
    const sections = [];
    const sectionMap = {};
    ['Installation', ...otherTypes].forEach(t => {
      const hasItems = allSelectedWOs.some(w => (w.Type||w.type||'') === t);
      if (hasItems) {
        const sec = { id: 'sec_' + t.toLowerCase() + '_' + Date.now(), name: t };
        sections.push(sec);
        sectionMap[t] = sec.id;
      }
    });
    if (!sections.length) {
      const sec = { id: 'sec_' + Date.now(), name: 'Work Orders' };
      sections.push(sec);
      sectionMap['_default'] = sec.id;
    }

    const items = allSelectedWOs.map(wo => {
      const t   = wo.Type || wo.type || '_default';
      const sid = sectionMap[t] || sections[0].id;
      return _innergyWOtoSIItem(wo, sid, includeHours, includeDates);
    });

    const instHours = allSelectedWOs
      .filter(w => (w.Type||w.type||'') === 'Installation')
      .reduce((s, w) => s + (_innergyParseHours(w.EstimatedHours) || 0), 0);

    const proj = {
      id: 'proj_' + Date.now(),
      name,
      ownedBy: _currentUser?.userId || '',
      client:      document.getElementById('m-client')?.value.trim()  || client || '—',
      company:     document.getElementById('m-company')?.value.trim() || '—',
      auditor:     document.getElementById('m-auditor')?.value.trim() || '—',
      date:        new Date().toLocaleDateString(),
      projectType: document.getElementById('m-type')?.value || '',
      projectNumber: document.getElementById('m-projnum')?.value.trim() || num || '',
      innergyId:   p.Id || p.id || '',
      laborSettings: instHours > 0
        ? { show: true, workers: 4, hoursPerDay: 8, workDays: 5, estimatedHours: Math.round(instHours) }
        : { show: false, workers: 4, hoursPerDay: 8, workDays: 5 },
      coverPhoto: null,
      sections,
      items,
      schedule: {},
      importLog: [{ date: new Date().toISOString(),
        summary: { added: items.length, modified: 0, removed: 0, conflicts: 0, scheduled: 0 },
        source: 'innergy-api' }]
    };
    _woPopulateSchedule(proj, items.filter(i => i.plannedStart));
    store.projects.push(proj);
    if (fid) { const f = getFolder(fid); if (f && !f.projects.includes(proj.id)) f.projects.push(proj.id); }
    markProjectDirty(proj.id);  // push the doc, not just the index entry
    markStoreDirty(); save(); closeModal();
    scheduleDirtySync();
    showToast(`✓ ${items.length} scope items imported from Innergy`, 'green');
    setTimeout(() => navToProject(proj.id, fid), 50);
  });

  // Wire up "select all" checkbox
  setTimeout(() => {
    const allCb = document.getElementById('innergy-chk-all');
    if (allCb) allCb.addEventListener('change', () => {
      document.querySelectorAll('.innergy-wo-check').forEach(c => c.checked = allCb.checked);
    });
  }, 50);
}
</script>
</body>
</html>
